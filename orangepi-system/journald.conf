[Journal]
# Changed from the Armbian default (2026-07-30, GitHub issue #11): forced
# explicit instead of relying on auto-detection. Investigation into the
# "boot hung at wpa_supplicant" incident found the persistent journal
# (/var/log.hdd/journal, exempted from the armbian-ramlog RAM-log scheme
# specifically so it survives reboots) was silently falling back to the
# volatile /run/log/journal (tmpfs, wiped on power loss/hard reset) after a
# routine flush+rotate event, and was NOT switching back on its own. Root
# cause of that fallback not fully traced (looks correlated with Armbian's
# periodic armbian-ramlog log-sync cycle), but forcing Storage=persistent
# removes the auto-detection ambiguity, which is the actionable part.
Storage=persistent
#Compress=yes
#Seal=yes
#SplitMode=uid
#SyncIntervalSec=5m
#RateLimitIntervalSec=30s
#RateLimitBurst=10000
# Bumped from the Armbian default 20M (2026-07-30, GitHub issue #11): 20M
# was observed filling in well under 13 hours of normal operation on this
# box (KlipperScreen debug spam, Xorg, xray/v2raya) and self-vacuuming the
# oldest entries with no crash required at all -- confirmed directly: boot
# 0's own first ~12.5h of history disappeared this way. 100M buys a couple
# of days of retention instead of half a day, at a modest SD-wear cost
# (this partition is small/rarely-written otherwise -- see printer-status.md).
SystemMaxUse=100M
#SystemKeepFree=
#SystemMaxFileSize=
#SystemMaxFiles=100
#RuntimeMaxUse=
#RuntimeKeepFree=
#RuntimeMaxFileSize=
#RuntimeMaxFiles=100
#MaxRetentionSec=0
#MaxFileSec=1month
#ForwardToSyslog=no
#ForwardToKMsg=no
#ForwardToConsole=no
#ForwardToWall=yes
#TTYPath=/dev/console
#MaxLevelStore=debug
#MaxLevelSyslog=debug
#MaxLevelKMsg=notice
#MaxLevelConsole=info
#MaxLevelWall=emerg
#MaxLevelSocket=debug
#LineMax=48K
#ReadKMsg=yes
#Audit=yes
