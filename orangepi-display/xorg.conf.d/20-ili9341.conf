Section "ServerFlags"
    Option "AutoAddGPU" "false"
    # Без этого DPMS усыпляет монитор через Suspend:3600 (дефолт X) и гасит
    # физическую подсветку (ili9341_backlight GPIO) - обратно её никто не
    # включает (KlipperScreen не шлёт DPMS-события), экран остаётся чёрным
    # навсегда, пока не перезапустить сервис или не дёрнуть xset руками.
    # Живой инцидент 2026-07-30: экран погас примерно через час простоя. 0 = выключено.
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
    Option "BlankTime" "0"
EndSection

Section "Device"
    Identifier "ili9341"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/by-path/platform-1c68000.spi-cs-0-card"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "ili9341"
EndSection
