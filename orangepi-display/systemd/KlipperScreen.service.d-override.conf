[Unit]
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
# VT-переключение на tty7 гасит подсветку/консоль tty1 и не включает обратно:
# 1) fb0/blank - застрявший флаг fbcon-консоли; 2) bl_power - сам gpio-backlight.
# Юнит держит User=ultra, а эти sysfs-файлы root-only - '+' запускает КОНКРЕТНО
# эту команду от root, игнорируя User= всего юнита.
ExecStartPost=+/bin/sh -c 'echo 0 > /sys/class/graphics/fb0/blank'
ExecStartPost=+/bin/sh -c 'echo 0 > /sys/class/backlight/ili9341_backlight/bl_power'
# Без оконного менеджера GTK show_cursor:false курсор на root-окне не прячет.
ExecStartPost=+/usr/local/bin/klipperscreen-cursor-hide.sh
