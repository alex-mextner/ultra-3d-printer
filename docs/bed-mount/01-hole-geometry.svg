<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1250" width="1400" height="1250" font-family="DejaVu Sans, Verdana, Geneva, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c6fb5"/>
    </marker>
  </defs>

  <rect width="1400" height="1250" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1400" height="100" fill="#1f2933"/>
  <text x="40" y="44" fill="#ffffff" font-size="33" font-weight="bold">1 / 6 — ГЕОМЕТРИЯ ОТВЕРСТИЙ. Плита Creality K1 Max</text>
  <text x="40" y="78" fill="#9fb3c8" font-size="19">310 × 315 мм · литой алюминий 5083, толщина 6 мм · ⌀4 сквозные, конус (зенковка) СВЕРХУ · вид сверху</text>
  <rect x="0" y="100" width="1400" height="34" fill="#1e8449"/>
  <text x="40" y="124" fill="#ffffff" font-size="19" font-weight="bold">ЗАМЕРЕНО: передняя и задняя кромки по 310 мм, боковые по 315 → ширина 310, глубина 315. Все три числа ниже ОКОНЧАТЕЛЬНЫЕ.</text>

  <!-- plate -->
  <rect x="470" y="240" width="600" height="610" fill="#c8ced3" stroke="#5b6670" stroke-width="3"/>
  <text x="770" y="530" text-anchor="middle" fill="#66707a" font-size="22" font-weight="bold">310 поперёк · 315 в глубину</text>
  <text x="770" y="562" text-anchor="middle" fill="#66707a" font-size="19">алюминий 6 мм</text>
  <text x="770" y="592" text-anchor="middle" fill="#8a939b" font-size="17">масса плиты ≈ 1.6 кг</text>

  <!-- front edge accent -->
  <line x1="470" y1="850" x2="1070" y2="850" stroke="#c0392b" stroke-width="9"/>
  <text x="1086" y="846" fill="#c0392b" font-size="21" font-weight="bold">ПЕРЁД</text>
  <text x="1086" y="872" fill="#c0392b" font-size="16">пометить маркером!</text>

  <!-- trapezoid guide -->
  <polygon points="518,798 1022,798 964,312 576,312" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6" opacity="0.75"/>

  <!-- holes -->
  <g fill="#ffffff" stroke="#1f2933" stroke-width="3">
    <circle cx="518" cy="798" r="13"/><circle cx="1022" cy="798" r="13"/>
    <circle cx="576" cy="312" r="13"/><circle cx="964" cy="312" r="13"/>
  </g>
  <g stroke="#1f2933" stroke-width="2">
    <line x1="518" y1="780" x2="518" y2="816"/><line x1="500" y1="798" x2="536" y2="798"/>
    <line x1="1022" y1="780" x2="1022" y2="816"/><line x1="1004" y1="798" x2="1040" y2="798"/>
    <line x1="576" y1="294" x2="576" y2="330"/><line x1="558" y1="312" x2="594" y2="312"/>
    <line x1="964" y1="294" x2="964" y2="330"/><line x1="946" y1="312" x2="982" y2="312"/>
  </g>
  <text x="518" y="762" text-anchor="middle" fill="#1f2933" font-size="17">⌀4</text>
  <text x="1022" y="762" text-anchor="middle" fill="#1f2933" font-size="17">⌀4</text>

  <!-- extension lines -->
  <g stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="518" y1="798" x2="518" y2="910"/>
    <line x1="1022" y1="798" x2="1022" y2="910"/>
    <line x1="576" y1="312" x2="576" y2="960"/>
    <line x1="964" y1="312" x2="964" y2="960"/>
    <line x1="518" y1="798" x2="430" y2="798"/>
    <line x1="576" y1="312" x2="310" y2="312"/>
    <line x1="470" y1="850" x2="430" y2="850"/>
    <line x1="470" y1="240" x2="310" y2="240"/>
    <line x1="518" y1="798" x2="518" y2="140"/>
    <line x1="576" y1="312" x2="576" y2="180"/>
    <line x1="470" y1="240" x2="470" y2="140"/>
  </g>

  <!-- dims below -->
  <g stroke="#2c6fb5" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)">
    <line x1="518" y1="900" x2="1022" y2="900"/>
    <line x1="576" y1="950" x2="964" y2="950"/>
  </g>
  <text x="770" y="891" text-anchor="middle" fill="#2c6fb5" font-size="24" font-weight="bold">260 мм   (передняя пара = 310 − 50)</text>
  <text x="770" y="941" text-anchor="middle" fill="#2c6fb5" font-size="24" font-weight="bold">200 мм   (задняя пара = 310 − 110)</text>

  <!-- dims left -->
  <g stroke="#2c6fb5" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)">
    <line x1="440" y1="798" x2="440" y2="850"/>
    <line x1="380" y1="312" x2="380" y2="798"/>
    <line x1="320" y1="240" x2="320" y2="312"/>
  </g>
  <text x="430" y="832" text-anchor="end" fill="#2c6fb5" font-size="20" font-weight="bold">27</text>
  <text x="368" y="548" text-anchor="end" fill="#2c6fb5" font-size="24" font-weight="bold">251 мм</text>
  <text x="364" y="576" text-anchor="end" fill="#2c6fb5" font-size="17">= 315 − 64</text>
  <text x="364" y="600" text-anchor="end" fill="#2c6fb5" font-size="17">между ригелями</text>
  <text x="308" y="282" text-anchor="end" fill="#2c6fb5" font-size="20" font-weight="bold">37</text>

  <!-- dims above -->
  <g stroke="#2c6fb5" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)">
    <line x1="470" y1="150" x2="518" y2="150"/>
    <line x1="470" y1="190" x2="576" y2="190"/>
  </g>
  <text x="530" y="144" fill="#2c6fb5" font-size="20" font-weight="bold">25</text>
  <text x="588" y="184" fill="#2c6fb5" font-size="20" font-weight="bold">55</text>

  <!-- side note -->
  <rect x="1120" y="240" width="250" height="290" fill="#fff5e6" stroke="#d68910" stroke-width="2" rx="8"/>
  <text x="1140" y="278" fill="#7d5a00" font-size="19" font-weight="bold">ФОРМА</text>
  <text x="1140" y="312" fill="#5b4300" font-size="17">Задняя пара уже</text>
  <text x="1140" y="336" fill="#5b4300" font-size="17">передней ровно на</text>
  <text x="1140" y="370" fill="#c0392b" font-size="28" font-weight="bold">60 мм</text>
  <text x="1140" y="400" fill="#5b4300" font-size="17">(30 мм на сторону).</text>
  <text x="1140" y="440" fill="#5b4300" font-size="17">Отверстия образуют</text>
  <text x="1140" y="468" fill="#c0392b" font-size="22" font-weight="bold">ТРАПЕЦИЮ,</text>
  <text x="1140" y="494" fill="#5b4300" font-size="17">а не прямоугольник →</text>
  <text x="1140" y="518" fill="#5b4300" font-size="17">ригели ставим ПОПЕРЁК.</text>

  <!-- variant table -->
  <rect x="1120" y="560" width="250" height="300" fill="#eaf7ee" stroke="#1e8449" stroke-width="3" rx="8"/>
  <text x="1245" y="596" text-anchor="middle" fill="#1e8449" font-size="18" font-weight="bold">ЗАМЕР ЗАКРЫТ</text>
  <line x1="1136" y1="612" x2="1354" y2="612" stroke="#1e8449" stroke-width="1.5"/>
  <text x="1140" y="644" fill="#145a32" font-size="16">перед и зад:</text>
  <text x="1350" y="644" text-anchor="end" fill="#1f2933" font-size="19" font-weight="bold">310</text>
  <text x="1140" y="678" fill="#145a32" font-size="16">бока:</text>
  <text x="1350" y="678" text-anchor="end" fill="#1f2933" font-size="19" font-weight="bold">315</text>
  <line x1="1136" y1="698" x2="1354" y2="698" stroke="#1e8449" stroke-width="1.5"/>
  <text x="1140" y="726" fill="#145a32" font-size="16">передняя пара</text>
  <text x="1350" y="726" text-anchor="end" fill="#1f2933" font-size="19" font-weight="bold">260</text>
  <text x="1140" y="758" fill="#145a32" font-size="16">задняя пара</text>
  <text x="1350" y="758" text-anchor="end" fill="#1f2933" font-size="19" font-weight="bold">200</text>
  <text x="1140" y="790" fill="#145a32" font-size="16">между ригелями</text>
  <text x="1350" y="790" text-anchor="end" fill="#1f2933" font-size="19" font-weight="bold">251</text>
  <line x1="1136" y1="810" x2="1354" y2="810" stroke="#1e8449" stroke-width="1.5"/>
  <text x="1245" y="836" text-anchor="middle" fill="#145a32" font-size="15">Сверять всё равно</text>
  <text x="1245" y="854" text-anchor="middle" fill="#145a32" font-size="15">переносом — см. ниже.</text>

  <!-- bottom box -->
  <rect x="60" y="1000" width="1280" height="222" fill="#eaf7ee" stroke="#1e8449" stroke-width="2" rx="8"/>
  <text x="90" y="1038" fill="#1e8449" font-size="21" font-weight="bold">ГЛАВНЫЙ ПРИЁМ: РАЗМЕЧАТЬ ПЕРЕНОСОМ, А НЕ ПО ЦИФРАМ</text>
  <text x="90" y="1074" fill="#145a32" font-size="18">Положи отрезанный ригель на плиту снизу, выставь по кромке — и накерни прямо через отверстия плиты. Цифры выше нужны только чтобы</text>
  <text x="90" y="1104" fill="#145a32" font-size="18">купить профиль нужной длины и понять схему. Замер рулеткой на 300 мм даёт ошибку 1–2 мм, перенос — ноль.</text>
  <line x1="90" y1="1124" x2="1310" y2="1124" stroke="#1e8449" stroke-width="1.5"/>
  <text x="90" y="1156" fill="#145a32" font-size="18">Отверстия в ригелях сверлим <tspan font-weight="bold" fill="#c0392b">⌀5 мм</tspan> под винт М4 — это запас на ошибку ручной разметки, и только на неё.</text>
  <text x="90" y="1188" fill="#145a32" font-size="18">Тепловое расширение плиты (0.74 мм при 120 °C) зазором в отверстии <tspan font-weight="bold" fill="#c0392b">НЕ лечится</tspan>: затянутый винт держит стык трением,</text>
  <text x="90" y="1214" fill="#145a32" font-size="18">а не телом винта. Лечится тем, что <tspan font-weight="bold">не перетягиваем</tspan> — для 6-мм литой плиты на трёх точках этого достаточно.</text>
</svg>
