[main]
keyboard_navigation: true
# font_size stays at the default ("medium") on purpose -- KlippyGtk.py hardcodes
# `if font_size_type == "max" and label is not None: image_name = None`, which
# silently drops the icon on every labelled button (Move/Extrude/Temperature/...)
# regardless of theme. The actual on-screen glyph size is controlled by the
# big-font theme's CSS (`* { font-size: 14px }`), which overrides this option's
# tiny +-10% multiplier anyway (see style.css comment), so "medium" costs us
# nothing in text size and gets icons back (and slightly LARGER icons than
# "max" would, since "max" also shrinks img_scale by 0.7x).
font_size: medium
show_cursor: false
# Starting theme. With auto_dark_theme below it only decides the very first
# frame at startup -- screen.py overrides it from the sun's altitude before the
# first change_theme() call, and again every 5 minutes afterwards.
theme: big-font-light

# --- Automatic light/dark theme switching by sunrise/sunset -----------------
# NOT stock KlipperScreen. Needs BOTH of these on the device (they live inside
# the KlipperScreen git checkout and are wiped by a KlipperScreen update):
#   * ks_includes/daynight_sun.py            (offline NOAA sunrise/sunset math)
#   * klipperscreen-patches/daynight-theme-switch.patch
#     (screen.py timer + ks_includes/config.py option whitelist)
# WITHOUT the config.py half of that patch these four options are rejected as
# unknown and KlipperScreen shows an "Invalid config file" modal instead of the
# UI -- so never deploy this file to a device that has not been patched.
auto_dark_theme: true
light_theme: big-font-light
dark_theme: big-font
# Moscow. This is an ASSUMPTION inferred from the device timezone
# (Europe/Moscow) and was never confirmed with the user -- the printer could be
# anywhere in MSK, and at Petrozavodsk's latitude the summer day is nearly an
# hour longer. Correct these two numbers if the printer is not in Moscow;
# nothing else needs to change.
latitude: 55.7558
longitude: 37.6173

