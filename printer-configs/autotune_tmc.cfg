# NOT LOADED - printer.cfg keeps this file's [include] commented out (see the
# comment block right above `#[include autotune_tmc.cfg]` there for the current
# reasoning: no motor on this machine has a confirmed match in klipper_tmc_
# autotune's own motor_database.cfg, so autotuning would compute chopper
# parameters from a fictional motor).
#
# CORRECTED 2026-08-15 (investigation triggered by the user spotting `voltage:
# 24` in a section for a 12V machine): this section was NEVER adapted to this
# printer at all. Confirmed via `git log --follow` - it is byte-identical to
# what the very first commit of this repo added, i.e. the raw upstream
# klipper_tmc_autotune example/template, never customized. Two real problems
# beyond the voltage, found while fixing it:
#
# 1. `motor: ldo-42sth48-2504ah` is a real entry in klipper_tmc_autotune's
#    motor_database.cfg, but it's an LDO-brand motor this machine does not
#    have - it was never swapped for anything specific to the actual hardware
#    here. This machine's real motors (docs/bom.md §3): X/E carry a Motech
#    MT-1702HS170AW-class marking (only 🟡 decoded by catalog pattern, not a
#    confirmed datasheet match), Z carries a 17HD2008-200-class marking, Y's
#    marking has never been read. NONE of these have a confirmed exact match
#    in klipper_tmc_autotune's motor_database.cfg (checked directly on the
#    device 2026-08-15: closest Motech entries by body-size code are
#    motech-mt-1702hs133a and similar - different rated current from the
#    170AW this machine's own marking implies, not an exact hit). This is the
#    same "motors not identified" blocker printer.cfg's comment already
#    documents - still true today, nothing has changed it.
#
# 2. Section target: `[autotune_tmc extruder]` targets a stepper named
#    "extruder" - but this machine's extruder runs an A4988 (see
#    printer-configs/printer.cfg's own [extruder] section: no uart_pin, current
#    set only by a physical Vref trimpot), which has no SPI/UART register
#    interface at all. klipper_tmc_autotune's own source confirms this isn't a
#    silent no-op if the include is ever restored as-is: `autotune_tmc.py`
#    (~/klipper_tmc_autotune/ on the device) loops `TRINAMIC_DRIVERS =
#    ["tmc2130","tmc2208","tmc2209","tmc2240","tmc2660","tmc5160"]` looking for
#    a `[<driver> extruder]` section, and if none exists: `raise config.error
#    ("Could not find any TMC driver config section for 'extruder' required by
#    TMC autotuning")` - Klipper would REFUSE TO START, a hard boot failure,
#    not a quiet skip. Whoever eventually revisits this (after the motors
#    above get identified with real confidence) needs to retarget this section
#    to one of stepper_x/stepper_y/stepper_z instead (the three axes that
#    actually run TMC2209 over UART, confirmed working since 2026-08-03) - not
#    just flip the include back on with the section as written here.
#
# voltage: fixed 24 -> 12 below regardless of the above (this machine's RAMPS
# board runs 12V, not 24V - docs/bom.md §2, a deliberate, documented departure
# from the stock Cube's 24V design) - correct even though the section as a
# whole still can't be safely enabled yet.

[autotune_tmc extruder]
# This parameter is used to retrieve the physical constants of the motor connected to the TMC driver
# Values: See DB - https://github.com/andrewmcgr/klipper_tmc_autotune/blob/main/motor_database.cfg
motor: ldo-42sth48-2504ah
# Parameter to choose how to fine-tune the TMC driver using StealthChop and tailored parameters.
# By opting for auto, it will automatically apply performance for the X and Y axes and silent for the Z axis and extruder.
# autoswitch is an highly experimental choice that enables dynamic switching between silent and performance modes in real-time when needed.
# However, at the moment, this transition can potentially be troublesome, resulting in unwanted behavior, noise disturbances and lost steps.
# Hence, it is recommended to avoid using 'autoswitch' until its identified issues are fully addressed
# Values: auto, silent, performance, and autoswitch
# Default: auto
tuning_goal: auto
# Additional hysteresis to reduce motor humming and vibration at low to medium speeds and maintain proper microstep accuracy.
# Warning: use only as much as necessary as a too high value will result in more chopper noise and motor power dissipation (ie. more heat)
# Values: 0 to 8
# Default: 0
extra_hysteresis: 0
# Comparator blank time. This time must safely cover the TMC switching events.
# A value of 1 or 2 should be fine for most typical applications, but higher capacitive loads may require this to be set to 3.
# Also, lower values allow StealthChop to regulate to lower coil current values
# Values: 0 to 3
# Default: 2
tbl: 2
# Sets the slow decay time (off time) of the chopper cycle. This setting also limits the maximum chopper frequency.
# When set to 0, the value is automatically computed by this autotuning algorithm. Highest motor velocities sometimes
# benefit from forcing toff to 1 or 2 and a setting a short tbl of 1 or 0
# Values: 0 to 15
# Default: 0
toff: 0
# Sensorless homing threshold for TMC5160, TMC2240, TMC2130, TMC2660. Set value appropriately if using
# sensorless homing (higher value means more sensitive detection and easier stall)
# Values: -64 to 63
# Default: 1
sgt: 1
# Sensorless homing threshold for TMC2209 and TMC2260. Set value appropriately if using sensorless homing
# (lower value means more sensitive detection and easier stall). This parameter is also used as the CoolStep current regulation
# threshold for TMC2209, TMC2240 and TMC5160. A default value of 80 is usually a good starting point for CoolStep (in the case of TMC2209,
# the tuned sensorless homing value will also work correctly)
# Values: 0 to 255
# Default: 10
sg4_thrs: 10
# Voltage used to power this motor and stepper driver
# Values: 0.0 to 60.0
# Default: 24
voltage: 12                  # CORRECTED 2026-08-15 from 24 - this machine's RAMPS board
                            # is 12V (docs/bom.md §2), not the stock Cube's 24V. See this
                            # file's own header for why this section still can't be
                            # enabled even with this fixed - motor and target are wrong.
# Set the optional overvoltage snubber built into the TMC2240. Users of the BTT SB2240 toolhead board should use it
# for the extruder by reading the actual toolhead voltage and adding 0.8V.
# Set this above the supply voltage. A value of 0 asserts the overvoltage condition
# continuously and is not accepted. Leave the option unset to keep the driver default.
# Values: above 0.0, up to 41.0 (TMC2240 absolute maximum)
# Default: unset (driver hardware default is preserved)
#overvoltage_vth: 28.0
