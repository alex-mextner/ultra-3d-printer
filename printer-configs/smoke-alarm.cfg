# ===========================================================================
# SMOKE ALARM: MQ-2 sensor + TMB12A05 buzzer, both on RAMPS 1.4
# ===========================================================================
# Written 2026-08-02. Nothing is physically wired yet - this file is the
# prepared config. Full write-up, pin map and mounting instructions:
# docs/printer-status.md, section "Датчик дыма + сирена".
#
# WHAT IS LIVE RIGHT NOW AND WHAT IS NOT
#   [output_pin siren]      ACTIVE. Drives an unconnected header pin, so it is
#                           physically inert until the buzzer is fitted. It is
#                           active on purpose: the KlipperScreen work needs a
#                           real object to code against.
#   all macros              ACTIVE. Inert until called.
#   [gcode_button ...]      COMMENTED OUT. This is the only genuinely risky
#                           section: an unconnected input pin with a weak AVR
#                           pullup, inside a printer full of steppers, whose
#                           press_gcode triggers an emergency shutdown.
#                           Uncomment it ONLY after the MQ-2 is wired.
#
# HARDWARE (see printer-status.md for the full table)
#   MQ-2 DO   -> AUX-2, pin labelled D42 = PL7   (digital in, active LOW)
#   buzzer    -> AUX-2, pin labelled D44 = PL5   (through a small NPN/FET)
#   5V / GND  -> AUX-2 pin 1 (VCC) and pin 2 (GND)
# Neither pin collides with anything in printer.cfg, nor with the three pins the
# TMC2209 PDN_UART lines OCCUPY (D53/PB0, D49/PL0, D40/PG1). Those three stopped
# being a plan on 2026-08-03: the wires are soldered and the UART link answers on
# all three axes, so they are spoken for permanently, not merely earmarked.
#
# ---------------------------------------------------------------------------
# WHY THE SIREN IS LATCHED BY shutdown_value AND NOT BY SET_PIN
# ---------------------------------------------------------------------------
# The user's decision (2026-08-02) is that smoke means a real emergency stop,
# not a pause: "все равно принтер скорее всего в процессе тушения будет
# отключен от питания". So the alarm ends in M112 / invoke_shutdown.
#
# That decision has a hard consequence, proven from the Klipper source, not
# guessed:
#   1. klippy/gcode.py:115-120 - the ONLY commands that survive a shutdown are
#      M110, M112, M115, RESTART, FIRMWARE_RESTART, ECHO, STATUS, HELP.
#      Everything else hits gcode.py:292 `if not self.is_printer_ready: raise`.
#      => SET_PIN cannot be used to sound the siren AFTER the shutdown, and no
#         "silence" macro can ever run either.
#   2. src/gpiocmds.c:198-208 digital_out_shutdown() writes each digital output
#      to its configured default_value (= shutdown_value) on shutdown.
#      => the pin state after M112 is decided ONLY by shutdown_value here.
# Therefore shutdown_value MUST be 1, or the buzzer would be switched OFF by
# the very command that is supposed to raise the alarm.
#
# The price, stated plainly: this pin knows nothing about WHY the MCU shut
# down, so the buzzer also sounds on an unrelated Klipper shutdown (a
# verify_heater trip, "Timer too close", a user-pressed emergency stop).
# It is silenced the same way in every case - FIRMWARE_RESTART - which is the
# same single gesture the screen offers. A total failure (MCU never connects)
# leaves the pin high-Z, i.e. SILENT, because of the mandatory gate/base
# pulldown resistor - so the noisy state is only ever "configured, then shut
# down", never "dead".
#
# ---------------------------------------------------------------------------
# CONTRACT WITH THE KlipperScreen UI (changed 2026-08-02 - read this)
# ---------------------------------------------------------------------------
#   alarm is active  <=  Klipper state is "shutdown" (or "error")
#                        AND state_message CONTAINS "SMOKE ALARM"
#
#   *** CONTAINS, NOT starts-with. This comment used to say the marker was put
#   "verbatim at the front" of state_message. THAT WAS WRONG, and it was wrong
#   in the dangerous direction: a startswith() check would never have matched,
#   so the banner would have failed to appear in the one scenario it exists
#   for. Caught 2026-08-02 by the UI agent running a real SMOKE_ALARM and
#   reading the actual message back. ***
#
#   The real string, live, is:
#       Shutdown due to SMOKE ALARM: MQ-2 triggered
#       Once the underlying issue is corrected, use the
#       "FIRMWARE_RESTART" command to reset the firmware, reload the
#       config, and restart the host software.
#       Printer is shutdown
#   i.e. the marker sits in the MIDDLE - a prefix in front of it and a
#   boilerplate tail after it. Assembled in three places, none of them
#   invoke_shutdown():
#     1. klippy/extras/gcode_macro.py:91-93 - _action_emergency_stop() is what
#        adds the "Shutdown due to " prefix:
#            self.printer.invoke_shutdown("Shutdown due to %s" % (msg,))
#     2. klippy/klippy.py:204-209 + :57-59 - invoke_shutdown() just stores that
#        string as state_message. It adds nothing of its own.
#     3. klippy/extras/error_mcu.py:8-13 and :91-95 - the shutdown handler then
#        appends the message_shutdown boilerplate ("Once the underlying issue
#        is corrected... Printer is shutdown") via update_error_msg().
#   The marker still does its job: a plain M112 gives "Shutdown due to M112
#   command", an MCU fault gives its own text, so a substring search for
#   "SMOKE ALARM" separates smoke from every other shutdown cause.
#   State category comes from klippy.py:45-54: "shutdown" while in_shutdown_state,
#   "error" otherwise - accept both and let the message decide.
#
#   silence          <=  FIRMWARE_RESTART   (POST /printer/firmware_restart)
#                        for a real alarm. For a BENCH alarm, where Klipper is
#                        still alive and only the pin is up (see the race
#                        below), SMOKE_SILENCE_MANUAL is the right call.
#   10-minute snooze <=  automatic. After the restart the sensor is NOT armed
#                        for `initial_duration` seconds (600 below). The UI
#                        does not have to call anything for this.
#
#   RACE, by design and not a bug: inside SMOKE_ALARM the SET_PIN and the
#   emergency stop are milliseconds apart, and SET_PIN goes through a
#   GCodeRequestQueue lookahead callback - so whether the pin flush wins or the
#   shutdown wins is not deterministic. Two identical SMOKE_ALARM runs were
#   observed raising the alarm through two different signals. Consequence for
#   any UI: watch BOTH sources (pin up while Klipper lives, and shutdown +
#   marker), and decide HOW to silence at the moment the button is pressed -
#   not at the moment the banner appeared, because the state can differ by then.
#
#   `printer["output_pin siren"].value` therefore works as a SECOND source, not
#   as the alarm flag: object queries do keep working during a shutdown
#   (klippy/webhooks.py _handle_query has no ready gate), but on an unrelated
#   shutdown the pin is physically high while `value` still reads 0.

# ---------------------------------------------------------------------------
# The buzzer output, and the switch that drives it.
# ---------------------------------------------------------------------------
# TMB12A05 is an ACTIVE buzzer - the oscillator is inside it, you just apply
# DC. So no PWM, no frequency to pick: pwm is left False on purpose. Do not
# turn this into a PWM "warble" - besides being pointless for an active
# buzzer, a toggling `value` would make any UI indicator flicker.
# Rated 5V (works 4-8V), ~30mA, ~85dB at 10cm, 2300 +-500 Hz.
#
# The user has no diodes and few or no resistors, so the circuit was reworked
# 2026-08-02 around what is actually on hand. Full reasoning, part numbers and
# the salvage advice are in printer-status.md; the short version:
#
# NO FLYBACK DIODE. Note the reason, because the obvious one is wrong: this is
# NOT a piezo. Every distributor that classifies it (LCSC, Piekarz, HQonline)
# lists TMB12A05 as an ELECTROMAGNETIC buzzer, and 30mA at 5V is a magnetic
# figure - active piezos draw single-digit mA. So there IS a coil. The diode is
# still unnecessary because the coil is not in our switching path: it sits
# behind the module's own drive circuit, which chops it at 2300 Hz and must
# therefore already handle its own flyback. Worst-case stored energy is
# 1/2*L*I^2 with I=30mA and a few mH -> single-digit microjoules, against an
# IRLZ44N avalanche rating of 110 mJ - four orders of magnitude of margin. If a
# diode ever turns up in the junk box, adding it costs nothing: cathode to +5V,
# anode to the drain/collector.
#
# OPTION A - PREFERRED, ZERO EXTRA PARTS: logic-level N-MOSFET.
#     +5V (AUX-2 pin 1) --- buzzer(+)
#     buzzer(-) ----------- DRAIN
#     D44/PL5 ------------- GATE      (straight to the pin, no resistor)
#     GND (AUX-2 pin 2) --- SOURCE
#   No gate resistor needed. A gate is a capacitor: the pin dumps
#   Ciss*5V ~= 8.5nC per edge into ~1.7nF (IRLZ44N), peak ~125mA for ~70ns
#   (tau = 40ohm pin impedance * Ciss), total energy 1/2*C*V^2 = 21 nJ. The
#   AVR's 20mA/40mA numbers are DC ratings - the datasheet says "steady state
#   (non-transient)" - and this is the same transient the pin already produces
#   driving any PCB trace. A gate resistor starts to matter only above roughly
#   5nF of Ciss, or when switching at kHz rates. We switch it twice per alarm.
#   Parts that WORK at a 5V gate (all verified against datasheets):
#     IRLZ44N   RDS(on) 0.022R specified AT VGS=5.0V, Vth 1-2V, 47A   - ideal
#     IRLB8721  RDS(on) ~0.020R at VGS=4.5V                           - ideal
#     IRL540N   RDS(on) 0.044R, Vth 1-2V                              - ideal
#     2N7000    ID(on) >= 75mA GUARANTEED at VGS=4.5V, ID max 200mA   - fine
#     BS170     same family, ID max 500mA                             - fine
#   Parts that do NOT qualify: IRF540, IRFZ44, IRF530, IRF3205 - anything
#   without the "L". Standard-level, Vth up to 4V, RDS(on) only specified at
#   VGS=10V. IRFZ44N vs IRLZ44N is one letter and they look identical - check.
#
# OPTION B - IF ONE RESISTOR IS AVAILABLE, THIS IS BETTER THAN A: add a gate
#   pulldown, gate to GND. Any value from 1k to 1M works (a 1000:1 window, so
#   practically any salvaged resistor). Why it matters: AVR pins are high-Z
#   through reset and the Arduino bootloader, and unlike a bipolar base a
#   MOSFET gate HOLDS its charge - so without the pulldown the buzzer can sound
#   for the whole boot window and keep sounding, including right through the
#   FIRMWARE_RESTART meant to silence it. It also restores the safety property
#   this design leans on: an unconfigured MCU leaves the pin high-Z, and only
#   the pulldown guarantees that reads as SILENT rather than as a stuck alarm.
#   No hardware is at risk either way - a half-on FET passing 30mA dissipates
#   under 100mW - but the behaviour is bad, so use the resistor if one exists.
#
# OPTION C - BIPOLAR NPN (BC337, BC547, 2N2222, 2N3904, S8050, KT315...):
#     D44/PL5 --[ 1k..10k ]-- BASE, COLLECTOR to buzzer(-), EMITTER to GND
#   The base resistor is MANDATORY - without it the pin drives the base-emitter
#   junction directly, clamping at ~0.7V and sourcing (5-0.7)/40ohm ~= 107mA,
#   nearly 3x the absolute maximum. Value is forgiving: 1k gives Ib=4.2mA
#   (forced beta 7), 10k gives 0.42mA (forced beta 71, still saturated for any
#   hFE>=100 part). 470R..15k all work; above ~22k saturation is no longer
#   guaranteed. No base pulldown needed - a floating base through a resistor
#   leaks off and the transistor stays off, which makes "C with one resistor"
#   quieter at reset than "A with none".
#
# OPTION D - STRAIGHT OFF THE PIN, NO SWITCH: rejected for permanent use.
#   Would need buzzer(+) to +5V and buzzer(-) to the pin (sinking), i.e.
#   `pin: !PL5` here so that logical 1 still means "sound". 30mA is inside the
#   40mA absolute maximum and the port-group budget is fine (ports C/G/D/L
#   share 200mA of IOL and nothing else there draws real current), BUT it is
#   half again over the 20mA the datasheet actually characterises, VOL above
#   that is unspecified so the buzzer would see maybe 3.5-4V against a 4V
#   minimum, and a killed pin on a soldered-down ATmega2560 is unrepairable and
#   fails SILENTLY - the worst possible failure mode for a fire alarm. Fine as
#   a 5-second bench check that the buzzer itself works. Not as the install.
#
# The config below assumes A/B/C (low-side switch, gate/base high = sound).
# Only option D needs the pin changed to `!PL5`.
[output_pin siren]
pin: PL5                    # AUX-2, pin labelled D44. Free: not in printer.cfg,
                            # not one of the three pins the live PDN_UART lines
                            # occupy (wired and answering since 2026-08-03).
value: 0                    # silent at every normal startup
shutdown_value: 1           # sounds on MCU shutdown - see the long note above.
                            # Legal only because output_pin.py calls
                            # setup_max_duration(0.); with a non-zero max
                            # duration mcu.py would reject value != shutdown_value.

# ---------------------------------------------------------------------------
# Arming state. The sensor is deliberately ignored for the first N seconds
# after Klipper reaches "ready".
# ---------------------------------------------------------------------------
[gcode_macro _SMOKE_STATE]
variable_armed: 0
gcode:

[delayed_gcode _smoke_arm]
# 600 s = 10 minutes. This single number does three jobs at once:
#   1. the user's "snooze for 10 minutes" - after FIRMWARE_RESTART silences the
#      buzzer, the sensor stays ignored for exactly this long;
#   2. MQ-2 warm-up. The heater has to reach temperature before the on-board
#      comparator means anything; a cold sensor reads as "gas present" and
#      would re-trigger the alarm the instant Klipper came back;
#   3. it makes the two indistinguishable, which is the point - Klipper cannot
#      tell "restarted after an alarm" from "restarted after a deploy", and
#      one fixed number needs no persistent state to get right.
# COST, stated honestly: for 10 minutes after ANY Klipper restart (including
# every scripts/deploy.sh run) the smoke sensor is not watching. If that ever
# matters, the fix is [save_variables] - write a flag before the shutdown and
# use a short delay when the flag is absent - about ten more lines.
initial_duration: 600
gcode:
    SET_GCODE_VARIABLE MACRO=_SMOKE_STATE VARIABLE=armed VALUE=1
    RESPOND MSG="Smoke sensor armed"
    # If the smoke never cleared, no new edge will arrive - gcode_button only
    # fires on a transition. So re-read the level here and raise the alarm
    # again if it is still tripped. Guarded because the button section may be
    # commented out (no sensor wired yet); `in printer` is the safe test, a
    # bare printer['...'] lookup raises KeyError.
    {% if 'gcode_button smoke_sensor' in printer %}
      {% if printer['gcode_button smoke_sensor'].state == 'PRESSED' %}
        RESPOND TYPE=error MSG="Smoke still detected after the snooze"
        SMOKE_ALARM
      {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# The alarm itself.
# ---------------------------------------------------------------------------
[gcode_macro SMOKE_ALARM]
description: Fire response - siren on, heaters off, emergency shutdown. Called by the MQ-2 sensor; can also be run by hand to test the whole chain.
gcode:
    # Order matters. Everything that needs a live Klipper has to happen before
    # the shutdown, so the emergency stop is the LAST thing, and it lives in
    # its own macro: action_emergency_stop() is a Jinja call, it fires while
    # the template is being RENDERED, i.e. before any command of this macro
    # would run. Putting it here inline would shut Klipper down first and make
    # every line below fail with "Printer is shutdown".
    SET_PIN PIN=siren VALUE=1
    TURN_OFF_HEATERS
    M107                    # part fan OFF - do not blow air onto a fire
    RESPOND TYPE=error MSG="SMOKE ALARM - heaters off, emergency stop"
    _SMOKE_ESTOP

[gcode_macro _SMOKE_ESTOP]
description: Helper for SMOKE_ALARM - do not call directly
gcode:
    # This exact string is the UI contract. It does NOT end up at the start of
    # state_message - action_emergency_stop() itself prepends "Shutdown due to "
    # (gcode_macro.py:92) and the shutdown handler appends the boilerplate tail
    # (error_mcu.py:91-95), so the live message reads
    #   "Shutdown due to SMOKE ALARM: MQ-2 triggered\nOnce the underlying issue
    #    is corrected, use the \"FIRMWARE_RESTART\" command ...\nPrinter is shutdown"
    # Match it with a SUBSTRING search, never startswith. Full chain and the
    # verified live text are in the contract block at the top of this file.
    # Changing this text breaks the screen.
    {action_emergency_stop("SMOKE ALARM: MQ-2 triggered")}

# ---------------------------------------------------------------------------
# Manual helpers.
# ---------------------------------------------------------------------------
# DELIBERATELY NOT NAMED "SMOKE_SNOOZE". A UI that dismisses the alarm by
# sending a macro cannot work under this design - after a real alarm Klipper is
# in shutdown and every macro is rejected (see the contract note at the top of
# this file: dismissing means FIRMWARE_RESTART). Shipping a macro under the
# obvious name would let such a UI pass its "does the macro exist?" check and
# then fail later, at the confusing end. Under this name that check fails
# immediately and loudly, which is the correct outcome.
# What this one is actually for: bench tests, and the brief window before the
# shutdown if SMOKE_ALARM is ever run with the estop line removed.
[gcode_macro SMOKE_SILENCE_MANUAL]
description: Manual/bench use only - silence the buzzer and hold the sensor disarmed for another 10 minutes. Cannot run after a real alarm (Klipper is shut down); dismissing a real alarm means FIRMWARE_RESTART.
gcode:
    SET_PIN PIN=siren VALUE=0
    SET_GCODE_VARIABLE MACRO=_SMOKE_STATE VARIABLE=armed VALUE=0
    # UPDATE_DELAYED_GCODE reschedules, it does not stack - pressing twice
    # extends the snooze to a fresh 10 minutes rather than adding 20.
    UPDATE_DELAYED_GCODE ID=_smoke_arm DURATION=600
    RESPOND MSG="Smoke alarm snoozed for 600s"

[gcode_macro SMOKE_STATUS]
description: Report whether the smoke sensor is armed and what it currently reads
gcode:
    {% if 'gcode_button smoke_sensor' in printer %}
      RESPOND MSG="armed={printer['gcode_macro _SMOKE_STATE'].armed} sensor={printer['gcode_button smoke_sensor'].state} siren={printer['output_pin siren'].value}"
    {% else %}
      RESPOND MSG="armed={printer['gcode_macro _SMOKE_STATE'].armed} sensor=NOT CONFIGURED siren={printer['output_pin siren'].value}"
    {% endif %}

# SIDE EFFECT WORTH KNOWING: this raises the pin, so a UI watching the pin will
# put its alarm banner up. Dismissing that banner sends SMOKE_SILENCE_MANUAL,
# which disarms the sensor for another 600s. So "I just tested the wiring" can
# leave the detector asleep for ten minutes. That is the cost of one number
# serving three jobs (snooze, warm-up, re-arm); acceptable, but run SMOKE_STATUS
# afterwards if you want to know where you stand.
[gcode_macro SMOKE_TEST_SIREN]
description: Sound the buzzer for 3 seconds to check the wiring. Does NOT shut anything down. Note - a UI watching the pin will raise its banner, and dismissing it disarms the sensor for 600s.
gcode:
    SET_PIN PIN=siren VALUE=1
    UPDATE_DELAYED_GCODE ID=_smoke_test_off DURATION=3

[delayed_gcode _smoke_test_off]
gcode:
    SET_PIN PIN=siren VALUE=0

# ---------------------------------------------------------------------------
# THE SENSOR. Uncomment only after the MQ-2 is physically wired to AUX-2 D42.
# ---------------------------------------------------------------------------
# pin: ^!PL7
#   ^  internal AVR pullup. The module already pulls DO up to 5V through the
#      LM393's own pullup, so this is redundant in normal operation - it is
#      there to define the level if the signal wire ever comes loose (reads
#      HIGH = RELEASED = no alarm, rather than floating).
#   !  invert. On every MQ-2 module the LM393 output goes LOW when the gas
#      concentration passes the trimpot threshold, HIGH otherwise. So "pressed"
#      must mean "low", hence the inversion.
#
# FAIL-SAFE NOTE, intended behaviour and not a bug: if the sensor loses its 5V
# while GND and DO stay connected, the module's own pullup resistor becomes a
# ~10k pulldown to a dead rail, which beats the AVR's ~20-50k pullup, DO reads
# LOW and the alarm fires. Losing power to the smoke detector SHOULD be loud.
#
# debounce_delay: 2 - two full seconds of continuous LOW before anything
# happens. A fire alarm has no latency requirement, and two seconds kills every
# plausible EMI glitch on a header sitting next to four stepper drivers.
#
# release_gcode is deliberately left empty: the alarm LATCHES. If the buzzer
# went quiet by itself when the smoke thinned out, an unattended event would
# leave no trace at all.
#
#[gcode_button smoke_sensor]
#pin: ^!PL7
#debounce_delay: 2
#press_gcode:
#    {% if printer['gcode_macro _SMOKE_STATE'].armed|int == 1 %}
#      SMOKE_ALARM
#    {% else %}
#      RESPOND MSG="Smoke sensor triggered but not armed yet (warm-up/snooze) - ignored"
#    {% endif %}
#release_gcode:
#    RESPOND MSG="Smoke sensor cleared"
