# ===========================================================================
# SMOKE ALARM: MQ-2 sensor + TMB12A05 buzzer, both on RAMPS 1.4
# ===========================================================================
# Written 2026-08-02; MQ-2 and buzzer wired 2026-08-06. Full write-up, pin map
# and mounting instructions: docs/printer-status.md, section "Датчик дыма +
# сирена".
#
# WHAT IS LIVE RIGHT NOW AND WHAT IS NOT
#   [output_pin siren]      ACTIVE. Drives an unconnected header pin, so it is
#                           physically inert until the buzzer is fitted. It is
#                           active on purpose: the KlipperScreen work needs a
#                           real object to code against.
#   all macros              ACTIVE. Inert until called.
#   [gcode_button ...]      ACTIVE since 2026-08-06. MQ-2 is wired to AUX-2
#                           D42; this is the section whose press_gcode
#                           triggers an emergency shutdown, now live.
#   [output_pin siren_armed] ACTIVE since 2026-08-06. Pure software arm/disarm
#                           flag on AUX-4 D16/PH1, an entirely unused connector -
#                           nothing is physically wired to it. Exists so Mainsail
#                           can render it as a clickable toggle; see below.
#   [output_pin smoke_alarm_active] ACTIVE since 2026-08-17. Second pure software
#                           flag, AUX-4 D43/PL6. THE alarm discriminator - see the
#                           next block, this is the fix for the false-banner bug.
#
# ---------------------------------------------------------------------------
# 2026-08-17: TEN FALSE ALARMS, AND THE MQ-2 CAUSED NONE OF THEM
# ---------------------------------------------------------------------------
# docs/tasks.md item H5 recorded seven "MQ-2 pin triggers" in KlipperScreen.log
# starting 2026-08-07 and concluded the sensor was picking up EMI. That was
# wrong. There were ten by 2026-08-17, and every one is self-inflicted:
#
#   KlipperScreen (screen.py:110)          SMOKE_ALARM_OBJECT = "output_pin siren"
#   smoke-siren-daemon.py (alarm_source()) queries the same "output_pin siren"
#
# Both consumers treat "the BUZZER pin is high" as "there is a fire". But three
# different things drive that pin, and only one of them is a fire:
#   1. SMOKE_ALARM          - an actual alarm.
#   2. SMOKE_TEST_SIREN     - a 3-second bench check of the buzzer wiring.
#   3. _BEEP                - the print-lifecycle chirps added 2026-08-16
#                             (2 at the end of PRINT_START, 3 at PRINT_END,
#                             150ms on / 150ms off each at the time; shortened
#                             to 50/30 the same day, see _BEEP below).
# Matching the logs to that list accounts for all ten with nothing left over:
#   2026-08-07 20:23:33, 20:49:57 and 2026-08-08 13:43:25 lasted 3.006 / 3.010 /
#     3.009 s - SMOKE_TEST_SIREN's dwell, to three decimal places.
#   Every event from 2026-08-16 on lasted 0.24-0.52 s and sits within 0.3 s of a
#     "Print finished" or a print-start completion in the same log - _BEEP. The
#     2026-08-16 01:38:18.5 + 01:38:19.1 pair is literally the two chirps of one
#     _BEEP COUNT=2. The "during a print" one (2026-08-17 00:04:41, the one H5
#     called alarming) is the PRINT_START chirp, 8 minutes into a PETG heat-up.
# The MQ-2's own trip path leaves different evidence entirely - "Smoke sensor
# tripped..." / "...back to clear" echoes below - and those appear exactly twice
# in the whole log, on 2026-08-15 right after a deliberate SMOKE_ALARM. The
# sensor has not produced one unexplained edge.
#
# It was not only a screen banner: the daemon's journal for 2026-08-17 00:18:48
# reads "ALARM ACTIVE (source=pin) - pulsing gpio110, RGB red blinking" and
# clears one second later. A print-finished chirp made the fire daemon pulse the
# siren GPIO. Once that GPIO is wired to the real buzzer, this becomes audible -
# which is precisely the "it beeps at noise" the user reported.
#
# THE FIX, and why it is a new pin rather than a bigger number: no amount of
# sensor debouncing can help, because the sensor was never involved. The defect
# is that one pin carries three meanings. So the meaning "a fire alarm is up"
# gets its own flag, [output_pin smoke_alarm_active], which ONLY SMOKE_ALARM
# raises. Beeps and bench tests keep driving `siren` and no longer look like
# fires.
# 🔴 CONSUMERS MUST BE REPOINTED FOR THIS TO DO ANYTHING. Adding the pin here is
# half the fix; the other half is two one-line changes outside this repository
# path, and until they are made the false banners continue exactly as before:
#   KlipperScreen  ~/KlipperScreen/screen.py:110
#                  SMOKE_ALARM_OBJECT = "output_pin smoke_alarm_active"
#                  (and the mirror of that line in
#                   orangepi-display/klipperscreen-patches/README.md:1609)
#   siren daemon   orangepi-services/smoke-siren/smoke-siren-daemon.py,
#                  alarm_source() - done in the repo 2026-08-17, NOT yet
#                  deployed (deploying it is scp + `systemctl restart
#                  smoke-siren`, which visibly restarts the RGB strip and is a
#                  user-announced operation per printer-status.md).
#
# HARDWARE (see printer-status.md for the full table)
#   MQ-2 DO   -> AUX-2, pin labelled D42 = PL7   (digital in, active LOW)
#   buzzer    -> AUX-2, pin labelled D44 = PL5   (through a small NPN/FET)
#   5V / GND  -> AUX-2 pin 1 (VCC) and pin 2 (GND)
# Neither pin collides with anything in printer.cfg, nor with the three pins the
# TMC2209 PDN_UART lines OCCUPY (D53/PB0, D49/PL0, D40/PG1). Those three stopped
# being a plan on 2026-08-03: the wires are soldered and the UART link answers on
# all three axes, so they are spoken for permanently, not merely earmarked.
#
# ---------------------------------------------------------------------------
# WHY THE SIREN IS LATCHED BY shutdown_value AND NOT BY SET_PIN
# ---------------------------------------------------------------------------
# The user's decision (2026-08-02) is that smoke means a real emergency stop,
# not a pause: "все равно принтер скорее всего в процессе тушения будет
# отключен от питания". So the alarm ends in M112 / invoke_shutdown.
#
# That decision has a hard consequence, proven from the Klipper source, not
# guessed:
#   1. klippy/gcode.py:115-120 - the ONLY commands that survive a shutdown are
#      M110, M112, M115, RESTART, FIRMWARE_RESTART, ECHO, STATUS, HELP.
#      Everything else hits gcode.py:292 `if not self.is_printer_ready: raise`.
#      => SET_PIN cannot be used to sound the siren AFTER the shutdown, and no
#         "silence" macro can ever run either.
#   2. src/gpiocmds.c:198-208 digital_out_shutdown() writes each digital output
#      to its configured default_value (= shutdown_value) on shutdown.
#      => the pin state after M112 is decided ONLY by shutdown_value here.
# Therefore shutdown_value MUST be 1, or the buzzer would be switched OFF by
# the very command that is supposed to raise the alarm.
#
# The price, stated plainly: this pin knows nothing about WHY the MCU shut
# down, so the buzzer also sounds on an unrelated Klipper shutdown (a
# verify_heater trip, "Timer too close", a user-pressed emergency stop).
# It is silenced the same way in every case - FIRMWARE_RESTART - which is the
# same single gesture the screen offers. A total failure (MCU never connects)
# leaves the pin high-Z, i.e. SILENT, because of the mandatory gate/base
# pulldown resistor - so the noisy state is only ever "configured, then shut
# down", never "dead".
#
# ---------------------------------------------------------------------------
# CONTRACT WITH THE KlipperScreen UI (changed 2026-08-02 - read this)
# ---------------------------------------------------------------------------
#   alarm is active  <=  Klipper state is "shutdown" (or "error")
#                        AND state_message CONTAINS "SMOKE ALARM"
#
#   *** CONTAINS, NOT starts-with. This comment used to say the marker was put
#   "verbatim at the front" of state_message. THAT WAS WRONG, and it was wrong
#   in the dangerous direction: a startswith() check would never have matched,
#   so the banner would have failed to appear in the one scenario it exists
#   for. Caught 2026-08-02 by the UI agent running a real SMOKE_ALARM and
#   reading the actual message back. ***
#
#   The real string, live, is:
#       Shutdown due to SMOKE ALARM: MQ-2 triggered
#       Once the underlying issue is corrected, use the
#       "FIRMWARE_RESTART" command to reset the firmware, reload the
#       config, and restart the host software.
#       Printer is shutdown
#   i.e. the marker sits in the MIDDLE - a prefix in front of it and a
#   boilerplate tail after it. Assembled in three places, none of them
#   invoke_shutdown():
#     1. klippy/extras/gcode_macro.py:91-93 - _action_emergency_stop() is what
#        adds the "Shutdown due to " prefix:
#            self.printer.invoke_shutdown("Shutdown due to %s" % (msg,))
#     2. klippy/klippy.py:204-209 + :57-59 - invoke_shutdown() just stores that
#        string as state_message. It adds nothing of its own.
#     3. klippy/extras/error_mcu.py:8-13 and :91-95 - the shutdown handler then
#        appends the message_shutdown boilerplate ("Once the underlying issue
#        is corrected... Printer is shutdown") via update_error_msg().
#   The marker still does its job: a plain M112 gives "Shutdown due to M112
#   command", an MCU fault gives its own text, so a substring search for
#   "SMOKE ALARM" separates smoke from every other shutdown cause.
#   State category comes from klippy.py:45-54: "shutdown" while in_shutdown_state,
#   "error" otherwise - accept both and let the message decide.
#
#   silence          <=  FIRMWARE_RESTART   (POST /printer/firmware_restart)
#                        for a real alarm. For a BENCH alarm, where Klipper is
#                        still alive and only the pin is up (see the race
#                        below), SMOKE_SILENCE_MANUAL is the right call.
#   10-minute snooze <=  automatic. After the restart the sensor is NOT armed
#                        for `initial_duration` seconds (600 below). The UI
#                        does not have to call anything for this.
#
#   RACE, by design and not a bug: inside SMOKE_ALARM the SET_PIN and the
#   emergency stop are milliseconds apart, and SET_PIN goes through a
#   GCodeRequestQueue lookahead callback - so whether the pin flush wins or the
#   shutdown wins is not deterministic. Two identical SMOKE_ALARM runs were
#   observed raising the alarm through two different signals. Consequence for
#   any UI: watch BOTH sources (pin up while Klipper lives, and shutdown +
#   marker), and decide HOW to silence at the moment the button is pressed -
#   not at the moment the banner appeared, because the state can differ by then.
#
#   `printer["output_pin siren"].value` therefore works as a SECOND source, not
#   as the alarm flag: object queries do keep working during a shutdown
#   (klippy/webhooks.py _handle_query has no ready gate), but on an unrelated
#   shutdown the pin is physically high while `value` still reads 0.

# ---------------------------------------------------------------------------
# The buzzer output, and the switch that drives it.
# ---------------------------------------------------------------------------
# TMB12A05 is an ACTIVE buzzer - the oscillator is inside it, you just apply
# DC. So no PWM, no frequency to pick: pwm is left False on purpose. Do not
# turn this into a PWM "warble" - besides being pointless for an active
# buzzer, a toggling `value` would make any UI indicator flicker.
# Rated 5V (works 4-8V), ~30mA, ~85dB at 10cm, 2300 +-500 Hz.
#
# The user has no diodes and few or no resistors, so the circuit was reworked
# 2026-08-02 around what is actually on hand. Full reasoning, part numbers and
# the salvage advice are in printer-status.md; the short version:
#
# NO FLYBACK DIODE. Note the reason, because the obvious one is wrong: this is
# NOT a piezo. Every distributor that classifies it (LCSC, Piekarz, HQonline)
# lists TMB12A05 as an ELECTROMAGNETIC buzzer, and 30mA at 5V is a magnetic
# figure - active piezos draw single-digit mA. So there IS a coil. The diode is
# still unnecessary because the coil is not in our switching path: it sits
# behind the module's own drive circuit, which chops it at 2300 Hz and must
# therefore already handle its own flyback. Worst-case stored energy is
# 1/2*L*I^2 with I=30mA and a few mH -> single-digit microjoules, against an
# IRLZ44N avalanche rating of 110 mJ - four orders of magnitude of margin. If a
# diode ever turns up in the junk box, adding it costs nothing: cathode to +5V,
# anode to the drain/collector.
#
# OPTION A - PREFERRED, ZERO EXTRA PARTS: logic-level N-MOSFET.
#     +5V (AUX-2 pin 1) --- buzzer(+)
#     buzzer(-) ----------- DRAIN
#     D44/PL5 ------------- GATE      (straight to the pin, no resistor)
#     GND (AUX-2 pin 2) --- SOURCE
#   No gate resistor needed. A gate is a capacitor: the pin dumps
#   Ciss*5V ~= 8.5nC per edge into ~1.7nF (IRLZ44N), peak ~125mA for ~70ns
#   (tau = 40ohm pin impedance * Ciss), total energy 1/2*C*V^2 = 21 nJ. The
#   AVR's 20mA/40mA numbers are DC ratings - the datasheet says "steady state
#   (non-transient)" - and this is the same transient the pin already produces
#   driving any PCB trace. A gate resistor starts to matter only above roughly
#   5nF of Ciss, or when switching at kHz rates. We switch it twice per alarm.
#   Parts that WORK at a 5V gate (all verified against datasheets):
#     IRLZ44N   RDS(on) 0.022R specified AT VGS=5.0V, Vth 1-2V, 47A   - ideal
#     IRLB8721  RDS(on) ~0.020R at VGS=4.5V                           - ideal
#     IRL540N   RDS(on) 0.044R, Vth 1-2V                              - ideal
#     2N7000    ID(on) >= 75mA GUARANTEED at VGS=4.5V, ID max 200mA   - fine
#     BS170     same family, ID max 500mA                             - fine
#   Parts that do NOT qualify: IRF540, IRFZ44, IRF530, IRF3205 - anything
#   without the "L". Standard-level, Vth up to 4V, RDS(on) only specified at
#   VGS=10V. IRFZ44N vs IRLZ44N is one letter and they look identical - check.
#
# OPTION B - IF ONE RESISTOR IS AVAILABLE, THIS IS BETTER THAN A: add a gate
#   pulldown, gate to GND. Any value from 1k to 1M works (a 1000:1 window, so
#   practically any salvaged resistor). Why it matters: AVR pins are high-Z
#   through reset and the Arduino bootloader, and unlike a bipolar base a
#   MOSFET gate HOLDS its charge - so without the pulldown the buzzer can sound
#   for the whole boot window and keep sounding, including right through the
#   FIRMWARE_RESTART meant to silence it. It also restores the safety property
#   this design leans on: an unconfigured MCU leaves the pin high-Z, and only
#   the pulldown guarantees that reads as SILENT rather than as a stuck alarm.
#   No hardware is at risk either way - a half-on FET passing 30mA dissipates
#   under 100mW - but the behaviour is bad, so use the resistor if one exists.
#
# OPTION C - BIPOLAR NPN (BC337, BC547, 2N2222, 2N3904, S8050, KT315...):
#     D44/PL5 --[ 1k..10k ]-- BASE, COLLECTOR to buzzer(-), EMITTER to GND
#   The base resistor is MANDATORY - without it the pin drives the base-emitter
#   junction directly, clamping at ~0.7V and sourcing (5-0.7)/40ohm ~= 107mA,
#   nearly 3x the absolute maximum. Value is forgiving: 1k gives Ib=4.2mA
#   (forced beta 7), 10k gives 0.42mA (forced beta 71, still saturated for any
#   hFE>=100 part). 470R..15k all work; above ~22k saturation is no longer
#   guaranteed. No base pulldown needed - a floating base through a resistor
#   leaks off and the transistor stays off, which makes "C with one resistor"
#   quieter at reset than "A with none".
#
# OPTION D - STRAIGHT OFF THE PIN, NO SWITCH: rejected for permanent use.
#   Would need buzzer(+) to +5V and buzzer(-) to the pin (sinking), i.e.
#   `pin: !PL5` here so that logical 1 still means "sound". 30mA is inside the
#   40mA absolute maximum and the port-group budget is fine (ports C/G/D/L
#   share 200mA of IOL and nothing else there draws real current), BUT it is
#   half again over the 20mA the datasheet actually characterises, VOL above
#   that is unspecified so the buzzer would see maybe 3.5-4V against a 4V
#   minimum, and a killed pin on a soldered-down ATmega2560 is unrepairable and
#   fails SILENTLY - the worst possible failure mode for a fire alarm. Fine as
#   a 5-second bench check that the buzzer itself works. Not as the install.
#
# The config below assumes A/B/C (low-side switch, gate/base high = sound).
# Only option D needs the pin changed to `!PL5`.
[output_pin siren]
pin: PL5                    # AUX-2, pin labelled D44. Free: not in printer.cfg,
                            # not one of the three pins the live PDN_UART lines
                            # occupy (wired and answering since 2026-08-03).
value: 0                    # silent at every normal startup
shutdown_value: 1           # sounds on MCU shutdown - see the long note above.
                            # Legal only because output_pin.py calls
                            # setup_max_duration(0.); with a non-zero max
                            # duration mcu.py would reject value != shutdown_value.

# ---------------------------------------------------------------------------
# Arming state, as a Mainsail-visible toggle (reworked 2026-08-06)
# ---------------------------------------------------------------------------
# Used to be a plain `variable_armed` inside a bare [gcode_macro _SMOKE_STATE]
# (no gcode: body of its own - purely a variable holder). That is invisible to
# Mainsail: it only renders a clickable switch for [output_pin] objects, never
# for a gcode_macro variable. Result was "где мой тумблер" - no toggle in the
# UI, and no way to arm early short of typing a macro into the console by hand
# (SMOKE_ARM below is new for exactly that). Moved the flag onto a real
# [output_pin] purely to get that UI treatment; it drives no real hardware.
#
# Pin choice: AUX-4/D16/PH1, the RepRapDiscount LCD header, entirely unused on
# this machine (the screen lives on the Orange Pi and never touches RAMPS -
# see the AUX pin-occupancy map in printer-status.md). Nothing needs to be
# physically wired for this pin to work; it is a pure software flag riding a
# spare pin.
# 🔴 STANDING RULE (2026-08-06, not just for this pin): endstop connector pins
# (X-MIN/X-MAX/Y-MIN/Y-MAX/Z-MIN/Z-MAX) are reserved for actual endstop
# switches ONLY, permanently, regardless of whether they look free right now.
# Never repurpose one for a flag/toggle/anything else - see printer-status.md.
[output_pin siren_armed]
pin: PH1                    # AUX-4, contact labelled D16. Entirely unused connector
                            # (RepRapDiscount LCD header - screen lives on the Orange
                            # Pi, never routes through RAMPS). Pure software flag,
                            # nothing needs to be physically wired here.
value: 0                    # unarmed at every startup - matches existing warm-up safety
shutdown_value: 0

# ---------------------------------------------------------------------------
# The alarm discriminator (added 2026-08-17 - read the false-alarm block at the
# top of this file for why this exists at all)
# ---------------------------------------------------------------------------
# Raised ONLY by SMOKE_ALARM. Not by _BEEP, not by SMOKE_TEST_SIREN, not by any
# other Klipper shutdown. That is the entire point: `siren` answers "is the
# buzzer sounding", this answers "is it sounding BECAUSE OF SMOKE".
#
# 🔑 shutdown_value: 0 - and this is the non-obvious half, so here is the
# reasoning rather than the value alone. The tempting choice is 1, by analogy
# with `siren` above. It is wrong here, and wrong in the direction that
# recreates the bug being fixed: gpiocmds.c writes shutdown_value on EVERY MCU
# shutdown without knowing the cause, so a 1 would put this flag up on a
# verify_heater trip, a "Timer too close", or a hand-pressed emergency stop -
# i.e. it would go back to meaning "something is wrong" instead of "smoke".
# Nothing is lost by 0, because the post-shutdown window is already covered by
# a cause-SPECIFIC signal: the "SMOKE ALARM" marker inside state_message (the
# contract block at the top of this file). Division of labour:
#     Klipper alive   -> this pin says whether it is smoke.
#     Klipper down    -> state_message says whether it was smoke.
# The consequence to know: SMOKE_ALARM sets this to 1 and shuts down
# milliseconds later, so a 1 Hz poller may never observe the 1. Harmless - by
# then the shutdown+marker source is up and is the authoritative one. The pin
# source exists for the bench case where Klipper stays alive.
#
# Pin: AUX-4 D43/PL6, a free contact on the RepRapDiscount LCD header that will
# never carry an LCD on this machine. Pure software flag, same pattern and same
# reasoning as siren_armed above; nothing is physically wired to it. Checked
# against the AUX occupancy map in printer-status.md before claiming it free -
# and NOT taken from any endstop connector, which are permanently reserved for
# real endstops (standing project rule, see siren_armed's note).
[output_pin smoke_alarm_active]
pin: PL6                    # AUX-4, contact labelled D43. Software-only.
value: 0
shutdown_value: 0           # deliberate - see the reasoning above, do not "fix"
                            # this to 1 by analogy with the siren pin.

[delayed_gcode _smoke_arm]
# 600 s = 10 minutes. This single number does three jobs at once:
#   1. the user's "snooze for 10 minutes" - after FIRMWARE_RESTART silences the
#      buzzer, the sensor stays ignored for exactly this long;
#   2. MQ-2 warm-up. The heater has to reach temperature before the on-board
#      comparator means anything; a cold sensor reads as "gas present" and
#      would re-trigger the alarm the instant Klipper came back;
#   3. it makes the two indistinguishable, which is the point - Klipper cannot
#      tell "restarted after an alarm" from "restarted after a deploy", and
#      one fixed number needs no persistent state to get right.
# COST, stated honestly: for 10 minutes after ANY Klipper restart (including
# every scripts/deploy.sh run) the smoke sensor is not watching. If that ever
# matters, the fix is [save_variables] - write a flag before the shutdown and
# use a short delay when the flag is absent - about ten more lines. SMOKE_ARM
# (below) is the other escape hatch: call it by hand once the MQ-2 is known to
# already be warm, to skip the rest of this wait instead.
initial_duration: 600
gcode:
    SET_PIN PIN=siren_armed VALUE=1
    RESPOND MSG="Smoke sensor armed"
    # If the smoke never cleared, no new edge will arrive - gcode_button only
    # fires on a transition. So re-read the level here and raise the alarm
    # again if it is still tripped. Guarded because a bare printer['...']
    # lookup on a name Klipper doesn't have raises KeyError; `in printer` is
    # the safe test (kept even though the button is live as of 2026-08-06, in
    # case a future config change ever comments it out again).
    {% if 'gcode_button smoke_sensor' in printer %}
      {% if printer['gcode_button smoke_sensor'].state == 'PRESSED' %}
        RESPOND TYPE=error MSG="Smoke still detected after the snooze"
        SMOKE_ALARM
      {% endif %}
    {% endif %}

# ---------------------------------------------------------------------------
# The alarm itself.
# ---------------------------------------------------------------------------
[gcode_macro SMOKE_ALARM]
description: Fire response - siren on, heaters off, emergency shutdown. Called by the MQ-2 sensor; can also be run by hand to test the whole chain.
gcode:
    # Order matters. Everything that needs a live Klipper has to happen before
    # the shutdown, so the emergency stop is the LAST thing, and it lives in
    # its own macro: action_emergency_stop() is a Jinja call, it fires while
    # the template is being RENDERED, i.e. before any command of this macro
    # would run. Putting it here inline would shut Klipper down first and make
    # every line below fail with "Printer is shutdown".
    # The discriminator goes up FIRST, in the same position and by the same
    # mechanism the siren SET_PIN used to hold, so the SET_PIN-versus-shutdown
    # race documented at the top of this file keeps exactly the properties it
    # was analysed with. This is the ONLY place in the whole config that raises
    # this flag - see the false-alarm block at the top for why that matters.
    SET_PIN PIN=smoke_alarm_active VALUE=1
    SET_PIN PIN=siren VALUE=1
    TURN_OFF_HEATERS
    M107                    # part fan OFF - do not blow air onto a fire
    RESPOND TYPE=error MSG="SMOKE ALARM - heaters off, emergency stop"
    _SMOKE_ESTOP

[gcode_macro _SMOKE_ESTOP]
description: Helper for SMOKE_ALARM - do not call directly
gcode:
    # This exact string is the UI contract. It does NOT end up at the start of
    # state_message - action_emergency_stop() itself prepends "Shutdown due to "
    # (gcode_macro.py:92) and the shutdown handler appends the boilerplate tail
    # (error_mcu.py:91-95), so the live message reads
    #   "Shutdown due to SMOKE ALARM: MQ-2 triggered\nOnce the underlying issue
    #    is corrected, use the \"FIRMWARE_RESTART\" command ...\nPrinter is shutdown"
    # Match it with a SUBSTRING search, never startswith. Full chain and the
    # verified live text are in the contract block at the top of this file.
    # Changing this text breaks the screen.
    {action_emergency_stop("SMOKE ALARM: MQ-2 triggered")}

# ---------------------------------------------------------------------------
# Manual helpers.
# ---------------------------------------------------------------------------
# DELIBERATELY NOT NAMED "SMOKE_SNOOZE". A UI that dismisses the alarm by
# sending a macro cannot work under this design - after a real alarm Klipper is
# in shutdown and every macro is rejected (see the contract note at the top of
# this file: dismissing means FIRMWARE_RESTART). Shipping a macro under the
# obvious name would let such a UI pass its "does the macro exist?" check and
# then fail later, at the confusing end. Under this name that check fails
# immediately and loudly, which is the correct outcome.
# What this one is actually for: bench tests, and the brief window before the
# shutdown if SMOKE_ALARM is ever run with the estop line removed.
[gcode_macro SMOKE_SILENCE_MANUAL]
description: Manual/bench use only - silence the buzzer and hold the sensor disarmed for another 10 minutes. Cannot run after a real alarm (Klipper is shut down); dismissing a real alarm means FIRMWARE_RESTART.
gcode:
    SET_PIN PIN=siren VALUE=0
    SET_PIN PIN=smoke_alarm_active VALUE=0   # drop the discriminator too, or a
                                             # bench alarm would leave every
                                             # consumer latched on a dead flag
    SET_PIN PIN=siren_armed VALUE=0
    # UPDATE_DELAYED_GCODE reschedules, it does not stack - pressing twice
    # extends the snooze to a fresh 10 minutes rather than adding 20.
    UPDATE_DELAYED_GCODE ID=_smoke_arm DURATION=600
    RESPOND MSG="Smoke alarm snoozed for 600s"

# The manual counterpart to SMOKE_SILENCE_MANUAL: arm right now instead of
# waiting out the rest of initial_duration. Same siren_armed pin, same
# "Smoke sensor armed" wording _smoke_arm already uses on the timer path - one
# message for one event, however it was reached.
[gcode_macro SMOKE_ARM]
description: Arm the smoke sensor immediately, bypassing the warm-up wait. Use once you know the MQ-2 has already warmed up.
gcode:
    SET_PIN PIN=siren_armed VALUE=1
    RESPOND MSG="Smoke sensor armed"

# Bookkeeping so that sensor DEGRADATION is visible at a glance instead of
# needing log archaeology. Counts every debounced trip that did NOT become an
# alarm (i.e. one that landed during warm-up or a snooze). A healthy MQ-2 leaves
# this at 0 for weeks; a drifting one will climb it.
# HONEST LIMIT, stated so nobody trusts it further than it goes: gcode_macro
# variables live in RAM, so this resets on every FIRMWARE_RESTART and every
# scripts/deploy.sh run. It is a "has anything happened lately" indicator, not
# an odometer. Making it survive restarts means [save_variables], i.e. a disk
# write per event - not worth it until the counter shows something.
[gcode_macro _SMOKE_COUNTERS]
description: Variable holder for smoke-sensor bookkeeping. Run it to print the count.
variable_unarmed_trips: 0
gcode:
    RESPOND MSG="Smoke sensor trips that did NOT raise an alarm this session: {printer['gcode_macro _SMOKE_COUNTERS'].unarmed_trips}"

[gcode_macro SMOKE_STATUS]
description: Report whether the smoke sensor is armed and what it currently reads
gcode:
    {% if 'gcode_button smoke_sensor' in printer %}
      RESPOND MSG="armed={printer['output_pin siren_armed'].value} sensor={printer['gcode_button smoke_sensor'].state} siren={printer['output_pin siren'].value} alarm={printer['output_pin smoke_alarm_active'].value} unarmed_trips={printer['gcode_macro _SMOKE_COUNTERS'].unarmed_trips}"
    {% else %}
      RESPOND MSG="armed={printer['output_pin siren_armed'].value} sensor=NOT CONFIGURED siren={printer['output_pin siren'].value} alarm={printer['output_pin smoke_alarm_active'].value} unarmed_trips={printer['gcode_macro _SMOKE_COUNTERS'].unarmed_trips}"
    {% endif %}

# SIDE EFFECT, HISTORICAL: this raises `siren`, and a UI watching THAT pin used
# to put its alarm banner up - three of the ten false alarms of 2026-08-17 are
# this macro's 3-second dwell, recognisable in KlipperScreen.log to three
# decimal places. It is no longer supposed to, because the banner is meant to
# follow smoke_alarm_active, which this macro deliberately does NOT touch. If a
# bench test still raises a banner, the consumer has not been repointed yet -
# see the 🔴 list at the top of this file.
# The other side effect is unchanged and still real: dismissing a banner sends
# SMOKE_SILENCE_MANUAL, which disarms the sensor for another 600s. So "I just
# tested the wiring" can leave the detector asleep for ten minutes. Run
# SMOKE_STATUS afterwards if you want to know where you stand.
[gcode_macro SMOKE_TEST_SIREN]
description: Sound the buzzer for 3 seconds to check the wiring. Does NOT shut anything down. Note - a UI watching the pin will raise its banner, and dismissing it disarms the sensor for 600s.
gcode:
    SET_PIN PIN=siren VALUE=1
    UPDATE_DELAYED_GCODE ID=_smoke_test_off DURATION=3

[delayed_gcode _smoke_test_off]
gcode:
    SET_PIN PIN=siren VALUE=0

# ---------------------------------------------------------------------------
# Print-lifecycle beeps (added 2026-08-16, print-start-end.cfg) - reuses this
# SAME buzzer, not a second one. 2 beeps at the end of PRINT_START (print
# about to start), 3 at the start of PRINT_END.
# ---------------------------------------------------------------------------
# RACE WITH SMOKE_ALARM, checked rather than assumed safe: SMOKE_ALARM's own
# gcode lines run strictly in order (SET_PIN VALUE=1, then TURN_OFF_HEATERS,
# then M107/RESPOND, then _SMOKE_ESTOP last) - by the time _SMOKE_ESTOP's
# {action_emergency_stop(...)} actually fires invoke_shutdown, SMOKE_ALARM's
# own SET_PIN VALUE=1 has already been dispatched. If a real alarm's press_
# gcode interleaves with a beep sequence mid-dwell (gcode_button callbacks are
# not literally queued behind whatever macro happens to be mid-G4), the worst
# case is a beep's own VALUE=0 landing a moment before or after the alarm's
# VALUE=1 - but the FINAL physical pin state after a real shutdown is decided
# by digital_out_shutdown() writing shutdown_value (=1, see the long note at
# the top of this file) at the actual MCU shutdown event, not by whichever
# gcode line ran last. So a beep cannot leave the siren stuck silent through a
# real alarm - only ever delay its onset by at most one dwell step (50 ms since
# 2026-08-17, was 150 ms when this was written).
#
# 🔴 WHAT THAT ANALYSIS MISSED, found 2026-08-17: it checked the race against
# the BUZZER and passed, but never asked what a consumer WATCHING the buzzer pin
# would conclude. Seven of the ten false fire alarms are these chirps - each one
# raised a full-screen red banner and, on 2026-08-17 00:18:48, made the siren
# daemon start pulsing its GPIO. The lesson generalises past this file: a pin
# that means three things cannot be an alarm signal. Hence smoke_alarm_active,
# which _BEEP must never touch. Do not "simplify" this by having _BEEP set it.
[gcode_macro _BEEP]
description: _BEEP COUNT=<n> - n short beeps on the existing siren buzzer (AUX-2 D44/PL5, TMB12A05). Used by print-start-end.cfg; safe to call by hand too.
gcode:
    # 50 ms tone / 30 ms gap, shortened from 150/150 on 2026-08-17 at the user's
    # request ("they should be much briefer"). He arrived at the same reading of
    # the false alarms independently - "maybe that was not the fire alarm, maybe
    # it was the three error beeps" - which is exactly what it was.
    #
    # WHY 50 AND NOT "as short as possible". Checked against the part rather than
    # picked: the TMB12A05 datasheet (Jiangsu Huaneng, and the LCSC C96093 page)
    # specifies rated voltage, current, SPL, operating range and a 2.4 kHz
    # resonant frequency - and NO response or rise time at all, so this number
    # cannot be read off a sheet and is derived instead:
    #   - It is an ACTIVE ELECTROMAGNETIC buzzer: applying DC starts an internal
    #     oscillator driving a mechanical resonator, so the sound builds over a
    #     few cycles rather than starting instantly. One cycle at 2.4 kHz is
    #     417 us; a small magnetic resonator settles within single-digit
    #     milliseconds. 50 ms is ~120 cycles - an order of magnitude of margin.
    #   - The binding limit is the ear, not the buzzer. A burst needs very
    #     roughly 15-20 ms before it is heard as a pitched tone instead of a
    #     click, and perceived loudness keeps integrating up to ~200 ms. So
    #     50 ms is comfortably tonal while giving up only a few dB against the
    #     old 150 ms - against 85 dB at 10 cm, irrelevant.
    #   - Below ~20 ms both effects bite at once: it turns into a faint tick.
    #     If these ever need to be shorter still, that is the floor to respect.
    # The gap is deliberately SHORTER than the tone (30 ms, far above the ~3 ms
    # at which the ear resolves two bursts as separate) so that a triple reads
    # as one "tick-tick-tick" event rather than three separate horns. A
    # COUNT=3 sequence is now 240 ms end to end instead of 900 ms.
    #
    # SECOND-ORDER BENEFIT, worth stating because it is a safety property and
    # not just cosmetics: the shorter the pulse, the narrower the window in
    # which anything watching the buzzer pin can mistake a chirp for a fire.
    # Moonraker batches status pushes on the order of a couple of hundred
    # milliseconds, so a 150 ms pulse was reliably observable and a 50 ms one
    # usually is not. Treat that as a reduction in probability, NOT a fix - a
    # consumer can still catch it. The actual fix is smoke_alarm_active, which
    # this macro never touches; this just narrows the target.
    {% set count = params.COUNT|default(1)|int %}
    {% for i in range(count) %}
        SET_PIN PIN=siren VALUE=1
        G4 P50
        SET_PIN PIN=siren VALUE=0
        G4 P30
    {% endfor %}

# ---------------------------------------------------------------------------
# THE SENSOR. Uncomment only after the MQ-2 is physically wired to AUX-2 D42.
# ---------------------------------------------------------------------------
# pin: ^!PL7
#   ^  internal AVR pullup. The module already pulls DO up to 5V through the
#      LM393's own pullup, so this is redundant in normal operation - it is
#      there to define the level if the signal wire ever comes loose (reads
#      HIGH = RELEASED = no alarm, rather than floating).
#   !  invert. On every MQ-2 module the LM393 output goes LOW when the gas
#      concentration passes the trimpot threshold, HIGH otherwise. So "pressed"
#      must mean "low", hence the inversion.
#
# FAIL-SAFE NOTE, intended behaviour and not a bug: if the sensor loses its 5V
# while GND and DO stay connected, the module's own pullup resistor becomes a
# ~10k pulldown to a dead rail, which beats the AVR's ~20-50k pullup, DO reads
# LOW and the alarm fires. Losing power to the smoke detector SHOULD be loud.
#
# ---------------------------------------------------------------------------
# debounce_delay: WHAT IT ACTUALLY DOES, read out of the source on THIS machine
# (~/klipper/klippy/extras/buttons.py, class DebounceButton) rather than assumed
# ---------------------------------------------------------------------------
# The question that matters is whether this number suppresses REPEAT events
# (a lockout, useless against a first glitch) or demands the level be HELD (a
# filter, which is what a fire alarm wants). It is the second. The mechanism,
# in full, because the difference decides whether raising it buys anything:
#
#   button_handler(eventtime, state):     # called on every debounced MCU edge
#       physical_state = state; latest_eventtime = eventtime
#       if logical_state == physical_state: return       # no transition, drop
#       reactor.register_callback(_debounce_event, eventtime + debounce_delay)
#   _debounce_event(eventtime):
#       if logical_state == physical_state: return       # it went back - drop
#       if (eventtime - debounce_delay) < latest_eventtime: return  # superseded
#       logical_state = physical_state; button_action(...)          # FIRE
#
# Three consequences, all load-bearing:
#   1. press_gcode runs `debounce_delay` seconds AFTER the edge, and only if the
#      level is still on the new side. A glitch shorter than the delay reaches
#      the first `return` and nothing happens. So the delay IS a hold time.
#   2. Any fresh edge inside the window restarts the clock (that is the
#      `superseded` line). A chattering input therefore never fires WHILE it
#      chatters - it fires `debounce_delay` after it settles. Good: a comparator
#      hunting around its threshold cannot trip the alarm by hunting.
#   3. 🔴 The corollary, and it is the honest answer to "log the noise you
#      filtered": a glitch shorter than debounce_delay never reaches the host
#      callback AT ALL. Klipper cannot report what it never gets. There is no
#      way to log sub-debounce events without lowering the filter that is doing
#      the protecting - and a `[delayed_gcode]` re-check in its place would be
#      strictly worse, because it samples the level at ONE instant, so a
#      chattering sensor that happens to read high at that instant would drop a
#      real alarm. The filter stays in the reactor. What IS logged is every trip
#      that survived the filter, plus the counter in _SMOKE_COUNTERS.
#
# WHY 10 AND NOT 2 (raised 2026-08-17). 2 s was already enough for what H5
# feared - the ~250 ms events it was written about turned out to be our own
# beeps, and the MQ-2 has never produced a single unexplained edge, so this is
# insurance against something not yet measured rather than a fix for something
# seen. It is still worth having, because the plausible failure mode of an MQ-2
# is not EMI (microseconds, killed by any of these numbers) but its LM393
# sitting near the trimpot threshold and dipping for a couple of seconds as the
# ambient drifts, or a passing puff of filament fume. Those are 1-5 s events;
# 10 s clears them with margin while a fire, which produces smoke for minutes,
# is unaffected. The cost is stated plainly: worst-case detection latency goes
# from ~2 s to ~10 s. That is irrelevant against a 1000 W bed fire and it is
# reversible at zero cost - if latency ever matters, put 2 back.
# ⚠️ NOT a substitute for the one calibration still missing: the module's
# threshold trimpot has never been set against real smoke. No debounce value
# rescues a threshold in the wrong place, in either direction.
#
# release_gcode is NOT empty (an earlier version of this comment said it was,
# and the code below has disagreed with it for a while). The alarm still
# LATCHES - clearing the sensor does not undo a shutdown or silence anything -
# the release path only writes a line so an unattended come-and-go leaves a
# trace instead of nothing.
[gcode_button smoke_sensor]
pin: ^!PL7
debounce_delay: 10
press_gcode:
    {% if printer['output_pin siren_armed'].value|int == 1 %}
      SMOKE_ALARM
    {% else %}
      SET_GCODE_VARIABLE MACRO=_SMOKE_COUNTERS VARIABLE=unarmed_trips VALUE={printer['gcode_macro _SMOKE_COUNTERS'].unarmed_trips|int + 1}
      RESPOND MSG="Smoke sensor tripped while DISARMED (warm-up or snooze) - no alarm raised. Trips this session: {printer['gcode_macro _SMOKE_COUNTERS'].unarmed_trips|int + 1}"
    {% endif %}
release_gcode:
    RESPOND MSG="Smoke sensor back to clear (RELEASED)"
