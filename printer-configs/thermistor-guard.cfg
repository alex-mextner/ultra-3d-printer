# ============================================================================
# THERMISTOR GLITCH GUARD - added 2026-08-18 after H18
# ============================================================================
#
# WHAT HAPPENED. On 2026-08-18 verify_heater shut the printer down with "Heater
# extruder not heating at expected rate". The log said something different: the
# hotend had REACHED 255C and held it at 33-69% PWM, and then the reading began
# jumping +-20C within a single second.
#
# That cannot be the block. A Volcano heatblock is roughly 20 g of aluminium and
# brass, about 16 J/K; the cartridge at full power moves it ~1C/s as measured on
# this machine's own heat-up curves (134 -> 165C in 30 s), and passive cooling is
# slower still. A 12-20C step in one second is an order of magnitude beyond what
# the hardware can do in either direction.
#
# Cause, named by the user: the heatblock's standard thermistor hole could not be
# used because of the large heatsink, so a new one was drilled and the bead sits
# in it on THERMAL PASTE ALONE. Under motion it loses thermal contact. The bead
# weighs a fraction of a gram, so ITS temperature really can swing that fast -
# the reading is honest, it has simply stopped being the block's temperature.
#
# 🔴 WHY THIS NEEDS A GUARD AND NOT JUST A NOTE. The failure is ASYMMETRIC. A bead
# that loses contact reads LOW, Klipper sees "too cold" and drives MORE power, and
# the real block goes ABOVE target with nothing watching. verify_heater caught the
# 2026-08-18 event only incidentally - the temperature failed to reach target, so
# its "not heating" check fired. Had the glitch happened while cruising at target,
# nothing in the stock configuration would have said a word.
#
# WHAT THIS DOES. Samples the extruder temperature once a second and shuts the
# heaters off if it moves faster than physics allows. It does NOT fix the mounting
# - that is H16/H18's foil-tape-then-grub-screw job - it converts an unguarded
# hazard into a guarded one so heating can resume under supervision.
#
# THRESHOLD, and why 5C/s:
#   measured heat-up rate on this machine   ~1  C/s
#   theoretical max, 40W into 16 J/K         2.5 C/s
#   observed glitches                       12-20 C/s
# 5 leaves 5x headroom over real behaviour and 2x over the theoretical maximum,
# while sitting far below anything the fault produced. Raise it only with a
# measured heat-up curve in hand, not by guessing.
#
# ⚠️ Deliberately does NOT guard the bed: it is a 1000W mains heater on a much
# larger mass, its rate limits are different, and it has never shown this fault.
# ============================================================================

[gcode_macro _THERMISTOR_GUARD]
variable_prev: -1000
variable_max_rate: 5.0
variable_min_temp: 80.0
gcode:
    # -1000 marks "no previous sample": after a restart, after the guard is first
    # armed, and any time the chain is broken. Comparing against a stale sample
    # from before a restart would be meaningless, so the first tick only records.
    {% set t = printer.extruder.temperature|float %}
    {% set prev = printer['gcode_macro _THERMISTOR_GUARD'].prev|float %}
    {% set rate = printer['gcode_macro _THERMISTOR_GUARD'].max_rate|float %}
    {% set floor = printer['gcode_macro _THERMISTOR_GUARD'].min_temp|float %}
    {% set delta = (t - prev)|abs %}

    # Only meaningful when hot. An NTC's sensitivity collapses at low temperature:
    # the same electrical or thermal perturbation that shows as 20C at 255C shows
    # as hundredths of a degree at 45C (dR/dT is ~4.4 ohm/K at 255C against
    # ~1700 ohm/K at 45C - a factor of ~385). Below this floor the check would be
    # blind anyway, and would only add false positives during fast warm-up.
    {% if prev > -999 and t > floor and delta > rate %}
        TURN_OFF_HEATERS
        M117 THERMISTOR GLITCH
        { action_respond_info(
            "THERMISTOR GUARD: extruder reading moved %.1fC in one second (%.1f -> %.1f). "
            "The heatblock physically cannot do that - this machine heats at ~1C/s and "
            "tops out near 2.5C/s. The sensor has lost contact with the block, which is "
            "H18: the bead sits in a drilled hole on thermal paste alone. HEATERS ARE OFF. "
            "A bead that loses contact reads LOW, so the danger is overheating, not "
            "under-heating. Fix the mounting before heating again - foil tape as the quick "
            "check, grub screw or a cartridge thermistor as the real answer."
            % (delta, prev, t)) }
        { action_raise_error("Thermistor glitch: %.1fC in 1s. See H18." % delta) }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_THERMISTOR_GUARD VARIABLE=prev VALUE={t}

[delayed_gcode _thermistor_guard_tick]
initial_duration: 15
gcode:
    _THERMISTOR_GUARD
    UPDATE_DELAYED_GCODE ID=_thermistor_guard_tick DURATION=1

[gcode_macro THERMISTOR_GUARD_STATUS]
description: Report the thermistor guard's threshold and last sample. Diagnostics only - the guard runs on its own timer and needs no arming.
gcode:
    {% set g = printer['gcode_macro _THERMISTOR_GUARD'] %}
    { action_respond_info(
        "thermistor guard: max %.1f C/s above %.0f C, last sample %.1f C (now %.1f C). "
        "Background: H18 in docs/tasks.md."
        % (g.max_rate|float, g.min_temp|float, g.prev|float,
           printer.extruder.temperature|float)) }
