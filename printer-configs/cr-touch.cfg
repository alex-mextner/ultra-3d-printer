# ===========================================================================
# CR-TOUCH (Creality's BLTouch-compatible clone) - mounted on the print head
# 2026-08-08. Klipper models this device with the [bltouch] module, not a
# raw [probe] - it is a servo-controlled pin-deploy probe (control pin drives
# a servo-style pulse to raise/lower the pin; sensor pin reports touch), and
# [bltouch] is exactly the module that speaks that protocol
# (klipper3d.org/BLTouch.html; raw docs/BLTouch.md in the Klipper source
# confirms the same two-pin control_pin/sensor_pin shape). A bare [probe]
# section only understands a simple switch and cannot drive the deploy/stow
# sequence at all.
#
# ---------------------------------------------------------------------------
# WIRING - deliberately NOT on the Z-MIN endstop connector
# ---------------------------------------------------------------------------
# This machine's Z axis is unusually unforgiving: the BED moves, G28 Z drives
# it UP toward the nozzle, and as of this session G28 has never once been run
# on ANY axis (printer-status.md, "🔴 G28 не проходил ни разу ни по одной
# оси"). The physical Z-MIN switch is the only Z-homing reference that has
# ever been exercised (via FORCE_MOVE direction checks, 2026-08-02) - handing
# Z-homing to a probe that was wired minutes ago and has NEVER been triggered
# even once would stack two unvalidated things on top of each other on the
# single most collision-prone axis in this build.
#
# So: the physical Z-MIN mechanical switch stays the SOLE Z-homing reference,
# completely unchanged ([stepper_z] endstop_pin below is untouched by this
# file). CR-Touch is wired to its OWN pins below and used ONLY as a [probe]
# object for BED_MESH_CALIBRATE / PROBE_CALIBRATE - it never substitutes
# endstop_pin: probe:z_virtual_endstop, and [safe_z_home] is deliberately NOT
# added here.
#
# This also happens to sidestep a documented clone quirk, not just a
# machine-specific caution: Klipper's own BLTouch doc notes some BL-Touch
# v3 / clone probes do not behave correctly when their signal line lands on
# a Z-MIN pin that has a capacitor across it for switch debounce (a fixture
# common on Z-MIN circuits, not confirmed present or absent on this specific
# RAMPS board) - the documented workaround is "connect to a different pin",
# which is what this file does regardless.
#
# Pins - AUX-4 (18-pin header, wired for the LCD that will never arrive on
# this RAMPS board - see docs/printer-status.md "Карта занятости AUX"),
# confirmed free against that map and against every printer-configs/*.cfg
# 2026-08-08 (does not collide with D16 armed-toggle, D17/Serial2's other
# half, or the D23/D25/D27 RGB reserve):
#   control_pin -> D29 / PA7 (AUX-4)   - orange wire, servo pulse
#   sensor_pin  -> D31 / PC6 (AUX-4)   - white wire, touch signal
#   5V and GND taken from the same AUX-4 header (present on every AUX
#   connector on this board).
# ---------------------------------------------------------------------------

[bltouch]
control_pin: PA7             # D29/AUX-4. Orange wire. No pullup - this is a
                            # push-pull output from the MCU, not a sense
                            # input (Klipper Config_Reference.md: "Pin
                            # connected to the BLTouch control pin", no
                            # pullup mentioned for this one).
sensor_pin: ^PC6             # D31/AUX-4. White wire. Pullup REQUIRED - both
                            # klipper3d.org/BLTouch.html ("Most BL-Touch
                            # devices require a pullup on the sensor pin
                            # (prefix the pin name with '^')") and
                            # Config_Reference.md agree; omitting it is a
                            # known way to get a probe that free-floats
                            # between reads.
x_offset: 0                # PLACEHOLDER. Needs a real measurement (ruler/
y_offset: 0                # calipers, nozzle center to CR-Touch pin center)
                            # once the head mount (docs/print-head-mount.md,
                            # basket C6) is physically finished - the probe
                            # was only just mounted, the offset from nozzle
                            # has not been measured yet. CR-Touch's pin is
                            # OFFSET from its mounting screws (unlike genuine
                            # BLTouch, whose pin is centered between them),
                            # so this is not "eyeball it from the STL" - it
                            # needs a physical measurement of the assembled
                            # head, not the CAD model.
#z_offset:                  # DELIBERATELY UNSET - Klipper requires this in
                            # [bltouch] with no built-in default
                            # (Config_Reference.md lists it as required, no
                            # default value), and it can ONLY be produced by
                            # running PROBE_CALIBRATE on the real machine
                            # (klipper3d.org/BLTouch.html: "verify the Z
                            # offset is close to 1mm" is a sanity check on a
                            # MEASURED value, not a number to assume up
                            # front). Leaving this unset means Klipper will
                            # refuse to start until someone runs
                            # PROBE_CALIBRATE and fills it in - a deliberate
                            # hard stop, not an oversight: guessing a z_offset
                            # on an axis where the bed already travels
                            # straight into the nozzle on Z-home is the wrong
                            # place to be optimistic.
speed: 3                   # BELOW Klipper's own default (5.0,
                            # Config_Reference.md) - this file's [probe]
                            # object moves the SAME physical bed-toward-
                            # nozzle Z axis as G28 Z, and every other first
                            # move on this machine has shipped at a reduced,
                            # cautious speed (see [stepper_y] homing_speed:
                            # 10, lowered from 50, same reasoning). Raise
                            # once PROBE_CALIBRATE and a first BED_MESH_
                            # CALIBRATE have both landed clean.
samples: 2                  # Above Klipper's default of 1 - this probe has
                            # never taken a single real reading on this
                            # machine; a lone sample can't be cross-checked
                            # against anything. samples_tolerance/
                            # samples_result are left at Klipper's own
                            # defaults (0.100mm / average) - no evidence yet
                            # to justify overriding either.
# lift_speed, pin_move_time, stow_on_each_sample, probe_with_touch_mode,
# pin_up_reports_not_triggered, pin_up_touch_mode_reports_triggered: all
# left at Klipper's own defaults (Config_Reference.md). In particular,
# pin_up_touch_mode_reports_triggered is a commonly-cited fix
# ("set False") for clone probes that fail Klipper's internal sensor-state
# verification ("BLTouch failed to verify sensor state") - NOT applied here
# preemptively, because this exact unit has not been tested even once and
# this repo's convention is to fix a measured fault, not a hypothetical one.
# If the first BLTOUCH_DEBUG/PROBE_CALIBRATE run throws that specific error,
# this is the first knob to try, cited here so it is not a fresh research
# trip at 11pm.

# [bed_mesh] intentionally NOT added yet. Real mesh bounds depend on
# [stepper_x]/[stepper_y] position_max, which is being re-measured live on
# the real machine this same session (see docs/printer-status.md) - adding
# mesh bounds here now would mean guessing numbers that are actively being
# corrected elsewhere, in parallel, in the same file family. Add [bed_mesh]
# once: (1) X/Y travel is settled, (2) PROBE_CALIBRATE has produced a real
# z_offset, (3) a first manual PROBE / QUERY_PROBE has confirmed the sensor
# actually triggers. None of those three are true yet.
