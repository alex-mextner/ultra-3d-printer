# ===========================================================================
# PRINT_START / PRINT_END - written 2026-08-16, this machine's first real
# print attempt cancelled without them ever existing.
# ===========================================================================
# klippy.log from that attempt: `Unknown command:"PRINT_START"` (and
# EXCLUDE_OBJECT_* before this file's [exclude_object] fixed those). Grepping
# every printer-configs/*.cfg that evening found zero [gcode_macro PRINT_START]
# or PRINT_END anywhere - confirmed independently twice. PRINT_START/PRINT_END
# are NEVER built into Klipper itself (unlike Marlin's fixed start/end
# behaviour) - Klipper's minimal-core philosophy means the slicer just calls a
# command by this name and expects the user to have written it (confirmed
# against Voron's own docs: https://docs.vorondesign.com/community/macros/).
# This machine's actual slicer profile proves it: grepping the real gcode file
# from the failed attempt (OrcaSlicer 2.4.2, "Generic Klipper Printer")
# shows machine_start_gcode is LITERALLY just
#   M190 S[bed_temperature_initial_layer_single]
#   M109 S[nozzle_temperature_initial_layer]
#   PRINT_START EXTRUDER=[nozzle_temperature_initial_layer] BED=[bed_temperature_initial_layer_single]
# i.e. the slicer heats, then hands EVERYTHING else - homing, any further
# heat-soak sequencing, the purge/prime line - to this macro. With PRINT_START
# missing, Klipper's SD-print handling logs "Unknown command" and CONTINUES to
# the next line rather than aborting (this is why the print body's real moves
# started running with the toolhead never re-homed for this print at all).
#
# ---------------------------------------------------------------------------
# THE REAL ROOT CAUSE OF THE 2026-08-16 ABORT - confirmed by evidence, not
# guessed. Two competing hypotheses were RULED OUT first:
# ---------------------------------------------------------------------------
#   RULED OUT: slicer-side M851/Z-offset double-counting (the Marlin habit).
#   The actual gcode file's own footer states `; z_offset = 0` - this
#   slicer profile is not adding anything on top of position_endstop.
#   RULED OUT: the rejected move was ordinary first-layer squish. The
#   klippy.log line was `Move out of range: 144.450 122.564 -0.100 [-0.800]`
#   - that trailing bracket is E, and it is NEGATIVE (a retract), not a
#   squish move into plastic already on the bed.
#
#   CONFIRMED, from klippy.log: TWO separate "Move out of range" incidents
#   that same evening landed within 0.1mm of each other in completely
#   unrelated computed contexts - one in mainsail.cfg's OWN park helper
#   (_TOOLHEAD_PARK_PAUSE_CANCEL, X=240 Y=190 Z=-0.100, a PAUSE/CANCEL_PRINT
#   invocation, nothing to do with the slicer file at all), the other in this
#   print's own body (X=144.450 Y=122.564 Z=-0.100). Two independent
#   computations landing on the same small negative Z is not a coincidence -
#   it is the signature of a SHARED ADDITIVE TERM sitting underneath both:
#   a live SET_GCODE_OFFSET Z value. mainsail.cfg's park helper computes
#   z_park entirely in GCODE-space and explicitly clamps its floor to 0
#   (`[(act.z + park_dz), z_min]|max`) - it CANNOT produce a negative
#   request on its own. Klipper's gcode_move layer then adds the live
#   homing_origin.z (== whatever SET_GCODE_OFFSET Z is currently set to) on
#   top of that clamped, always-non-negative GCODE coordinate to get the real
#   KINEMATIC target actually checked against position_min/max - which is
#   exactly the class of value klippy.log's "Move out of range" reports. A
#   babystepped offset left over from this same evening's manual paper-based
#   bed leveling (SET_GCODE_OFFSET is documented by Klipper itself,
#   Manual_Level.html, as RAM-only and meant to be routine/per-session - it
#   does NOT reset between two prints in the same Klipper session, only on a
#   real Klipper restart) is the only explanation that fits BOTH incidents
#   without requiring the print file or the park helper to have done anything
#   wrong on their own.
#
#   CONCLUSION: this was never a slicer bug and never really a position_min
#   bug either (position_min=0 did its job both times - it rejected an
#   actually-dangerous request). The real gap was that nothing on this
#   machine ever re-synchronised the live Z babystep back to the permanent,
#   position_endstop-calibrated reference before trusting an absolute Z
#   coordinate. PRINT_START now does that explicitly - see SET_GCODE_OFFSET
#   Z=0 MOVE=0 below - immediately after a fresh G28, which is also why G28
#   has to come first: it re-establishes stepper position from the real
#   switch, but on its own does NOT touch homing_origin.z (SET_GCODE_OFFSET is
#   a separate, deliberately-persistent layer - see printer.cfg [stepper_z]'s
#   own comments on why position_endstop and SET_GCODE_OFFSET are not allowed
#   to blend into one number). A leftover offset from an unrelated manual
#   leveling session is not "this print's" offset and must not silently
#   apply to it.
#
#   Community-standard confirmation (WebSearch, 2026-08-16): PRINT_START
#   macros home before anything else runs specifically so no later absolute-
#   coordinate command has to trust stale pre-print toolhead state - see
#   Voron's own macro docs (https://docs.vorondesign.com/community/macros/)
#   and general Klipper community practice (e.g. discussion at
#   https://klipper.discourse.group/t/must-home-axis-first-when-starting-print/10918).
#   Nothing found suggests PRINT_START should ever need to command a negative
#   absolute Z on this or any similarly-calibrated machine - routine
#   first-layer dialing-in belongs in SET_GCODE_OFFSET/babystepping (live,
#   per-print), never in position_min.
#
# ---------------------------------------------------------------------------
# WHAT THIS MACHINE DOES NOT HAVE (so this file does not pretend to use it)
# ---------------------------------------------------------------------------
# No bed_mesh, no probe: CR-Touch (cr-touch.cfg's [bltouch]) is physically
# dead (see docs/bom.md) and that file is deliberately NOT [include]d in
# printer.cfg. No QGL/Z_TILT: single Z motor, nothing to tilt-adjust.
#
# Z HOMING ON THIS MACHINE MOVES THE BED, NOT THE HEAD, UP TOWARD THE NOZZLE
# (printer.cfg [stepper_z]) - the single most safety-relevant fact about this
# macro. G28 alone (no custom Z-lift-first override) is used here on purpose:
# it already homes X and Y before Z (Klipper's own default axis order for a
# bare G28), and Z's own homing_speed is Klipper's conservative unmodified
# default (5mm/s - printer.cfg never overrides it, unlike X/Y's temporarily
# lowered 10mm/s), the same G28 this project's whole axis-travel-measure
# effort (axis-travel-measure.cfg) already exercised repeatedly and
# successfully on this exact axis. Nothing new is being tried on Z here - the
# novelty is entirely in remembering to CALL G28 at all before a print, and in
# resetting the live offset immediately after.
#
# 🔴 FIRST SUPERVISED RUN REQUIRED - do not scripts/deploy.sh this file
# unattended. The homing sequence itself is proven; what is genuinely new and
# unverified is the ORDER (home -> reset offset -> heat -> prime) running
# back-to-back, unattended-until-the-first-tested-run, right before real
# print motion. Watch the first PRINT_START live, hand on the power switch,
# same posture as every other first-Z-motion event this project has done.
#
# ---------------------------------------------------------------------------
# PARAMETERS - matched to what this machine's actual slicer profile sends
# ---------------------------------------------------------------------------
# Confirmed live from the failed print's own gcode file:
#   PRINT_START EXTRUDER=220 BED=55
# i.e. EXTRUDER= and BED=, both plain numbers, both required by this profile
# (OrcaSlicer's [nozzle_temperature_initial_layer]/[bed_temperature_initial_
# layer_single]). Defaulted to 0 here anyway so a bare hand-typed PRINT_START
# does not explode - 0 skips the heater wait blocks below.
[gcode_macro PRINT_START]
description: PRINT_START EXTRUDER=<target C> BED=<target C> - call from the slicer's machine start gcode. Homes, re-syncs the live Z babystep to the calibrated position_endstop reference, heats, primes, then hands off to the sliced body. See this file's header for the full 2026-08-16 root-cause writeup this design is based on.
gcode:
    {% set extruder_temp = params.EXTRUDER|default(0)|float %}
    {% set bed_temp = params.BED|default(0)|float %}

    # Cancel any pending 30-minute "just finished, still green" timer from a
    # PREVIOUS print (rgb-status.cfg's RGB_DONE/_rgb_done_off) before it can
    # fire mid-THIS-print and blank RGB_PRINTING for no reason connected to
    # what's actually running now. DURATION=0 is Klipper's documented way to
    # cancel a pending delayed_gcode. Harmless/no-op if nothing was pending.
    UPDATE_DELAYED_GCODE ID=_rgb_done_off DURATION=0

    RGB_PREPARING

    # Bed heat started early, non-blocking (M140 not M190) so it can soak
    # while X/Y/Z home - the slow part of warm-up overlaps the slow part of
    # homing instead of happening in series.
    M140 S{bed_temp}

    # Re-home from the real switches before trusting ANY absolute coordinate
    # below. This is the actual fix for the 2026-08-16 abort - see header.
    G28

    # G28 does not touch a live SET_GCODE_OFFSET - that is deliberate
    # (printer.cfg [stepper_z]: position_endstop is the permanent
    # calibration, SET_GCODE_OFFSET is the routine/session layer, and they
    # are not supposed to blend). Explicitly zero any leftover babystep from
    # a PRIOR, unrelated manual-leveling session before this print inherits
    # it silently. MOVE=0: no physical move needed, the fresh G28 already put
    # the toolhead at a position consistent with offset=0.
    SET_GCODE_OFFSET Z=0 MOVE=0

    # Wait for both heaters. Bed first (head start already spent warming up
    # during homing), extruder last so filament is not sitting hot any
    # longer than necessary before the prime line/real printing starts.
    M190 S{bed_temp}
    M109 S{extruder_temp}

    # Purge/prime line. Deliberately entirely within position_min(0)..
    # position_max on every axis - this exact class of move (a Z target
    # computed as small/negative before print motion starts) is what broke on
    # 2026-08-16; nowhere in this macro is Z ever commanded as a bare
    # negative number. Front-left corner, off the model's own footprint.
    G90
    G1 X5 Y5 F6000
    G1 Z2 F600
    G92 E0
    G1 Z0.3 F600
    G1 X60 Y5 E15 F500        # slow prime line - lay down a clean bead
    G1 X100 Y5 E10 F1000      # faster wipe - thin the trailing ooze
    G92 E0
    G1 Z2 F600                 # lift clear of the prime line before real moves

    _BEEP COUNT=2

    # Last line on purpose (rgb-status.cfg's own design note): "printing"
    # means the nozzle is actually about to extrude real geometry, not just
    # that heaters were requested.
    RGB_PRINTING

# ---------------------------------------------------------------------------
# PRINT_END - confirmed from the same gcode file: machine_end_gcode is
# literally `PRINT_END`, no params, called AFTER the slicer's own
# filament_end_gcode has already retracted and turned the part fan off
# (verified: `G1 E-.56 ... M106 S0 ... PRINT_END` immediately precedes it in
# the real file) - so this macro does not retract or touch the fan again on
# entry, that would double up on an already-retracted extruder.
# ---------------------------------------------------------------------------
[gcode_macro PRINT_END]
description: Called by the slicer's machine end gcode after a normal, successful print. Lifts clear, parks, kills heat, disables steppers, signals done.
gcode:
    # Green for 30 minutes ("done, come collect it"), then auto-off - see
    # rgb-status.cfg's RGB_DONE header for the full design note and why
    # PRINT_START cancels this timer's next-print carry-over risk.
    RGB_DONE

    TURN_OFF_HEATERS
    M106 S0

    # Relative Z-hop, clamped to this axis's own real ceiling (position_max,
    # MEASURED 2026-08-15 - see printer.cfg [stepper_z]) rather than a bare
    # +10 that could itself go out of range near the top of travel.
    {% set safe_z = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
    G90
    G1 Z{safe_z} F600
    G1 X5 Y5 F6000

    M84

    _BEEP COUNT=3

    RESPOND MSG="Print finished"
