# Measurement helper: records the REAL physical homing travel distance per
# stepper, via klipper-extras/axis_travel_report.py - deployed separately
# from the rest of printer-configs/*.cfg, see scripts/deploy-klipper-
# extras.sh. This section alone does nothing without that .py file present
# in ~/klipper/klippy/extras/ on the printer (Klipper will fail to start
# with "Unable to load module" if the .py is missing but this section is
# still included - the deploy script installs both together for exactly
# this reason).
#
# Built 2026-08-08 to answer one question precisely: how far does Y/Z
# actually travel from its far mechanical limit (no endstop there) to the
# real endstop trigger point, so position_max can be set from a real
# measurement instead of a tape-measure guess. Full design rationale,
# sourced against this printer's actual installed Klipper, is the module's
# own docstring - read it before using this.
#
# 🔴 2026-08-15: the original design here (SET_KINEMATIC_POSITION then
# plain G28) turned out not to work - Klipper's G28 always overwrites the
# start position with its own synthetic value before the module ever sees
# it, discarding SET_KINEMATIC_POSITION entirely. Full root cause and the
# fix (a new MEASURE_HOME command that bypasses the part of G28 that does
# this) are in the module's docstring - read that before touching this
# file again, it has the source citations. This macro no longer does the
# measurement itself; it is a one-line compatibility wrapper so the
# command name people already learned keeps working.
#
# Adds three gcode commands (see the module docstring for the real detail
# on each):
#   MEASURE_HOME AXIS=<X|Y|Z> [MARGIN=<mm>]  - the actual measurement.
#     Requires the axis to already be pushed by hand to its far mechanical
#     limit before calling this - it homes toward the real switch and
#     records the true travel. Also what HOME_AND_MEASURE below calls.
#   RESET_AXIS_TRAVEL_REPORT [STEPPER=<name>]  - MEASURE_HOME calls this
#     itself; only needed by hand if inspecting a plain G28's (synthetic,
#     not physically meaningful - see module docstring) numbers instead.
#   AXIS_TRAVEL_REPORT                         - print what's recorded.
# and one queryable object: GET /printer/objects/query?axis_travel_report
[axis_travel_report]

# HOME_AND_MEASURE AXIS=<X|Y|Z> - kept as the name already in use; it is now
# a one-line pass-through to MEASURE_HOME (klipper-extras/axis_travel_
# report.py), which does the real work in Python (anchor pick + the actual
# non-G28 homing move) rather than here. X is out of scope as of 2026-08-08
# (bare belt, no carriage mounted) - this will still run for AXIS=X since
# nothing here is X-specific, but don't call it for X until the carriage is
# actually on.
[gcode_macro HOME_AND_MEASURE]
description: HOME_AND_MEASURE AXIS=<X|Y|Z> - alias for MEASURE_HOME AXIS=<X|Y|Z>. Read the result with GET /printer/objects/query?axis_travel_report (fields: start_mm, trigger_mm, travel_mm) - this does not compute position_max itself, on purpose: which config key the far coordinate becomes (position_max for Y/Z, position_min for X) depends on which side is unconstrained, and that mapping belongs with the human reading the result, not hidden in gcode.
gcode:
    MEASURE_HOME AXIS={params.AXIS}
