# Measurement helper: records the REAL physical homing travel distance per
# stepper, via klipper-extras/axis_travel_report.py - deployed separately
# from the rest of printer-configs/*.cfg, see scripts/deploy-klipper-
# extras.sh. This section alone does nothing without that .py file present
# in ~/klipper/klippy/extras/ on the printer (Klipper will fail to start
# with "Unable to load module" if the .py is missing but this section is
# still included - the deploy script installs both together for exactly
# this reason).
#
# Built 2026-08-08 to answer one question precisely: how far does Y/Z
# actually travel from its far mechanical limit (no endstop there) to the
# real endstop trigger point, so position_max can be set from a real
# measurement instead of a tape-measure guess. Full design rationale,
# sourced against this printer's actual installed Klipper, is the module's
# own docstring - read it before using this.
#
# PURELY OBSERVATIONAL - never changes homing speed, retract distance, or
# the final position Klipper reports after G28. Adds two gcode commands:
#   RESET_AXIS_TRAVEL_REPORT [STEPPER=<name>]   - call before a fresh
#     manual-reposition-then-home measurement (see module docstring: the
#     reported number is only meaningful if Klipper's tracked position was
#     accurate when the pass began, which after a by-hand reposition means
#     a SET_KINEMATIC_POSITION ... SET_HOMED=<axis> right before G28)
#   AXIS_TRAVEL_REPORT                           - print what's recorded
# and one queryable object: GET /printer/objects/query?axis_travel_report
[axis_travel_report]

# HOME_AND_MEASURE AXIS=<X|Y|Z> - one-command wrapper so nobody has to hand-
# pick or type a SET_KINEMATIC_POSITION reference number to use this. The
# module's own docstring (klipper-extras/axis_travel_report.py) explains why
# that reference step can't be skipped: an axis moved by hand since the last
# trustworthy position has no other way to tell Klipper where it physically
# is. The number itself is provably irrelevant (cancels out of the reported
# delta) - this macro just picks one automatically, near whichever end of
# the CONFIGURED range has no endstop, so the homing search has its full
# legal window before it reaches the real switch.
#
# anchor_at_max is a per-machine fact, not a guess: X's endstop sits on the
# MAX side (position_endstop is coupled to position_max in [stepper_x],
# see that section's own comment), Y and Z sit on MIN
# (docs/printer-status.md, "Карта занятости AUX" / homing direction notes).
# X is out of scope as of 2026-08-08 (bare belt, no carriage mounted) - this
# macro will still run for AXIS=X since nothing here is X-specific, but
# don't call it for X until the carriage is actually on.
[gcode_macro HOME_AND_MEASURE]
description: HOME_AND_MEASURE AXIS=<X|Y|Z> - homes one axis from an automatically-chosen legal reference point and records the real travel distance. Read the result with GET /printer/objects/query?axis_travel_report (fields: start_mm, trigger_mm, travel_mm) - this macro does not compute position_max itself, on purpose: which config key the far coordinate becomes (position_max for Y/Z, position_min for X) depends on which side is unconstrained, and that mapping belongs with the human reading the result, not hidden in gcode.
gcode:
    {% set AXIS = params.AXIS|upper %}
    {% set axis = AXIS|lower %}
    {% set idx = {'x': 0, 'y': 1, 'z': 2}[axis] %}
    {% set anchor_at_max = {'x': False, 'y': True, 'z': True}[axis] %}
    {% set margin = 1.0 %}
    {% set amin = printer.toolhead.axis_minimum[idx] %}
    {% set amax = printer.toolhead.axis_maximum[idx] %}
    {% set anchor = (amax - margin) if anchor_at_max else (amin + margin) %}
    RESET_AXIS_TRAVEL_REPORT STEPPER=stepper_{axis}
    SET_KINEMATIC_POSITION {AXIS}={anchor} SET_HOMED={axis}
    G28 {AXIS}
    AXIS_TRAVEL_REPORT
