# Measurement helper: records the REAL physical homing travel distance per
# stepper, via klipper-extras/axis_travel_report.py - deployed separately
# from the rest of printer-configs/*.cfg, see scripts/deploy-klipper-
# extras.sh. This section alone does nothing without that .py file present
# in ~/klipper/klippy/extras/ on the printer (Klipper will fail to start
# with "Unable to load module" if the .py is missing but this section is
# still included - the deploy script installs both together for exactly
# this reason).
#
# Built 2026-08-08 to answer one question precisely: how far does Y/Z
# actually travel from its far mechanical limit (no endstop there) to the
# real endstop trigger point, so position_max can be set from a real
# measurement instead of a tape-measure guess. Full design rationale,
# sourced against this printer's actual installed Klipper, is the module's
# own docstring - read it before using this.
#
# PURELY OBSERVATIONAL - never changes homing speed, retract distance, or
# the final position Klipper reports after G28. Adds two gcode commands:
#   RESET_AXIS_TRAVEL_REPORT [STEPPER=<name>]   - call before a fresh
#     manual-reposition-then-home measurement (see module docstring: the
#     reported number is only meaningful if Klipper's tracked position was
#     accurate when the pass began, which after a by-hand reposition means
#     a SET_KINEMATIC_POSITION ... SET_HOMED=<axis> right before G28)
#   AXIS_TRAVEL_REPORT                           - print what's recorded
# and one queryable object: GET /printer/objects/query?axis_travel_report
[axis_travel_report]
