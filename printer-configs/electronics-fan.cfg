# ===========================================================================
# ELECTRONICS BAY FAN: RAMPS board + TMC2209/A4988 drivers + SSR + Orange Pi,
# brought under Klipper control on D5/PE3 through a KSP42(TA) bipolar NPN
# low-side switch. Design worked out 2026-08-03 (docs/printer-status.md,
# "ПЛАН: управление ВСЕМИ вентиляторами") assuming a logic-level N-MOSFET;
# WIRED 2026-08-07 with a KSP42(TA) BJT instead (what the user actually had
# on the bench). The control logic below is unchanged from that plan - only
# the switch device and its drive math are different. Read the fail-safe
# note near the bottom before trusting this at "blows even if the MCU is
# dead" - that property was part of the MOSFET plan and does NOT carry over
# unmodified to a BJT. Full history: docs/printer-status.md, sections 5-10
# under "ПЛАН: управление ВСЕМИ вентиляторами", plus the 2026-08-07 update
# at the end of that plan recording this exact deviation.
#
# WHY THIS EXISTS: this fan used to run on a permanently-live 12V terminal,
# outside Klipper entirely - the only way to quiet it was to physically
# unplug the board. Cost of that: driver/SSR/host cooling had no protection
# either, and the user resorted to de-powering the whole board to get quiet.
# This section replaces "always on" with "on when there is heat to move" -
# see the trigger logic below.
#
# ---------------------------------------------------------------------------
# HARDWARE - low-side BJT switch, no pull resistor either direction
# ---------------------------------------------------------------------------
#   +12V ─────────────────────────── fan(+)
#                     fan(-) ──────── COLLECTOR
#   D5/PE3 ──[ 180R ]── BASE
#   GND (common with RAMPS) ──────── EMITTER
#
# Transistor: KSP42(TA). NPN, TO-92, 300V/500mA/625mW (Fairchild/onsemi
# datasheet, confirmed via Mouser/onsemi/alldatasheet listings 2026-08-07 -
# the huge VCEO headroom is irrelevant here, it is what was on hand).
# "(TA)" is a TAPE-AND-AMMO-PACK PACKAGING SUFFIX, not a different package -
# alldatasheet/chipdocs list KSP42TA and KSP42BU (bulk) alongside plain
# KSP42, all the same TO-92 die. Do not go looking for a SOT-89 footprint.
# Pinout per the Fairchild/onsemi datasheet: TO-92, leads (1) Emitter,
# (2) Base, (3) Collector - VERIFY THIS on the actual part before soldering
# (multimeter diode-test mode: base is the pin common to both forward drops,
# emitter/collector by the diode direction), the same "don't trust the
# printed convention, check the physical part" discipline this project
# already paid for once on the TMC2209 PDN_UART mixup.
#
# Base resistor - 180R, MANDATORY, sized from real datasheet numbers, not
# copied from the smoke-alarm buzzer's resistor (that part has hFE>=100;
# this one does not, see below):
#
#   KSP42 DC current gain (hFE), from the datasheet's own ON Characteristics
#   table (Fairchild/onsemi, confirmed via three independent listings
#   2026-08-07): hFE >= 25 min @ VCE=10V, IC=1mA; hFE >= 40 min @ IC=10mA and
#   IC=30mA. NO hFE FIGURE IS PUBLISHED ABOVE IC=30mA, and the datasheet's own
#   hFE-vs-IC graph (Figure 1) shows further ROLL-OFF above that point - so at
#   this fan's actual load ("hundreds of mA", see below) the true hFE is
#   UNKNOWN and plausibly below even the 25 floor. Design against the WORST
#   published number (25), not the more flattering 40 at 10-30mA - the fan
#   current is well outside the range that 40 was ever measured at.
#   VBE(sat) = 0.9V max @ IC=20mA, IB=2mA (same table) - used below as the
#   base-emitter drop, not the generic 0.7V rule of thumb.
#   VCE(sat) = 0.5V max @ IC=20mA, IB=2mA - i.e. the datasheet's own
#   saturation guarantee is measured at forced beta (IC/IB) = 10. That ratio
#   is the target below, not an arbitrary overdrive factor.
#
#   Fan current is NOT measured or specified anywhere in this repo (no model
#   number on record, see docs/bom.md) - only ever described qualitatively as
#   "hundreds of mA" (docs/printer-status.md, same language used for the
#   already-working D11 motor fan through its old IRL640). Design against an
#   assumed 150-300mA band, stated as an ESTIMATE, not a measurement.
#
#   Pin drive voltage under an 18-23mA DC load (not the near-zero-current
#   MOSFET-gate case elsewhere in this project) is NOT given as a guaranteed
#   number in the ATmega2560 datasheet's DC Characteristics table (Microchip
#   DS40002211A p.355 lists the VOH test condition, IOH=-20mA @ VCC=5V, but
#   defers the actual min/typ figure to characterization curves, not a table
#   entry) - so this is bracketed rather than assumed: 4.0V (conservative,
#   accounts for real sag under load) to 5.0V (optimistic, unloaded rail).
#
#   With R = 180R:
#     Ib = (Vpin - 0.9V) / 180R
#     Vpin=4.0V -> Ib = 3.1V/180R  = 17.2mA
#     Vpin=5.0V -> Ib = 4.1V/180R  = 22.8mA
#   Forced beta (Ic/Ib) across the assumed 150-300mA band and both Vpin
#   bounds:
#     worst case for saturation:  Ic=300mA, Ib=17.2mA -> beta = 17.4
#     best case:                  Ic=150mA, Ib=22.8mA -> beta =  6.6
#   Both ends sit BELOW the 25 hFE floor with real margin (30% at the worst
#   combination), i.e. below the datasheet's own forced-beta=10 saturation
#   test in the "deep enough to still count as saturated" sense even though
#   it isn't the exact tested ratio.
#   470R (the top of a "generic small-signal BJT" range like the one used
#   for the smoke-alarm buzzer) was checked and REJECTED for this specific
#   part: Ib=(4.1V)/470R=8.7mA, forced beta at 250mA = 28.7 - ABOVE the 25
#   floor, i.e. not guaranteed saturated. The buzzer's 470R-15k range relied
#   on hFE>=100; this transistor does not have that headroom, and the same
#   resistor range does not transfer.
#   Ib stays under the AVR's 20mA "recommended continuous" figure at the
#   conservative Vpin bound and only modestly over it at the optimistic
#   bound - both are far under the 40mA per-pin absolute maximum (Microchip
#   DS40002211A p.355) already relied on elsewhere in this project (siren
#   circuit, smoke-alarm.cfg). Port-group budget: PE3 is Port E, group
#   "E0-E7, G5" <=100mA (same datasheet, note 4) - the only other pin in that
#   group used anywhere in this repo is PE4 (stepper_x endstop, an INPUT with
#   an internal pull-up, draws no real current into a load) - so this fan's
#   ~20mA is effectively the entire group's draw, nowhere near the 100mA cap.
#
#   Without the resistor: the pin would drive the base-emitter junction
#   directly, clamped near 0.9V, current limited only by the pin's own
#   internal drive impedance - same failure class already worked out for the
#   smoke-alarm buzzer's Option C (there: ~107mA, "nearly 3x the absolute
#   maximum"). Mandatory, not optional.
#
# No base pulldown AND no base pullup - covered under "fail-safe" below,
# this is a deliberate choice, not an oversight matching the buzzer pattern.
#
# Diode: not needed, same reasoning already established for the D11 motor
# fan and the buzzer - a two-wire brushless fan's own commutation
# electronics absorbs its own inductive kick; nothing here is a bare coil.
#
# VERIFICATION AFTER WIRING (do this before trusting the section below):
# with the fan running, measure VCE across the transistor directly (expect
# well under 1V - the datasheet's 0.5V spec is measured at a much lower
# current, so some derating is plausible, but it must stay clearly in
# saturation, not the linear region) OR equivalently measure the voltage
# across the fan itself (expect >=11V of the 12V rail - the same check
# already used in this project for the IRF540ZPBF candidate). A low reading
# on the fan (8-10V) means the transistor is in the linear region and
# heating up, not switching - lower the resistor value and recheck.
# ---------------------------------------------------------------------------

[temperature_fan electronics_fan]
pin: PE3                    # D5, SERVOS header. Confirmed free by grepping
                            # every printer-configs/*.cfg 2026-08-07 - no
                            # other section claims PE3 or PE4 as an output.
shutdown_speed: 1.0         # SET EXPLICITLY even though it is temperature_fan's
                            # own default - see fan.py: Fan(config,
                            # default_shutdown_speed=1.). Written out so a
                            # future edit that changes the section TYPE (e.g.
                            # to fan_generic, whose default is 0) cannot
                            # silently change the shutdown behaviour. Meaning:
                            # Klipper went to shutdown with a warm bay -> blow
                            # at 100%. This is written into MCU firmware
                            # (gpiocmds.c digital_out_shutdown(), the same
                            # mechanism the siren in smoke-alarm.cfg and the
                            # red RGB channel in rgb-status.cfg both rely on)
                            # and fires on ANY invoke_shutdown - verify_heater
                            # trip, M112, lost MCU comms - independent of the
                            # transistor behind the pin. See the fail-safe
                            # note below for what this does NOT cover.
# kick_start_time: DELIBERATELY OMITTED (not a live key - this line is a
                            # comment, not config), not merely forgotten.
                            # kick_start_time only matters when the commanded
                            # speed is a low PWM fraction the fan needs a
                            # shove to start turning at - fan.py's
                            # _apply_speed() always jumps to max_power for
                            # the kick regardless of target, so under
                            # control:watermark below (whose only two states
                            # ARE 0 and max_speed) the kick and the settled
                            # value are identical: no observable effect,
                            # just a wasted 0.2s delay before the first
                            # reading is honoured. An earlier draft of this
                            # section (printer-status.md, "ПЛАН") carried it
                            # with a bearing-friction rationale that does not
                            # actually apply here - corrected 2026-08-07.
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp   # same file [temperature_sensor
                            # OrangePi_CPU] already opens below in printer.cfg.
                            # Both open it independently and read-only -
                            # temperature_host.py has no shared state between
                            # sections, so there is no conflict, only two
                            # readers of one file.
min_temp: 0
max_temp: 95                # Belt-and-suspenders, not the operative ceiling:
                            # [temperature_sensor OrangePi_CPU] in printer.cfg
                            # already has max_temp: 90 on the SAME underlying
                            # file, and temperature_host.py calls
                            # invoke_shutdown() the moment either section's
                            # limit is crossed - the 90 fires first, always.
                            # 95 here is honest bookkeeping (this section
                            # must have SOME max_temp, Klipper requires it)
                            # rather than a real independent safety margin.
control: watermark          # Bang-bang, not PID: nothing here needs a
                            # proportional response, and PID's floor
                            # (min_speed, default 0.3) would keep the fan
                            # spinning at low speed forever - defeats the
                            # entire point (quiet in idle). No PID_CALIBRATE
                            # exists for temperature_fan in Klipper anyway,
                            # so coefficients would be hand-guessed.
target_temp: 60             # PRELIMINARY - see docs/printer-status.md, "B15"
                            # in the (B) basket. Nobody has measured this
                            # bay's CPU-adjacent temperature with the fan
                            # OFF; every number on record was taken with it
                            # already running. If idle-with-no-fan turns out
                            # to sit above ~55C, this threshold makes the fan
                            # run almost continuously and the user gets
                            # nothing for the wiring effort. Revisit after B15.
max_delta: 5.0              # -> ON at 65C, OFF at 55C. 10C of hysteresis
                            # against an H3 that passive-throttles at 80C:
                            # room to spare, and wide enough that ordinary
                            # load-driven wobble of a few degrees will not
                            # chatter the fan on and off.

# ---------------------------------------------------------------------------
# Supervisor: pulls the target down (forces the fan on) while motors are
# energized or a heater has a nonzero target - conditions the CPU sensor
# cannot see on its own. Uses ONLY SET_TEMPERATURE_FAN_TARGET, never
# SET_FAN_SPEED / SET_PIN / M106 - that restriction is not stylistic, it is
# the entire reason this design is safe to run. See "idle_timeout" note below.
# ---------------------------------------------------------------------------
[delayed_gcode _elec_fan_supervisor]
initial_duration: 10        # start 10s after Klipper reaches ready
gcode:
    # RESCHEDULE FIRST, AND NOTHING ELSE BEFORE IT. If anything below this
    # line ever raises (a bad printer.* lookup, a typo after a future edit),
    # the next tick is already queued and the loop survives the error. Put
    # this line last instead and one exception stops the supervisor forever,
    # silently - the exact mistake power-loss-recovery.cfg's header already
    # tells this story about (_plr_tick, the '#' inside a Jinja string).
    UPDATE_DELAYED_GCODE ID=_elec_fan_supervisor DURATION=5
    {% set st = printer.stepper_enable.steppers %}
    {% set motors = st['stepper_x'] or st['stepper_y']
                    or st['stepper_z'] or st['extruder'] %}
    {% set heaters = printer.heater_bed.target > 0
                     or printer.extruder.target > 0 %}
    {% set force = motors or heaters %}
    {% set tf = printer['temperature_fan electronics_fan'] %}
    # TARGET=5, never 0: temperature_fan.py's set_tf_speed() special-cases
    # target_temp <= 0 as "off" (`if self.target_temp <= 0.: value = 0.`),
    # so TARGET=0 would do the opposite of "force on". Verified against
    # Klipper tag v0.13.0 2026-08-07 (this machine runs v0.13.0-708, i.e.
    # 708 commits past that tag - close but not identical; re-check on the
    # actual installed tree with
    # `grep -n "target_temp <= 0" ~/klipper/klippy/extras/temperature_fan.py`
    # next time the printer is reachable over SSH, it was not reachable
    # tonight - see printer-status.md for why). The ">10" comparison below
    # is just "are we already in that state", so the same command is not
    # re-sent every 5 seconds for no reason.
    {% if force and tf.target > 10 %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics_fan TARGET=5
    {% elif not force and tf.target < 10 %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics_fan TARGET=60
    {% endif %}
    # NO SET_FAN_SPEED / SET_PIN / M106 ANYWHERE IN THIS MACRO - see below.

# ---------------------------------------------------------------------------
# Why polling this macro on a timer does NOT corrupt idle_timeout (the trap
# that already cost this project one evening, see power-loss-recovery.cfg's
# header and docs/printer-status.md "Ключевая находка... идёт по gcode-пути"):
#
#   SET_FAN_SPEED / M106 / SET_PIN all route through
#   GCodeRequestQueue.queue_gcode_request() -> toolhead.register_lookahead_
#   callback(), which on an idle machine immediately calls
#   get_last_move_time() -> _calc_print_time() -> fires
#   "toolhead:sync_print_time" - and idle_timeout.handle_sync_print_time()
#   treats that event as PRINTING, resetting the idle clock. Repeat that
#   every 5s and TURN_OFF_HEATERS (printer.cfg [idle_timeout] timeout: 600)
#   never fires, and scripts/deploy.sh's hard "not printing" gate starts
#   failing roughly 1/3 of the time it happens to sample mid-blip.
#
#   temperature_fan's OWN control loop (what actually flips the pin) never
#   goes near that path: fan.py Fan.set_speed() calls
#   self.gcrq.send_async_request(value, print_time), the async branch, no
#   toolhead call at all. And SET_TEMPERATURE_FAN_TARGET's handler
#   (cmd_SET_TEMPERATURE_FAN_TARGET) only assigns target_temp/min_speed/
#   max_speed fields on the object - no toolhead, no lookahead callback,
#   nothing gcode-queue-shaped. Both verified line-by-line against Klipper
#   tag v0.13.0 2026-08-07 (klippy/extras/fan.py, klippy/extras/
#   temperature_fan.py) - the printer itself was unreachable over SSH
#   tonight (see printer-status.md) so this is checked against the closest
#   available tag, not the exact installed v0.13.0-708 tree; re-run the
#   same check on-device before treating it as fully closed.
#
# Rule this project already wrote down once and is repeating here on
# purpose: a supervisor macro over a fan may call SET_TEMPERATURE_FAN_TARGET
# and nothing else that touches gcode/toolhead.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# FAIL-SAFE - what this design covers, what it does NOT, and why that is a
# conscious change from the 2026-08-03 plan, not an oversight.
# ---------------------------------------------------------------------------
# The 2026-08-03 plan (printer-status.md, section 8) called for a LOGIC-LEVEL
# MOSFET with its gate pulled UP to +5V, specifically so the fan would blow
# even with the pin high-Z (MCU reset, host reboot, before Klipper connects).
# That plan explicitly said: "если берём биполярный - вентилятор при
# неуправляемом пине МОЛЧИТ, и тогда честнее оставить его постоянным" - i.e.
# a bipolar switch gives up that fail-safe, and the honest fallback was "then
# don't bother with Klipper control at all."
#
# Tonight's hardware reality overrides that conclusion, and here is the
# actual reasoning, not just the override:
#
# A base pull-up does NOT transplant cleanly from a MOSFET gate to a BJT
# base. A MOSFET gate draws ~0 steady current, so a 10k-100k pull-up holds
# it at +5V for free with no interaction with the pin's own LOW drive. A BJT
# base draws real current: a pull-up small enough to deliver useful fail-safe
# base current (tens of mA, per the saturation math above) would ALSO fight
# the pin whenever Klipper drives it LOW to turn the fan off normally - the
# pin would have to sink the pull-up's current on top of the base resistor's,
# every single time the fan is supposed to be off, which is most of the
# time. There is no clean, honest way to give this specific transistor class
# the same "unmanaged pin = fan on" property the MOSFET plan relied on
# without either wasting continuous pin current or under-sizing the pull-up
# to the point it cannot actually saturate the transistor. So: no pull-up,
# same choice already made for the D11 motor fan and the smoke-alarm buzzer.
#
# What is actually lost, precisely: WITHOUT the pull-up, an unmanaged pin
# (base floating through the 180R resistor to a high-Z AVR pin) leaks off
# and the transistor defaults OFF - so the fan does NOT blow during a genuine
# MCU reset (opening the serial port toggles DTR and resets the Mega -
# this happens on every `scripts/deploy.sh` run) or during the window after
# a host reboot before Klipper reconnects.
#
# What is NOT lost: shutdown_speed: 1.0 is applied by MCU FIRMWARE while the
# firmware is still running - Klipper crashing into shutdown (verify_heater,
# M112, lost comms) still drives the pin HIGH through gpiocmds.c, which still
# forward-biases this BJT's base through the same 180R exactly as normal ON
# operation does. That is the dominant failure mode this fan actually guards
# against (section 9 risk item 1 in the doc: "in this same moment the SSR
# pin also goes dark, so the bed stops generating heat" - the scenario "dead
# fan with an actively heating bed" still cannot happen). Only the narrower
# "MCU itself is not running firmware yet" window loses coverage, and in
# that window the SSR pin is ALSO not being driven by firmware, so no active
# heat generation is happening there either - it is a short window (seconds
# per deploy, tens of seconds on a host reboot) of residual heat with no
# active fan, not continuous unprotected operation. The doc's own section 9
# risk item 3 already concluded driver airflow is not a safety condition at
# the current run_currents (0.8/0.7/0.6A against a 1.0A no-airflow ceiling)
# - that conclusion now covers this reset window too, for the same reason.
#
# OPTION NOT TAKEN, WORTH KNOWING: the IRL640 freed by tonight's D11 swap
# (see printer.cfg's [controller_fan extruder_motor_fan] comment) is a
# logic-level MOSFET, field-proven on this exact machine, and WOULD support
# a real gate pull-up fail-safe the way this BJT cannot. It is currently
# earmarked for the RGB red channel (rgb-status.cfg), which is unbought/
# unwired. Swapping that allocation - IRL640 here, a KSP42(TA) on RGB red
# later - was not done tonight because the user had already committed to
# wiring both fan circuits with KSP42(TA) at the bench; flagged here as a
# real, currently-available option to revisit, not a redesign performed
# unasked.
# ---------------------------------------------------------------------------
