# ============================================================================
# _SLICER_PROFILE - the slicer-only settings this machine declares about
# itself, so the generated OrcaSlicer profile needs NO hand-editing.
# Added 2026-08-18.
# ============================================================================
#
# WHY THIS FILE EXISTS
#
# `scripts/deploy.sh` regenerates the OrcaSlicer profile on every deploy by
# running klipper-to-orcaslicer against the live config (see the tail of that
# script). That generator can only derive what Klipper actually knows: bed
# size, Z height, nozzle diameter, velocity/acceleration ceilings. It cannot
# derive z-hop height, retraction, or the fact that this hotend has a hardened
# steel nozzle and a direct-drive extruder - Klipper does not model any of
# that, because none of it is firmware's business.
#
# Everything not declared here silently falls back to OrcaSlicer's generic
# base preset defaults. That is not theoretical: on 2026-08-17 the profile
# had no z_hop at all, so the slicer used its own 0.4mm default, the travel
# moves failed to clear curled-up PETG edges at 200mm/s, and the print was
# knocked out of alignment along Y. The value below is the fix for exactly
# that failure.
#
# THE REAL REASON IT LIVES IN THE PRINTER'S CONFIG AND NOT IN THE REPO
#
# This printer is going to be handed to someone else. They get the MACHINE -
# not this git repository, not this workstation, not the generator checkout.
# Anything stored beside the generator would make the profile correct only on
# the computer holding that file. Stored here, the printer carries its own
# slicer settings: the new owner points the generator at the printer, imports
# one JSON, and prints. That is the whole requirement.
#
# It also keeps the project rule intact - configs are edited in the repo and
# deployed, never edited on the printer (CLAUDE.md). This file is deployed by
# the same automatic glob as everything else in printer-configs/.
#
# HOW IT WORKS / HOW TO ADD A SETTING
#
# Each `variable_<key>` is copied into the profile under `<key>` verbatim, so
# adding a setting is a one-line edit HERE - it never requires touching the
# generator. Two rules, both enforced by Klipper itself:
#
#   1. Values must be valid PYTHON LITERALS. Strings need their quotes:
#      `variable_nozzle_type: ["hardened_steel"]`, never bare hardened_steel.
#   2. A LIST becomes a JSON array, a SCALAR becomes a bare string. This is
#      not cosmetic - OrcaSlicer stores per-extruder settings (z_hop,
#      retraction, nozzle_type ...) as arrays and machine-wide ones as plain
#      strings, and it will not read a value written in the wrong shape.
#      Verified against a profile known to load in OrcaSlicer 2.4.2.
#
# 🔴 Do not put a `#` comment on a variable line. Klipper's config parser
# strips from the first `#` BEFORE the value is ever evaluated, quotes and
# all - the same trap already documented for power-loss-recovery.cfg in
# CLAUDE.md. Keep comments on their own lines, as below.

[gcode_macro _SLICER_PROFILE]

# --- Z hop ------------------------------------------------------------------
# 0.8mm, raised from the slicer's 0.4mm default after the 2026-08-17 layer
# shift described above: 0.4mm did not clear PETG edges that had curled up off
# the bed, so the nozzle struck them during travel.
# ⚠️ HONEST CAVEAT, do not lose this: docs/calibration-plan.md Э0-Б suspects
# Z-hop itself of causing Z step loss on this machine (max_z_accel is only
# 100mm/s²) and asks for a test print with z_hop = 0. A TALLER hop means MORE
# Z motion, so these two findings pull in opposite directions and are not yet
# reconciled. 0.8 is the deliberate current choice - it fixes a failure that
# actually happened, against one that is so far only suspected. If Э0-Б comes
# back positive, this line is the first thing to revisit.
variable_z_hop: [0.8]
variable_z_hop_types: ["Normal Lift"]

# --- Physical facts about the head -------------------------------------------
# Hardened steel nozzle: a property of the installed hotend, invisible to
# Klipper. It matters to the slicer's abrasive-filament handling, and it is
# genuinely true of this machine (see docs/hotend-assembly.md).
variable_nozzle_type: ["hardened_steel"]
# Direct drive, not bowden - the extruder is mounted on the carriage. Klipper's
# gear_ratio (50:17) proves the extruder is GEARED, but says nothing about
# where it sits, so this cannot be derived and has to be declared.
variable_printer_extruder_variant: ["Direct Drive Standard"]

# --- Retraction --------------------------------------------------------------
# ⚠️ NOT CALIBRATED. These are the values inherited from OrcaSlicer's base
# preset, pinned here explicitly so they live in one place and survive
# regeneration - pinning them changes NO behaviour today, it only makes the
# current state visible and editable from the source of truth.
# docs/calibration-plan.md Э10 is the step that replaces them with measured
# values; until it runs, treat these as "whatever the slicer was already
# doing", not as a result.
variable_retraction_length: [0.8]
variable_retraction_speed: [30]
variable_deretraction_speed: [30]

# ---------------------------------------------------------------------------
# ACCELERATION CLAMP - added 2026-08-18, and this one is not cosmetic
# ---------------------------------------------------------------------------
# On 2026-08-18 acceleration was measured to be the cause of Y layer shifts:
# 6000mm/s^2 slips whole electrical cycles, 5000 and below is clean, and the
# deployed max_accel was cut to 4000 (see [printer] in printer.cfg for the
# table and the reasoning).
#
# 🔴 BUT max_accel DOES NOT BIND A PRINT. The accelerations that reach the
# machine come from the SLICER'S PROCESS PROFILE, not from the printer profile
# and not from printer.cfg:
#     travel_acceleration        7000   <- this is the one that slipped the axis
#     inner_wall_acceleration    5000
#     default_acceleration       5000
#     outer_wall_acceleration    3000
#     initial_layer_acceleration  500
# Those are exactly the SET_VELOCITY_LIMIT values found in this machine's own
# sliced files, and Klipper does not clamp them - toolhead.py's
# set_max_velocities assigns straight through.
#
# machine_limits_usage is not defined anywhere in the preset tree, so the
# machine profile's machine_max_acceleration_* sits there influencing nothing.
# Setting it here is an attempt to make the machine's own limits actually bind,
# which is the only version of this fix that TRAVELS WITH THE MACHINE rather
# than living in one person's slicer install - and that matters, because this
# printer is being handed on.
#
# ⚠️ NOT YET CONFIRMED TO CLAMP. If a re-slice still emits accelerations above
# max_accel, then Orca treats machine limits as time-estimate-only for this
# flavour, and the real fix has to be a shipped PROCESS profile - task P7 in
# docs/tasks.md, which already exists for travel_speed for the same reason.
# Verify by slicing and grepping the output for SET_VELOCITY_LIMIT.
variable_machine_limits_usage: ["emit_to_gcode"]

# Klipper requires a gcode: field on every [gcode_macro]; the section exists
# purely to carry the variables above, so the body is intentionally empty.
# Same shape as Mainsail's own [gcode_macro _CLIENT_VARIABLE].
gcode:
