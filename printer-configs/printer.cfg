[include mainsail.cfg]

# Smoke alarm (MQ-2 on AUX-2 D42/PL7) + buzzer (AUX-2 D44/PL5, through a small
# NPN). MQ-2 and buzzer were wired 2026-08-06 and [gcode_button smoke_sensor]
# is now live - see that file's own header for current state. Design notes,
# the M112 analysis and the mounting instructions are in that file's header
# and in printer-status.md ("Датчик дыма + сирена").
[include smoke-alarm.cfg]

# Power-loss / interruption recovery: a timer checkpoints the print to disk, and
# RESUME_INTERRUPTED_PRINT walks the machine back to that point after anything
# that wipes klippy's RAM (power loss, M112, shutdown, host reboot). It also
# brings the only [save_variables] section in this config with it.
# SAFE TO KEEP ACTIVE WITH NO HARDWARE FITTED: the timer writes nothing unless a
# virtual_sdcard print is running, and every macro that moves the machine
# refuses without an explicit CONFIRM=YES.
# 🔴 COMPLETELY UNTESTED ON A REAL PRINT - no print has ever run on this
# machine. Read the file header and printer-status.md ("Возобновление печати")
# before trusting it.
# RE-ENABLED 2026-08-06 after being disabled the same night. Root cause of the
# earlier outage: _PLR_SAVE line 238 had a literal '#' inside a Jinja string
# ('#' in fname) - klippy/configfile.py truncates every config line at its
# first '#' (line.find('#')) before configparser/jinja2 ever see it, quote-
# blind, which gutted that line's {% if %} tag and crashed Jinja further down.
# Proven with Klipper's own ConfigFileReader, not guessed - see
# printer-status.md "Возобновление печати" for the reproduction and the
# corrected timeline (the original write-up here briefly blamed a deploy-time
# race; that was wrong and has been corrected in the same doc section).
# Fixed by replacing the literal '#' with '\x23' (same character to Jinja,
# invisible to Klipper's naive truncator) - verified before this redeploy with
# the real configfile.ConfigFileReader + the real
# jinja2.Environment('{%','%}','{','}'), both compiling and correctly matching
# an actual '#' in a test string at render time. Live confirmation (Klipper
# reaching ready with this include active) is recorded in printer-status.md,
# not here - check there rather than trusting this comment's age.
[include power-loss-recovery.cfg]

# Electronics-bay fan (RAMPS board + TMC2209/A4988 drivers + SSR + Orange Pi)
# on D5/PE3, through an external KSP42(TA) BJT - being wired 2026-08-07,
# physical completion NOT confirmed (printer was unreachable over the
# network this session - see printer-status.md). Was on a permanently-live
# 12V terminal outside Klipper entirely before this; see
# that file's own header for the base-resistor math, the trigger logic, and
# - important - a fail-safe trade-off deliberately accepted by going BJT
# instead of the MOSFET the original 2026-08-03 plan assumed. Design history:
# printer-status.md, "ПЛАН: управление ВСЕМИ вентиляторами".
[include electronics-fan.cfg]

# Hotend HEATSINK fan on D9/PH6 - the same physical fan this config called
# [fan] (part cooling) until 2026-08-17. Nothing was rewired; the declaration
# was simply wrong: that fan blows at the hotend heatsink, not at the part, so
# every slicer M107 left a 240C hot end without airflow (heat creep -> jam).
# It is now a [temperature_fan] whose OFF threshold tracks the Orange Pi CPU
# temperature instead of a constant, per the user's own rule ("отключается
# только когда сопло холоднее процессора"). Consequences that reach outside
# that file - M106/M107 no longer have a real fan and are stubbed there, and
# this machine currently has NO part cooling at all (planned separately) -
# are written out in its header.
[include hotend-fan.cfg]

# RGB status light: [led rgb_strip], software-only (dummy AVR pins, nothing
# physically wired) so Mainsail's native color-picker widget has a real
# Klipper object to drive - real switching happens on the Orange Pi, see
# orangepi-services/smoke-siren/smoke-siren-daemon.py. Full design, pin map,
# dimming/threshold policy: that file's own header, this file's own header,
# and printer-status.md, "RGB статус-подсветка".
[include rgb-status.cfg]

# CR-Touch probe, [bltouch] on AUX-4 D29 (control) / D31 (sensor) - mounted
# 2026-08-08. NOT wired into Z-homing (physical Z-MIN switch stays the sole
# Z-homing reference) - used only for BED_MESH_CALIBRATE/PROBE_CALIBRATE once
# z_offset is measured. z_offset is left UNSET on purpose (Klipper requires
# it, no default exists) - this include will refuse to start Klipper until
# PROBE_CALIBRATE has run on the real machine. See that file's own header.
#
# 🔴 TEMPORARILY DISABLED 2026-08-08 (same evening): this include was
# committed (f9c984b) but never actually deployed by the agent that wrote
# it - the comment above ("will refuse to start") was verified true, not
# hypothetical, the moment printer.cfg was next deployed for an UNRELATED
# reason (adding [include axis-travel-measure.cfg] below): Klipper went to
# `error` on "Option 'z_offset' in section 'bltouch' must be specified"
# (confirmed via klippy.log, not guessed). Commenting this one line out is
# the fix, NOT inventing a z_offset - that number can only come from a real
# PROBE_CALIBRATE on the live machine, which is explicitly a separate,
# supervised task (see cr-touch.cfg's own header). Re-enable this line only
# once that calibration has actually happened; until then it must stay
# commented so the rest of printer.cfg (including anything unrelated added
# after it) can be deployed without dragging this half-finished feature
# down with it.
#[include cr-touch.cfg]

# Axis-travel measurement helper. The Python module itself
# (axis_travel_report.py) is no longer part of this repo - as of 2026-08-15
# it lives at github.com/alex-mextner/klipper-axis-travel-report, cloned on
# the device to ~/klipper-axis-travel-report and symlinked into
# ~/klipper/klippy/extras/, updated via Moonraker's [update_manager
# klipper-axis-travel-report] (printer-configs/moonraker.conf) - the same
# standard git_repo pattern this project already used for
# klipper_tmc_autotune. This [include] only carries the config SECTION
# ([axis_travel_report] + the HOME_AND_MEASURE macro) - purely observational,
# see the module's own repo for its header/design notes.
[include axis-travel-measure.cfg]

# Filament load/unload macros for KlipperScreen's stock filament panel -
# see filament-load.cfg's own header for why they didn't exist before
# 2026-08-15 and what still needs live calibration.
[include filament-load.cfg]

# PID_SWEEP - calibrate the extruder's PID at several representative
# temperatures in one supervised run, compare results, pick one by
# hand. See pid-calibrate-sweep.cfg's own header for the real Klipper
# internals this works around (single-profile PID, no live-apply
# command, and a template-rendering-vs-execution-order gotcha).
[include pid-calibrate-sweep.cfg]

# PRINT_START / PRINT_END - real macros, written 2026-08-16 after the first
# print attempt aborted (klippy.log: Unknown command:"PRINT_START", neither
# macro existed anywhere in this repo). Full root-cause writeup (why the
# abort happened, what it has to do with a leftover SET_GCODE_OFFSET rather
# than the slicer or position_min) is in print-start-end.cfg's own header.
[include print-start-end.cfg]

# TUNE_SPEED_LADDER / TUNE_ACCEL_LADDER / TUNE_CURRENT_SWEEP - semi-automatic
# motor and driver tuning, written 2026-08-17. Each ladder steps one variable
# (velocity, acceleration or run_current), runs a stress pattern, and then
# MEASURES the resulting lost steps IN MILLIMETRES using this project's own
# axis_travel_report module (MEASURE_HOME, see [include axis-travel-measure.cfg]
# above) instead of asking a human whether it sounded like it skipped - so the
# ladder can stop by itself at the first rung that fails. Replaces the by-ear /
# by-hand-load method that set [printer] max_velocity to 175 and then had to be
# cut to 80 on 2026-08-16 after real skipped steps during a print.
# NOTHING HERE RUNS ON ITS OWN. Every macro moves real axes, and on Z homing
# drives the BED INTO THE NOZZLE - read motor-tuning.cfg's own header (safety
# section, the hardcoded 1.0 A RMS current ceiling and where it comes from, and
# the two ways a ladder could silently report a ceiling that does not exist)
# before running any of them.
[include motor-tuning.cfg]

# force_move: KEPT PERMANENTLY - deliberate choice, do not "clean up".
# Originally added 2026-07-27 for direction-verification testing before homing
# was trusted; that testing is now finished. It stays because this is a custom,
# frequently-modified machine (repairs, upgrades, swapped hotends/endstops), and
# FORCE_MOVE / SET_KINEMATIC_POSITION are exactly what you need to move an axis
# safely when homing is not yet trustworthy after a change.
# Trade-off accepted knowingly: these commands bypass normal position/limit
# checks, so a wrong DISTANCE can drive an axis into the frame. Use small values.
[force_move]
enable_force_move: True

[mcu]
# by-id path, NOT /dev/ttyUSB* - the ttyUSB number changes between reboots and
# when the cable moves to another port. The FT232R is built into the Freaduino
# board itself (behind its miniUSB socket), not a separate external adapter.
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AJV9MLVG-if00-port0
baud: 250000                # Klipper default and recommended value - do not change

[printer]
kinematics: cartesian
# All three limits below were found EMPIRICALLY (FORCE_MOVE at rising VELOCITY
# under hand load), not from datasheets - the motors are unbranded and have none.
max_velocity: 80             # LOWERED 2026-08-16 from 175 - user reported real skipped
                            # steps on X/Y at the higher speed during actual printing
                            # (the FORCE_MOVE-under-hand-load sweep that justified 175 was
                            # a no-extrusion-load bench test, not representative of a real
                            # print's combined X/Y/E/accel demand). 80 is a deliberately
                            # conservative cut, not a recalculated margin - re-raise only
                            # after a real print confirms no skips at a level in between.
max_accel: 1500             # NOT calibrated - generic default. Needs a ringing-tower
                            # test print to set properly (method in ramps-diagnostics.html)
max_z_velocity: 18          # NOT changed to 80 - Z's own empirical ceiling (this same
                            # bench sweep) plateaued at 20mm/s regardless of current, a
                            # mechanical/back-EMF limit, not a tuning choice. Commanding 80
                            # here would just mean the mechanism tops out around 18-20
                            # anyway; the "80 everywhere" request applies to where X/Y
                            # actually had headroom to give up, not to an axis that never
                            # had 80 available in the first place. Real Z step-loss (see
                            # print-quality investigation, 2026-08-16) is a separate,
                            # still-open question from this speed cut.
# 2026-08-16 print-quality investigation (layer 2 printing "in the air", voids left in
# layer 1) - drafted, reviewed, then deployed the same day for a supervised test print
# (user present, hand on power switch - same posture as every other first-Z-motion-
# change event this project has done), because it changes how the bed accelerates on
# every single Z-hop.
max_z_accel: 100             # DEPLOYED 2026-08-16, isolated test (current/stealthchop NOT
                            # touched in the same step, on purpose - see the print-quality
                            # investigation below and docs/printer-status.md: the user's own
                            # gravity-direction analysis suggests the more direct cause may be
                            # insufficient HOLDING torque against the bed's weight at low-
                            # speed/stop moments (asymmetric: gravity ASSISTS the down move
                            # and RESISTS the up move, so any torque shortfall in either
                            # direction still nets the bed FARTHER from the nozzle, matching
                            # the observed air-printed layer 2 rather than compressed layers -
                            # this accel cut is tested FIRST, alone, specifically so a still-
                            # present void after this deploy points cleanly at current/
                            # stealthchop_threshold next, not a tangled multi-variable guess).
                            # Evidence for this value: this printer's own real gcode
                            # (OrcaCube_v2_0.2mm_PETG..., every inter-feature travel move,
                            # e.g. line 307) commands "G1 Z.6 F12000" for the Z-hop lift/
                            # drop - Klipper clamps the CRUISE speed to max_z_velocity (18),
                            # but the ACCEL to reach it still uses the global max_accel
                            # (1500mm/s^2 above), which that same [printer] section's own
                            # comment already flags as "NOT calibrated - generic default"
                            # (line 140) - i.e. never validated for Z's real load. On THIS
                            # machine Z moves the BED (heater+wiring+plate), not a light
                            # carriage - a materially heavier mass than X/Y ever accelerate,
                            # on a T8 leadscrew, at a MODEST run_current (0.6A, [tmc2209
                            # stepper_z] above - chosen from old trimpot-era guesses, "STILL
                            # OPEN... needs the user present" per that section's own note,
                            # never validated under real bed load). Compounding factor: Z
                            # has stealthchop_threshold: 5 (added 2026-08-08 to fix an
                            # audible whine, [tmc2209 stepper_z] above) - the TMC2209
                            # switches chopper mode by MEASURED velocity in hardware, so
                            # every accel/decel ramp through 5mm/s on the way to/from 18
                            # briefly runs in stealthChop (lower torque than spreadCycle at
                            # the same current) exactly while accelerating the bed's mass -
                            # a plausible per-hop step-loss mechanism that would accumulate
                            # over the many hops in one layer, matching the reported symptom
                            # (bed measurably lower by layer 2). This machine has no diag_pin
                            # on stepper_z (grepped printer.cfg - none configured) and
                            # DRV_STATUS has no lost-step counter (this file's own comment,
                            # [tmc2209 stepper_z]), so Klipper cannot detect this
                            # electrically either way - only a real, watched test print
                            # settles it. 100mm/s^2 is a conservative placeholder (~15% of
                            # the uncalibrated 1500 default), not a measurement - pick a real
                            # value the same way X/Y's max_accel eventually should be (a
                            # ringing-tower-style test, scaled for Z's much lower velocity
                            # ceiling). DOES NOT touch stealthchop_threshold or run_current -
                            # those trade off against the confirmed whine complaint and
                            # deserve a separate, explicit decision, not a silent revert
                            # bundled into this fix.
# square_corner_velocity: not set -> Klipper default 5mm/s. Also needs a test print.

[idle_timeout]
# After this many seconds with no real gcode activity Klipper silently runs
# TURN_OFF_HEATERS. Status polling via API does NOT count as activity.
# This caused several "the bed switched itself off" scares - it is normal behaviour.
timeout: 600                # Klipper default (10 min). Raise temporarily if testing.

[virtual_sdcard]
path: /home/ultra/printer_data/gcodes
on_error_gcode: CANCEL_PRINT   # abort the print if an error occurs mid-job

# ADDED 2026-08-16, no parameters needed - this section's mere presence is
# what registers EXCLUDE_OBJECT_DEFINE/EXCLUDE_OBJECT_START/EXCLUDE_OBJECT_END
# etc. as real commands. Without it, slicers with "label objects for
# exclusion" enabled (PrusaSlicer/OrcaSlicer/SuperSlicer, on by default in
# recent versions) emit these in the gcode header and Klipper rejects them:
# "Unknown command: EXCLUDE_OBJECT_DEFINE" - caught live 2026-08-16 on this
# machine's first real print (a single-object test cube, so harmless there -
# nothing to actually exclude), but this makes future multi-object plates
# work correctly (cancel one failed object mid-print without aborting the
# whole job) instead of silently rejecting the marker commands every time.
[exclude_object]

# ---------------------------------------------------------------------------
# FANS - three of them, ALL THREE under Klipper control as of 2026-08-07:
#   D9/PH6 -> [temperature_fan hotend_fan] in hotend-fan.cfg : HOTEND HEATSINK
#             (declared [fan] / part cooling until 2026-08-17 - that was the
#             bug, not the wiring; see below and that file's header)
#   D11   -> [controller_fan] below            : extruder MOTOR cooling
#   D5/PE3 -> [temperature_fan] in electronics-fan.cfg : electronics bay
#             (was wired to constant 12V, always on, outside Klipper, until
#             2026-08-07 - see that file's header for the full design)
# THERE IS NO PART-COOLING FAN ON THIS MACHINE as of 2026-08-17. A separate one
# is planned (docs/tasks.md); until it exists M106/M107 drive nothing and are
# stubbed to no-ops in hotend-fan.cfg.
# ---------------------------------------------------------------------------

# D9/PH6 - the section that used to live here ("[fan] / part-cooling") MOVED to
# hotend-fan.cfg on 2026-08-17 and changed type, because the fan on this pin
# physically blows at the HOTEND HEATSINK and never really reached the part
# (user's own observation). As [fan] it obeyed the slicer, so every M107 cut
# the heatsink's airflow with the hot end still at 200-240C - the classic
# heat-creep-jam setup. It is now a [temperature_fan] that stops only once the
# nozzle is colder than the Orange Pi's CPU. The pin, the wire and the onboard
# MOSFET are untouched. Design, source-verified mechanism notes, the M106/M107
# stubs and two disclosed fail-safe gaps: printer-configs/hotend-fan.cfg.

# Extruder MOTOR cooling fan. D11 = PB5 sits on the SERVOS header, which is a raw
# 5V logic pin with NO onboard MOSFET - it cannot drive a fan directly, so an
# external switch is required. SWAPPED 2026-08-07: was an IRL640 logic-level
# MOSFET (gate via 460R), now a KSP42(TA) bipolar NPN (base via 180R) - the
# IRL640 was reassigned to the RGB status-light project's red channel
# (rgb-status.cfg), which needed it freed. THIS SECTION'S BEHAVIOUR IS
# UNCHANGED: same pin, same [controller_fan] section, same trigger logic -
# Klipper does not know or care what transistor sits behind PB5.
#   +12V ─────────────────────────── fan(+)
#                     fan(-) ──────── COLLECTOR
#   D11/PB5 ──[ 180R ]── BASE
#   GND (common with RAMPS) ──────── EMITTER
# Base resistor 180R, no pulldown/pullup - identical part, identical math, and
# identical "floating base defaults off" reasoning as the electronics-fan.cfg
# KSP42(TA) circuit added the same night; full datasheet numbers (hFE floor
# 25, VBE(sat) 0.9V, why 470R is NOT safe for this specific low-gain part) are
# written out ONCE there rather than duplicated here - see that file's header.
# fan_speed: 1.0 below means this fan only ever runs at DC/steady full power,
# never PWM-modulated, so the saturation math is a straightforward "hold
# ON continuously" problem, not a switching-speed one.
# Side effect of the swap, worth knowing: the old IRL640 wiring had NO gate
# pulldown (printer-status.md: "пользователь счёл некритичным"), so a floating
# MOSFET gate could pick up enough stray charge to twitch the fan briefly at
# power-up before Klipper configures the pin. A BJT's base does not have that
# problem - a floating base leaks off through the base resistor and defaults
# OFF - so this swap incidentally fixes that minor pre-existing quirk, it does
# not introduce a new one.
#
# DESIGN DECISION (2026-07-29): this fan cools the STEPPER MOTOR, not a heatbreak
# heatsink. The mbot cube never had heatbreak-heatsink cooling and this build
# does not either - an oversized heatsink was fitted instead, on the expectation
# that it dissipates passively. Hence the fan is tied to machine ACTIVITY, not to
# hotend temperature: motors heat up from coil current, not from the hotend.
#
# ✅ RESOLVED 2026-08-17, and the paragraph that used to stand here is kept in
# rewritten form because its conclusion was right and its premise was wrong.
# It said: if heat creep ever appears (filament softening ABOVE the melt zone -
# under-extrusion late in long prints, feeder clicking, stuck filament), the
# passive heatsink is not enough, and the fix is a SEPARATE fan on a SEPARATE
# pin as [heater_fan heatbreak_fan] - never this motor fan, whose trigger logic
# is different. Heat creep DID appear (user, 2026-08-17: "радиатор хотэнда всё
# же перегревается без обдува"). But no new fan and no new pin were needed: the
# fan on D9 was already physically aimed at the heatsink and merely
# MIS-DECLARED as part cooling. It is now [temperature_fan hotend_fan] in
# hotend-fan.cfg - and a [temperature_fan] rather than the [heater_fan]
# sketched here, because the user asked for the fan to stop only once the
# nozzle is colder than the Orange Pi's CPU, which a fixed heater_temp cannot
# express. What still stands unchanged from the old text: THIS motor fan was
# not and must not be repurposed for heatsink duty - the two have different
# trigger logic and, since 2026-08-17, separate sections doing separate jobs.
[controller_fan extruder_motor_fan]
pin: PB5
fan_speed: 1.0              # 100% whenever active - motor cooling wants full flow
idle_timeout: 60            # keep running 60s after activity stops, to clear residual heat
stepper: stepper_x, stepper_y, stepper_z, extruder   # any energized stepper turns it on
heater: extruder                                     # ...as does the hotend heater

# Monitoring display in Mainsail. Drives nothing directly ITSELF, but as of
# 2026-08-07 [temperature_fan electronics_fan] (electronics-fan.cfg) opens
# this SAME sensor_path independently and DOES drive the electronics-bay fan
# from it - two read-only readers of one sysfs file, no conflict (see that
# file's header). This section's own max_temp: 90 fires invoke_shutdown
# BEFORE electronics-fan.cfg's max_temp: 95 ever could, on the same reading.
# 🔴 THIS SECTION IS NO LONGER PURELY DECORATIVE - do not delete it as "just a
# readout". Since 2026-08-17 hotend-fan.cfg's _hotend_fan_supervisor reads THIS
# OBJECT's temperature (printer['temperature_sensor OrangePi_CPU'].temperature,
# not the file) every 5s and uses it as the hotend heatsink fan's switch-off
# threshold. Removing or renaming this section breaks that supervisor - the
# fan would fall back to its static target_temp. Still only two readers of the
# sysfs file itself; this is a third consumer of the VALUE.
[temperature_sensor OrangePi_CPU]
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp
min_temp: 0
max_temp: 90

# Convenience wrappers so bed testing does not require editing [heater_bed].
[gcode_macro TEST_BED_TEMP]
description: Heat bed to TARGET (default 120) and hold for observation, without touching [heater_bed] config. Usage: TEST_BED_TEMP or TEST_BED_TEMP TARGET=100
gcode:
    {% set target = params.TARGET|default(120)|float %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target}
    RESPOND MSG="Bed heating to {target}C - use BED_OFF to stop early"

[gcode_macro BED_OFF]
description: Immediately stop the bed test heater (target=0), independent of idle_timeout
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    RESPOND MSG="Bed target set to 0"

# klipper_tmc_autotune (and printer-configs/autotune_tmc.cfg, the [update_manager]
# entry in moonraker.conf, and the git clone on the device) were REMOVED 2026-08-15,
# by user decision, after confirming the file was dead weight: its one section,
# [autotune_tmc extruder], was an untouched upstream example template (motor:
# ldo-42sth48-2504ah - unrelated, never adapted to this machine) targeting the
# extruder, whose A4988 driver has no UART/SPI at all - nothing for a chopper-
# register tuner to configure. It was never [include]d, so removing it changes
# no live behavior; confirmed via klipper_tmc_autotune's own source that restoring
# that section as-written would have hard-failed Klipper's boot outright
# ("Could not find any TMC driver config section for 'extruder'"), not silently
# no-op'd, had it ever been re-enabled without retargeting.
#
# NOT a rejection of TMC autotune on this machine in general - stepper_x/y/z carry
# real TMC2209s with working UART (confirmed via DUMP_TMC), which IS the driver
# family this extension actually tunes. It was never pointed at them because none
# of those three motors are confidently identified in the extension's motor
# database (X/E: Motech MT-1702HS170AW by marking decode, not a verified datasheet
# match; Z: 17HD2008-200-class, same caveat; Y: marking never read at all - see
# docs/bom.md SS3). Feeding autotune a wrong motor profile tunes chopper parameters
# to fiction, worse than not tuning. Revisit by identifying the real motors first
# (multimeter coil resistance is enough to narrow a database match), THEN adding
# fresh [autotune_tmc stepper_x/y/z] sections - do not resurrect the deleted file,
# start clean once real motor data exists.
#
# klipper_auto_speed (anonoei/klipper_auto_speed) is a DIFFERENT extension, not
# related to the above - it empirically finds max velocity/accel by homing at
# rising speed, not from motor datasheet figures. Its own blocker (needing a
# first clean G28 per axis before repeated-homing speed tests are safe) was
# cleared 2026-08-15 - X, Y, Z all got their first-ever successful supervised
# homing that day via klipper-axis-travel-report's MEASURE_HOME (docs/printer-
# status.md). Still not installed - a real follow-up, not done today.

[stepper_x]
step_pin: PF0
# MOTOR DIRECTION AND ENDSTOP SIDE ARE TWO SEPARATE FACTS. Full cross-axis table:
# printer-status.md, "Концевики и направления — полная раскладка (2026-08-02)".
# 2026-08-01: the "!" was REMOVED here (was "!PF1"). Basis: the user ran
# FORCE_MOVE STEPPER=stepper_x DISTANCE=+100 and the head went the WRONG way, i.e.
# LEFT. The origin is front-left, so +X must move the head RIGHT - and that
# requirement does not depend on which side the switch sits on, so confirming on
# 2026-08-02 that the switch is on the RIGHT does NOT undo this edit. The July
# "confirmed by FORCE_MOVE test" note is superseded, not competing: the rule in
# this repo is that an axis direction is closed only by a successful G28.
# CONFIRMED PHYSICALLY 2026-08-02: FORCE_MOVE STEPPER=stepper_x DISTANCE=10 VELOCITY=5
# moved it RIGHT, i.e. toward the switch - direction and endstop side agree.
# One caveat left, and it is mechanical, not a config doubt: the head mount is OFF, so
# the X belt is not clamped to the carriage yet. Clamping to the other belt branch
# reverses the carriage, so repeat this one move after fitting the mount.
dir_pin: PF1
enable_pin: !PD7            # "!" here is normal: A4988/TMC enable is active-low
microsteps: 16              # this is what Klipper writes into the driver's MRES register
                            # over UART (GCONF.mstep_reg_select=1, read back live), so the
                            # config decides resolution. Keep it matching the physical
                            # MS1/MS2 jumpers anyway - those are the standalone fallback,
                            # and they also set the address. See the [tmc2209] block below.
rotation_distance: 36       # GT2 belt (2.0mm pitch) x 18-tooth pulley = exactly 36.
                            # CONFIRMED 2026-08-02 by a clean short run, after four days
                            # of long runs that all disagreed with each other:
                            #   FORCE_MOVE STEPPER=stepper_x DISTANCE=96 VELOCITY=20
                            #   ACCEL=200   -> the BELT moved exactly 96mm.
                            # 96 commanded at the configured 36 is 96/36 = 2.6667 turns,
                            # so 96/2.6667 = 36.0 mm per turn. Dead on, and it rules 32
                            # out: 32 would predict 85.3mm, and measuring 96 would mean
                            # the motor turned FURTHER than commanded, which cannot happen.
                            # Why this run is trusted where the earlier ones are not: it
                            # fits inside the straight part of the belt (the flag never
                            # reaches a pulley), and the flags were set immediately before
                            # it with no command and no hand movement in between.
                            #
                            # The 2.0mm pitch is independently nailed down: 25 belt teeth
                            # counted over 50mm. (A caliper on ONE GT2 tooth reads ~1mm and
                            # is a trap - the profile is curved, so tooth and valley each
                            # measure ~0.7 and the two 0.3 round-overs fall into neither.
                            # Count teeth over a span instead.) 36/2.0 = 18 teeth.
                            #
                            # DO NOT re-derive this from the pulley's diameter with a
                            # caliper - it cannot tell 16T from 18T. Crown-to-root on a 2GT
                            # pulley is 2*0.76 = 1.52mm, which is MORE than the 1.27mm gap
                            # between neighbouring tooth counts, so a reading that lands in
                            # a valley on one pulley overlaps the crown reading of the next
                            # one down. A 9.8mm reading taken this way looked like 16T and
                            # sent this value to 32 for an hour; 9.8 sits inside 18T's
                            # crown/root band of 9.43..10.95 just as comfortably.
                            #
                            # Sanity check: 200*16/36 = 88.8889 steps/mm, the classic
                            # Replicator/FlashForge X-Y figure, and this machine is an mbot
                            # cube. Supporting only - 100.0 steps/mm (32) is just as
                            # standard a number, so this never discriminated on its own.
                            # Full write-up: printer-status.md, "rotation_distance X = 36".
                            #
                            # THE OLD LONG RUNS (226mm at 6.25 turns, 186mm at 5.5556) are
                            # both scrapped: each demands MORE belt than was commanded, and
                            # nothing can add travel. The user's own account of why:
                            # "мог путать край полоски" - tape flags ~18mm wide, matched
                            # edge-to-centre, which is the same order as the discrepancies.
                            #
                            # PRELIMINARY BY THE USER'S OWN PLAN, not by our caution:
                            # "с кареткой и починенным uart еще перемеряем, сейчас делаем
                            # предварительные замеры чтобы хотя бы примерно все ходило как
                            # надо". Measured with the head off and the drivers still on
                            # blind trimmer current. Half of that is settled now: UART came
                            # up on all three axes 2026-08-03, so current is set by
                            # run_current in the [tmc2209] sections and not by the trimpots
                            # any more. What is left is the carriage - re-measure once the
                            # head is fitted. Roughly-right is the goal for now; precision
                            # comes later. Same note applies to Y and Z.
# ENDSTOP SIDE CONFIRMED BY THE USER 2026-08-02: "x справа max" - the switch is on
# the RIGHT = the X MAX side, and it never changed sides ("тут ничего не менялось,
# работы по концевикам завершены ранее"). The 2026-08-01 value position_endstop: 0
# was a GUESS ("origin front-left, so the switch must be left") written over the
# already-correct 220, and is reverted here. Lesson recorded in printer-status.md:
# a confirmed value is never overwritten on the strength of an inference.
endstop_pin: ^!PE4          # "^" = pullup, "!" = invert. PE4 is the X-MAX header on
                            # RAMPS, which matches a right-side switch. The plug was
                            # moved to it and confirmed by press/release + QUERY_ENDSTOPS
                            # on 2026-07-27; nothing has been re-plugged since.
position_endstop: 245       # = position_max, because the switch is on the MAX side.
                            # NOT an independent number: change it TOGETHER with
                            # position_max, or the whole X coordinate system shifts by
                            # the difference. Klipper infers homing_positive_dir=True
                            # from it (stepper.py: endstop in the top quarter of the
                            # range), so G28 X drives +X, i.e. RIGHT, into the switch.
position_max: 245           # MEASURED 2026-08-15 with MEASURE_HOME AXIS=X (klipper-
                            # extras/axis_travel_report.py) - carriage pushed by hand to
                            # the far (left) mechanical limit, real trigger-to-start
                            # distance read back from raw MCU step counts (see [stepper_
                            # y]/[stepper_z] for the same technique and the two Klipper-
                            # internals bugs it took to get here - X reused the fixed
                            # version directly, no new issues): travel = 247.792mm, at
                            # homing_speed 10 for ~25s, matching real physical motion.
                            # Sanity-checked with a repeat call at the switch
                            # (travel=0.000mm, ~1s). 245 is a round number chosen by the
                            # user (~2.8mm margin) over the project's literal 3mm-margin/
                            # floor result (244) - same spirit, negligible difference.
                            # Replaces the 2026-08-07 tape-measure value (257, ~260mm by
                            # tape) - real figure came in tighter, as it did on Y.
                            # Costlier here than on Y/Z: it also sets position_endstop
                            # above, and it sets the homing sweep - cartesian.py starts
                            # the axis at position_endstop - 1.5*(position_endstop -
                            # position_min) = -128.5 (unchanged by this edit: the anchor
                            # MEASURE_HOME used for this very measurement) and sweeps to
                            # +245.
homing_speed: 10            # TEMPORARILY lowered from 50 until the first successful
                            # G28 X, same reasoning as in [stepper_y]. Restore to 50
                            # once the axis has homed cleanly onto the switch once.

[stepper_y]
step_pin: PF6
# 2026-08-01: the "!" was REMOVED here (was "!PF7"). Do not put it back without
# a successful G28 Y to back it up - see the reasoning below.
# WHAT HAPPENED: the first G28 Y ever run on this machine (2026-08-01) drove the
# carriage AWAY from the front Y-MIN switch, and the user had to hit emergency
# stop (klippy.log: "Transition to shutdown state: Shutdown due to webhooks
# request" in the middle of homing, then "Homing failed due to printer shutdown").
# WHAT IS *NOT* WRONG: the endstop side. The dumped gcode state at that shutdown
# was last_position=[0.0, 330.0, 0.0, 0.0], and 330 = position_endstop +
# 1.5*(position_max - position_min) = 0 + 1.5*220, i.e. exactly the force-position
# Klipper sets before homing an axis toward its MIN. So Klipper was commanding the
# NEGATIVE direction, as intended, and the switch/coordinate half of this block
# (^!PJ1 = Y-MIN, position_endstop 0, origin at the front-left) is correct.
# => The only thing left that can disagree is the MOTOR direction, so the "!" goes.
# WHY THIS LOOKS LIKE A FLIP-FLOP: on 2026-07-27 the "!" was removed and then put
# back on an untested report, and the line was labelled "inversion confirmed
# correct". It never was confirmed. FORCE_MOVE only shows which way the motor
# turns; it cannot show whether that agrees with the side the switch sits on.
# Only a real G28 composes those two facts - and today's was the first one.
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 36       # 2026-08-02, was 40. GT2 (2.0mm) x 18 teeth, same as X.
                            # MEASURED ON THIS AXIS, not carried over: after deploying 36
                            # here, FORCE_MOVE STEPPER=stepper_y DISTANCE=108 VELOCITY=20
                            # ACCEL=200 is exactly 3 turns, and the BELT moved exactly
                            # 108mm. 108/3 = 36.0 per turn. Tape flag on the belt and a
                            # mark on the fixed rail, head off, flags set immediately
                            # before the run with nothing touched in between.
                            # 40 would have predicted 120mm and 32 would have predicted
                            # 96mm; neither is within reach of a 12mm-per-candidate spread
                            # measured with a ruler good to ~1mm.
                            # Y's own first-ever reading agreed all along and nobody
                            # believed it: 100 commanded at the then-current 40 = 2.5 turns
                            # gave ~90mm, and 90/2.5 = 36.0. It was discounted because the
                            # run was VELOCITY=250 ACCEL=0 (a step-losing regime, where 40
                            # with a 10% loss fits equally well) - correctly discounted as
                            # proof, but it never pointed anywhere else.
                            # Belt pitch is independently fixed at 2.0mm: 25 teeth counted
                            # over 50mm of belt. 36/2.0 = 18 teeth.
                            # PRELIMINARY on the same terms as X - measured with the head
                            # off, so re-measure once the carriage is fitted. See the
                            # note in [stepper_x].
endstop_pin: ^!PJ1          # Y-MIN, front side. Polarity fixed 2026-07-27 and
                            # re-confirmed 2026-08-01 (QUERY_ENDSTOPS: open at rest).
                            # Side confirmed by the user 2026-08-02: "y спереди min".
position_endstop: 0         # 0 because the switch is on the MIN side. Homing goes -Y,
                            # and -Y is confirmed to move the carriage FORWARD, to the
                            # switch (2026-08-02: FORCE_MOVE DISTANCE=-10 VELOCITY=5).
position_max: 190           # MEASURED 2026-08-15 with MEASURE_HOME AXIS=Y (klipper-
                            # extras/axis_travel_report.py) - carriage pushed by hand to
                            # the far mechanical limit, real trigger-to-start distance
                            # read back from raw MCU step counts (bypasses the position_
                            # endstop-remapping that makes a plain G28 unusable for this,
                            # see docs/ramps-diagnostics.html "Оси и движение"): travel =
                            # 191.509mm. Only ~1.5mm margin here (not this project's usual
                            # 3mm) - a deliberate, informed exception, not the standard
                            # rule: G1 Y190 F600 was live-verified the same day (clean
                            # arrival, no grinding, no skipped steps), and the user chose
                            # to keep 190 rather than the more conservative 188 on their
                            # own judgment, citing remaining slack beyond the measured
                            # trigger point. Replaces the 2026-08-07 tape-measure value
                            # (197, ~200mm by tape) - the real figure came in tighter than
                            # the tape read. Independent of position_endstop (Y's switch
                            # is on the MIN side, not MAX like X) - no coupled number here.
homing_speed: 10            # TEMPORARILY lowered from 50 for the first G28 Y after
                            # the direction flip above: if the direction is somehow
                            # still wrong, the carriage grinds into the frame, and
                            # 10mm/s leaves time to reach emergency stop. Restore to
                            # 50 once one G28 Y has landed on the switch cleanly.

[stepper_z]
step_pin: PL3
# 2026-08-02: the "!" was REMOVED here (was "!PL1"), on a physical check by the user:
#   FORCE_MOVE STEPPER=stepper_z DISTANCE=-2 VELOCITY=2   -> the bed went DOWN. Wrong.
# On this machine the BED moves and the Z endstop is at the TOP of the screw (Z-MIN),
# so -Z must RAISE the bed toward the nozzle. G28 Z homes toward MIN, i.e. -Z, so with
# the old "!" the very first G28 Z would have driven the bed DOWN, away from the switch,
# into the bottom stop - the bug survived only because G28 Z has never once been run on
# this machine. The July "inverted after FORCE_MOVE showed + moved the bed the wrong
# way" note was the same observation judged against the wrong expectation.
# The inversion CANNOT move the switch off the MIN side: the side is set by
# position_endstop (0.5, nearest position_min) and the plug by endstop_pin - neither is
# touched here. So homing still goes -Z; -Z now goes UP, which is where the switch is.
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8        # T8 leadscrew, 8mm lead. NO LONGER A PLACEHOLDER -
                            # confirmed by measurement 2026-08-02:
                            #   FORCE_MOVE STEPPER=stepper_z DISTANCE=24 VELOCITY=3
                            #   ACCEL=100    (= 3 turns at 8)  -> bed moved ~23mm.
                            # Backlash was taken up first with a DISTANCE=3 run the same
                            # way, and the flag was fresh.
                            # For a screw this is the LEAD directly - mm per turn - with
                            # no belt pitch or tooth count in it. T8 leads come in 2, 4, 8
                            # (and rarely 12). Only 8 survives:
                            #   lead 2  -> 3 turns = 6mm,  measured 23 = impossible
                            #   lead 4  -> 3 turns = 12mm, measured 23 = impossible
                            #   lead 8  -> 3 turns = 24mm, measured 23 = 4% short, fine
                            #   lead 12 -> 3 turns = 36mm, measured 23 = 36% short, absurd
                            #             at 3mm/s (and T8x12 is rare)
                            # "Impossible" is literal: nothing can make an axis travel
                            # further than the motor was told to turn.
                            # NOTE: Z is the ONLY axis where the original guess was right.
                            # X and Y were both wrong (40 -> 36 on each).
                            # STILL OPEN, and it is not this number: the ~1mm shortfall.
                            # Settle it with a long run - unlike X/Y there is no belt loop
                            # here, so length costs nothing:
                            #   FORCE_MOVE STEPPER=stepper_z DISTANCE=80 VELOCITY=3 ACCEL=100
                            # 10 turns, so 80mm is due. ~79 (still ~1mm short) = a one-off
                            # offset, i.e. backlash or flag placement, and nothing to fix.
                            # ~77 (short by 4% again) = a per-turn loss: skipped steps under
                            # the bed's weight, or the coupler slipping on the motor shaft.
                            # Long is FINE here and short was never a virtue in itself: on
                            # X/Y the cap existed because a flag on a belt loop reaches a
                            # pulley. A screw has no loop, so the only cap is the axis's own
                            # travel - use the length, it divides the reading error.
                            # PRELIMINARY on the same terms as X/Y - re-measure once the
                            # carriage is fitted. See the note in [stepper_x].
endstop_pin: ^!PD3          # Z-MIN, at the TOP of the screw. On this machine the BED
                            # moves: Z=0 means bed raised closest to the nozzle.
                            # Side confirmed by the user 2026-08-02: "z вверху min".
# 🔴 THIS LINE IS COMMENTED OUT BY KLIPPER ITSELF, NOT BY HAND - 2026-08-16. During the
# first genuinely successful print the user baby-stepped Z by +0.5 (first layer was being
# crushed) and pressed Save on KlipperScreen. That runs Z_OFFSET_APPLY_ENDSTOP, whose
# arithmetic is new = old - offset (klippy/extras/manual_probe.py) = 0.5 - 0.5 = 0.000,
# and SAVE_CONFIG then (a) commented out this line and (b) wrote the new value into the
# #*# autosave block at the END of this file. THE AUTOSAVE BLOCK IS NOW THE LIVE VALUE.
# This whole file was pulled BACK from the printer into the repo the same evening so the
# repo stays the source of truth - without that pull-back the next deploy.sh (a plain scp
# overwrite) would have silently restored 0.5 AND wiped the extruder PID sitting in the
# same autosave block. Rule for next time: right after any deliberate SAVE_CONFIG, pull
# printer.cfg back from the printer and commit it BEFORE the next deploy.
# NOT YET PROPERLY CALIBRATED: +0.5 is a by-eye correction made mid-print, an order of
# magnitude larger than a normal baby-step (0.02-0.1), which says the switch position
# itself is off rather than the offset being fine-tuned. Proper procedure is in
# docs/calibration-plan.md. Also note 0.000 now sits exactly ON position_min (0), so
# there is ZERO room left to move the bed any CLOSER to the nozzle - if a future
# calibration wants a smaller gap, position_min has to be revisited first (carefully -
# see the comment on it just below, that bound is the only overtravel stop there is).
#position_endstop: 0.5       # RESTORED 2026-08-15 as the deliberate working reference,
                            # after two real Z_ENDSTOP_CALIBRATE paper tests both landed
                            # very close to it (-4.900 on a less careful first attempt,
                            # then -0.020 on a careful one - see git history on this line
                            # for both, and docs/printer-status.md for the full story).
                            # Both results are small relative to this value, and by
                            # user's explicit request this section carries no negative
                            # numbers - 0.5 is not a guess, it is the same reference this
                            # machine ran on for the entire rest of this session before
                            # today's calibration attempts, i.e. an already-exercised,
                            # safe value, not an inflated placeholder invented today.
                            # WHY NOT JUST INFLATE THIS NUMBER TO DODGE FUTURE NEGATIVE
                            # CALIBRATION OUTPUT: considered and rejected same day - Z_
                            # ENDSTOP_CALIBRATE's arithmetic (z_pos = old_config_position_
                            # endstop - accepted_TESTZ, klippy/extras/manual_probe.py)
                            # reads this value ONLY at config load, and G28 Z always
                            # homes to the SAME physical switch regardless of what number
                            # labels it - so inflating this to dodge a negative RESULT
                            # would also inflate what Z=0 means for every OTHER command
                            # (first-layer offset, baby-stepping) between now and the
                            # next calibration, i.e. make the machine believe it has more
                            # real travel toward the nozzle than it physically does. If a
                            # future calibration lands negative again, round THAT RESULT
                            # to a small clean number before saving it here (like -0.020
                            # was rounded to 0 earlier today) - don't pre-inflate this
                            # line to avoid seeing it happen.
                            # 0.5 sits inside position_min(0, see below)..position_max
                            # (190), in the bottom quarter of that range, so
                            # homing_positive_dir=False -> G28 Z drives -Z = UP.
position_min: 0             # REVERTED 2026-08-16 (was briefly -2, see git history commit
                            # 2b87e99) - that change was WRONG and the user caught it live:
                            # nothing mechanically stops overtravel past an already-
                            # triggered microswitch except this exact bound, so widening it
                            # toward the bed is the dangerous direction, not a safe margin.
                            # The real print-attempt error ("Move out of range: ...
                            # -0.100 [-0.800]") was a REJECTED RETRACT-TRAVEL move (E was
                            # NEGATIVE, i.e. a retract, not a squish - real first-layer
                            # squish needs plastic between nozzle and bed already, this was
                            # a dry travel). CONFIRMED root cause (print-start-end.cfg's own
                            # header has the full evidence trail, including the slicer-side
                            # double-count guess this superseded - the gcode file's own
                            # footer says `z_offset = 0`, ruling that out): a stale, live
                            # SET_GCODE_OFFSET Z left over from manual paper-based bed
                            # leveling earlier that session, silently added on top of an
                            # otherwise-valid absolute Z target - SET_GCODE_OFFSET is
                            # RAM-only and does not reset between prints, only on a real
                            # Klipper restart. That -0.1 was correctly rejected by
                            # position_min=0 - the bound did its job. PRINT_START (print-
                            # start-end.cfg) now re-syncs this to 0 right after every G28,
                            # before heating/priming, so no print inherits a leftover
                            # offset from an unrelated earlier session again.
position_max: 190           # MEASURED 2026-08-15 with MEASURE_HOME AXIS=Z (klipper-
                            # extras/axis_travel_report.py) - bed pushed by hand to the
                            # bottom (far from the switch, which is Z-MIN at the TOP of
                            # the screw), real trigger-to-start distance read back from
                            # raw MCU step counts: travel = 195.675mm. This required a
                            # second fix beyond Y's (see docs/ramps-diagnostics.html "Оси
                            # и движение"): a plain G28-style search bound was needed
                            # (position_endstop + 1.5*(position_max - position_endstop)
                            # for this axis, matching cartesian.py's own forcepos
                            # formula) instead of the tighter axis_maximum-derived one
                            # that undershot and failed with "No trigger on stepper_z
                            # after full movement" on the first attempt that same day.
                            # Sanity-checked live: a repeat MEASURE_HOME call with the
                            # bed still sitting at the switch reported travel=0.000mm in
                            # ~1s, confirming the number tracks real physical distance,
                            # not a synthetic echo. 190 is a deliberately round choice by
                            # the user (~5.7mm margin, more than this project's usual
                            # 3mm) - not a live near-edge move like Y's G1 Y190 F600, on
                            # the reasoning that a Z overshoot risks the nozzle/hotend,
                            # not just gantry grinding, so the extra margin substitutes
                            # for the live check rather than adding one on top of it.
                            # Replaces the untouched-since-bring-up placeholder.

[extruder]
step_pin: PA4
dir_pin: !PA6                # TESTED 2026-08-15 with filament loaded (the exact check this
                            # line used to be waiting on): commanded direction ran BACKWARDS
                            # on the bare pin, so "!" is added to invert it. Not a placeholder
                            # any more - live-confirmed by the user with real filament in the
                            # gear, same category of fix as [stepper_z]'s dir_pin flip
                            # (2026-08-02, see that section): trust the physical observation,
                            # not the wiring assumption.
enable_pin: !PA2
microsteps: 16              # NOTE: driver here is A4988, where the 3rd jumper is MS3
                            # and DOES affect microstepping - must match this value
rotation_distance: 23.562   # theoretical: pi * 7.5mm BMG hobbed gear (see gear_ratio).
                            # CALIBRATE by extruding a measured 100mm.
gear_ratio: 50:17           # real BMG reduction (the marketed "3:1" is rounded)
nozzle_diameter: 0.600      # CORRECTED 2026-08-16 from 0.400 - user confirmed the nozzle
                            # physically mounted right now is 0.6mm, not the placeholder
                            # 0.4mm this file had. This is the standard/only place Klipper
                            # represents nozzle size - no separate "nozzle profile" concept
                            # exists. Real consequence, not cosmetic: max_extrude_cross_
                            # section's default (below) is computed FROM this value - see
                            # that setting's own comment, now updated to the corrected math.
filament_diameter: 1.750
max_extrude_only_velocity: 35  # tested clean to 50mm/s under finger load; 35 = margin
heater_pin: PB4             # RAMPS D10
sensor_type: Generic 3950   # CONFIRMED by user: hotend thermistor is 100K NTC 3950
sensor_pin: PK5             # RAMPS T0
#control: pid
#pid_Kp: 22.2                # generic values from generic-ramps.cfg - NOT calibrated.
#pid_Ki: 1.08                # run PID_CALIBRATE once the hotend is reassembled.
#pid_Kd: 114
min_temp: 0
max_temp: 300                # RAISED 2026-08-15 from 250, in response to a real overtemp
                            # shutdown: target was pushed 190->220->250 within ~6 minutes
                            # (no settling time), PID is still uncalibrated (see pid_Kp/Ki/
                            # Kd above - "NOT calibrated"), and the last jump landed the
                            # sensor at 251.946C - past the old 250 ceiling with ZERO
                            # margin, tripping the MCU's hardware ADC-range check
                            # (verified in klippy.log: "Sensor 'extruder' temperature
                            # 251.946 not in range 0.000:250.000"). Klipper's own
                            # `max_temp` is meant as a ceiling with real headroom above the
                            # highest INTENDED target, not equal to it - this project
                            # already gets that right for heater_bed (that section's own
                            # comment: "Must stay 5-10C above the highest target you use").
                            # This one didn't have that lesson applied yet.
                            # 300 is chosen so a genuinely-intended 280C test target (the
                            # user wants to confirm whether extrusion finally works at
                            # higher temp, suspecting the melt zone runs cooler than the
                            # sensor reports) still has 20C of real margin, not the zero
                            # margin that caused the shutdown above.
                            # NOT chosen for "nozzle metal can survive it" reasons - the
                            # hardened Volcano-style nozzle itself is rated far higher
                            # (E3D's own hardened-steel Volcano nozzles: 500C). The actual
                            # unknown limiting factor is the heater CARTRIDGE's wattage,
                            # which is undocumented anywhere in this repo - a standard 40W
                            # cartridge realistically tops out around 300-310C under load
                            # on a Volcano-length melt zone (clevercreations.org heater-
                            # wattage guide). 300 sits right at that estimated edge: if the
                            # real cartridge is weaker than assumed, this machine will
                            # simply fail to REACH 300 (a power-limited plateau, safe and
                            # informative) rather than overshoot past it - the opposite
                            # failure mode of what caused the shutdown above, and a
                            # tolerable one to probe experimentally.
                            # SEQUENCING THAT MATTERS: do not jump straight to a 280
                            # target on the still-uncalibrated PID - run PID_CALIBRATE at
                            # a moderate, realistic target (e.g. 210-215C) FIRST, so the
                            # controller has real gains before it's asked to chase
                            # anything near this new, still-experimental ceiling.
min_extrude_temp: 170       # safety: refuses to extrude below this. Do not lower.
max_extrude_cross_section: 3 # ADDED 2026-08-16 - real print (Voron cube, 220C/55C) aborted:
                            # "Move exceeds maximum extrusion (0.656mm^2 vs 0.640mm^2)".
                            # REVISED same day once nozzle_diameter above was corrected
                            # 0.400 -> 0.600 (the real physically-mounted nozzle - this file
                            # had the wrong value): the 0.640 default that actually rejected
                            # the print was computed from the WRONG diameter (4.0*0.4^2) -
                            # under the CORRECT 0.6mm nozzle the honest default is 4.0*0.6^2
                            # = 1.44, nearly 2.3x higher. So this wasn't really a documented-
                            # false-positive edge case (short E-heavy corner/seam move
                            # spiking the E/XY ratio, still a real, separate phenomenon worth
                            # knowing about - github.com/jschuh/klipper-macros/discussions/212)
                            # so much as the safety net being miscalibrated for the real bead
                            # width a 0.6mm nozzle legitimately extrudes. This check exists to
                            # catch a genuinely wrong config (e.g. a mistyped filament_
                            # diameter) - 3 still gives real margin over the now-correct 1.44
                            # default (~2x) without disabling the check's actual job
                            # (community-common value for this exact error, confirmed by
                            # WebSearch 2026-08-16, not picked arbitrarily).
# Extruder driver is A4988 - no UART. Its current is set ONLY by the module's
# physical Vref trimpot. Formula: Vref = run_current x 8 x Rsense, Rsense = 0.100
# (marking "S1 R100"/"S2 R100"). NOTE: on this machine the currents were never
# actually measured - no meter that reads below ~0.5V - they were dialled in by
# behaviour (no skipped steps at speed/under load, no overheating).

# ADDED 2026-08-16 - answers "какое сопло сейчас в конфиге" at a glance from
# Mainsail's console, after nozzle_diameter above was found wrong (0.4
# configured, 0.6 physically mounted) for who knows how long. NOT a live
# nozzle-swap mechanism - Klipper has none; nozzle_diameter is read once at
# config load and changing the real value always needs an edit + redeploy/
# restart, same as today's fix. This macro only makes the CURRENTLY
# CONFIGURED value fast to check, so that mismatch is easier to catch next
# time, not a way to avoid the edit.
[gcode_macro NOZZLE_STATUS]
description: Report the currently configured nozzle_diameter and the max_extrude_cross_section computed from it - config-time values, not live/auto-detected. Check this against what's physically mounted after any nozzle swap.
gcode:
    RESPOND MSG="{'nozzle_diameter=%.2fmm  max_extrude_cross_section=%.2fmm^2 (edit printer-configs/printer.cfg [extruder] and redeploy to change - no live nozzle-swap command exists in Klipper)' % (printer.configfile.settings.extruder.nozzle_diameter, printer.configfile.settings.extruder.max_extrude_cross_section)}"

# Bed: stock Creality K1 Max, 1000W @ 220V AC, thermistor NTC 100K/B3950.
# Wired to RAMPS D8 -> external zero-cross SSR (the MOSFET cannot switch mains).
[heater_bed]
heater_pin: PH5             # RAMPS D8 - drives the SSR's DC input, not the bed directly
sensor_type: Generic 3950
sensor_pin: PK6             # RAMPS T1
pullup_resistor: 4700       # standard 4.7k pullup on RAMPS thermistor inputs
smooth_time: 2.0            # averaging window - the bed is slow, so smoothing is fine
min_temp: 0
max_temp: 130               # HARD safety ceiling, NOT the working target. Must stay
                            # 5-10C above the highest target you use. The old reason for
                            # the wide margin ("with watermark the regulator itself
                            # overshoots by max_delta") no longer applies now that this
                            # bed is on PID, which backs power off BEFORE the target
                            # instead of coasting past it. Value deliberately UNCHANGED
                            # anyway: an over-wide ceiling costs nothing but margin, and
                            # retuning it in the same change that swapped the regulator
                            # would confuse which change caused what. One at a time.
max_power: 1.0
control: pid                # CHANGED 2026-08-17, was watermark. The comment that used
                            # to sit here justified bang-bang like this: "correct choice
                            # for a zero-cross SSR, which physically cannot switch faster
                            # than the mains zero crossing, so PWM/PID degenerates into
                            # on/off anyway". THAT PREMISE IS FALSE - checked against the
                            # Klipper source installed on this machine, klippy/extras/
                            # heaters.py:
                            #     pwm_cycle_time = config.getfloat(
                            #         'pwm_cycle_time', 0.100, above=0., maxval=pwm_delay)
                            # The default 0.100s PWM period spans 10 zero crossings of
                            # 50Hz mains, so a zero-cross SSR still resolves ~10 real
                            # duty levels. Coarse proportional control - not on/off. (And
                            # the crossing grid is not even the binding limit: heaters.py
                            # suppresses PWM updates smaller than MIN_PWM_CHANGE_RATIO =
                            # 0.05 of max_power, i.e. 5%.) The other half of the old
                            # justification, "matches Klipper's generic-ramps.cfg", was
                            # just as weak - that file ships a default for an unknown DC
                            # bed, not a decision about a 1000W mains bed.
                            # THE REAL REASON TO SWITCH is this machine's own recorded
                            # failure, preserved in the max_delta note below: bang-bang
                            # holds 1000W flat out until target+delta, and the plate's
                            # thermal lag carries it well past - at max_delta 2.0 it
                            # "overshot into max_temp". Damping that overshoot is what
                            # the derivative term is for.
                            # HONESTY CHECK ON THAT ARGUMENT, measured during this very
                            # calibration and NOT to be quietly dropped: the bed peaked
                            # at 81.84C against the 80C setpoint (Moonraker temperature
                            # store, covering the whole run from 25.8C - so it bounds
                            # both the initial full-power ramp 26->80C and every relay
                            # cycle after it). That is ~1.8C of real overshoot, which is
                            # MODEST - the old max_delta note's "overshot into max_temp"
                            # was a 120C incident where max_temp itself sat at 120 and
                            # the regulator merely PLANNED a 122C cutoff, so it never
                            # measured overshoot at all. So overshoot is a smaller win
                            # than it looks; the honest headline benefit is the tighter
                            # steady state (watermark ripples +-max_delta by
                            # construction, i.e. +-1.0C here). This 1.8C figure is also
                            # the first real data point for the thermal-fuse margin
                            # question in printer-status.md, which records peak
                            # overshoot as never measured - but it is a measurement AT
                            # 80C ONLY; do not extrapolate it to a 110-120C target.
                            # (CNC Kitchen measured bang-bang
                            # ~+-1C vs PID ~+-0.1C on a bed and traced visible z-banding
                            # to that thermal cycling. Cited as the reason to prefer PID
                            # generally - NOT as a diagnosis of this printer, which has
                            # printed a handful of cubes and shown no such banding.)
                            # pwm_cycle_time IS DELIBERATELY LEFT ABSENT (default 0.100).
                            # Voron's flicker guide suggests ~0.025 (37-40Hz) on 50Hz
                            # mains, but light flicker is not a symptom anyone has
                            # reported on this machine, and the Klipper forum has a
                            # documented case where 0.02 made a bed plateau at 96C with
                            # random verify_heater trips. Do not tune it speculatively:
                            # leaving it fixed means that if the bed misbehaves from now
                            # on, the PWM frequency is the one thing that did NOT change.
pid_Kp: 50.161              # MEASURED 2026-08-17: PID_CALIBRATE HEATER=heater_bed
pid_Ki: 4.078               # TARGET=80. 80C because that is what every PETG job in
pid_Kd: 154.244             # ~/printer_data/gcodes actually asks for (M190 S80), and
                            # PETG is what this machine prints. A sweep across several
                            # bed temperatures was NOT run and is not wanted here: a
                            # heater holds exactly one gain triple, and this bed only
                            # ever sees 60-80C. (pid-calibrate-sweep.cfg is a different,
                            # extruder-only tool - it hardcodes HEATER=extruder. Task K7
                            # in docs/tasks.md is about that file, not about this line.)
                            # Full precision from klippy.log, if it is ever needed:
                            # Kp=50.160779 Ki=4.078112 Kd=154.244396. The 3-decimal form
                            # is what Klipper itself stages for SAVE_CONFIG, so that is
                            # what is written here.
                            # WRITTEN BY HAND, NO SAVE_CONFIG WAS RUN - on purpose. This
                            # repository is the source of truth for configs, and
                            # pid-calibrate-sweep.cfg's own "APPLYING A RESULT" section
                            # prescribes exactly this route (take the numbers, edit them
                            # into printer.cfg, lint + deploy). SAVE_CONFIG would instead
                            # have Klipper rewrite printer.cfg ON THE DEVICE - configfile
                            # .py's cmd_SAVE_CONFIG calls _strip_duplicates(regular_data,
                            # ...) which comments out every body line the autosave block
                            # overrides - and the only way back into git would be copying
                            # the whole device file over this one. That is exactly the
                            # drift this project has spent effort removing, and it is
                            # unsafe while other agents hold uncommitted work here.
# max_delta IS GONE, and must stay gone while control is pid. It is read only by
# ControlBangBang, and an option that no config object reads is a HARD BOOT FAILURE,
# not dead weight: configfile.py's check_unused() does
#     raise error("Option '%s' is not valid in section '%s'")
# so leaving it would have dropped Klipper into a config error on the next restart.
# Its note is kept verbatim because it is the evidence for this whole change:
#     "watermark hysteresis: heater off at target+1.0, back on at target-1.0.
#      Was 2.0, which overshot into max_temp."
# If PID is ever reverted, max_delta must come back in the same edit as control.

[verify_heater heater_bed]
# Thermal-runaway protection. Do NOT disable "for convenience" - this is the only
# software guard against a stuck-on SSR or a detached thermistor.
max_error: 120
check_gain_time: 60         # the 1000W bed is large and slow; 60s avoids false trips
hysteresis: 5

# [tmc2209 stepper_x/y/z] - WIRED 2026-08-02, LINK WORKING ON ALL THREE AXES
# SINCE 2026-08-03.
#
# THE FAULT WAS ONE SHARED WIRING MISTAKE, not three: every PDN_UART wire was
# soldered onto the wrong pin of its RAMPS driver socket. On these modules a PDN
# solder jumper ON THE DRIVER BOARD selects which of two socket pins PDN_UART comes
# out on, and the factory position of that jumper routes it to the MS3 position of
# the slot - the 5th pin from the bottom, counting DIR as the first. The wires sat
# on the SLEEP position (3rd from the bottom), which RAMPS ties by trace to RESET
# and to nothing else - never to MS3. So all three lines hung on a pin the chip
# does not drive, which is why no axis and no address ever answered.
# FIX: the three wires were re-soldered onto the 5th pin from the bottom. The
# solder jumper on the module itself was NOT touched and must stay as it is.
#
# CONFIRMED BY THE CHIPS THEMSELVES, identically on X, Y and Z: DUMP_TMC reads IOIN
# with version=0x21 (a real TMC2209 answering, not a floating line) and pdn_uart=1,
# plus ms1=1 ms2=1 - which is also where uart_address: 3 below comes from. GCONF
# reads back pdn_disable=1 and mstep_reg_select=1, i.e. Klipper's writes landed.
#
# NEVER FIT THE THIRD MICROSTEP JUMPER UNDER THESE THREE SLOTS. That third position
# IS the MS3 position - the very pin the UART wire is now soldered to. A jumper
# there ties PDN_UART straight to +5V: the link dies and the MCU pin is driven
# against a hard supply. The two jumpers that are fitted stay fitted, see the
# uart_address note below.
#
# 'ready' STILL PROVES NOTHING about the link, so do not use it as one: klippy/
# extras/tmc.py wraps the init in try/except and only logs "TMC %s failed to init",
# then carries on. What proves it, after any work on the wiring:
#     grep "failed to init" ~/printer_data/logs/klippy.log   # must print NOTHING
#     DUMP_TMC STEPPER=stepper_x                             # IOIN version=0x21
# Beware also that a dead link is not a harmless no-op with these sections live:
# the init is retried when a stepper is ENABLED, and there tmc.py does not swallow
# it but calls invoke_shutdown() - so a broken wire shows up as a shutdown on the
# first G28 / FORCE_MOVE, not at startup.
# The full history of the hunt is in printer-status.md, "UART для TMC2209".
#
# Every line in the sections below is deliberate:
#
#   uart_address: 3 - on a TMC2209 the MS1/MS2 pins are BOTH the microstep select
#     AND the UART node address, from one datasheet table: MS2/MS1 = VCC_IO/VCC_IO
#     -> 1/16 microsteps AND address 3. On RAMPS a fitted jumper pulls an MS pin to
#     +5V, and both jumpers are fitted here - read back from the chips, see below.
#     Klipper defaults to 0 (tmc_uart.py: config.getint('uart_address', 0, ...)), so
#     without this line even a perfectly wired driver stays silent.
#     The address does NOT have to be unique across the three sections. It exists
#     to tell apart chips that SHARE one uart_pin (Config_Reference: "typically
#     used when multiple TMC2209 chips are connected to the same UART pin"); here
#     each axis has its own MCU pin, i.e. three independent single-wire links, so
#     the address only has to MATCH THE HARDWARE - and all three chips are 3.
#     NO LONGER CONDITIONAL, and no longer resting on the 2026-07-27 note: IOIN
#     reads ms1=1 ms2=1 on all three chips, which is exactly the VCC_IO/VCC_IO row,
#     i.e. address 3. One jumper missing would have meant address 1 or 2, both
#     missing 0 - the chips say otherwise.
#     The jumpers are deliberately LEFT ON: with them the standalone fallback is
#     still 1/16 and matches microsteps: 16 in [stepper_*]. Pulling them would give
#     address 0 - which would then have to be written here - and would silently drop
#     that fallback to 1/8, so an axis that ever lost the link would travel twice
#     the commanded distance.
#
#   run_current - now PER AXIS (X 0.8, Y 0.7, Z 0.6 amps RMS), no longer one
#     number copied three times. X carries the longer motor (~47mm body), so it
#     both offers and needs more torque; Z only lifts the bed on a screw.
#     Still not metered with an ammeter, but the SCALING PATH is confirmed rather
#     than assumed since 2026-08-03: DUMP_TMC on Y read cs_actual=19, irun=19,
#     ihold=19 at vsense=1 with sense_resistor 0.110, which is 0.61 A RMS - i.e.
#     exactly the 0.6 the config asked for. What this line requests is what the
#     chip delivers. (That cs_actual=19 reading predates the per-axis split above -
#     the printer was still being asked for 0.6 on Y at the time, and all three axes
#     read 19 for the same reason. The split IS DEPLOYED as of 2026-08-03 and was
#     re-read from the chips afterwards: X 0.8 / Y 0.7 / Z 0.6 on the machine,
#     en_spreadCycle=1 and stealth=0 on all three. Repo == machine.)
#     THE TRIMPOTS ARE INERT now that UART works: Klipper's tmc2209.py never sets
#     GCONF.i_scale_analog, so it is written as 0 = internal reference, and the
#     VREF pin stops scaling anything. These lines are the ONLY thing setting
#     motor current on X/Y/Z. Too low brings back skipped steps (the very defect
#     UART is meant to fix), too high cooks unbranded motors. Tune live, no deploy
#     needed:
#         SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.9
#     in 0.1 steps, feeling the motor after a few minutes. That does NOT survive a
#     restart - write the winning value back into this file.
#
#   sense_resistor: 0.110 - matches the modules' marking (confirmed visually) and
#     also happens to be Klipper's default; spelled out so a module with different
#     sense resistors cannot silently rescale the current.
#
#   stealthchop_threshold is ABSENT, and that absence is the setting - see the
#     note repeated in each section below. Absent means GCONF.en_spreadCycle=1,
#     i.e. spreadCycle at EVERY speed, standstill included. That is deliberate
#     while the machine is being brought up.
#     An explicit "0" is NOT the same thing, and it is not a way to switch
#     stealthChop off either: it sets en_spreadCycle=0 and leaves TPWMTHRS at
#     0xFFFFF, which is a threshold velocity of about zero - spreadCycle as soon
#     as the motor moves, stealthChop only while it stands still. Always-
#     stealthChop is written as 999999. The practical difference from "absent" is
#     small, but a mode that flips at every stop is not what a machine under
#     diagnosis needs.
#     A note that stood here on 2026-08-03 claimed the explicit 0 gave stealthChop
#     at EVERY speed and that this machine had been running on it. That was wrong
#     and is withdrawn - full source-level write-up in docs/ramps-diagnostics.html,
#     section "spreadCycle и stealthChop" (#chopper-modes).
#     HOW TO READ THE MODE BACK: the discriminator is en_spreadCycle in GCONF, NOT
#     TPWMTHRS - Klipper writes 0xFFFFF there in both cases. The stealth bit in
#     DRV_STATUS shows the mode AT THE MOMENT OF THE READ, so read it WHILE THE
#     MOTOR IS MOVING; a dump taken at rest (stst=1, tstep=0xFFFFF) cannot tell
#     "stealthChop in motion too" from "stealthChop only at standstill".
#     The SPREAD jumper stays OFF, and that too is now read rather than assumed:
#     IOIN reports the SPREAD bit as 0 (the SPRE solder jumper on the module is
#     not bridged), so its XOR with GCONF.en_spreadCycle is transparent and the
#     chopper mode is decided by this config alone.
#
#   hold_current is deliberately NOT set - Klipper's own Config_Reference says
#     setting it "is not recommended"; the default is no reduction at standstill,
#     which is what standalone was already doing. interpolate is left at its
#     default (True).
#
# With the link up, microstepping comes from the config and not from the jumpers:
# Klipper sets GCONF.mstep_reg_select=1 (read back live), so resolution is taken
# from the MRES register, i.e. from microsteps: in [stepper_*] - CHOPCONF reads
# mres=4 = 16 microsteps, matching the config. The MS1/MS2 jumpers now only pick
# the address and the standalone fallback.
#
# The extruder is an A4988 - no UART, and its current stays on its own trimpot.
# Vref: TMC2209 standalone = current x 2.5 x 0.110 | A4988 = current x 8 x 0.100
[tmc2209 stepper_x]
uart_pin: ^PB0
uart_address: 3
run_current: 0.8            # the longer motor of the three (~47mm body) - more
                            # torque on offer and more of it needed. Y is 0.7, Z 0.6.
sense_resistor: 0.110
# stealthchop_threshold IS ABSENT ON PURPOSE. Do not "restore" it to 0.
# Absent is not "the default 0": Klipper reads the option as None, and only a value
# actually present turns its internal en_pwm_mode on, which on a 2209 (no such GCONF
# bit exists on this chip) is written as GCONF.en_spreadCycle=0. Missing key =>
# en_spreadCycle=1 => spreadCycle at EVERY speed, standstill included. That is what
# this machine wants: predictable torque, no learning phase, and lost steps that are
# audible instead of silently swallowed.
# An explicit 0 would NOT turn stealthChop on everywhere - an earlier version of this
# comment said it did, and that was wrong. A 0 sets en_spreadCycle=0 and leaves
# TPWMTHRS at 0xFFFFF, i.e. a threshold velocity of ~0: spreadCycle in motion,
# stealthChop only at rest. 999999 is the idiom for always-stealthChop, should this
# machine ever want it. Reasoning from the Klipper sources and the TMC2209 datasheet:
# docs/ramps-diagnostics.html, section "spreadCycle и stealthChop" (#chopper-modes).
# READING THE MODE BACK: TPWMTHRS is 0xFFFFF in both cases and discriminates nothing.
# The discriminator is en_spreadCycle in GCONF - with this key absent it must read 1.
# The stealth bit in DUMP_TMC STEPPER=stepper_x is a live indicator, so read it WHILE
# THE AXIS IS MOVING; at rest (stst=1, tstep=0xFFFFF) it cannot tell the two settings
# apart. Do not go looking for "en_pwm_mode" in a DUMP_TMC - the 2209 has no such bit.
# hold_current is likewise NOT set, for the same "the default is the setting" reason:
# Klipper then makes no reduction at standstill. THE REASON IS NOT "the axis would
# sag under load" - an earlier version of this comment said cutting current at rest
# lets X/Y creep off under belt tension and lets the Z bed settle between layers, and
# that is not what the source objects to. Klipper says it flatly: "Setting a
# hold_current is not recommended" (Config_Reference.md) and "If unsure, prefer to not
# specify a hold_current" (TMC_Drivers.md). The hazard is the JOLT AT THE MOMENT THE
# CURRENT CHANGES - the rotor snaps to the nearest stator tooth: "changing motor
# current may itself introduce motor movement ... due to 'detent forces' within the
# stepper motor". Note which way that cuts: a BIGGER hold_current does not cure the
# jolt, its absence does. The upside is near zero anyway - "few printing moves will
# leave a stepper motor idle for sufficiently long to activate the hold_current
# feature". Those two reasons carry the decision on their own - a blanket "not
# recommended" plus no measurable gain - and that is what this line rests on.
# The one exception Klipper names is a DEDICATED Z motor that truly idles through
# the print, i.e. no bed_mesh / bed_tilt / Z skew_correction / vase mode. This
# machine happens to have none of those TODAY, but bed_mesh arrives with the
# CR-Touch (see C1 in printer-status.md), so even that door is closing. Not worth
# opening for a Z that only lifts a bed.

[tmc2209 stepper_y]
uart_pin: ^PL0
uart_address: 3
run_current: 0.7            # RAISED to 0.85 then REVERTED back to 0.7, same session,
                            # 2026-08-08. The 0.85 attempt and what it tested (FORCE_MOVE
                            # sweeps 130-220mm/s at both currents, GSTAT clean, no DRV_STATUS
                            # fault bits at either) is recorded in full on [tmc2209 stepper_z]
                            # below, since Z is where the problem actually surfaced - read it
                            # there before touching this number again.
                            # SHORT VERSION: while this change was live (Y at 0.85, Z at 0.7),
                            # the user reported Z "очень сильно свистит, гудит" (loud
                            # whistle/hum) live, unprompted. Both axes hold this run_current
                            # at FULL strength even at standstill (hold_current is absent on
                            # purpose - see the long note below), and spreadCycle's audible
                            # chopper whine scales with current - so a current bump raising
                            # standstill whine is physically expected, not a new fault. Z was
                            # named, not Y, but the mechanism is identical on both axes (same
                            # chopper config, same missing hold_current) and Y's bump was
                            # proportionally the larger one of the two (+0.15A vs Z's +0.1A),
                            # so Y was reverted too out of the same caution, even though it
                            # was not the axis named. Nothing here confirms Y ever got loud -
                            # it was pulled back before anyone had the chance to notice either
                            # way.
                            # 0.7 is the pre-2026-08-08 value, known quiet at standstill (it
                            # is what the machine had been running since the 2026-08-03 UART
                            # bring-up). The regression this was meant to fix ("clean at
                            # 100mm/s, skips above it") is UNFIXED again after this revert -
                            # see the caveat on [tmc2209 stepper_z] for what is still open.
sense_resistor: 0.110
stealthchop_threshold: 5     # ADDED 2026-08-08, in direct response to the whine incident
                            # recorded on [tmc2209 stepper_z] below - read that first. X still
                            # has NO stealthchop_threshold (absent = always spreadCycle,
                            # unchanged) because X is out of scope this session (bare belt, no
                            # carriage) - that is now a deliberate ASYMMETRY between X and Y/Z,
                            # not an oversight, and X should get the same treatment once it is
                            # back in scope.
                            # WHAT THIS ACTUALLY DOES, read from the real source on this
                            # printer (~/klipper/klippy/extras/tmc.py, TMCStealthchopHelper +
                            # TMCtstepHelper, both inspected directly, not from memory of the
                            # docs): a velocity in mm/s that Klipper converts to a TPWMTHRS
                            # register value via step_dist/mres/tmc_freq. The chip is in
                            # stealthChop below that speed (TSTEP > TPWMTHRS) and spreadCycle
                            # above it (TSTEP <= TPWMTHRS) - unlike "absent" (spreadCycle
                            # always) or an explicit "0" (spreadCycle in motion, stealthChop
                            # only in the vanishingly small window right at TSTEP's max value),
                            # this is a REAL third option: quiet up to 5mm/s, full spreadCycle
                            # torque from 5mm/s up.
                            # WHY 5: standstill is velocity 0, always below any positive
                            # threshold, so this alone silences the constant-hold whine that
                            # is the actual complaint (this axis has no hold_current reduction
                            # either - see the long note above - so it used to hold full
                            # run_current through spreadCycle at rest, non-stop, whether moving
                            # or parked). 5mm/s sits below this axis's own homing_speed (10,
                            # see [stepper_y] above) and far below any real print speed, so
                            # every move this machine actually makes - homing included - still
                            # gets spreadCycle, unchanged from before. Nothing about the torque
                            # picture during real motion changes; only the at-rest behaviour
                            # does.
                            # NOT YET CONFIRMED BY EAR: DUMP_TMC after deploy shows TPWMTHRS at
                            # the expected non-max value and en_spreadcycle=0 at rest (script
                            # queried it cold, no motion since restart) - electrical proof the
                            # switch is wired up as intended. Whether it is actually QUIETER is
                            # something only the user's own ears can close, same limitation as
                            # everywhere else in this file's 2026-08-08 edits: nobody has been
                            # at the machine since the whine was reported.
# hold_current is ABSENT ON PURPOSE, same reasoning as [tmc2209 stepper_x] above (Klipper:
# "setting it is not recommended" - the jolt at the current-change moment is the hazard, not
# a benefit foregone). Verify chopper mode with en_spreadCycle in GCONF (0 = stealthChop, 1 =
# spreadCycle) and TSTEP vs TPWMTHRS, not TPWMTHRS alone - read while the axis moves to catch
# spreadCycle, at rest (no motion since restart/last move) to catch stealthChop.

[tmc2209 stepper_z]
uart_pin: ^PG1
uart_address: 3
run_current: 0.6            # RAISED to 0.7, then REVERTED back to 0.6 the same session,
                            # 2026-08-08 - full story below, read before changing this again.
                            #
                            # WHAT HAPPENED: Y was reported "only clean at 100mm/s, skips
                            # above it, worse than the old manual (trimpot) tuning". Root-
                            # cause theory: 0.6/0.7 (Z/Y) were body-length GUESSES written
                            # the day UART came up (2026-08-03), never re-validated at speed -
                            # and current is exactly what changed that day: before it, the
                            # physical trimpot set real coil current independently of these
                            # numbers (this file's own history: "run_current: 0.6 (amps RMS) -
                            # A DOCUMENTED GUESS, NOT A MEASUREMENT"), and X/Y/Z ran a clean
                            # 200mm/s FORCE_MOVE sweep under THAT current (see [printer]
                            # max_velocity above). Once UART took over, the trimpot went inert
                            # and actual current dropped to whatever number happened to be
                            # sitting in this file - not necessarily what the trimpot had been
                            # delivering. More current raises available torque at speed
