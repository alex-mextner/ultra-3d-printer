[include mainsail.cfg]

# Smoke alarm (MQ-2 on AUX-2 D42/PL7) + buzzer (AUX-2 D44/PL5, through a small
# NPN). NOTHING IS WIRED YET and this include is still safe to keep active: the
# only section in that file that touches a physical input - [gcode_button
# smoke_sensor] - is commented out inside it, and the output pin it does define
# drives a header pin nothing is connected to. It is included rather than left
# out so that the KlipperScreen alarm UI has a real [output_pin siren] object to
# develop against. Design notes, the M112 analysis and the mounting instructions
# are in that file's header and in printer-status.md ("Датчик дыма + сирена").
[include smoke-alarm.cfg]

# force_move: KEPT PERMANENTLY - deliberate choice, do not "clean up".
# Originally added 2026-07-27 for direction-verification testing before homing
# was trusted; that testing is now finished. It stays because this is a custom,
# frequently-modified machine (repairs, upgrades, swapped hotends/endstops), and
# FORCE_MOVE / SET_KINEMATIC_POSITION are exactly what you need to move an axis
# safely when homing is not yet trustworthy after a change.
# Trade-off accepted knowingly: these commands bypass normal position/limit
# checks, so a wrong DISTANCE can drive an axis into the frame. Use small values.
[force_move]
enable_force_move: True

[mcu]
# by-id path, NOT /dev/ttyUSB* - the ttyUSB number changes between reboots and
# when the cable moves to another port. The FT232R is built into the Freaduino
# board itself (behind its miniUSB socket), not a separate external adapter.
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AJV9MLVG-if00-port0
baud: 250000                # Klipper default and recommended value - do not change

[printer]
kinematics: cartesian
# All three limits below were found EMPIRICALLY (FORCE_MOVE at rising VELOCITY
# under hand load), not from datasheets - the motors are unbranded and have none.
max_velocity: 175           # X/Y ran clean at 200mm/s under load; 175 keeps ~12% margin
max_accel: 1500             # NOT calibrated - generic default. Needs a ringing-tower
                            # test print to set properly (method in ramps-diagnostics.html)
max_z_velocity: 18          # Z plateaued at 20mm/s regardless of current -> mechanical/
                            # back-EMF ceiling, not torque. Well above real need (5-15).
# square_corner_velocity: not set -> Klipper default 5mm/s. Also needs a test print.

[idle_timeout]
# After this many seconds with no real gcode activity Klipper silently runs
# TURN_OFF_HEATERS. Status polling via API does NOT count as activity.
# This caused several "the bed switched itself off" scares - it is normal behaviour.
timeout: 600                # Klipper default (10 min). Raise temporarily if testing.

[virtual_sdcard]
path: /home/ultra/printer_data/gcodes
on_error_gcode: CANCEL_PRINT   # abort the print if an error occurs mid-job

# ---------------------------------------------------------------------------
# FANS - three of them, only two are under Klipper control:
#   D9  -> [fan] below                      : part cooling, slicer-driven
#   D11 -> [controller_fan] below           : extruder MOTOR cooling
#   (none) electronics fan                  : wired to constant 12V, always on
# ---------------------------------------------------------------------------

# Part-cooling fan (blows on the printed part). RAMPS D9 = PH6, a real MOSFET
# output, so it drives a fan directly. Controlled by the slicer via M106/M107.
[fan]
pin: PH6

# Extruder MOTOR cooling fan. D11 = PB5 sits on the SERVOS header, which is a raw
# 5V logic pin with NO onboard MOSFET - it cannot drive a fan directly, so an
# external IRL640 logic-level MOSFET was added (gate via 460R to PB5, source to
# GND, drain to fan minus, fan plus to 12V).
#
# DESIGN DECISION (2026-07-29): this fan cools the STEPPER MOTOR, not a heatbreak
# heatsink. The mbot cube never had heatbreak-heatsink cooling and this build
# does not either - an oversized heatsink was fitted instead, on the expectation
# that it dissipates passively. Hence the fan is tied to machine ACTIVITY, not to
# hotend temperature: motors heat up from coil current, not from the hotend.
#
# IF HEAT-CREEP JAMS APPEAR (filament softening ABOVE the melt zone and clogging
# the heatbreak/feeder - shows up as under-extrusion late in long prints, feeder
# clicking, stuck filament), the passive heatsink is not enough. The fix is to add
# a SEPARATE fan on a SEPARATE pin configured as:
#     [heater_fan heatbreak_fan]
#     heater: extruder
#     heater_temp: 50.0
# i.e. on whenever the hotend is hot, regardless of motion. Do NOT repurpose this
# motor fan for that job - the two have different trigger logic.
[controller_fan extruder_motor_fan]
pin: PB5
fan_speed: 1.0              # 100% whenever active - motor cooling wants full flow
idle_timeout: 60            # keep running 60s after activity stops, to clear residual heat
stepper: stepper_x, stepper_y, stepper_z, extruder   # any energized stepper turns it on
heater: extruder                                     # ...as does the hotend heater

# Monitoring only - shows the Orange Pi CPU temperature in Mainsail.
# Drives no fan (the electronics fan is on constant 12V, outside Klipper).
[temperature_sensor OrangePi_CPU]
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp
min_temp: 0
max_temp: 90

# Convenience wrappers so bed testing does not require editing [heater_bed].
[gcode_macro TEST_BED_TEMP]
description: Heat bed to TARGET (default 120) and hold for observation, without touching [heater_bed] config. Usage: TEST_BED_TEMP or TEST_BED_TEMP TARGET=100
gcode:
    {% set target = params.TARGET|default(120)|float %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={target}
    RESPOND MSG="Bed heating to {target}C - use BED_OFF to stop early"

[gcode_macro BED_OFF]
description: Immediately stop the bed test heater (target=0), independent of idle_timeout
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    RESPOND MSG="Bed target set to 0"

# autotune_tmc.cfg stays disabled: it needs a working TMC UART link, which does
# not exist here (see the [tmc2209] block at the bottom of this file).
#[include autotune_tmc.cfg]

[stepper_x]
step_pin: PF0
# MOTOR DIRECTION AND ENDSTOP SIDE ARE TWO SEPARATE FACTS. Full cross-axis table:
# printer-status.md, "Концевики и направления — полная раскладка (2026-08-02)".
# 2026-08-01: the "!" was REMOVED here (was "!PF1"). Basis: the user ran
# FORCE_MOVE STEPPER=stepper_x DISTANCE=+100 and the head went the WRONG way, i.e.
# LEFT. The origin is front-left, so +X must move the head RIGHT - and that
# requirement does not depend on which side the switch sits on, so confirming on
# 2026-08-02 that the switch is on the RIGHT does NOT undo this edit. The July
# "confirmed by FORCE_MOVE test" note is superseded, not competing: the rule in
# this repo is that an axis direction is closed only by a successful G28.
# CONFIRMED PHYSICALLY 2026-08-02: FORCE_MOVE STEPPER=stepper_x DISTANCE=10 VELOCITY=5
# moved it RIGHT, i.e. toward the switch - direction and endstop side agree.
# One caveat left, and it is mechanical, not a config doubt: the head mount is OFF, so
# the X belt is not clamped to the carriage yet. Clamping to the other belt branch
# reverses the carriage, so repeat this one move after fitting the mount.
dir_pin: PF1
enable_pin: !PD7            # "!" here is normal: A4988/TMC enable is active-low
microsteps: 16              # standalone: must match the physical MS1/MS2 jumpers on
                            # the driver. Under UART this value is what gets written to
                            # the MRES register instead - see the [tmc2209] block below.
rotation_distance: 36       # GT2 belt (2.0mm pitch) x 18-tooth pulley = exactly 36.
                            # CONFIRMED 2026-08-02 by a clean short run, after four days
                            # of long runs that all disagreed with each other:
                            #   FORCE_MOVE STEPPER=stepper_x DISTANCE=96 VELOCITY=20
                            #   ACCEL=200   -> the BELT moved exactly 96mm.
                            # 96 commanded at the configured 36 is 96/36 = 2.6667 turns,
                            # so 96/2.6667 = 36.0 mm per turn. Dead on, and it rules 32
                            # out: 32 would predict 85.3mm, and measuring 96 would mean
                            # the motor turned FURTHER than commanded, which cannot happen.
                            # Why this run is trusted where the earlier ones are not: it
                            # fits inside the straight part of the belt (the flag never
                            # reaches a pulley), and the flags were set immediately before
                            # it with no command and no hand movement in between.
                            #
                            # The 2.0mm pitch is independently nailed down: 25 belt teeth
                            # counted over 50mm. (A caliper on ONE GT2 tooth reads ~1mm and
                            # is a trap - the profile is curved, so tooth and valley each
                            # measure ~0.7 and the two 0.3 round-overs fall into neither.
                            # Count teeth over a span instead.) 36/2.0 = 18 teeth.
                            #
                            # DO NOT re-derive this from the pulley's diameter with a
                            # caliper - it cannot tell 16T from 18T. Crown-to-root on a 2GT
                            # pulley is 2*0.76 = 1.52mm, which is MORE than the 1.27mm gap
                            # between neighbouring tooth counts, so a reading that lands in
                            # a valley on one pulley overlaps the crown reading of the next
                            # one down. A 9.8mm reading taken this way looked like 16T and
                            # sent this value to 32 for an hour; 9.8 sits inside 18T's
                            # crown/root band of 9.43..10.95 just as comfortably.
                            #
                            # Sanity check: 200*16/36 = 88.8889 steps/mm, the classic
                            # Replicator/FlashForge X-Y figure, and this machine is an mbot
                            # cube. Supporting only - 100.0 steps/mm (32) is just as
                            # standard a number, so this never discriminated on its own.
                            # Full write-up: printer-status.md, "rotation_distance X = 36".
                            #
                            # THE OLD LONG RUNS (226mm at 6.25 turns, 186mm at 5.5556) are
                            # both scrapped: each demands MORE belt than was commanded, and
                            # nothing can add travel. The user's own account of why:
                            # "мог путать край полоски" - tape flags ~18mm wide, matched
                            # edge-to-centre, which is the same order as the discrepancies.
                            #
                            # PRELIMINARY BY THE USER'S OWN PLAN, not by our caution:
                            # "с кареткой и починенным uart еще перемеряем, сейчас делаем
                            # предварительные замеры чтобы хотя бы примерно все ходило как
                            # надо". Measured with the head off and the drivers on blind
                            # trimmer current. Re-measure after the carriage is mounted and
                            # UART is up. Roughly-right is the goal for now; precision
                            # comes later. Same note applies to Y and Z.
# ENDSTOP SIDE CONFIRMED BY THE USER 2026-08-02: "x справа max" - the switch is on
# the RIGHT = the X MAX side, and it never changed sides ("тут ничего не менялось,
# работы по концевикам завершены ранее"). The 2026-08-01 value position_endstop: 0
# was a GUESS ("origin front-left, so the switch must be left") written over the
# already-correct 220, and is reverted here. Lesson recorded in printer-status.md:
# a confirmed value is never overwritten on the strength of an inference.
endstop_pin: ^!PE4          # "^" = pullup, "!" = invert. PE4 is the X-MAX header on
                            # RAMPS, which matches a right-side switch. The plug was
                            # moved to it and confirmed by press/release + QUERY_ENDSTOPS
                            # on 2026-07-27; nothing has been re-plugged since.
position_endstop: 220       # = position_max, because the switch is on the MAX side.
                            # NOT an independent number: change it TOGETHER with
                            # position_max, or the whole X coordinate system shifts by
                            # the difference. Klipper infers homing_positive_dir=True
                            # from it (stepper.py: endstop in the top quarter of the
                            # range), so G28 X drives +X, i.e. RIGHT, into the switch.
position_max: 220           # PLACEHOLDER - measure with a tape and subtract 2-5mm margin.
                            # Costlier here than on Y/Z: it also sets position_endstop
                            # above, and it sets the homing sweep - cartesian.py starts
                            # the axis at position_endstop - 1.5*(position_endstop -
                            # position_min) = -110 and sweeps 330mm to +220.
homing_speed: 10            # TEMPORARILY lowered from 50 until the first successful
                            # G28 X, same reasoning as in [stepper_y]. Restore to 50
                            # once the axis has homed cleanly onto the switch once.

[stepper_y]
step_pin: PF6
# 2026-08-01: the "!" was REMOVED here (was "!PF7"). Do not put it back without
# a successful G28 Y to back it up - see the reasoning below.
# WHAT HAPPENED: the first G28 Y ever run on this machine (2026-08-01) drove the
# carriage AWAY from the front Y-MIN switch, and the user had to hit emergency
# stop (klippy.log: "Transition to shutdown state: Shutdown due to webhooks
# request" in the middle of homing, then "Homing failed due to printer shutdown").
# WHAT IS *NOT* WRONG: the endstop side. The dumped gcode state at that shutdown
# was last_position=[0.0, 330.0, 0.0, 0.0], and 330 = position_endstop +
# 1.5*(position_max - position_min) = 0 + 1.5*220, i.e. exactly the force-position
# Klipper sets before homing an axis toward its MIN. So Klipper was commanding the
# NEGATIVE direction, as intended, and the switch/coordinate half of this block
# (^!PJ1 = Y-MIN, position_endstop 0, origin at the front-left) is correct.
# => The only thing left that can disagree is the MOTOR direction, so the "!" goes.
# WHY THIS LOOKS LIKE A FLIP-FLOP: on 2026-07-27 the "!" was removed and then put
# back on an untested report, and the line was labelled "inversion confirmed
# correct". It never was confirmed. FORCE_MOVE only shows which way the motor
# turns; it cannot show whether that agrees with the side the switch sits on.
# Only a real G28 composes those two facts - and today's was the first one.
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 36       # 2026-08-02, was 40. GT2 (2.0mm) x 18 teeth, same as X.
                            # MEASURED ON THIS AXIS, not carried over: after deploying 36
                            # here, FORCE_MOVE STEPPER=stepper_y DISTANCE=108 VELOCITY=20
                            # ACCEL=200 is exactly 3 turns, and the BELT moved exactly
                            # 108mm. 108/3 = 36.0 per turn. Tape flag on the belt and a
                            # mark on the fixed rail, head off, flags set immediately
                            # before the run with nothing touched in between.
                            # 40 would have predicted 120mm and 32 would have predicted
                            # 96mm; neither is within reach of a 12mm-per-candidate spread
                            # measured with a ruler good to ~1mm.
                            # Y's own first-ever reading agreed all along and nobody
                            # believed it: 100 commanded at the then-current 40 = 2.5 turns
                            # gave ~90mm, and 90/2.5 = 36.0. It was discounted because the
                            # run was VELOCITY=250 ACCEL=0 (a step-losing regime, where 40
                            # with a 10% loss fits equally well) - correctly discounted as
                            # proof, but it never pointed anywhere else.
                            # Belt pitch is independently fixed at 2.0mm: 25 teeth counted
                            # over 50mm of belt. 36/2.0 = 18 teeth.
                            # PRELIMINARY on the same terms as X - head off, blind trimmer
                            # current, re-measure after the carriage and UART. See the
                            # note in [stepper_x].
endstop_pin: ^!PJ1          # Y-MIN, front side. Polarity fixed 2026-07-27 and
                            # re-confirmed 2026-08-01 (QUERY_ENDSTOPS: open at rest).
                            # Side confirmed by the user 2026-08-02: "y спереди min".
position_endstop: 0         # 0 because the switch is on the MIN side. Homing goes -Y,
                            # and -Y is confirmed to move the carriage FORWARD, to the
                            # switch (2026-08-02: FORCE_MOVE DISTANCE=-10 VELOCITY=5).
position_max: 220           # PLACEHOLDER - measure with a tape
homing_speed: 10            # TEMPORARILY lowered from 50 for the first G28 Y after
                            # the direction flip above: if the direction is somehow
                            # still wrong, the carriage grinds into the frame, and
                            # 10mm/s leaves time to reach emergency stop. Restore to
                            # 50 once one G28 Y has landed on the switch cleanly.

[stepper_z]
step_pin: PL3
# 2026-08-02: the "!" was REMOVED here (was "!PL1"), on a physical check by the user:
#   FORCE_MOVE STEPPER=stepper_z DISTANCE=-2 VELOCITY=2   -> the bed went DOWN. Wrong.
# On this machine the BED moves and the Z endstop is at the TOP of the screw (Z-MIN),
# so -Z must RAISE the bed toward the nozzle. G28 Z homes toward MIN, i.e. -Z, so with
# the old "!" the very first G28 Z would have driven the bed DOWN, away from the switch,
# into the bottom stop - the bug survived only because G28 Z has never once been run on
# this machine. The July "inverted after FORCE_MOVE showed + moved the bed the wrong
# way" note was the same observation judged against the wrong expectation.
# The inversion CANNOT move the switch off the MIN side: the side is set by
# position_endstop (0.5, nearest position_min) and the plug by endstop_pin - neither is
# touched here. So homing still goes -Z; -Z now goes UP, which is where the switch is.
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8        # T8 leadscrew, 8mm lead. NO LONGER A PLACEHOLDER -
                            # confirmed by measurement 2026-08-02:
                            #   FORCE_MOVE STEPPER=stepper_z DISTANCE=24 VELOCITY=3
                            #   ACCEL=100    (= 3 turns at 8)  -> bed moved ~23mm.
                            # Backlash was taken up first with a DISTANCE=3 run the same
                            # way, and the flag was fresh.
                            # For a screw this is the LEAD directly - mm per turn - with
                            # no belt pitch or tooth count in it. T8 leads come in 2, 4, 8
                            # (and rarely 12). Only 8 survives:
                            #   lead 2  -> 3 turns = 6mm,  measured 23 = impossible
                            #   lead 4  -> 3 turns = 12mm, measured 23 = impossible
                            #   lead 8  -> 3 turns = 24mm, measured 23 = 4% short, fine
                            #   lead 12 -> 3 turns = 36mm, measured 23 = 36% short, absurd
                            #             at 3mm/s (and T8x12 is rare)
                            # "Impossible" is literal: nothing can make an axis travel
                            # further than the motor was told to turn.
                            # NOTE: Z is the ONLY axis where the original guess was right.
                            # X and Y were both wrong (40 -> 36 on each).
                            # STILL OPEN, and it is not this number: the ~1mm shortfall.
                            # Settle it with a long run - unlike X/Y there is no belt loop
                            # here, so length costs nothing:
                            #   FORCE_MOVE STEPPER=stepper_z DISTANCE=80 VELOCITY=3 ACCEL=100
                            # 10 turns, so 80mm is due. ~79 (still ~1mm short) = a one-off
                            # offset, i.e. backlash or flag placement, and nothing to fix.
                            # ~77 (short by 4% again) = a per-turn loss: skipped steps under
                            # the bed's weight, or the coupler slipping on the motor shaft.
                            # Long is FINE here and short was never a virtue in itself: on
                            # X/Y the cap existed because a flag on a belt loop reaches a
                            # pulley. A screw has no loop, so the only cap is the axis's own
                            # travel - use the length, it divides the reading error.
                            # PRELIMINARY on the same terms as X/Y - re-measure after the
                            # carriage and UART. See the note in [stepper_x].
endstop_pin: ^!PD3          # Z-MIN, at the TOP of the screw. On this machine the BED
                            # moves: Z=0 means bed raised closest to the nozzle.
                            # Side confirmed by the user 2026-08-02: "z вверху min".
position_endstop: 0.5       # recheck - the Z endstop bracket was rebuilt as adjustable.
                            # 0.5 sits inside position_min(0, the default - the key is
                            # not set below)..position_max(190), so Klipper accepts it,
                            # and it is in the bottom quarter of that range, so
                            # homing_positive_dir=False -> G28 Z drives -Z = UP.
position_max: 190           # PLACEHOLDER - measure with a tape

[extruder]
step_pin: PA4
dir_pin: PA6                # NOT verified for direction yet (extruder is disassembled).
                            # Check with filament loaded before the first print.
enable_pin: !PA2
microsteps: 16              # NOTE: driver here is A4988, where the 3rd jumper is MS3
                            # and DOES affect microstepping - must match this value
rotation_distance: 23.562   # theoretical: pi * 7.5mm BMG hobbed gear (see gear_ratio).
                            # CALIBRATE by extruding a measured 100mm.
gear_ratio: 50:17           # real BMG reduction (the marketed "3:1" is rounded)
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_velocity: 35  # tested clean to 50mm/s under finger load; 35 = margin
heater_pin: PB4             # RAMPS D10
sensor_type: Generic 3950   # CONFIRMED by user: hotend thermistor is 100K NTC 3950
sensor_pin: PK5             # RAMPS T0
control: pid
pid_Kp: 22.2                # generic values from generic-ramps.cfg - NOT calibrated.
pid_Ki: 1.08                # run PID_CALIBRATE once the hotend is reassembled.
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 170       # safety: refuses to extrude below this. Do not lower.
# Extruder driver is A4988 - no UART. Its current is set ONLY by the module's
# physical Vref trimpot. Formula: Vref = run_current x 8 x Rsense, Rsense = 0.100
# (marking "S1 R100"/"S2 R100"). NOTE: on this machine the currents were never
# actually measured - no meter that reads below ~0.5V - they were dialled in by
# behaviour (no skipped steps at speed/under load, no overheating).

# Bed: stock Creality K1 Max, 1000W @ 220V AC, thermistor NTC 100K/B3950.
# Wired to RAMPS D8 -> external zero-cross SSR (the MOSFET cannot switch mains).
[heater_bed]
heater_pin: PH5             # RAMPS D8 - drives the SSR's DC input, not the bed directly
sensor_type: Generic 3950
sensor_pin: PK6             # RAMPS T1
pullup_resistor: 4700       # standard 4.7k pullup on RAMPS thermistor inputs
smooth_time: 2.0            # averaging window - the bed is slow, so smoothing is fine
min_temp: 0
max_temp: 130               # HARD safety ceiling, NOT the working target. Must stay
                            # 5-10C above the highest target you use: with watermark
                            # the regulator itself overshoots by max_delta, and if
                            # max_temp sat at the target the normal cycle would trip it.
max_power: 1.0
control: watermark          # bang-bang (on/off), NOT PID - correct choice for a
                            # zero-cross SSR, which physically cannot switch faster
                            # than the mains zero crossing, so PWM/PID degenerates
                            # into on/off anyway. Matches Klipper's generic-ramps.cfg.
max_delta: 1.0              # watermark hysteresis: heater off at target+1.0, back on
                            # at target-1.0. Was 2.0, which overshot into max_temp.

[verify_heater heater_bed]
# Thermal-runaway protection. Do NOT disable "for convenience" - this is the only
# software guard against a stuck-on SSR or a detached thermistor.
max_error: 120
check_gain_time: 60         # the 1000W bed is large and slow; 60s avoids false trips
hysteresis: 5

# [tmc2209 stepper_x/y/z] - WIRED 2026-08-02, LINK TESTED, LINK DOES NOT WORK.
# The sections are commented out again ON PURPOSE. Read this block before
# uncommenting them: over a dead link they do NOT fail safely.
#
# WHAT WAS DONE 2026-08-02: the user ran the three PDN_UART wires per the table in
# printer-status.md (X -> AUX-3 D53/PB0, Y -> AUX-3 D49/PL0, Z -> AUX-2 D40/PG1)
# and powered the board (12V + 5V). The sections below were enabled and deployed.
#
# RESULT: no communication - no axis, no address. Five Klipper restarts between
# 18:19 and 18:24 walked uart_address through 3, 0, 1, 2, 3, and every single run
# logged, for ALL THREE axes:
#     TMC stepper_x failed to init: Unable to read tmc uart 'stepper_x' register IFCNT
# The address hypothesis is CLOSED - the sweep is complete and nothing answered.
# It also settles NOTHING about the MS1/MS2 jumpers: address 3 failing is not
# evidence that the jumpers are off, because 0/1/2 failed identically.
#
# TWO THINGS THIS FILE USED TO CLAIM AND GOT WRONG - both cost real time:
#   1. "A broken link shows up at startup, Klipper will not reach 'ready'" - FALSE
#      on this Klipper. klippy/extras/tmc.py wraps the init in try/except and only
#      logs it ("TMC %s failed to init: ..."), then carries on. Klipper reached
#      'ready' with all three drivers mute. 'ready' IS NOT EVIDENCE OF A LINK.
#   2. Because of (1), live sections over a dead link are a TRAP rather than a
#      harmless no-op. The init is retried when a stepper is ENABLED, and there
#      the exception is not swallowed - tmc.py calls invoke_shutdown(). So the
#      machine looks healthy and then dies on the first G28 / FORCE_MOVE with
#      "Unable to write tmc uart ...". That is exactly why these sections are
#      commented out while the link is dead: commented out, every driver is back
#      in standalone and the axes simply work.
#
# WHAT ACTUALLY PROVES THE LINK IS UP (use this instead of 'ready'):
#     grep "failed to init" ~/printer_data/logs/klippy.log
#   must print NOTHING for the current run. Only then does DUMP_TMC mean anything:
#     DUMP_TMC STEPPER=stepper_x  -> GCONF has pdn_disable=1 and mstep_reg_select=1,
#     CHOPCONF.mres corresponds to 16 microsteps, DRV_STATUS is clean (no ot/otpw/
#     s2ga/s2gb/ola/olb).
#
# WHERE TO LOOK NEXT - the fault is physical and it is COMMON TO ALL THREE AXES.
# Three independent wiring mistakes are far less likely than one shared wrong
# assumption, and there is exactly one assumption all three share that has never
# been checked with a meter: that on THIS module the socket positions RESET and
# SLEEP are both PDN_UART. Check that first - module out of the socket, step (a)
# of the continuity protocol in printer-status.md, "UART для TMC2209". If those
# two pads do not ring out to each other and to the chip's PDN_UART, then the
# whole "bend one of the two pins outwards" plan rests on a wrong pinout and has
# to be replaced, not retried. A scope only makes sense after the full continuity
# protocol passes.
#
# THE SECTIONS BELOW ARE READY TO USE AS THEY STAND once the wiring is fixed:
# uncomment, deploy, then run the grep above. Every line in them is deliberate:
#
#   uart_address: 3 - on a TMC2209 the MS1/MS2 pins are BOTH the microstep select
#     AND the UART node address, from one datasheet table: MS2/MS1 = VCC_IO/VCC_IO
#     -> 1/16 microsteps AND address 3. On RAMPS a fitted jumper pulls an MS pin to
#     +5V, and per the 2026-07-27 note both jumpers are fitted here. Klipper
#     defaults to 0 (tmc_uart.py: config.getint('uart_address', 0, ...)), so
#     without this line even a perfectly wired driver stays silent.
#     The address does NOT have to be unique across the three sections. It exists
#     to tell apart chips that SHARE one uart_pin (Config_Reference: "typically
#     used when multiple TMC2209 chips are connected to the same UART pin"); here
#     each axis has its own MCU pin, i.e. three independent single-wire links, so
#     the address only has to MATCH THE HARDWARE - and all three chips are 3.
#     CONDITIONAL: 3 is right only if BOTH jumpers really are on all three
#     modules, which comes from a 2026-07-27 note never re-checked by eye. One
#     jumper missing -> address 1 or 2; both missing -> 0. The 2026-08-02 sweep
#     did NOT resolve this, since nothing answered at any address.
#     The jumpers are deliberately LEFT ON: with them the standalone fallback is
#     still 1/16 and matches microsteps: 16 in [stepper_*]. Pulling them would give
#     address 0 but silently drop standalone to 1/8 - and standalone is exactly
#     what the machine is running right now, so the axis would travel twice the
#     commanded distance.
#
#   run_current - now PER AXIS (X 0.8, Y 0.7, Z 0.6 amps RMS), no longer one
#     number copied three times. X carries the longer motor (~47mm body), so it
#     both offers and needs more torque; Z only lifts the bed on a screw.
#     Still not metered with an ammeter, but the SCALING PATH is confirmed rather
#     than assumed since 2026-08-03: DUMP_TMC on Y read cs_actual=19, irun=19,
#     ihold=19 at vsense=1 with sense_resistor 0.110, which is 0.61 A RMS - i.e.
#     exactly the 0.6 the config asked for. What this line requests is what the
#     chip delivers.
#     THE TRIMPOTS ARE INERT now that UART works: Klipper's tmc2209.py never sets
#     GCONF.i_scale_analog, so it is written as 0 = internal reference, and the
#     VREF pin stops scaling anything. These lines are the ONLY thing setting
#     motor current on X/Y/Z. Too low brings back skipped steps (the very defect
#     UART is meant to fix), too high cooks unbranded motors. Tune live, no deploy
#     needed:
#         SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.9
#     in 0.1 steps, feeling the motor after a few minutes. That does NOT survive a
#     restart - write the winning value back into this file.
#
#   sense_resistor: 0.110 - matches the modules' marking (confirmed visually) and
#     also happens to be Klipper's default; spelled out so a module with different
#     sense resistors cannot silently rescale the current.
#
#   stealthchop_threshold is ABSENT, and that absence is the setting - see the
#     note repeated in each section below. This block used to carry the line
#     "stealthchop_threshold: 0 - 0 means stealthChop OFF" as a deliberate design
#     decision. It says the opposite of what it does, and the machine ran on
#     stealthChop for it: the first live DUMP_TMC (2026-08-03, Y) came back with
#     stealth=1 and TPWMTHRS=0xfffff while the config read 0.
#     The SPREAD jumper stays OFF, and that too is now read rather than assumed:
#     IOIN reports the SPREAD bit as 0 (the SPRE solder jumper on the module is
#     not bridged), so its XOR with GCONF.en_spreadCycle is transparent and the
#     chopper mode is decided by this config alone.
#
#   hold_current is deliberately NOT set - Klipper's own Config_Reference says
#     setting it "is not recommended"; the default is no reduction at standstill,
#     which is what standalone was already doing. interpolate is left at its
#     default (True).
#
# Once the link works, microstepping comes from the config and not from the
# jumpers: Klipper sets GCONF.mstep_reg_select=1, so resolution is read from the
# MRES register, i.e. from microsteps: in [stepper_*]. The "must match the physical
# MS1/MS2 jumpers" note up in [stepper_x] applies to standalone only.
#
# The extruder is an A4988 - no UART, and its current stays on its own trimpot.
# Vref: TMC2209 standalone = current x 2.5 x 0.110 | A4988 = current x 8 x 0.100
#
# KEPT ENABLED ON PURPOSE while the link is being debugged (2026-08-02 evening).
# They were briefly commented out again in 62527eb on the correct reasoning that
# 'ready' never proved the link works - but commenting them out also stops
# DUMP_TMC from touching the wire at all, and the user is on the machine right
# now with a scope on the Y line. A failed TMC init is NOT fatal: Klipper logs
# "failed to init" and runs on, drivers stay in standalone on their trimpots, so
# the printer behaves exactly as before. Comment them back out once debugging
# ends without success, so the next session does not inherit noisy startup logs.
[tmc2209 stepper_x]
uart_pin: ^PB0
uart_address: 3
run_current: 0.8            # the longer motor of the three (~47mm body) - more
                            # torque on offer and more of it needed. Y is 0.7, Z 0.6.
sense_resistor: 0.110
# stealthchop_threshold IS ABSENT ON PURPOSE. Do not "restore" it to 0.
# Klipper's semantics are the reverse of how the number reads: ANY value present -
# zero included - sets GCONF.en_pwm_mode=1, and 0 leaves TPWMTHRS at maximum, i.e.
# stealthChop at EVERY speed. Always-spreadCycle exists only when the key is missing
# from the section entirely. That is what this machine wants: predictable torque, no
# learning phase, and lost steps that are audible instead of silently swallowed.
# Checked with the stealth bit in DUMP_TMC STEPPER=stepper_x - it must read 0.
# hold_current is likewise NOT set, for the same "the default is the setting" reason:
# Klipper then makes no reduction at standstill. Cutting current at rest lets X/Y
# creep off position under belt tension and lets the Z bed sag between layers.

[tmc2209 stepper_y]
uart_pin: ^PL0
uart_address: 3
run_current: 0.7
sense_resistor: 0.110
# stealthchop_threshold and hold_current are ABSENT ON PURPOSE here too - an explicit
# 0 would switch stealthChop ON at every speed, not off. Full reasoning in
# [tmc2209 stepper_x] above; verify with the stealth bit in DUMP_TMC.

[tmc2209 stepper_z]
uart_pin: ^PG1
uart_address: 3
run_current: 0.6
sense_resistor: 0.110
# stealthchop_threshold and hold_current are ABSENT ON PURPOSE here too - an explicit
# 0 would switch stealthChop ON at every speed, not off. Full reasoning in
# [tmc2209 stepper_x] above; verify with the stealth bit in DUMP_TMC.
