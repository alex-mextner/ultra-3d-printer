# ===========================================================================
# LOAD_FILAMENT / UNLOAD_FILAMENT - KlipperScreen's stock filament panel
# (~/KlipperScreen/panels/extrude.py on the device) gates its Load/Unload
# buttons on these two macro names existing at all:
#   self.load_filament = any("LOAD_FILAMENT" in macro.upper() for macro in macros)
# and shows "Macro LOAD_FILAMENT not found" / sends nothing if they don't.
# Neither macro has ever existed in this project (grepped 2026-08-15 across
# every printer-configs/*.cfg, zero matches; confirmed live via
# GET /printer/objects/list on the running printer, same result) - the
# buttons have been a harmless no-op since the screen was first built, not a
# bug that ever risked motion. This file makes them real.
#
# Both are called by the screen with SPEED={speed_mm_s * 60} - i.e. SPEED is
# in mm/min (matching gcode F convention), not mm/s. A default is given so
# LOAD_FILAMENT typed bare from the console also works.
#
# ---------------------------------------------------------------------------
# WHY THE REAL SAFETY GATE IS Klipper'S OWN min_extrude_temp, NOT THIS FILE
# ---------------------------------------------------------------------------
# [extruder] min_extrude_temp: 170 (printer.cfg) makes any ordinary G1 E...
# move refuse outright below that temperature - a firmware-level check, not
# a macro-level one. Both macros below end in a plain G1 E move for exactly
# this reason: the temperature guard has to be Klipper's own check on the
# real move, not a re-implementation in gcode that a future edit could
# accidentally weaken or route around. Two known ways to defeat it, neither
# used here on purpose:
#   - M302 / SET_EXTRUDER_MIN_TEMP override tricks (sometimes copy-pasted
#     from cold-pull guides) - would lower the real gate, not add to it.
#   - FORCE_MOVE STEPPER=extruder ... - this project already has
#     [force_move] enable_force_move: True (printer.cfg, kept for the
#     direction-verification FORCE_MOVE tests this session used on X/Y/Z),
#     and FORCE_MOVE has NO temperature check at all - it exists to move a
#     stepper independent of kinematics/limits, and using it here would
#     silently discard the one guard this whole design depends on.
# The {% if %} check below is a UX nicety layered ON TOP of that gate (a
# readable error instead of Klipper's raw refusal) - not a replacement for
# it. Removing the {% if %} would still leave the machine safe; removing the
# G1 E move's reliance on min_extrude_temp would not.
#
# ---------------------------------------------------------------------------
# WHY THE DISTANCES ARE PLACEHOLDERS, AND WHAT THAT MEANS RIGHT NOW
# ---------------------------------------------------------------------------
# This machine is direct-drive (BMG hobbed gear directly on the extruder
# motor, gear_ratio: 50:17 in [extruder]), not bowden - load/unload only
# needs to travel from the hobbed gear to just past the melt zone, a few
# tens of mm, NOT the 400-800mm a bowden tutorial's numbers assume. The
# ACTUAL distance depends on the assembled hotend's melt-zone-to-gear length,
# which is not measurable yet: as of 2026-08-15 the print head mount is
# still being assembled (printer-status.md: head printed, waiting on M3x40
# screws) and [extruder] dir_pin was only just confirmed by a live test with
# filament loaded THIS SAME DAY (see printer.cfg) - meaning this is the
# first day direction is even known, and the hotend's physical dimensions
# still are not. LOAD_DISTANCE/UNLOAD_DISTANCE below are deliberately
# conservative placeholders, not measurements - recalibrate both once the
# head is fully reassembled, per this project's no-invented-constants
# convention (see e.g. [stepper_z] rotation_distance's own "PRELIMINARY,
# re-measure" precedent).
#
# NOT LIVE-TESTED. Deployed 2026-08-15 alongside the dir_pin fix so the
# button stops being a dead end, but neither macro has been called on the
# real machine yet - do that only once the hotend is confirmed fully
# assembled, supervised, per this project's "warn before tests" rule.
# ---------------------------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: LOAD_FILAMENT [SPEED=<mm/min>] - feed filament to the nozzle. Called by KlipperScreen's filament panel with SPEED in mm/min; safe to type bare from the console too. Refuses below min_extrude_temp (170C) via Klipper's own G1 E check - see this file's header.
gcode:
    {% set speed = params.SPEED|default(300)|float %}   # 300mm/min = 5mm/s -
                            # conservative first-use default, well under
                            # [extruder] max_extrude_only_velocity: 35mm/s
                            # (2100mm/min). Raise once a real load has been
                            # watched succeed at this speed.
    {% set LOAD_DISTANCE = 30 %}   # PLACEHOLDER - see file header. Short
                            # direct-drive feed, not a bowden-length purge.
    {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
        {action_raise_error("LOAD_FILAMENT: nozzle is at %.0fC, needs >= %.0fC (min_extrude_temp) - heat it first." % (printer.extruder.temperature, printer.configfile.settings.extruder.min_extrude_temp))}
    {% endif %}
    SAVE_GCODE_STATE NAME=_load_filament
    M83
    G1 E{LOAD_DISTANCE} F{speed}
    RESTORE_GCODE_STATE NAME=_load_filament

[gcode_macro UNLOAD_FILAMENT]
description: UNLOAD_FILAMENT [SPEED=<mm/min>] - retract then pull filament clear of the hobbed gear. Called by KlipperScreen's filament panel with SPEED in mm/min; safe to type bare from the console too. Refuses below min_extrude_temp (170C) via Klipper's own G1 E check - see this file's header.
gcode:
    {% set speed = params.SPEED|default(300)|float %}   # same default and
                            # reasoning as LOAD_FILAMENT above.
    {% set UNLOAD_DISTANCE = 40 %}   # PLACEHOLDER - see file header. A
                            # little longer than LOAD_DISTANCE so the tip
                            # clears the hobbed gear, not just the melt zone.
    {% if printer.extruder.temperature < printer.configfile.settings.extruder.min_extrude_temp %}
        {action_raise_error("UNLOAD_FILAMENT: nozzle is at %.0fC, needs >= %.0fC (min_extrude_temp) - heat it first." % (printer.extruder.temperature, printer.configfile.settings.extruder.min_extrude_temp))}
    {% endif %}
    SAVE_GCODE_STATE NAME=_unload_filament
    M83
    G1 E-{UNLOAD_DISTANCE} F{speed}
    RESTORE_GCODE_STATE NAME=_unload_filament
