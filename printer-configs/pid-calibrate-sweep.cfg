# PID_SWEEP - run Klipper's own PID_CALIBRATE at several representative
# extruder temperatures in one go, record every result, and print a
# comparison report - instead of the human having to pick one target,
# run PID_CALIBRATE by hand, and lose the number the moment a second run
# (or an unrelated SAVE_CONFIG) overwrites it.
#
# WHY THIS EXISTS: Klipper's [extruder] holds exactly ONE pid_Kp/Ki/Kd
# triple - there is no per-temperature-band profile switching built in
# (klippy/extras/heaters.py's PIDControl reads pid_Kp/Ki/Kd once, from
# config, at object construction - nothing in this Klipper version
# exposes a gcode command to change them live afterwards; confirmed by
# grepping heaters.py for any SET_HEATER_PID-style command - none
# exists). So "calibrate at every temperature you might print at" isn't
# a real option; the practical unit of calibration is ONE well-chosen
# run. This sweep exists to make comparing a few CANDIDATE runs cheap,
# not to produce several simultaneously-active profiles.
#
# HOW A RESULT IS CAPTURED, sourced from the real installed Klipper
# (klippy/extras/pid_calibrate.py, read on this printer 2026-08-15):
# PID_CALIBRATE's cmd_PID_CALIBRATE() ends with
#   configfile.set(cfgname, 'pid_Kp', "%.3f" % (Kp,))   (and Ki, Kd)
# which stages the value in configfile's own pending-SAVE_CONFIG buffer,
# NOT anywhere it takes effect immediately and NOT anywhere a second
# calibration run leaves alone - klippy/configfile.py's
# ConfigAutoSave.set() does
#   pending[section][option] = svalue
# i.e. plain last-write-wins per (section, option). A second
# PID_CALIBRATE HEATER=extruder call silently clobbers the first run's
# staged Kp/Ki/Kd before anyone ever runs SAVE_CONFIG - there is no
# multi-value history anywhere inside Klipper itself. That pending
# buffer IS queryable, though, and this sweep leans on exactly that:
#   printer.configfile.save_config_pending_items.extruder.pid_Kp / _Ki / _Kd
# (klippy/configfile.py: PrinterConfig.get_status() -> ConfigAutoSave.
# get_status() -> {'save_config_pending_items': self.status_save_pending}).
# So: read it out immediately after each run, before the next run
# overwrites it, and stash it ourselves in [save_variables] (already
# defined once, in power-loss-recovery.cfg, filename
# ~/printer_data/config/variables.cfg - do NOT add a second
# [save_variables] section, Klipper's config parser only allows one and
# this project's own linter flags duplicate sections for exactly this
# reason). Variable names here (pid_sweep_queue, pid_sweep_results) are
# new and distinct from that file's own (plr_state etc.) - no collision.
#
# A REAL, NON-OBVIOUS KLIPPER TEMPLATING GOTCHA THIS DESIGN WORKS AROUND:
# a [gcode_macro]'s entire `gcode:` Jinja template is rendered to a flat
# gcode string ONCE, in full, BEFORE any line of that string is
# dispatched for execution (klippy/extras/gcode_macro.py,
# TemplateWrapper.run_gcode_from_command(): self.gcode.
# run_script_from_command(self.render(context)) - render() completes
# first, dispatch happens after, on the whole already-rendered text).
# That means a naive single macro with
#   {% for t in temps %}
#     PID_CALIBRATE HEATER=extruder TARGET={t}
#     {% set kp = printer.configfile.save_config_pending_items... %}
#   {% endfor %}
# would read printer.configfile state as it was at the MOMENT THE MACRO
# WAS INVOKED, for every iteration - none of the PID_CALIBRATE calls
# will have actually run yet by the time any {% set %} in the same
# template evaluates, because Jinja rendering doesn't interleave with
# real command execution at all. The fix used below: split the sweep
# into SEPARATE macros that call each other via plain gcode lines (not
# Jinja includes) - each such call is dispatched, and therefore
# re-rendered against CURRENT printer state, only once the gcode queue
# actually reaches it, i.e. after every command before it has finished
# physically executing. This is the standard Klipper community pattern
# for "do a real action, then branch on its result" macros.
#
# SAFETY - read before ever calling PID_SWEEP:
# - Each step is a REAL heating cycle to a REAL temperature. Supervise
#   it exactly like every other live heat/motion action on this
#   machine - do not start it and walk away, per this project's
#   standing "warn before visible tests" rule.
# - This macro deliberately does NOT touch [extruder] max_temp,
#   min_extrude_temp, or verify_heater in any way, and does not attempt
#   to suppress/retry a failed PID_CALIBRATE - if a run errors out
#   (e.g. "pid_calibrate interrupted", or a real max_temp/verify_heater
#   trip), the sweep stops there. Diagnose the real cause before
#   re-running - do not loosen a safety check to "push through" it.
# - Default targets (210 / 240 / 260 C) are realistic PRINTING
#   temperatures - PLA ~190-220, PETG ~230-250, ABS/ASA ~230-260, Nylon
#   ~240-270 (ranges from this session's own 2026-08-15 research into
#   this machine's hotend) - chosen with real margin below [extruder]'s
#   current max_temp: 300 (see that option's own comment for why 300).
#   280C is this session's SEPARATE diagnostic test point (confirming
#   whether the melt zone can even reach that high) - deliberately NOT
#   in this default sweep; pass TEMPS=... explicitly if you ever want
#   to include it, understanding a target that close to max_temp has
#   little overshoot margin left (same lesson as the 2026-08-15
#   overtemp shutdown this project already had at target==max_temp).
#
# USAGE:
#   PID_SWEEP                          - calibrate at 210, 240, 260C in turn
#   PID_SWEEP TEMPS=200,230             - or your own comma-separated list
#   PID_SWEEP_REPORT                    - re-print the last sweep's results
#     without re-running anything (e.g. after a restart wiped console
#     scrollback, since [save_variables] persists across restarts)
#
# APPLYING A RESULT: there is no live "activate this one" command -
# per the "ONE profile, no live SET_HEATER_PID" limitation explained
# above, this is a real, unavoidable Klipper constraint, not something
# this file works around. PID_SWEEP_REPORT prints each candidate's
# numbers in a copy-paste-able form; take the one you want and edit it
# into printer-configs/printer.cfg's [extruder] pid_Kp/pid_Ki/pid_Kd by
# hand, then lint + deploy as normal (this project's own "config source
# of truth lives in the repo" rule - a live-apply macro that wrote
# straight to the device without going through the repo would just
# recreate the kind of drift this project has spent real effort
# removing elsewhere, e.g. today's axis_travel_report migration off an
# ad-hoc on-device copy).

[gcode_macro PID_SWEEP]
description: PID_SWEEP [TEMPS=210,240,260] - run PID_CALIBRATE at each listed extruder target in turn (real heating each time, supervise it), record every result, then print a comparison report. See this file's own header for how results are captured and why no live "apply" command exists.
gcode:
    {% set temps_str = params.TEMPS|default("210,240,260") %}
    SAVE_VARIABLE VARIABLE=pid_sweep_queue VALUE="{ temps_str.split(',')|map('trim')|map('int')|list }"
    RESPOND MSG="PID sweep starting: {temps_str}C - stay near the machine, this is a real heating cycle. Prior results (if any) are kept, not cleared - PID_SWEEP_REPORT shows every temperature ever recorded, across runs."
    _PID_SWEEP_STEP

[gcode_macro _PID_SWEEP_STEP]
description: Internal to PID_SWEEP - do not call directly. Pops the next queued target and calibrates it.
gcode:
    {% set queue = printer.save_variables.variables.pid_sweep_queue|default([]) %}
    {% if queue|length == 0 %}
        PID_SWEEP_REPORT
    {% else %}
        {% set t = queue[0] %}
        SAVE_VARIABLE VARIABLE=pid_sweep_queue VALUE="{ queue[1:] }"
        RESPOND MSG="PID sweep: calibrating extruder at {t}C ..."
        PID_CALIBRATE HEATER=extruder TARGET={t}
        _PID_SWEEP_RECORD TARGET={t}
    {% endif %}

[gcode_macro _PID_SWEEP_RECORD]
description: Internal to PID_SWEEP - do not call directly. Captures the PID_CALIBRATE result that just staged in configfile's pending-SAVE_CONFIG buffer before the next sweep step overwrites it, then continues the queue.
gcode:
    {% set t = params.TARGET|int %}
    {% set pending = printer.configfile.save_config_pending_items.extruder|default({}) %}
    {% if 'pid_Kp' not in pending or 'pid_Ki' not in pending or 'pid_Kd' not in pending %}
        { action_raise_error("PID sweep: no pid_Kp/Ki/Kd staged in configfile after PID_CALIBRATE at %dC - the run may have failed, been interrupted, or something else already consumed the pending values. Stopping the sweep here rather than guessing." % t) }
    {% endif %}
    {% set results = printer.save_variables.variables.pid_sweep_results|default({}) %}
    {% set _ = results.update({t: {'pid_Kp': pending.pid_Kp|float, 'pid_Ki': pending.pid_Ki|float, 'pid_Kd': pending.pid_Kd|float}}) %}
    SAVE_VARIABLE VARIABLE=pid_sweep_results VALUE="{ results }"
    RESPOND MSG="PID sweep: {t}C done - pid_Kp={'%.3f'|format(pending.pid_Kp|float)} pid_Ki={'%.3f'|format(pending.pid_Ki|float)} pid_Kd={'%.3f'|format(pending.pid_Kd|float)}"
    _PID_SWEEP_STEP

[gcode_macro PID_SWEEP_REPORT]
description: Print the most recent PID_SWEEP's results again, without re-running anything. Numbers persist in variables.cfg across restarts.
gcode:
    {% set results = printer.save_variables.variables.pid_sweep_results|default({}) %}
    {% if results|length == 0 %}
        RESPOND MSG="PID sweep: no results recorded yet - run PID_SWEEP first."
    {% else %}
        RESPOND MSG="===== PID sweep results ====="
        {% for t in results|sort %}
            {% set r = results[t] %}
            RESPOND MSG="  {t}C -> pid_Kp={'%.3f'|format(r.pid_Kp)} pid_Ki={'%.3f'|format(r.pid_Ki)} pid_Kd={'%.3f'|format(r.pid_Kd)}"
        {% endfor %}
        RESPOND MSG="To use one: edit its numbers into [extruder] pid_Kp/pid_Ki/pid_Kd in printer-configs/printer.cfg, then lint + deploy. No live-apply command exists (see this file's own header for why)."
    {% endif %}
