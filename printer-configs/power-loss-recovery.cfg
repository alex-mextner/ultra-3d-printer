# ===========================================================================
# POWER-LOSS / INTERRUPTION RECOVERY  ("PLR")
# ===========================================================================
# Written 2026-08-03. Implements the architecture researched on 2026-08-02 and
# written up in docs/printer-status.md, section "Возобновление печати после
# прерывания". Read that section before changing anything here - it carries the
# source citations (Klipper issue 1645, the Discourse thread, the survey of the
# five existing community PLR projects and why none of them is installed here).
#
# 🔴 NEVER RUN ON A REAL PRINT UNTIL IT HAS BEEN REHEARSED. Nothing in this file
# has ever executed on this machine: the hotend is disassembled (basket C1), no
# G28 has ever completed (B2/B3), and position_max is still an unmeasured
# placeholder (B7). Every macro below is written, reviewed against the Klipper
# sources on this very machine, and COMPLETELY UNTESTED. The rehearsal checklist
# is in printer-status.md.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES AND WHAT IT DELIBERATELY DOES NOT DO
# ---------------------------------------------------------------------------
# While a virtual_sdcard print runs, a timer writes one small record to disk:
# where in the file we are, where the head is, how hot everything was. After any
# event that wipes klippy's RAM - power loss, M112, a Klipper shutdown, a host
# reboot - that record is still there, and RESUME_INTERRUPTED_PRINT walks the
# machine back to the saved point and restarts the file from the saved byte
# offset with the stock M23 / M26 S<offset> / M24 commands.
#
# It does NOT resume anything automatically, ever. Recovery is a deliberate
# command typed by a human who has LOOKED AT THE PART first. On this machine
# G28 Z drives the BED UP INTO THE NOZZLE (endstop is Z-MIN at the top of the
# screw), so an automatic "just re-home and carry on" would push a half-printed
# part into the hotend. That single fact is why the Yumi_PLR project - the only
# live one out there - is not installed: it runs SET_KINEMATIC_POSITION X=0 Y=0
# Z=0 from a delayed_gcode 0.2s after EVERY Klipper start.
#
# For a plain PAUSE inside a living Klipper session none of this is involved:
# [pause_resume] plus the Mainsail PAUSE/RESUME macros already handle that, they
# are in mainsail.cfg, and they are strictly better (Klipper itself captures and
# restores the position). Use RESUME. This file is only for the case where the
# session itself is gone.
#
# ---------------------------------------------------------------------------
# DEPENDENCIES - all already satisfied by the rest of the config
# ---------------------------------------------------------------------------
#   [virtual_sdcard]  printer.cfg (path) + mainsail.cfg. Prints must be started
#                     from the file manager, not streamed over USB.
#   [respond]         mainsail.cfg line 61 - RESPOND is used heavily below.
#   [pause_resume]    mainsail.cfg line 54 - CLEAR_PAUSE is used below.
#   [force_move]      printer.cfg - SET_KINEMATIC_POSITION is only registered
#                     when enable_force_move is True. It is, permanently.
#   [save_variables]  defined HERE (nothing else in this repo used it).
# No section in this file duplicates one that already exists elsewhere; a second
# [virtual_sdcard] / [pause_resume] / [respond] would silently merge with the
# first one (Klipper parses with configparser strict=False) and that merge is
# exactly the kind of surprise this repo keeps getting bitten by.
#
# ---------------------------------------------------------------------------
# 🔶 ATOMICITY - THE ONE HONEST WEAKNESS, STATED PLAINLY
# ---------------------------------------------------------------------------
# klippy/extras/save_variables.py (read on this machine, not from memory) does:
#       f = open(self.filename, "w"); varfile.write(f); f.close()
# Truncate, rewrite, close. No temp file, no rename, no fsync. So:
#
#   1. NOT DURABLE. The bytes may sit in the host page cache for tens of
#      seconds. Losing power can cost the last checkpoint or two. Accepted -
#      the older checkpoint is still a valid checkpoint.
#   2. NOT ATOMIC. Power loss during the rewrite can leave the file truncated
#      or zero-filled. If it ends up unparseable, SaveVariables.__init__ raises
#      a config error and KLIPPER WILL NOT START until the file is removed:
#          ssh ultra@192.168.11.160 'rm ~/printer_data/config/variables.cfg'
#      Klipper recreates it empty on the next start. Nothing else in this repo
#      stores anything in it, so deleting it costs only the checkpoint.
#
# WHAT IS DONE ABOUT IT: one single SAVE_VARIABLE per checkpoint. The whole
# record is one Python dict, so a checkpoint can be lost but can never be TORN -
# there is no way to end up with the new file offset next to the old Z height.
# That mixed record is the genuinely dangerous failure, because it looks valid
# and would send the nozzle to the wrong place; losing the record merely means
# no recovery. Eight separate SAVE_VARIABLE calls (one per field) would have
# been eight separate full-file rewrites and eight chances to tear.
#
# TWO ALTERNATING SLOTS WITH A VALIDITY FLAG - CONSIDERED AND REJECTED, do not
# "improve" this later by adding them. Both slots would live in the same file,
# and that file is rewritten in full on every save, so a torn write destroys
# both. Slots only protect against torn RECORDS, which the single-dict write
# already makes impossible. They would double the write count for nothing.
#
# ---------------------------------------------------------------------------
# CHECKPOINT FREQUENCY - why a 30s timer and not the layer-change hook
# ---------------------------------------------------------------------------
# The 2026-08-02 plan said "hook _PLR_SAVE into SET_PRINT_STATS_INFO, the
# slicer already calls it on every layer change". That was reconsidered when it
# came to writing it, and the timer won on three counts:
#
#   * SET_PRINT_STATS_INFO is already overridden in mainsail.cfg, a VENDOR file
#     whose own header says "This file is read-only". Hooking it means either
#     editing that file (lost on the next Mainsail update) or declaring a second
#     [gcode_macro SET_PRINT_STATS_INFO] section here and relying on Klipper's
#     configparser(strict=False) merging the two - which silently keeps
#     mainsail's variable_pause_next_layer / pause_at_layer while replacing its
#     body. Far too clever to leave for the next session to trip over.
#   * A layer hook saves NOTHING during a long layer. A big first layer or a
#     wide part can run for minutes; the timer bounds the loss at ~30s no matter
#     what the geometry does.
#   * A layer hook needs the slicer to emit SET_PRINT_STATS_INFO. The timer
#     works on any file from any slicer, including ones already sliced.
#
# COST OF 30s, counted rather than felt: 2 writes/min, ~1200 over a 10h print,
# each one a rewrite of a file of a few hundred bytes = one 4KiB block plus
# journal. Roughly 5MiB of writes per 10h print - noise next to SD endurance
# with wear levelling. Writes are skipped entirely when the file offset has not
# moved (heating waits, pauses), so an idle print costs nothing at all.
#
# 🔴 BUT WEAR IS NOT THE REAL COST, AND THIS IS THE REASON NOT TO TURN THE
# INTERVAL DOWN. SAVE_VARIABLE is synchronous file I/O - write, close, then a
# full re-open and re-parse (save_variables.py ends with loadVariables()) - and
# it runs while this macro holds the gcode mutex. virtual_sdcard's work_handler
# checks that mutex before every single line it dispatches:
#       if gcode_mutex.test():
#           self.reactor.pause(self.reactor.monotonic() + 0.050)
# So each checkpoint stalls the g-code PARSER by the I/O time plus at least one
# 50ms backoff granule, on a host with 512MB and four A7 cores already carrying
# Klipper, Moonraker, KlipperScreen and crowsnest. The lookahead buffer normally
# swallows that. On a stretch of many tiny fast moves it may not, and a drained
# buffer shows up in the plastic as a blob or a seam.
# CONCRETE THING TO LOOK FOR ON THE FIRST REAL PRINT: a repeating artefact
# spaced one checkpoint interval apart. If it appears, raise the interval - do
# not lower it. PLR_SET_INTERVAL makes lowering easy and that is a trap.
#
# If layer granularity is ever wanted ON TOP of this, there is a supported way
# that touches no vendor file: put PLR_CHECKPOINT in the slicer's "after layer
# change" custom gcode. It is safe to call from inside the file - see the note
# in _PLR_SAVE about where file_position points in that case.
#
# ---------------------------------------------------------------------------
# 🔶 THE OVERLAP / GAP QUESTION - what "without skips" really means
# ---------------------------------------------------------------------------
# printer.virtual_sdcard.file_position is the PARSE FRONT: the offset after the
# last line klippy has read, which is ahead of what the steppers have physically
# executed by the depth of the lookahead queue (well under a second of motion).
#
#   * Normal case: the checkpoint is up to 30s old, i.e. far BEHIND the physical
#     head, so resuming re-runs a stretch that is already on the bed. That is
#     over-extrusion on one patch - ugly, survivable, and the right way round.
#   * Bad case: power dies within the lookahead window right after a checkpoint.
#     Then the saved offset is slightly AHEAD of what was printed and a thin gap
#     is possible. Nothing in this design removes that; a byte-level "rewind"
#     cannot fix it either, because M26 to an offset that is not a line boundary
#     hands Klipper half a command.
#
# So the promise is not "no skips". It is "a print that is currently lost gets a
# chance". Say it that way to the user.
# ===========================================================================


# --- persistent storage -----------------------------------------------------
# Lives in the config dir on purpose: that is where every Klipper install puts
# it, Moonraker backs the directory up, and scripts/deploy.sh does NOT touch it
# (it copies an explicit file list and variables.cfg is not in it), so a deploy
# can never wipe a checkpoint.
#
# ⚠️ ONE UNVERIFIED CONSEQUENCE OF THAT CHOICE, recorded rather than glossed
# over: Moonraker watches its roots with inotify (file_manager.py imports
# inotify_simple and defaults file_system_observer to "inotify"), and the config
# directory is one of those roots. So every checkpoint fires a filesystem event
# and a notify_filelist_changed broadcast - 2 per minute during a print, on a
# host with a documented history of dying under memory pressure. Almost
# certainly harmless, and it is the setup every Klipper install already runs,
# but nobody has watched it during a real print here. If it ever proves noisy
# the fix is this one line: point it at ~/printer_data/variables.cfg instead,
# outside the watched root. That trades away the config backup.
[save_variables]
filename: ~/printer_data/config/variables.cfg


# --- tunables ---------------------------------------------------------------
# Everything adjustable lives here so that tuning during the first rehearsals
# does not need a deploy: SET_GCODE_VARIABLE MACRO=_PLR_SETTINGS VARIABLE=<name>
# VALUE=<v> changes it live. Live changes do NOT survive a restart - the winning
# value has to be written back into this file and deployed.
[gcode_macro _PLR_SETTINGS]
description: Tunables for power-loss recovery. Call it to print the current values.
variable_interval: 30.0        # seconds between checkpoints while printing
variable_clearance: 5.0        # mm of Z gained before ANY XY motion on resume.
                               # This is the single most important safety number
                               # here: it is the gap between the nozzle and the
                               # top of the part while X and Y home across it.
                               # It cannot be too generous - only too small.
variable_prime_length: 20.0    # mm of filament purged before returning to the
                               # part. The melt zone has been sitting hot (or
                               # has cooled and oozed) - the first millimetres
                               # out of the nozzle are degraded and under
                               # pressure-starved. 0 disables the purge.
variable_prime_speed: 5.0      # mm/s of extrusion during the purge
variable_prime_x: -1.0         # purge spot. -1 = derive from the axis limits:
variable_prime_y: -1.0         # (axis_maximum.x - 10, axis_minimum.y + 10),
                               # i.e. the front-right corner on this machine.
                               # 🔴 THOSE LIMITS ARE STILL PLACEHOLDERS (B7).
                               # Measure the bed, then either fix position_max
                               # in printer.cfg or pin the purge spot here.
variable_travel_speed: 60.0    # mm/s for XY travel during recovery
variable_z_speed: 5.0          # mm/s for Z moves during recovery. Deliberately
                               # slow: these are the moves that can hit the part
variable_retract: 1.0          # mm retracted after the purge, un-retracted at
                               # the resume point. Mirrors what the Mainsail
                               # RESUME macro does, same reason: stop the string
                               # from the purge spot being dragged over the part
gcode:
    RESPOND TYPE=echo MSG="PLR settings: interval={interval}s clearance={clearance}mm prime={prime_length}mm retract={retract}mm"


# --- the checkpoint writer --------------------------------------------------
# Called by the timer below, and safe to call by hand or from a slicer layer
# hook. Writes nothing unless a virtual_sdcard print is actually running and the
# file offset has moved since the last write.
#
# WHERE file_position POINTS, in both call paths (this matters and is easy to
# get wrong): virtual_sdcard.work_handler sets self.file_position only AFTER the
# line it dispatched has returned. Called from the timer, the value is therefore
# the offset of the first not-yet-executed line - resume there and nothing is
# skipped and nothing is repeated. Called from inside the file (a slicer layer
# hook), the value is the offset of the calling line itself, so a resume re-runs
# that one PLR_CHECKPOINT call. Harmless either way.
[gcode_macro _PLR_SAVE]
description: Internal. Write one recovery checkpoint to disk if a print is running.
variable_last_pos: -1
variable_complained: 0
gcode:
    {% set ps  = printer.print_stats %}
    {% set vsd = printer.virtual_sdcard %}
    {% set gm  = printer.gcode_move %}
    {% if ps.state == 'printing' and vsd.is_active %}
        {% set fname = ps.filename %}
        # The record is handed to SAVE_VARIABLE as one quoted VALUE. Klipper
        # parses extended-command arguments with shlex.split, and strips
        # anything after ; # or * even earlier, so a filename containing any of
        # " ' ; # * cannot survive the round trip. Refuse loudly instead of
        # writing a record that will not parse back.
        {% if '"' in fname or "'" in fname or ';' in fname or '#' in fname or '*' in fname %}
            {% if not complained %}
                SET_GCODE_VARIABLE MACRO=_PLR_SAVE VARIABLE=complained VALUE=1
                RESPOND TYPE=error MSG="PLR DISABLED for this print: the file name contains a quote, semicolon, hash or asterisk. Rename the file to get crash recovery."
            {% endif %}
        {% elif vsd.file_position != last_pos %}
            {% set ext_name = printer.toolhead.extruder %}
            {% set st = {
                'v'  : 1,
                'f'  : fname,
                'p'  : vsd.file_position,
                'x'  : gm.gcode_position.x|round(3),
                'y'  : gm.gcode_position.y|round(3),
                'z'  : gm.gcode_position.z|round(3),
                'e'  : gm.gcode_position.e|round(5),
                'zo' : gm.homing_origin.z|round(3),
                'ab' : gm.absolute_coordinates,
                'ae' : gm.absolute_extrude,
                'sf' : gm.speed_factor|round(4),
                'ef' : gm.extrude_factor|round(4),
                'fr' : gm.speed|round(1),
                'et' : (printer[ext_name].target if ext_name else 0)|round(1),
                'bt' : (printer.heater_bed.target if 'heater_bed' in printer else 0)|round(1),
                'fan': (printer.fan.speed if 'fan' in printer else 0)|round(3),
                'l'  : ps.info.current_layer,
                'd'  : ps.print_duration|round(0)
            } %}
            SAVE_VARIABLE VARIABLE=plr_state VALUE="{st}"
            SET_GCODE_VARIABLE MACRO=_PLR_SAVE VARIABLE=last_pos VALUE={vsd.file_position}
        {% endif %}
    {% endif %}


# --- the timer --------------------------------------------------------------
# 🔴 THIS MACRO MUST NEVER TOUCH THE TOOLHEAD. Reading printer.* status is free,
# but any command that goes down the gcode path to the motion queue - M106,
# SET_PIN, SET_FAN_SPEED, G4, a move - calls register_lookahead_callback, which
# on an idle machine fires toolhead:sync_print_time, which flips idle_timeout to
# "Printing". Consequences, both already worked out in printer-status.md
# ("Ключевая находка: опрашивающий макрос с SET_FAN_SPEED ломает idle_timeout"):
# the 10-minute TURN_OFF_HEATERS safety net on a 1000W bed would never fire
# again, and scripts/deploy.sh would randomly refuse to deploy because its hard
# check "idle_timeout.state == Printing" would keep tripping. SAVE_VARIABLE,
# SET_GCODE_VARIABLE and RESPOND are all pure host-side work and are safe.
[delayed_gcode _plr_tick]
initial_duration: 10.0
gcode:
    _PLR_TICK
    UPDATE_DELAYED_GCODE ID=_plr_tick DURATION={printer['gcode_macro _PLR_SETTINGS'].interval}

[gcode_macro _PLR_TICK]
description: Internal. One pass of the checkpoint timer.
gcode:
    {% set ps = printer.print_stats %}
    {% if ps.state == 'printing' %}
        _PLR_SAVE
    {% else %}
        # Reset the write-skipping state so the next print starts clean.
        {% if printer['gcode_macro _PLR_SAVE'].last_pos != -1
              or printer['gcode_macro _PLR_SAVE'].complained %}
            SET_GCODE_VARIABLE MACRO=_PLR_SAVE VARIABLE=last_pos VALUE=-1
            SET_GCODE_VARIABLE MACRO=_PLR_SAVE VARIABLE=complained VALUE=0
        {% endif %}
        # Drop the checkpoint only on a print that actually FINISHED, and only
        # if it is the checkpoint of that same file.
        # 'cancelled' deliberately does NOT clear it: virtual_sdcard's
        # on_error_gcode in printer.cfg is CANCEL_PRINT, so a print aborted by a
        # gcode error lands in exactly that state - and that is one of the cases
        # worth resuming. A stale checkpoint is harmless (resume needs an
        # explicit CONFIRM=YES) and is overwritten by the next print anyway.
        {% set saved = printer.save_variables.variables.plr_state|default({}) %}
        {% if ps.state == 'complete' and saved and saved.get('f') == ps.filename %}
            SAVE_VARIABLE VARIABLE=plr_state VALUE="{dict()}"
            RESPOND TYPE=echo MSG="PLR: print finished, checkpoint cleared."
        {% endif %}
    {% endif %}


# --- one-shot notice after every Klipper start ------------------------------
# Moves nothing, decides nothing. It exists so that a checkpoint left behind by
# a crash is noticed by the human instead of quietly rotting on disk.
[delayed_gcode _plr_startup_notice]
initial_duration: 3.0
gcode:
    {% set s = printer.save_variables.variables.plr_state|default({}) %}
    {% if s %}
        RESPOND TYPE=echo MSG="PLR: an interrupted print is on record - {s.get('f')}. Run SHOW_INTERRUPTED_PRINT before doing anything else."
    {% endif %}


# --- read-only report -------------------------------------------------------
[gcode_macro SHOW_INTERRUPTED_PRINT]
description: Show the saved recovery checkpoint. Moves nothing, changes nothing.
gcode:
    {% set s = printer.save_variables.variables.plr_state|default({}) %}
    {% if not s %}
        RESPOND TYPE=echo MSG="PLR: no checkpoint stored."
    {% elif s.get('v', 0) != 1 %}
        RESPOND TYPE=error MSG="PLR: checkpoint format version {s.get('v')} is not understood by this config. Run CLEAR_INTERRUPTED_PRINT."
    {% else %}
        RESPOND TYPE=echo MSG="--- interrupted print on record ---"
        RESPOND TYPE=echo MSG="file      {s.get('f')}"
        RESPOND TYPE=echo MSG="offset    {s.get('p')} bytes, layer {s.get('l')}, after {(s.get('d', 0) / 60)|round(1)} min of printing"
        RESPOND TYPE=echo MSG="position  X{s.get('x')} Y{s.get('y')} Z{s.get('z')} E{s.get('e')}"
        RESPOND TYPE=echo MSG="temps     nozzle {s.get('et')}C, bed {s.get('bt')}C, part fan {(s.get('fan', 0) * 100)|round(0)} percent"
        RESPOND TYPE=echo MSG="modes     coords {'absolute' if s.get('ab') else 'relative'}, extrusion {'absolute' if s.get('ae') else 'relative'}, feed {s.get('fr')} mm/min, M220 {(s.get('sf', 1) * 100)|round(0)}, M221 {(s.get('ef', 1) * 100)|round(0)}, Z offset {s.get('zo')}"
        {% if '/' in (s.get('f') or '') %}
            RESPOND TYPE=error MSG="This file is in a subfolder. M23 cannot open those - copy it to the top level of the gcodes folder before resuming."
        {% endif %}
        RESPOND TYPE=echo MSG="Look at the part first. Then RESUME_INTERRUPTED_PRINT CONFIRM=YES"
    {% endif %}


[gcode_macro CLEAR_INTERRUPTED_PRINT]
description: Forget the saved recovery checkpoint. Moves nothing.
gcode:
    SAVE_VARIABLE VARIABLE=plr_state VALUE="{dict()}"
    SET_GCODE_VARIABLE MACRO=_PLR_SAVE VARIABLE=last_pos VALUE=-1
    SET_GCODE_VARIABLE MACRO=_PLR_SAVE VARIABLE=complained VALUE=0
    RESPOND TYPE=echo MSG="PLR: checkpoint cleared."


[gcode_macro PLR_CHECKPOINT]
description: Write a recovery checkpoint right now. Safe from a slicer layer-change hook.
gcode:
    _PLR_SAVE


[gcode_macro PLR_SET_INTERVAL]
description: Change the checkpoint interval live. Usage: PLR_SET_INTERVAL SECONDS=15
gcode:
    {% set sec = params.SECONDS|default(30)|float %}
    {% if sec < 5 %}
        { action_raise_error("PLR: interval below 5s is refused - it buys nothing and loads the host.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PLR_SETTINGS VARIABLE=interval VALUE={sec}
    UPDATE_DELAYED_GCODE ID=_plr_tick DURATION={sec}
    RESPOND TYPE=echo MSG="PLR: checkpoint interval set to {sec}s (not saved across restarts)."


# ===========================================================================
# THE RESUME
# ===========================================================================
# ORDER OF OPERATIONS, and why each step is where it is. This is the part that
# can destroy a part or a hotend, so the reasoning is written down rather than
# left to be re-derived:
#
#   1. HEAT FIRST, MOVE NEVER BEFORE.  The nozzle may be sitting welded into the
#      part. Bed first (M190) because 1000W of bed is still the slow one and
#      because a warm bed buys back some adhesion, then the nozzle (M109).
#      Dragging a cold nozzle out of solid plastic shears the part off the bed
#      or the hotend off the carriage.
#   2. CLAIM Z, THEN GAIN CLEARANCE - BEFORE ANY HOMING.
#      SET_KINEMATIC_POSITION Z=<saved> SET_HOMED=z tells Klipper where it
#      already is instead of asking it to find out. The alternative, G28 Z, is
#      forbidden here: on this machine the Z endstop is Z-MIN at the TOP of the
#      screw and the BED moves, so G28 Z drives the bed UP INTO the part.
#      SET_HOMED=z is written explicitly because force_move.py defaults that
#      parameter to 'xyz' - taking the default would declare X and Y homed at
#      wherever they happen to be, and the next XY move would go anywhere.
#      Then one pure-Z move opens the clearance gap. A move that touches only Z
#      is legal with X/Y still unhomed: cartesian.py's _check_endstops only
#      checks axes whose delta is non-zero.
#   3. HOME Y, THEN X, at clearance height. Safe now, because the nozzle sits
#      above the highest plastic on the bed - the current layer IS the top of
#      the part. Y first, then X, matching the order printer-status.md gives for
#      the first homing of this machine.
#   4. PURGE at a corner, never over the part.
#   5. RESTORE the coordinate system: gcode offset, feed rate, M220/M221, fan.
#   6. RETURN IN TWO MOVES: XY at clearance height first, only then down to the
#      saved Z. A single diagonal move drives the nozzle into the side wall.
#   7. RESTART THE FILE: CLEAR_PAUSE, M23, M26 S<offset>, M24. In that order -
#      M23 resets file_position to 0, so an M26 issued before it is thrown away.
#      SDCARD_PRINT_FILE cannot be used instead: its body is _reset_file() ->
#      _load_file() -> do_resume() with nowhere to inject the seek.
#
# EVERYTHING IN A JINJA MACRO IS READ BEFORE ANYTHING RUNS. Klipper renders the
# whole template to a string first, then executes it. So every printer.* value
# below is the value from BEFORE step 1, and no test in this macro can react to
# what an earlier line of the same macro did. The guards are written knowing
# that; do not add a check that depends on, say, homed_axes after step 3.
# ===========================================================================
[gcode_macro RESUME_INTERRUPTED_PRINT]
description: Resume the print recorded by the last checkpoint. Requires CONFIRM=YES. THIS MOVES THE MACHINE.
gcode:
    {% set s   = printer.save_variables.variables.plr_state|default({}) %}
    {% set cfg = printer['gcode_macro _PLR_SETTINGS'] %}
    {% set th  = printer.toolhead %}
    ##### hard guards - all of these abort before a single command executes ####
    {% if not s %}
        { action_raise_error("PLR: nothing to resume - no checkpoint stored.") }
    {% endif %}
    {% if s.get('v', 0) != 1 %}
        { action_raise_error("PLR: checkpoint format is not version 1. Refusing.") }
    {% endif %}
    {% if printer.print_stats.state in ['printing', 'paused'] or printer.virtual_sdcard.is_active %}
        { action_raise_error("PLR: a print is already loaded or running. Cancel it first, then resume.") }
    {% endif %}
    {% set fname = s.get('f') or '' %}
    {% if not fname %}
        { action_raise_error("PLR: the checkpoint has no file name. Refusing.") }
    {% endif %}
    {% if '/' in fname %}
        { action_raise_error("PLR: M23 cannot open files in subfolders. Copy the file to the top level of the gcodes folder, then retry.") }
    {% endif %}
    {% if params.FILE is defined and params.FILE != fname %}
        { action_raise_error("PLR: FILE does not match the stored checkpoint. Refusing.") }
    {% endif %}
    ##### numbers ####
    {% set zo    = s.get('zo', 0.0)|float %}
    {% set zsave = s.get('z', 0.0)|float %}
    {% set clr   = params.CLEARANCE|default(cfg.clearance)|float %}
    {% set curz  = params.CURRENT_Z|default(zsave)|float %}
    # The clearance is measured from the TOP OF THE PART, and the top of the
    # part sits at the saved Z in bed coordinates - which is why zlift is built
    # from zsave and not from curz. That holds even when CURRENT_Z says the bed
    # has settled: once the true position is declared, "zsave + clearance" is
    # still exactly <clearance> above the plastic.
    # The ceiling is a machine coordinate, so the gcode offset has to come out
    # of it; the extra 0.1 keeps a float rounding error off the limit.
    {% set ztop  = th.axis_maximum.z - zo - 0.1 %}
    {% set zlift = [zsave + clr, ztop]|min %}
    {% set bt    = params.BED_TEMP|default(s.get('bt', 0))|float %}
    {% set et    = params.EXTRUDER_TEMP|default(s.get('et', 0))|float %}
    {% set prime = params.PRIME|default(cfg.prime_length)|float %}
    {% set px    = cfg.prime_x|float if cfg.prime_x|float >= 0 else (th.axis_maximum.x - 10.0) %}
    {% set py    = cfg.prime_y|float if cfg.prime_y|float >= 0 else (th.axis_minimum.y + 10.0) %}
    {% set tsp   = (cfg.travel_speed|float * 60)|round(0) %}
    {% set zsp   = (cfg.z_speed|float * 60)|round(0) %}
    {% set psp   = (cfg.prime_speed|float * 60)|round(0) %}
    {% set ret   = cfg.retract|float %}
    {% if et <= 0 %}
        { action_raise_error("PLR: the stored nozzle target is zero. Pass EXTRUDER_TEMP=<C> if you know what it should be.") }
    {% endif %}
    ##### unconfirmed: describe, move nothing ####
    {% if params.CONFIRM|default('no')|string|upper != 'YES' %}
        RESPOND TYPE=echo MSG="PLR would do this, and nothing has moved yet:"
        RESPOND TYPE=echo MSG=" 1. heat bed to {bt}C, then nozzle to {et}C"
        RESPOND TYPE=echo MSG=" 2. declare Z = {curz} without homing it, then move to Z{zlift} to clear the part"
        {% if zlift < zsave + clr %}
            RESPOND TYPE=error MSG="Z travel runs out: only {(zlift - zsave)|round(2)}mm of clearance instead of {clr}, because the part is near the top of the Z range. Homing X and Y will pass that close to it."
        {% endif %}
        RESPOND TYPE=echo MSG=" 3. G28 Y then G28 X at that height"
        RESPOND TYPE=echo MSG=" 4. purge {prime}mm at X{px|round(1)} Y{py|round(1)}"
        RESPOND TYPE=echo MSG=" 5. travel to X{s.get('x')} Y{s.get('y')}, then down to Z{zsave}"
        RESPOND TYPE=echo MSG=" 6. restart {fname} at byte {s.get('p')}"
        RESPOND TYPE=error MSG="LOOK AT THE PART FIRST. Detached, warped or shifted means DO NOT resume - CLEAR_INTERRUPTED_PRINT instead."
        RESPOND TYPE=echo MSG="Then: RESUME_INTERRUPTED_PRINT CONFIRM=YES"
    {% else %}
    ##### confirmed - from here on the machine moves ####
        RESPOND TYPE=echo MSG="PLR: resuming {fname} at byte {s.get('p')}. Keep a hand on emergency stop."
        {% if zlift < zsave + clr %}
            RESPOND TYPE=error MSG="PLR: only {(zlift - zsave)|round(2)}mm of clearance available, not {clr}. Z travel runs out. Watch the homing moves."
        {% endif %}
        CLEAR_PAUSE
        M107
        # --- 1. heat, no motion at all ---
        {% if bt > 0 %}
            M140 S{bt}
        {% endif %}
        M104 S{et}
        {% if bt > 0 %}
            RESPOND TYPE=echo MSG="PLR: waiting for the bed. 1000W on 220V - do not walk away."
            M190 S{bt}
        {% endif %}
        RESPOND TYPE=echo MSG="PLR: waiting for the nozzle."
        M109 S{et}
        # --- 2. claim Z, then open the gap. Nothing has moved before this. ---
        {% if 'z' not in th.homed_axes %}
            SET_KINEMATIC_POSITION Z={curz + zo} SET_HOMED=z
        {% endif %}
        SET_GCODE_OFFSET Z={zo}
        G90
        G1 Z{zlift} F{zsp}
        # --- 3. home the plane the nozzle is now above ---
        RESPOND TYPE=echo MSG="PLR: homing Y then X at Z{zlift}."
        G28 Y
        G28 X
        # --- 4. purge away from the part ---
        {% if prime > 0 %}
            G90
            G1 X{px} Y{py} F{tsp}
            M83
            G1 E{prime} F{psp}
            G1 E-{ret} F{psp}
        {% endif %}
        # --- 5. restore the coordinate system the file expects ---
        M220 S{(s.get('sf', 1.0) * 100)|round(1)}
        M221 S{(s.get('ef', 1.0) * 100)|round(1)}
        M106 S{(s.get('fan', 0.0) * 255)|round(0)|int}
        # --- 6. back to the point: XY high, then down. Never diagonally. ---
        G90
        G1 X{s.get('x')} Y{s.get('y')} F{tsp}
        G1 Z{zsave} F{zsp}
        {% if prime > 0 %}
            M83
            G1 E{ret} F{psp}
        {% endif %}
        # --- 7. hand the file back to Klipper ---
        {% if s.get('ae') %}
            M82
        {% else %}
            M83
        {% endif %}
        G92 E{s.get('e', 0.0)}
        G1 F{s.get('fr', 1500)}
        {% if not s.get('ab', True) %}
            G91
        {% endif %}
        M23 {fname}
        M26 S{s.get('p')}
        M24
        RESPOND TYPE=echo MSG="PLR: file restarted. Watch the first layer of the join - it is the weak point."
    {% endif %}


# ===========================================================================
# WHAT THIS CANNOT RESTORE - read before believing a recovered print
# ===========================================================================
# Mechanical, and no software can see any of it:
#   * A part that came off the bed, warped, or was knocked. Recovery will
#     happily print the rest of the object into thin air.
#   * A layer shift that happened before or during the failure.
#   * Steps lost while unpowered. Belt tension can pull X or Y; the bed on this
#     machine hangs on a T8 leadscrew with an 8mm lead, which is a multi-start
#     screw and NOT reliably self-locking, so it can settle downwards. The saved
#     Z would then be a lie. It errs safe (the nozzle ends up too high, printing
#     in air, rather than too low and crashing) but the print is still ruined.
#     CURRENT_Z=<value> exists for the case where the drop has been measured.
#   * The joint itself. Fresh hot plastic laid onto a cooled surface bonds worse
#     than its neighbours, always. On ABS/PETG after a full cooldown, or on any
#     part with real shrinkage, do not expect a usable part.
#   * A nozzle that cooked its filament into a plug during the outage.
#
# Software state that lives in the FILE HEADER and is skipped by design, because
# M26 restarts in the middle of the file and the header never runs again:
#   * M204 / SET_VELOCITY_LIMIT accel and jerk set by the slicer.
#   * SET_PRESSURE_ADVANCE (this machine has no pressure advance configured yet
#     - when it gets one, add it to the checkpoint).
#   * G20/G21 units. Klipper defaults to mm and every real slicer emits mm, so
#     this is a theoretical hole, listed for completeness.
#   * [firmware_retraction] and [exclude_object] state - neither section exists
#     in this config yet.
#   * BED_MESH_PROFILE. No bed_mesh here yet either; when the CR-Touch arrives
#     (basket C1) add BED_MESH_PROFILE LOAD=<name> to step 5 above AND add the
#     profile name to the checkpoint - a mesh that is not reloaded silently
#     changes the first restored layer.
#   * Anything else the slicer's start gcode did.
#
# And the case that is out of scope on purpose: SMOKE. The alarm ends in M112 by
# the user's decision (smoke-alarm.cfg). Do not resume a print the smoke sensor
# stopped - the checkpoint is on disk and CLEAR_INTERRUPTED_PRINT is the right
# command to run afterwards.
#
# ---------------------------------------------------------------------------
# WHICH INTERRUPTIONS NEED WHICH TOOL - the honest table
# ---------------------------------------------------------------------------
#   manual PAUSE / M600 / pause-at-layer      -> RESUME (mainsail.cfg). Klipper
#                                                itself captured the position.
#                                                Do NOT use this file for that.
#   idle_timeout firing during a long pause   -> RESUME. Known gap, not fixed
#                                                here: mainsail's RESUME reheats
#                                                the NOZZLE only, the bed stays
#                                                at zero. See printer-status.md
#                                                1.1(3) in the research section.
#   Moonraker restart, Mainsail reload        -> nothing. klippy keeps printing.
#   Klipper error/shutdown, lost MCU, M112,   -> this file. klippy's RAM is gone
#   host reboot, power loss                      after the mandatory
#                                                FIRMWARE_RESTART, and only what
#                                                reached the disk survives.
#
# Note what that means for a shutdown where the HOST stayed alive: a fresher
# truth existed in klippy's memory right up to the shutdown, and this design
# does not try to grab it. Doing so would need a daemon watching Moonraker and
# racing the restart. The 30s checkpoint is the deliberate, simple answer.
