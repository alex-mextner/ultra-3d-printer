# PID_CALIBRATE progress reporter - klipper-extras/pid_calibrate_progress.py
#
# Klipper's own PID_CALIBRATE reports nothing while running (confirmed by
# reading klippy/extras/pid_calibrate.py on this printer, 2026-08-15 - no
# send_event() anywhere in it, Heater.get_status() only ever exposes
# {temperature, target, power}, nothing identifying which control
# algorithm is active). This module passively counts real oscillation
# peaks by watching the heater's own public `target` field flip between
# two values exactly 5.0C apart (Klipper's own TUNE_PID_DELTA constant) -
# every flip is exactly one real peak in Klipper's internal bookkeeping,
# so the count is exact, not approximate. Full reasoning, the two
# considered designs, and the honest limits of this one: the module's own
# header comment - read it before trusting this file's numbers.
#
# NOT YET DEPLOYED as of 2026-08-15 - built and lint-checked only, held
# back deliberately (see docs/printer-status.md for why: a real live
# extruder-heat test was in progress on this machine at build time, and an
# earlier deploy mistake today already overwrote a real calibration result
# once - this module's own [include] line is deliberately NOT added to
# printer.cfg yet either, to avoid a second concurrent editor touching
# that file while a pending fix is still uncommitted there).
[pid_calibrate_progress]
heaters: extruder,heater_bed   # comma-separated heater names to watch -
                                # only these are polled, nothing else on
                                # the machine is touched or assumed to
                                # exist.
announce: True                 # also push M117-equivalent status text via
                                # [display_status] on every detected peak
                                # and on completion - confirmed safe to
                                # call from a timer (does not touch
                                # idle_timeout/lookahead, unlike SET_PIN/
                                # SET_FAN_SPEED/M106 - see this project's
                                # CLAUDE.md for that trap and
                                # klippy/extras/display_status.py for why
                                # M117/SET_DISPLAY_TEXT don't share it).
                                # Set False to stay purely queryable
                                # (GET /printer/objects/query?
                                # pid_calibrate_progress) with no display
                                # side effect.
