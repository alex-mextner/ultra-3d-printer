#### crowsnest.conf
#### This is the default config after installation.
#### It is also used as the default config in MainsailOS.
#### For details on how to configure this to your needs, see:
#### https://github.com/mainsail-crew/crowsnest/blob/v5/README.md


#####################################################################
####                                                            #####
####      Information about ports and according URL's           #####
####                                                            #####
#####################################################################
####                                                            #####
####    Port 8080 equals /webcam/?action=[stream/snapshot]      #####
####    Port 8081 equals /webcam2/?action=[stream/snapshot]     #####
####    Port 8082 equals /webcam3/?action=[stream/snapshot]     #####
####    Port 8083 equals /webcam4/?action=[stream/snapshot]     #####
####                                                            #####
####    Note: These ports are default for most Mainsail         #####
####    installations. Using any other port would involve       #####
####    changing the proxy configuration or using URLs          #####
####    with the specific port like                             #####
####    http://<ip>:<port>/?action=[stream/snapshot]            #####
####                                                            #####
#####################################################################


[crowsnest]
log_level: verbose                      # Valid Options are quiet/verbose/debug
rollover_on_start: false                # Creates a backup and clears the log on every restart, if set to true
no_proxy: false                         # If set to true, no reverse proxy is required. Only change this, if you know what you are doing.

[cam 1]
mode: ustreamer                         # https://docs.mainsail.xyz/crowsnest/faq/backends
port: 8080                              # HTTP/MJPG stream/snapshot port
device: /dev/v4l/by-id/usb-BC-231220-A_XWF-1080P-video-index0                     # See log for available devices
resolution: 640x480                     # <width>x<height> format
max_fps: 15                             # If hardware supports it, it will be forced, otherwise ignored/coerced.
# --slowdown ADDED 2026-08-19, по жалобе пользователя: «сделай чтобы камера
# реально выключалась когда ее никто не смотрит. А то она греется и цпу оранжа
# нагружает».
#
# Что делает ключ (проверено по --help самого ustreamer 6.61 на этой машине,
# /usr/bin/ustreamer): «Slowdown capturing to 1 FPS or less when no stream or
# sink clients». То есть камера не выключается совсем — она продолжает держать
# устройство открытым, — но захват падает с 15 кадров в секунду до одного.
# Именно захват греет матрицу и жжёт такты, так что это ~93% экономии.
#
# ⚠️ ЧЕСТНО ПРО ПРОЦЕССОР: замер при неподключённом зрителе показал, что
# ustreamer в верхних строках нагрузки ВООБЩЕ НЕ ПОЯВЛЯЕТСЯ (греют Python
# Klipper/Moonraker и Xorg экрана, CPU 44 °C). То есть жалоба на «нагружает
# процессор» этим замером не подтверждается, а на «греется камера» — вполне
# объяснима, потому что матрица снимает 15 fps впустую. Ключ ставится ради
# камеры, а не ради CPU, и от него не надо ждать падения температуры платы.
#
# Почему НЕ --exit-on-no-clients (он тоже есть): выход процесса требует, чтобы
# кто-то поднял его обратно, а первый кадр после подъёма ждать секунды. При
# --slowdown поток остаётся живым и разгоняется мгновенно.
custom_flags: --slowdown
#v4l2ctl:                               # Add v4l2-ctl parameters to set up your camera, see log for your camera capabilities.
