# Z-offset guard - klipper-extras/z_offset_guard.py
#
# ЗАЧЕМ ЭТО ЕСТЬ. Дважды (2026-08-16 и 2026-08-17) машина переставала
# запускаться после совершенно правильного действия пользователя: бэбистеп Z
# во время печати + Save на экране. Save вызывает Z_OFFSET_APPLY_ENDSTOP,
# арифметика там `new = old - offset` (klippy/extras/manual_probe.py), результат
# уходит в блок #*# SAVE_CONFIG БЕЗ ЕДИНОЙ ПРОВЕРКИ ДИАПАЗОНА, а на следующей
# загрузке klippy/stepper.py его проверяет и отказывается стартовать:
#   "position_endstop in section 'stepper_z' must be between position_min and
#    position_max"
# В стоковом Klipper эту дыру не закрывает ничто: manual_probe.py пишет число,
# stepper.py его отвергает, и между ними нет никакой связи.
#
# ЧТО ДЕЛАЕТ МОДУЛЬ. Перехватывает Z_OFFSET_APPLY_ENDSTOP и, как бэкстоп, сам
# SAVE_CONFIG (единственная точка, через которую обязан пройти любой писатель
# position_endstop — в том числе Z_ENDSTOP_CALIBRATE, у которого своей защиты
# нет вообще). Дальше:
#   * новый концевик УХОДИТ НИЖЕ position_min -> в ТОМ ЖЕ сохранении пишет
#     position_min = новому position_endstop. Пара всегда валидна, старт не
#     ломается, и перебега по-прежнему НЕТ: после хоуминга ось стоит ровно на
#     границе, хода ниже концевика нет вообще (та же нулевая перебежка, что
#     была при min=0=endstop, а не расширение хода — см. комментарий у
#     position_min в printer.cfg, там это разобрано подробно);
#   * новый концевик УХОДИТ ВВЕРХ, а min и endstop были равны -> поднимает
#     position_min следом. Без этого между ними открылась бы щель, а щель ниже
#     концевика на этой машине — это ход стола В СОПЛО;
#   * новый концевик ВЫШЕ position_max -> ОТКАЗ, без автоправки. Починить это
#     можно было бы только подняв position_max, а это расширение хода оси в
#     непромеренную зону — не ремонт, а другая, худшая ошибка;
#   * ниже предела самоправки (max_auto_lower) -> ОТКАЗ с объяснением, что
#     столько накопленной поправки означает физически смещённый концевик.
# При любом отказе НИЧЕГО не записывается и машина остаётся запускаемой.
#
# Полное обоснование, разбор исходников Klipper (manual_probe.py, stepper.py,
# configfile.py, gcode.py — прочитаны на этом принтере) и честные границы
# применимости — в шапке самого модуля, klipper-extras/z_offset_guard.py.
# Читать её перед тем, как трогать числа ниже.
[z_offset_guard]
max_auto_lower: 5.0    # НА СКОЛЬКО МИЛЛИМЕТРОВ НИЖЕ НУЛЯ модуль готов увести
                        # position_min вслед за концевиком. Это предел
                        # ЗДРАВОМЫСЛИЯ, а не безопасности — безопасность даёт
                        # равенство min == endstop, при котором хода ниже
                        # концевика нет при ЛЮБОМ значении. Почему 5.0:
                        #  * оба реальных инцидента на этой машине сдвигали
                        #    концевик на 0.5 и 1.0 мм — нормальная работа
                        #    даже близко не подходит к пределу;
                        #  * физически смещённый концевик "промахивается" на
                        #    единицы миллиметров; дальше надо двигать сам
                        #    концевик, а не растягивать конфиг — ровно это и
                        #    говорит сообщение об отказе;
                        #  * порог АБСОЛЮТНЫЙ (пол = -max_auto_lower), а не
                        #    "не больше N за одно сохранение". Пошаговый лимит
                        #    не ограничивал бы ничего: десять законных
                        #    сохранений по 0.5 увели бы ось на 5 мм по одному
                        #    легальному шагу за раз. Якорь — ноль, потому что
                        #    position_endstop по построению это Z-координата
                        #    срабатывания концевика, то есть маленькое число
                        #    около нуля на любой правильно собранной Z-MIN
                        #    машине.
max_auto_raise: 5.0     # Зеркальный предел вверх. Не украшение: его отсутствие
                        # нашёл тестовый прогон модуля до деплоя. При
                        # keep_equal position_min идёт за концевиком и ВВЕРХ, а
                        # у этого направления нет естественного упора —
                        # концевик 179 с position_min 179 проходит ВСЕ проверки
                        # Klipper (машина стартует, homing_positive_dir всё ещё
                        # выводится как False, потому что они равны), но
                        # достижимый диапазон оси становится 179..190, то есть
                        # Z=0 в него не попадает и печатать нечем. Не опасно
                        # (перебега по-прежнему нет), но молча проглатывать
                        # прыжок опоры на 180 мм — не защита.
keep_equal: True        # Следить за концевиком и ВВЕРХ тоже, а не только вниз
                        # (иначе position_min отстаёт и открывает перебег к
                        # соплу). Применяется ТОЛЬКО когда min и endstop уже
                        # равны: если кто-то намеренно оставил зазор, модуль
                        # его молча не закроет — так же, как молча не
                        # открывает.
verbose: True           # Печатать в консоль, что именно подвинуто и почему.
                        # Молчаливая правка конфига — плохо; выключать без
                        # причины не стоит.

# ПРОВЕРИТЬ, ЧТО МОДУЛЬ ЖИВ И ЧТО ОН ВИДИТ:
#   Z_OFFSET_GUARD_STATUS
# (или GET /printer/objects/query?z_offset_guard). Команда ничего не меняет.
# В выводе есть строка «бэкстоп на SAVE_CONFIG» — если там ОТКЛЮЧЁН, значит
# модуль не смог прочитать ожидающее состояние сейва на этой версии Klipper и
# честно об этом говорит вместо того, чтобы молча притворяться защитой.
#
# ЕСЛИ SAVE_CONFIG ОТКАЗАЛ — отказ ЛИПКИЙ: отвергнутое значение остаётся в
# ожидающем блоке, и следующий SAVE_CONFIG откажет снова, даже если ты только
# что закончил PID_CALIBRATE и хочешь сохранить ЕГО. Выходов два:
#   Z_OFFSET_GUARD_DISCARD — вернуть Z-офсет к загрузочным значениям и
#                            сохранить всё остальное (PID уцелеет);
#   RESTART                — выбросить ВЕСЬ ожидающий блок целиком.
#
# ПОСЛЕ ЛЮБОГО СРАБАТЫВАНИЯ, как и после любого SAVE_CONFIG на этой машине:
# забрать printer.cfg с принтера в репозиторий и закоммитить ДО следующего
# деплоя — deploy.sh это простой scp-перезаписью, и он затрёт и position_min,
# и PID из блока #*#. Правило не новое, см. CLAUDE.md и комментарий у
# position_endstop в printer.cfg.
#
# ЕСЛИ МАШИНА УЖЕ НЕ СТАРТУЕТ (модуль в этот момент не грузится — конфиг не
# проходит валидацию раньше, чем Klipper вообще доходит до extras): это
# лечится руками, автоматики тут нет и намеренно не будет. Точную команду
# печатает `bash scripts/deploy.sh --dry-run`, он распознаёт именно это
# состояние по тексту ошибки.
