# ===========================================================================
# RGB STATUS LIGHT: analog 3-channel RGB strip, 2x IRFZ44N + 1x IRL640
# ===========================================================================
# NOT INCLUDED IN printer.cfg YET - nothing is physically wired (no strip
# mounted, KSP42(TA) level shifters not soldered). Written and reviewed
# ahead of hardware, same pattern smoke-alarm.cfg used before the MQ-2/
# buzzer were physically wired. Full design history and datasheet citations:
# commits 694942b, 51a47ea (original design) and b6b01f6 (Orange-Pi
# redesign), and docs/printer-status.md, section "RGB статус-подсветка".
#
# WHAT THIS IS: an ANALOG RGB LED strip (3 wires + common anode, NOT an
# addressable WS2812/Neopixel strip), switched by three independent low-side
# N-channel MOSFETs, one per channel. Do NOT reach for Klipper's [neopixel]/
# [dotstar] sections for this - wrong hardware class.
#
# ---------------------------------------------------------------------------
# ARCHITECTURE: virtual request flags in Klipper, real switching on Orange Pi
# ---------------------------------------------------------------------------
# The three [output_pin] sections below (rgb_request_r/g/b, on AUX-4) are
# PURE VIRTUAL FLAGS - same pattern as [output_pin siren_armed] in
# smoke-alarm.cfg. Nothing is physically wired to these AVR pins. Klipper's
# only job for RGB is to set these three flags via SET_PIN at the lifecycle
# events below; orangepi-services/smoke-siren/smoke-siren-daemon.py polls
# them over Moonraker once a second and mirrors them onto the real MOSFET
# gates, which it drives directly from three Orange Pi GPIO pins through an
# inverting KSP42(TA) level-shifter per channel (3.3V GPIO logic is below
# IRFZ44N's worst-case 4.0V VGS(th), so it cannot drive the gate directly).
# Full circuit, resistor math, and live GPIO verification: smoke-siren-
# daemon.py's "RGB STATUS LIGHT" header section - read that for anything
# about the actual physical switching. Consequence worth knowing: up to ~1s
# of latency between a lifecycle macro call and the strip changing color.
#
# HARD PREREQUISITE - READ BEFORE WIRING ANYTHING
# The IRL640 assigned to the RED channel below is CURRENTLY IN SERVICE:
# printer.cfg's [controller_fan extruder_motor_fan] (D11/PB5) drives the
# extruder motor cooling fan through it (printer.cfg:89-114, 460R gate
# resistor). It cannot be pulled for this project until that fan is moved
# to a bipolar NPN transistor on the same D11/PB5 pin. As of this writing
# that swap's physical completion is NOT confirmed (tracked in
# printer-status.md, basket C9) - verify it at the machine before freeing
# this MOSFET for here.
#
# 🔴 BOOT-DEFAULT WARNING: an undriven Orange Pi GPIO pin (mid-boot, or the
# daemon crashed) leaves its channel ON at full brightness, not off - the
# opposite of every other output_pin default in this project. The KSP42(TA)
# stage's own 10k pull-up charges each gate HIGH whenever nothing is
# actively pulling it low. Worst case: full strip at ~1.26A white,
# unattended, for as long as that gap lasts (Orange Pi boot is tens of
# seconds). Not a bug to smooth over - see smoke-siren-daemon.py's header
# for why a naive gate pulldown does not fix it and what mitigation is
# actually in place (the daemon drives all three channels off within its
# first second of running, and on every exit path).
#
# ---------------------------------------------------------------------------
# MOSFET CHOICE AND CHANNEL ASSIGNMENT
# ---------------------------------------------------------------------------
# RED   -> IRL640.   Logic-level, RDS(on) guaranteed 0.18R max @ VGS=5V,
#          ID=10A (Vishay S21-1046-Rev.D). Already field-proven on this
#          machine at comparable current (the D11 fan) since 2026-07-28.
# GREEN -> IRFZ44N.  Standard-level - RDS(on) only characterized at VGS=10V
#          (17.5mR typ / 22mR max, Infineon PD-94787B); VGS(th) 2.0V min /
#          4.0V max @ ID=250uA. No 5V RDS(on) spec exists for this part.
# BLUE  -> IRFZ44N.  Same part, same numbers.
# Channel assignment is not safety-critical: every gate now gets the same
# clean drive through its own KSP42(TA) stage (see ARCHITECTURE above), so
# which physical MOSFET sits on which channel no longer matters
# electrically. Kept as IRL640=R / IRFZ44N=G,B because that is what was
# freed from the D11 fan and what was already on hand.
# Thermal margin at this load (~0.42A/channel typical, see STRIP SUPPLY
# below): even a pessimistic 10x the IRFZ44N's 10V-max RDS(on) at 2A
# dissipates ~0.88W; at 62 C/W theta-JA that's ~55C rise, nowhere near its
# 175C max. Full datasheet derivation: commit 694942b.
#
# ---------------------------------------------------------------------------
# PINS
# ---------------------------------------------------------------------------
# AVR SIDE (this file, virtual flags only) - AUX-4, a single-row 18-pin
# RepRapDiscount LCD header, never used for an LCD (the screen lives on the
# Orange Pi). D16/PH1 is already claimed by smoke-alarm.cfg's
# [output_pin siren_armed]; D23/D25/D27 are the three contacts immediately
# before it on the physical header (pins_RAMPS.h order), free and adjacent:
#   RED REQUEST   -> D23 / PA1  -> output_pin rgb_request_r
#   GREEN REQUEST -> D25 / PA3  -> output_pin rgb_request_g
#   BLUE REQUEST  -> D27 / PA5  -> output_pin rgb_request_b
# No collision with TMC UART, any stepper/heater/fan pin, or the smoke-alarm
# pins (PL5/PL7/PH1).
#
# ORANGE PI SIDE (real switching, smoke-siren-daemon.py) - each through its
# own KSP42(TA) + 10k/10k level shifter into the MOSFET gate assigned to
# that channel above:
#   RED   -> sysfs gpio21 / PA21   (header pin 26, unverified - meter it)
#   GREEN -> sysfs gpio19 / PA19   (header pin 27, unverified - meter it)
#   BLUE  -> sysfs gpio18 / PA18   (header pin 28, unverified - meter it)
# sysfs numbers are the verified fact (`gpioinfo` on gpiochip0, 2026-08-07,
# confirmed unclaimed); physical header-pin numbers are corroborated from
# this project's own pinout table, not freshly re-derived - meter them
# against the board before soldering. Full verification note in
# smoke-siren-daemon.py's header.
#
# ---------------------------------------------------------------------------
# EVENT MODEL - one-shot lifecycle events only, no polling
# ---------------------------------------------------------------------------
# This project already found and documented the trap this design must
# avoid: a macro/timer that periodically calls SET_PIN goes through
# toolhead.register_lookahead_callback -> toolhead:sync_print_time, which
# flips idle_timeout to "Printing" - breaking both the 10-minute
# TURN_OFF_HEATERS safety net and scripts/deploy.sh's hard gate. Full
# derivation: power-loss-recovery.cfg's own header, and printer-status.md
# "Ключевая находка". These macros are only ever CALLED from real one-shot
# events - never from a delayed_gcode timer.
#
# REJECTED ON PURPOSE: [idle_timeout] gcode: hook. It looks like a free
# one-shot event but isn't: if its gcode calls SET_PIN, idle_timeout bounces
# to "Printing" for ~1-1.5s before settling back to "Ready" (never "Idle"),
# so the transition-to-Idle condition rearms and can keep re-firing roughly
# every idle_timeout period. Same mechanism this project already burned
# time on once - not worth reintroducing for a cosmetic feature. RGB_OFF is
# reached a different way (below), so this hook isn't needed.
#
# WHAT DRIVES EACH COLOR, ALL ONE-SHOT:
#   PREPARING (yellow) -> RGB_PREPARING, first line of the future
#     PRINT_START (homing + heat-up phase).
#   PRINTING (white)   -> RGB_PRINTING, last line of the future PRINT_START,
#     right before control returns to the sliced gcode - so "printing"
#     means the nozzle is actually about to extrude, not "heaters requested".
#   IDLE/READY (off)   -> RGB_OFF, first line of the future PRINT_END.
#   Neither PRINT_START nor PRINT_END exists on this machine yet (no slicer
#     profile wired up, no print has ever completed - printer-status.md,
#     basket C1/C3). This file does not invent placeholder versions of
#     them: wire RGB_PREPARING/RGB_PRINTING in when that macro gets written.
#   CANCEL (off) -> already wired, no new hook needed - see the
#     _CLIENT_VARIABLE section below.
#   PAUSE/RESUME -> deliberately NOT hooked. Mid-print pause leaves the
#     strip on "printing" white, illuminating the work area for whoever is
#     fixing the pause - a reasonable default, not an oversight.
#     mainsail.cfg exposes user_pause_macro/user_resume_macro if this is
#     ever wanted later.
#   ERROR/FIRE (red blink) -> handled entirely by smoke-siren-daemon.py's
#     alarm_source() - the same independent, proven-live (2026-08-06)
#     Moonraker-polling detection the siren uses. When it fires, the daemon
#     blinks RED at the siren's cadence and forces GREEN/BLUE off,
#     overriding whatever color was requested, regardless of
#     rgb_request_r/g/b's value. Caveat, still unverified: whether
#     printer['output_pin rgb_request_r'].value reads back anything
#     meaningful during a real invoke_shutdown - moot for the physical
#     light (the daemon never looks at this flag during an alarm), but
#     worth knowing before building a UI indicator on top of this flag.
#
# ---------------------------------------------------------------------------
# STRIP SUPPLY
# ---------------------------------------------------------------------------
# 12V, 14.4W/m, three separate 350mm segments wired in PARALLEL (not one
# continuous roll - series would need 3x12V=36V, which doesn't exist here).
# Same-color wires from all three segments join into one bus per channel,
# landing on the one MOSFET assigned to that channel above. Combined worst
# case (full white, all channels): 14.4W/m * 1.05m / 12V = 1.26A, ~0.42A per
# channel - one to two orders of magnitude under either MOSFET's continuous
# rating. Low-side switching: strip V+ comes from its own 12V supply,
# common GND with RAMPS; each MOSFET only switches the return path to GND,
# so the existing 12V rail (fans, RAMPS logic) covers it, no second supply
# needed. Full segment-wiring plan: docs/printer-status.md, "Питание самой
# ленты". Purchase/price not confirmed - see docs/purchases.md.
#
# ---------------------------------------------------------------------------
# [output_pin] sections - pure virtual request flags. pwm left at its
# default (False, plain on/off): the three colors this design needs
# (yellow=R+G, white=R+G+B, red-only) are pure on/off combinations, no
# dimming required. If mixed colors read wrong on the actual strip once
# wired (full R+G often skews greenish on cheap analog strips, full R+G+B
# is rarely a clean white), the fix is `pwm: True` here plus a matching
# PWM-aware rewrite of the daemon's set_on() - cheap to add later, not
# built in now.
# ---------------------------------------------------------------------------
[output_pin rgb_request_r]
pin: PA1                    # AUX-4, contact D23. Virtual flag only - real
                            # RED gate (IRL640) is Orange Pi gpio21/PA21 via
                            # the KSP42(TA) level shifter. See PINS above.
value: 0                    # dark at every normal startup, matches the rest
                            # of this project's output_pin defaults.
shutdown_value: 0           # This pin drives nothing physical to latch; the
                            # fire response is smoke-siren-daemon.py's
                            # independent alarm_source() override - see
                            # EVENT MODEL above.

[output_pin rgb_request_g]
pin: PA3                    # AUX-4, contact D25. Virtual flag only - real
                            # GREEN gate (IRFZ44N) is Orange Pi gpio19/PA19
                            # via the level shifter.
value: 0
shutdown_value: 0

[output_pin rgb_request_b]
pin: PA5                    # AUX-4, contact D27. Virtual flag only - real
                            # BLUE gate (IRFZ44N) is Orange Pi gpio18/PA18
                            # via the level shifter.
value: 0
shutdown_value: 0

[gcode_macro RGB_OFF]
description: Request all channels off. Call once at print end/cancel, or any time by hand. Mirrored onto the real strip by smoke-siren-daemon.py within ~1s.
gcode:
    SET_PIN PIN=rgb_request_r VALUE=0
    SET_PIN PIN=rgb_request_g VALUE=0
    SET_PIN PIN=rgb_request_b VALUE=0

[gcode_macro RGB_PREPARING]
description: Request yellow (R+G) - homing/heating before a print. Call once, first line of the future PRINT_START.
gcode:
    SET_PIN PIN=rgb_request_r VALUE=1
    SET_PIN PIN=rgb_request_g VALUE=1
    SET_PIN PIN=rgb_request_b VALUE=0

[gcode_macro RGB_PRINTING]
description: Request white (R+G+B), plain illumination for the webcam. Call once, last line of the future PRINT_START.
gcode:
    SET_PIN PIN=rgb_request_r VALUE=1
    SET_PIN PIN=rgb_request_g VALUE=1
    SET_PIN PIN=rgb_request_b VALUE=1

[gcode_macro RGB_STATUS]
description: Report the current REQUESTED value of all three channels (what Klipper is asking for, not necessarily the physical strip - see fire-alarm override in smoke-siren-daemon.py, which can override this without touching these flags at all)
gcode:
    RESPOND MSG="{'requested R=%s G=%s B=%s (see smoke-siren-daemon.py journal for the actual physical state, and note the fire-alarm override does not update these flags)' % (printer['output_pin rgb_request_r'].value, printer['output_pin rgb_request_g'].value, printer['output_pin rgb_request_b'].value)}"

# ---------------------------------------------------------------------------
# CANCEL_PRINT hook - the documented mainsail.cfg extension point
# ---------------------------------------------------------------------------
# mainsail.cfg's header says to copy this whole _CLIENT_VARIABLE template
# into your own config and edit only what you need (every client.* field is
# wrapped in |default(...)), so the full template is copied verbatim below
# with only variable_user_cancel_macro changed, rather than declaring a
# partial section and relying on unverified Jinja Undefined behavior.
# printer['gcode_macro _CLIENT_VARIABLE'] is resolved by CANCEL_PRINT at the
# moment it RUNS, after the whole config has already loaded, so this works
# regardless of include order relative to mainsail.cfg.
# mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template stays
# commented-out (confirmed today). Two ACTIVE sections with this same name
# would collide - if that template ever gets uncommented, merge the two,
# don't stack them.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: "RGB_OFF" ; turn the strip off when a print is cancelled - the only line changed from the template
gcode:
