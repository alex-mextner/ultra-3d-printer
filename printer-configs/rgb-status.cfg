# ===========================================================================
# RGB STATUS LIGHT: analog 3-channel RGB strip, 2x IRFZ44N + 1x IRL640
# ===========================================================================
# INCLUDED IN printer.cfg since 2026-08-07. Klipper's whole side of this
# ([led rgb_strip] below) is pure software: no strip mounted, no KSP42(TA)
# level shifters soldered, nothing physically wired to the AVR pins it
# declares - same "safe to run unwired" pattern smoke-alarm.cfg used before
# the MQ-2/buzzer were physically wired. Full design history and datasheet
# citations: commits 694942b, 51a47ea (original design), b6b01f6 (Orange-Pi
# redesign), and this session's move from three [output_pin] flags to one
# real [led] object (see ARCHITECTURE below) - and docs/printer-status.md,
# section "RGB статус-подсветка". The REAL switching hardware (MOSFETs,
# strip, level shifters) is still not physically assembled - see basket C9
# in printer-status.md for the remaining physical blockers.
#   🔴 STALE AS OF 2026-08-08 - FLAGGED, NOT RESOLVED: this line dates to
#   2026-08-07 and says "not physically assembled." The user's live flicker
#   report on this exact strip (2026-08-07/08, see printer-status.md "Живая
#   жалоба на мерцание после деплоя PWM") is direct evidence a physical
#   strip WAS wired and switching by that point - same contradiction flagged
#   in smoke-siren-daemon.py's "WHAT GPIO18/19/21 ARE NOT" section. Don't
#   trust either claim without verifying at the machine.
#
# WHAT THIS IS: an ANALOG RGB LED strip (3 wires + common anode, NOT an
# addressable WS2812/Neopixel strip), switched by three independent low-side
# N-channel MOSFETs, one per channel. [led] below is Klipper's generic PWM-
# LED object (klippy/extras/led.py, class PrinterPWMLED) - the RIGHT config
# section for this hardware class despite the name overlap with [neopixel]/
# [dotstar]; those are for addressable strips and would be the wrong choice
# here even if the hardware were connected.
#
# ---------------------------------------------------------------------------
# ARCHITECTURE: a real Klipper [led] object, dummy pins, real switching on
# Orange Pi
# ---------------------------------------------------------------------------
# [led rgb_strip] below is Klipper's stock PWM-LED object - verified against
# the actual source on this printer (~/klipper/klippy/extras/led.py,
# 2026-08-07), not assumed. Its red_pin/green_pin/blue_pin are real AVR pins
# Klipper drives PWM duty cycle on (config_digital_out + set_digital_out_pwm_
# cycle firmware commands - Klipper's software PWM, confirmed in klippy/
# mcu.py's MCU_pwm._build_config: this path needs no hardware timer/OCR pin,
# it works on any digital-capable pin, same as the output_pin flags this
# section used to declare - see PINS below for why that matters). PA1/PA3/
# PA5 (AUX-4, D23/D25/D27) are UNCONNECTED on purpose - same "virtual,
# nothing soldered" pattern the old rgb_request_r/g/b flags used, just
# wearing one [led] object instead of three [output_pin]s now.
#
# WHY SWITCH FROM output_pin TO [led]: Mainsail ships a native color-picker
# widget for any [led]/[neopixel] object (mainsail-crew/mainsail#1050,
# "Miscellaneous" panel) - stock, no plugin/fork needed. output_pin only
# gets a plain on/off toggle in Mainsail's UI, no color picker. [led] gives
# the user a real color wheel that calls SET_LED LED=rgb_strip RED=..
# GREEN=.. BLUE=.. under the hood - the same command the lifecycle macros
# below use, so the picker and the macros are just two callers of one
# object, not two parallel mechanisms.
#
# orangepi-services/smoke-siren/smoke-siren-daemon.py polls this object's
# color_data (`GET /printer/objects/query?led%20rgb_strip`) once a second -
# led.py's get_status() returns {'color_data': [(r,g,b,w)]}, confirmed
# against source - THRESHOLDS each channel at 0.5 (see DIMMING below), and
# mirrors the result onto three Orange Pi GPIO pins through an inverting
# KSP42(TA) level-shifter per channel (3.3V GPIO logic is below IRFZ44N's
# worst-case 4.0V VGS(th), so it cannot drive the gate directly). Full
# circuit, resistor math, and live GPIO verification: smoke-siren-daemon.py's
# "RGB STATUS LIGHT" header section - read that for anything about the
# actual physical switching. Consequence worth knowing: up to ~1s of latency
# between a color change (picker or macro) and the physical strip actually
# changing - the same POLL_INTERVAL_S already used for the siren, not a new
# number, but a new place it applies.
#
# A real software-PWM version of this (fractional brightness, not just
# on/off) was tried and reverted 2026-08-08 - see DIMMING below and
# docs/printer-status.md, section "Живая жалоба на мерцание после деплоя
# PWM", before re-attempting it.
#
# WHY SYNC=0: SET_LED's SYNC parameter, read straight off led.py's
# cmd_SET_LED - SYNC=1 (its own default) routes the color change through
# toolhead.register_lookahead_callback, which touches toolhead print-time
# state; SYNC=0 calls the same update function immediately with print_time=
# None, entirely bypassing register_lookahead_callback. This project already
# burned time on a mechanism that flips idle_timeout to "Printing" via
# exactly that lookahead path (see EVENT MODEL below) - SYNC=0 is confirmed
# by source, not assumed, to sidestep it. The lifecycle macros below always
# pass SYNC=0 explicitly. Mainsail's own picker widget calling SET_LED with
# whatever SYNC it defaults to was not re-verified against Mainsail's source
# in this pass - but even in the worst case that is a single user-initiated
# click, not a repeating timer, so it cannot reproduce the delayed_gcode
# idle_timeout trap this project already hit (that required periodic
# automatic calls, not one manual action).
#
# ---------------------------------------------------------------------------
# DIMMING: THRESHOLD, NOT SMOOTH
# ---------------------------------------------------------------------------
# Mainsail's color-picker sends fractional RED/GREEN/BLUE (0.0-1.0) via
# SET_LED, same as for any [led]/[neopixel] widget. The physical switches
# here have no dimming hardware of their own: each channel is one MOSFET
# gate, pure on/off, no series PWM resistor anywhere in this strip's driving
# stage (see MOSFET CHOICE below) - so smoke-siren-daemon.py THRESHOLDS each
# channel at 0.5 before mirroring it onto the real gate (>=0.5 -> on, <0.5 ->
# off). Practical consequence: the picker's hue selection works correctly
# (confirmed live cycling red/green/blue/yellow/white/off), but its
# brightness slider does nothing useful - any value above 0.5 snaps to
# full-on, below snaps to full-off. This is a known, accepted limitation,
# not an oversight.
#
# 🔴 A real software-PWM version of this WAS tried (2026-08-07/08, a
# dedicated 200Hz toggling thread) and REVERTED after a live report of
# strong, uneven flicker that on-device measurement could not conclusively
# root-cause - suspected combination of the MOSFET/transistor switching
# characteristics and digital timing jitter on this board, not proven.
# User's call: not worth chasing further tonight, go back to plain on/off.
# Full investigation and revert record: docs/printer-status.md, section
# "Живая жалоба на мерцание после деплоя PWM". Don't re-add a PWM thread to
# smoke-siren-daemon.py without reading that section first.
#
# HARD PREREQUISITE - READ BEFORE WIRING ANYTHING
# The IRL640 assigned to the RED channel below is CURRENTLY IN SERVICE:
# printer.cfg's [controller_fan extruder_motor_fan] (D11/PB5) drives the
# extruder motor cooling fan through it (printer.cfg:89-114, 460R gate
# resistor). It cannot be pulled for this project until that fan is moved
# to a bipolar NPN transistor on the same D11/PB5 pin. As of this writing
# that swap's physical completion is NOT confirmed (tracked in
# printer-status.md, basket C9) - verify it at the machine before freeing
# this MOSFET for here.
#
# 🔴 BOOT-DEFAULT WARNING: an undriven Orange Pi GPIO pin (mid-boot, or the
# daemon crashed before ever exporting it) leaves its channel ON at full
# brightness, not off - the opposite of every other output_pin default in
# this project. The KSP42(TA) stage's own 10k pull-up charges each gate
# HIGH whenever nothing is actively pulling it low. Worst case: full strip
# at ~1.26A white, unattended, for as long as that gap lasts (Orange Pi boot
# is tens of seconds). Not a bug to smooth over - see smoke-siren-daemon.py's
# header for why a naive gate pulldown does not fix it and what mitigation
# is actually in place (the daemon drives all three channels off within its
# first second of running, and on every exit path).
#
# ---------------------------------------------------------------------------
# MOSFET CHOICE AND CHANNEL ASSIGNMENT
# ---------------------------------------------------------------------------
# RED   -> IRL640.   Logic-level, RDS(on) guaranteed 0.18R max @ VGS=5V,
#          ID=10A (Vishay S21-1046-Rev.D). Already field-proven on this
#          machine at comparable current (the D11 fan) since 2026-07-28.
# GREEN -> IRFZ44N.  Standard-level - RDS(on) only characterized at VGS=10V
#          (17.5mR typ / 22mR max, Infineon PD-94787B); VGS(th) 2.0V min /
#          4.0V max @ ID=250uA. No 5V RDS(on) spec exists for this part.
# BLUE  -> IRFZ44N.  Same part, same numbers.
# Channel assignment is not safety-critical: every gate now gets the same
# clean drive through its own KSP42(TA) stage (see ARCHITECTURE above), so
# which physical MOSFET sits on which channel no longer matters
# electrically. Kept as IRL640=R / IRFZ44N=G,B because that is what was
# freed from the D11 fan and what was already on hand.
# Thermal margin at this load (~0.42A/channel typical, see STRIP SUPPLY
# below): even a pessimistic 10x the IRFZ44N's 10V-max RDS(on) at 2A
# dissipates ~0.88W; at 62 C/W theta-JA that's ~55C rise, nowhere near its
# 175C max. Full datasheet derivation: commit 694942b.
#
# ---------------------------------------------------------------------------
# PINS
# ---------------------------------------------------------------------------
# AVR SIDE (this file, dummy PWM pins only) - AUX-4, a single-row 18-pin
# RepRapDiscount LCD header, never used for an LCD (the screen lives on the
# Orange Pi). D16/PH1 is already claimed by smoke-alarm.cfg's
# [output_pin siren_armed]; D23/D25/D27 are the three contacts immediately
# before it on the physical header (pins_RAMPS.h order), free and adjacent -
# the same three pins this file has reserved for RGB since 2026-08-06, now
# wearing [led rgb_strip]'s red_pin/green_pin/blue_pin instead of three
# separate [output_pin]s:
#   RED   -> D23 / PA1  -> [led rgb_strip] red_pin
#   GREEN -> D25 / PA3  -> [led rgb_strip] green_pin
#   BLUE  -> D27 / PA5  -> [led rgb_strip] blue_pin
# No collision with TMC UART, any stepper/heater/fan pin, or the smoke-alarm
# pins (PL5/PL7/PH1). PWM capability was NOT a selection criterion here and
# does not need to be: Klipper's [led] pins default to hardware_pwm=False
# (software PWM via the config_digital_out/set_digital_out_pwm_cycle
# firmware commands, klippy/mcu.py MCU_pwm._build_config, verified against
# source on this printer 2026-08-07), which works on ANY digital-capable
# pin, not only pins wired to a hardware timer/OCR channel on the
# ATmega2560 - so these three pins did not need to change, or even be
# checked against a hardware-PWM pinout table, when this file moved from
# output_pin to [led].
#
# ORANGE PI SIDE (real switching, smoke-siren-daemon.py) - each through its
# own KSP42(TA) + 10k/10k level shifter into the MOSFET gate assigned to
# that channel above:
#   RED   -> sysfs gpio21 / PA21   (header pin 26, unverified - meter it)
#   GREEN -> sysfs gpio19 / PA19   (header pin 27, unverified - meter it)
#   BLUE  -> sysfs gpio18 / PA18   (header pin 28, unverified - meter it)
# sysfs numbers are the verified fact (`gpioinfo` on gpiochip0, 2026-08-07,
# confirmed unclaimed); physical header-pin numbers are corroborated from
# this project's own pinout table, not freshly re-derived - meter them
# against the board before soldering. Full verification note in
# smoke-siren-daemon.py's header. This side did NOT change in this session -
# only what the daemon polls on the Klipper/Moonraker side changed (see
# ARCHITECTURE above).
#
# ---------------------------------------------------------------------------
# EVENT MODEL - one-shot lifecycle events only, no polling
# ---------------------------------------------------------------------------
# This project already found and documented the trap this design must
# avoid: a macro/timer that periodically calls SET_PIN/SET_LED goes through
# toolhead.register_lookahead_callback -> toolhead:sync_print_time, which
# flips idle_timeout to "Printing" - breaking both the 10-minute
# TURN_OFF_HEATERS safety net and scripts/deploy.sh's hard gate. Full
# derivation: power-loss-recovery.cfg's own header, and printer-status.md
# "Ключевая находка". These macros are only ever CALLED from real one-shot
# events - never from a delayed_gcode timer - and always pass SYNC=0 (see
# ARCHITECTURE above) to stay off that path even as a one-shot call.
#
# REJECTED ON PURPOSE: [idle_timeout] gcode: hook. It looks like a free
# one-shot event but isn't: if its gcode calls SET_PIN/SET_LED, idle_timeout
# bounces to "Printing" for ~1-1.5s before settling back to "Ready" (never
# "Idle"), so the transition-to-Idle condition rearms and can keep
# re-firing roughly every idle_timeout period. Same mechanism this project
# already burned time on once - not worth reintroducing for a cosmetic
# feature. RGB_OFF is reached a different way (below), so this hook isn't
# needed.
#
# WHAT DRIVES EACH COLOR, ALL ONE-SHOT:
#   PREPARING (yellow) -> RGB_PREPARING, first line of PRINT_START
#     (homing + heat-up phase).
#   PRINTING (white)   -> RGB_PRINTING, last line of PRINT_START, right
#     before control returns to the sliced gcode - so "printing" means the
#     nozzle is actually about to extrude, not "heaters requested".
#   IDLE/READY (off)   -> RGB_DONE, first line of PRINT_END. With the current
#     _RGB_CONFIG.done_hold_s = 0 that means "dark immediately" (user request
#     2026-08-17); with a nonzero hold it means "colour, then dark after N
#     seconds" - see _RGB_CONFIG below, that one variable is the whole
#     difference.
#   WIRED 2026-08-16 in printer-configs/print-start-end.cfg (previously
#     neither macro existed on this machine at all - see that file's header
#     for the full story, including the real print-abort root cause found
#     while writing it).
#   CANCEL/ERROR (dark) -> wired via _CLIENT_VARIABLE's user_cancel_macro
#     below, which since 2026-08-17 points at _PRINT_CANCEL_CLEANUP
#     (print-start-end.cfg) rather than straight at RGB_ERROR - an interrupted
#     print must also drop the motors and the part fan, not only the light.
#     That macro still calls RGB_ERROR, and RGB_ERROR still exists in full;
#     with _RGB_CONFIG.error_hold_s = 0 it resolves to "dark", see below.
#   PAUSE/RESUME -> deliberately NOT hooked. Mid-print pause leaves the
#     strip on "printing" white, illuminating the work area for whoever is
#     fixing the pause - a reasonable default, not an oversight.
#     mainsail.cfg exposes user_pause_macro/user_resume_macro if this is
#     ever wanted later.
#   MANUAL (any hue, any brightness slider) -> Mainsail's color-picker widget
#     on rgb_strip, calling SET_LED directly - the whole reason this file
#     moved from output_pin to [led] this session. Brightness is
#     threshold-only, not smooth - see DIMMING above.
#   WORK LIGHT (white, while the camera page is open) -> the /overcam page in
#     the Mainsail fork, added 2026-08-18. It lights the strip when nothing
#     else has it lit, darkens it 5 minutes after the tab loses focus, and
#     relights it on activity. 🔴 IT WRITES 0.973, NOT 1.0, AND THAT NUMBER IS
#     LOAD-BEARING - do not "tidy" it anywhere it appears. It is the ownership
#     token: physically identical to white (the daemon thresholds at 0.5) but
#     unreachable by every other writer, since the macros here write only 0/1
#     and both of Mainsail's picker paths quantize to two decimals. The page
#     will only ever send RGB_OFF if it reads that exact value back first, so
#     ANY colour written by anything else - a lifecycle macro above, a human
#     at the picker - revokes its claim for free and is then safe from its
#     idle timer. Consequence worth knowing when reading a live dump: a strip
#     showing 0.973 is the camera page's, one showing 1.0 is PRINT_START's.
#     Full reasoning: src/components/webcams/overcam-light.ts in the fork, and
#     docs/printer-status.md, "Рабочий свет по экрану камеры".
#   ERROR/FIRE (red blink) -> handled entirely by smoke-siren-daemon.py's
#     alarm_source() - the same independent, proven-live (2026-08-06)
#     Moonraker-polling detection the siren uses. When it fires, the daemon
#     blinks RED at the siren's cadence and forces GREEN/BLUE off,
#     overriding whatever color was requested (macro or picker),
#     regardless of rgb_strip's color_data. Caveat, still unverified:
#     whether printer['led rgb_strip'].color_data reads back anything
#     meaningful during a real invoke_shutdown - moot for the physical
#     light (the daemon never looks at this object during an alarm), but
#     worth knowing before building a UI indicator on top of it.
#
# ---------------------------------------------------------------------------
# STRIP SUPPLY
# ---------------------------------------------------------------------------
# 12V, 14.4W/m, three separate 350mm segments wired in PARALLEL (not one
# continuous roll - series would need 3x12V=36V, which doesn't exist here).
# Same-color wires from all three segments join into one bus per channel,
# landing on the one MOSFET assigned to that channel above. Combined worst
# case (full white, all channels): 14.4W/m * 1.05m / 12V = 1.26A, ~0.42A per
# channel - one to two orders of magnitude under either MOSFET's continuous
# rating. Low-side switching: strip V+ comes from its own 12V supply,
# common GND with RAMPS; each MOSFET only switches the return path to GND,
# so the existing 12V rail (fans, RAMPS logic) covers it, no second supply
# needed. Full segment-wiring plan: docs/printer-status.md, "Питание самой
# ленты". Purchase/price not confirmed - see docs/purchases.md.
#
# ---------------------------------------------------------------------------
# [led] section - one Klipper object, three dummy PWM pins. Drives Mainsail's
# native color-picker widget AND the lifecycle macros below through the same
# SET_LED command, so there is exactly one path a color request can take
# through Klipper, not two. cycle_time/hardware_pwm are physically
# irrelevant (no pin is connected) but must still be legal for Klipper to
# accept the section - left at led.py's own defaults (hardware_pwm: False ->
# software PWM, works on any digital pin per klippy/mcu.py, verified against
# source; cycle_time: 0.010s, led.py's own default).
#   `hardware_pwm` only feeds `mcu_pin.setup_cycle_time(...)`, which governs
#   how the (dummy, unconnected) AVR pin's OWN PWM waveform would be
#   generated on Klipper's MCU side - verified against klippy/extras/led.py's
#   source, not assumed. `get_status()`/`color_data` store and return the
#   raw float tuple set by `cmd_SET_LED` unconditionally, never quantized,
#   rounded, or gated by `hardware_pwm` anywhere in that file. The Orange-Pi
#   daemon reads color_data over Moonraker and never touches this pin config
#   at all, so this flag cannot affect what the daemon sees either way -
#   irrelevant whether the daemon thresholds it (current behavior) or, as
#   was tried and reverted 2026-08-08 (see DIMMING above), PWMs it.
# No white_pin: this
# strip has no white channel, and led.py accepts a pin definition being
# entirely absent (config.get(name + '_pin', None) with a None-skip). color_
# data resets to (0,0,0,0) on every Klipper (re)start - matches every other
# output_pin default in this project (dark until commanded otherwise).
# ---------------------------------------------------------------------------
[led rgb_strip]
red_pin: PA1                # AUX-4, contact D23. Dummy pin only - real RED
                             # gate (IRL640) is Orange Pi gpio21/PA21 via the
                             # KSP42(TA) level shifter. See PINS above.
green_pin: PA3               # AUX-4, contact D25. Dummy pin only - real
                             # GREEN gate (IRFZ44N) is Orange Pi gpio19/PA19
                             # via the level shifter.
blue_pin: PA5                # AUX-4, contact D27. Dummy pin only - real BLUE
                             # gate (IRFZ44N) is Orange Pi gpio18/PA18 via
                             # the level shifter.
initial_RED: 0               # dark at every normal startup, matches the
initial_GREEN: 0             # rest of this project's output_pin defaults.
initial_BLUE: 0

[gcode_macro RGB_OFF]
description: Request all channels off. Call once at print end/cancel, or any time by hand (also reachable via Mainsail's color-picker widget on rgb_strip). Mirrored onto the real strip by smoke-siren-daemon.py within ~1s.
gcode:
    SET_LED LED=rgb_strip RED=0 GREEN=0 BLUE=0 SYNC=0

[gcode_macro RGB_PREPARING]
description: Request yellow (R+G) - homing/heating before a print. Call once, first line of the future PRINT_START.
gcode:
    SET_LED LED=rgb_strip RED=1 GREEN=1 BLUE=0 SYNC=0

[gcode_macro RGB_PRINTING]
description: Request white (R+G+B), plain illumination for the webcam. Call once, last line of the future PRINT_START.
gcode:
    SET_LED LED=rgb_strip RED=1 GREEN=1 BLUE=1 SYNC=0

# ---------------------------------------------------------------------------
# _RGB_CONFIG - how long the post-print colour stays up before going dark
# ---------------------------------------------------------------------------
# 🔴 THIS IS WHERE THE 2026-08-15 -> 2026-08-17 REVERSAL LIVES. Read this
# before "fixing" either macro below.
#
#   2026-08-15, user: "должна не гаснуть а становиться зеленой на полчаса"
#     -> RGB_DONE lit green and armed _rgb_done_off for 1800s.
#   2026-08-16, user: "красная на ошибку когда печать прервалась"
#     -> RGB_ERROR lit solid red on CANCEL_PRINT, with NO timer at all, i.e.
#        red until something else changed it.
#   2026-08-17, user: "после окончания или прерывания печати пусть подсветка
#     гаснет, и моторы и кулера выключаются все"
#     -> BOTH of the above now end dark. Newer instruction wins.
#
# Live evidence the 2026-08-17 request is a reaction to real behaviour, not a
# hypothetical: at the moment this was written `GET /printer/objects/query?
# led%20rgb_strip` returned color_data [[1.0, 0.0, 0.0, 0.0]] - solid red,
# left over from the cancelled print of 2026-08-16, still lit a day later
# because RGB_ERROR had no auto-off at all.
#
# THE OLD BEHAVIOUR IS NOT DELETED, ONLY SET TO ZERO. Both macros still exist
# in full, both still know their colour, and both still use the same one-shot
# delayed_gcode. Putting 1800 back into done_hold_s restores the half-hour
# green exactly as it was, in one number, with no code to rewrite - which is
# the point of this section, because this preference has already flipped once.
#
# WHY 0 SKIPS THE COLOUR ENTIRELY instead of setting it and clearing it a
# moment later: the physical strip is driven by smoke-siren-daemon.py polling
# color_data once a second (see ARCHITECTURE above), so a colour that is
# overwritten within the same second is never visible on the strip at all -
# it would only be a phantom in the logs. If the hold is zero, go straight to
# RGB_OFF and say so.
#
# This is a variables-only macro (empty gcode:), the same shape as
# _CLIENT_VARIABLE below - it is never called, only read.
[gcode_macro _RGB_CONFIG]
description: Timing knobs for the post-print light. Never called - RGB_DONE/RGB_ERROR read these variables. See this section's header for the 2026-08-15/16/17 history behind the current values.
variable_done_hold_s: 0      # seconds of GREEN after a successful print
                             # before going dark. WAS 1800 (the half-hour
                             # green requested 2026-08-15); set to 0 =
                             # "dark immediately" on 2026-08-17 by the user's
                             # newer request. Restore the old behaviour by
                             # putting 1800 back here - nothing else changes.
variable_error_hold_s: 0     # seconds of RED after an interrupted print
                             # before going dark. WAS effectively infinite
                             # (RGB_ERROR set red and never cleared it,
                             # 2026-08-16); set to 0 = "dark immediately" on
                             # 2026-08-17 by the same request. A small
                             # nonzero value here (say 60) is the middle
                             # ground if the user ever wants a brief red
                             # "that print was interrupted" flag that still
                             # ends dark - not chosen now because the request
                             # named cancellation explicitly.
gcode:

[gcode_macro RGB_ERROR]
description: A print was interrupted (CANCEL_PRINT, by hand or by an aborted move). Shows solid red for _RGB_CONFIG.error_hold_s seconds and then goes dark; with the current error_hold_s = 0 it goes dark immediately. Reached via _PRINT_CANCEL_CLEANUP (print-start-end.cfg), which also drops motors and the part fan.
gcode:
    {% set hold = printer['gcode_macro _RGB_CONFIG'].error_hold_s|float %}
    {% if hold > 0 %}
        SET_LED LED=rgb_strip RED=1 GREEN=0 BLUE=0 SYNC=0
        UPDATE_DELAYED_GCODE ID=_rgb_done_off DURATION={hold}
    {% else %}
        # Cancel first, then go dark: an interrupt landing inside a previous
        # print's afterglow window must not leave that older timer armed to
        # fire later over whatever is on the strip by then. DURATION=0 is
        # Klipper's documented "cancel, do not fire" - see RGB_DONE below.
        UPDATE_DELAYED_GCODE ID=_rgb_done_off DURATION=0
        RGB_OFF
    {% endif %}

# ---------------------------------------------------------------------------
# RGB_DONE - the "print finished normally" light
# ---------------------------------------------------------------------------
# Added 2026-08-16 as green-for-30-minutes; now parameterised through
# _RGB_CONFIG above (done_hold_s = 0 -> dark immediately, 2026-08-17). Read
# that section for the full history - it is not repeated here.
#
# The countdown uses the SAME one-shot delayed_gcode pattern this file's
# EVENT MODEL section above already established (no periodic polling, see
# that section for why: a repeating timer that calls SET_LED would flip
# idle_timeout back to "Printing" via toolhead.register_lookahead_callback -
# irrelevant for a genuinely one-shot delay, but the auto-off below still
# passes SYNC=0 to stay consistent with every other call in this file).
#
# CANCELLED BY THE NEXT PRINT_START, ON PURPOSE: without this, starting a new
# print during a previous print's afterglow would let the stale timer fire
# mid-new-print and blank out RGB_PRINTING (white) or whatever color is live
# at that moment, for no reason connected to the print actually running.
# print-start-end.cfg's PRINT_START cancels this timer as its very first
# action (UPDATE_DELAYED_GCODE ID=_rgb_done_off DURATION=0 - Klipper's
# documented way to cancel a pending delayed_gcode without waiting for it to
# fire), before RGB_PREPARING even runs. That call is a harmless no-op while
# the holds are 0, and stays correct the moment either one is raised again.
#
# ONE TIMER, BOTH PATHS: _rgb_done_off is shared by RGB_DONE and RGB_ERROR on
# purpose. They are mutually exclusive endings of the same print, and if one
# somehow follows the other, re-arming the single timer is exactly right -
# two separate timers could race and blank each other's colour. Name kept
# from 2026-08-16 rather than renamed, because PRINT_START and this project's
# docs already reference this ID.
[gcode_macro RGB_DONE]
description: A print finished successfully. Shows solid green for _RGB_CONFIG.done_hold_s seconds and then goes dark; with the current done_hold_s = 0 it goes dark immediately. Call once, first line of PRINT_END.
gcode:
    {% set hold = printer['gcode_macro _RGB_CONFIG'].done_hold_s|float %}
    {% if hold > 0 %}
        SET_LED LED=rgb_strip RED=0 GREEN=1 BLUE=0 SYNC=0
        UPDATE_DELAYED_GCODE ID=_rgb_done_off DURATION={hold}
    {% else %}
        UPDATE_DELAYED_GCODE ID=_rgb_done_off DURATION=0
        RGB_OFF
    {% endif %}

[delayed_gcode _rgb_done_off]
# initial_duration: 0 - never fires on its own at Klipper startup, only ever
# via RGB_DONE's UPDATE_DELAYED_GCODE call above (same pattern as
# smoke-alarm.cfg's _smoke_test_off).
initial_duration: 0
gcode:
    RGB_OFF

[gcode_macro RGB_STATUS]
description: Report the current REQUESTED color of rgb_strip (what Klipper is asking for, via macro or Mainsail's picker - not necessarily the physical strip - see fire-alarm override in smoke-siren-daemon.py, which can override this without touching this object at all)
gcode:
    RESPOND MSG="{'requested color_data=%s (see smoke-siren-daemon.py journal for the actual physical state, and note the fire-alarm override does not update this object)' % (printer['led rgb_strip'].color_data,)}"

# ---------------------------------------------------------------------------
# CANCEL_PRINT hook - the documented mainsail.cfg extension point
# ---------------------------------------------------------------------------
# mainsail.cfg's header says to copy this whole _CLIENT_VARIABLE template
# into your own config and edit only what you need (every client.* field is
# wrapped in |default(...)), so the full template is copied verbatim below
# with only variable_user_cancel_macro changed, rather than declaring a
# partial section and relying on unverified Jinja Undefined behavior.
# printer['gcode_macro _CLIENT_VARIABLE'] is resolved by CANCEL_PRINT at the
# moment it RUNS, after the whole config has already loaded, so this works
# regardless of include order relative to mainsail.cfg.
# mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template stays
# commented-out (confirmed today). Two ACTIVE sections with this same name
# would collide - if that template ever gets uncommented, merge the two,
# don't stack them.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: "_PRINT_CANCEL_CLEANUP" ; CHANGED 2026-08-17 (was "RGB_ERROR", before that "RGB_OFF"). The hook now points at print-start-end.cfg's _PRINT_CANCEL_CLEANUP, which calls RGB_ERROR *and* drops the part fan and the steppers - the user's 2026-08-17 request covers an interrupted print, not only a finished one, and CANCEL_PRINT's own body never disables motors. Kept as one macro name because mainsail.cfg emits this string verbatim as a single gcode line ({client.user_cancel_macro|default("")}), so a comma/semicolon list of commands would not work here. Neither macro touches the fire-alarm path (smoke-siren-daemon.py's alarm override is independent and still takes priority regardless of this object's requested color - see EVENT MODEL above).
gcode:
