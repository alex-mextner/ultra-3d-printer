# ===========================================================================
# RGB STATUS LIGHT: analog 3-channel RGB strip, 2x IRFZ44N + 1x IRL640
# ===========================================================================
# Written 2026-08-06. NOT INCLUDED IN printer.cfg YET - nothing is physically
# wired (no strip bought, MOSFETs not mounted, extruder-fan BJT swap not done).
# Written and reviewed ahead of hardware, same pattern smoke-alarm.cfg used
# before the MQ-2/buzzer were physically wired. Full design writeup, MOSFET
# datasheet numbers and pin-map cross-check: docs/printer-status.md, section
# "RGB статус-подсветка".
#
# 🔴 ARCHITECTURE CHANGE 2026-08-07 - READ THIS BEFORE THE REST OF THE FILE.
# The three [output_pin] sections below (rgb_request_r/g/b) NO LONGER drive
# the MOSFET gates. They used to (RAMPS 5V logic straight to each gate) when
# this file was first written 2026-08-06; as of 2026-08-07 the strip's R/G/B
# wires will be driven from ORANGE PI GPIO (3.3V) instead, through an
# inverting KSP42(TA) level-shifter per channel, because 3.3V is below
# IRFZ44N's worst-case 4.0V VGS(th) - not a safe assumption to drive a power
# MOSFET gate on. Full circuit, resistor math, GPIO pin numbers, and the
# switching code all live in orangepi-services/smoke-siren/
# smoke-siren-daemon.py's "RGB STATUS LIGHT" header section - READ THAT
# FIRST for anything about the actual physical switching. This file's three
# [output_pin] sections are now PURE VIRTUAL REQUEST FLAGS - same pattern as
# [output_pin siren_armed] in smoke-alarm.cfg, nothing physically wired to
# these AVR pins at all. Klipper's only job for RGB is to set these three
# flags via SET_PIN at the lifecycle events below; the Orange-Pi daemon
# polls them over Moonraker once a second and mirrors them onto the real
# GPIO-driven channels - except during a fire alarm, when it overrides them
# entirely and independently (see EVENT MODEL further down). Consequence
# worth knowing: there is now up to ~1s of latency between a lifecycle
# macro call and the physical strip actually changing color.
# 🔴 ALSO READ BEFORE WIRING: the daemon's BOOT-DEFAULT WARNING - with this
# topology, an UNDRIVEN Orange Pi GPIO pin (mid-boot, or the daemon crashed)
# leaves the channel ON (full brightness), not off - the opposite of every
# other output_pin default in this project. Worst case is the full strip at
# ~1.26A white, unattended, for as long as that gap lasts. This is a real,
# accepted consequence of the topology chosen tonight, not a bug to smooth
# over - see the daemon header for the full explanation and why a naive
# gate pulldown does not fix it.
#
# WHAT THIS IS: an ANALOG RGB LED strip (3 wires + common anode, NOT an
# addressable WS2812/Neopixel strip), switched by three independent low-side
# N-channel MOSFETs, one per channel. Do NOT reach for Klipper's [neopixel]/
# [dotstar] sections for this - wrong hardware class.
#
# ---------------------------------------------------------------------------
# HARD PREREQUISITE - READ BEFORE WIRING ANYTHING
# ---------------------------------------------------------------------------
# The IRL640 assigned to the RED channel below is CURRENTLY IN SERVICE:
# printer.cfg's [controller_fan extruder_motor_fan] (D11/PB5) drives the
# extruder motor cooling fan through it (printer.cfg:89-114, 460R gate
# resistor). It cannot be pulled for this project until that fan is moved to
# a cheap bipolar NPN transistor (user has many on hand) on the same D11/PB5
# pin. THAT SWAP HAS NOT BEEN DONE - confirmed by reading printer.cfg
# 2026-08-06, no BJT swap present. Do this first, verify the fan still runs
# (100% while any stepper is energized or the hotend is hot, +60s after,
# per the existing [controller_fan] block), THEN free the IRL640 for here.
#
# ---------------------------------------------------------------------------
# MOSFET CHOICE AND CHANNEL ASSIGNMENT - not arbitrary, see reasoning below
# ---------------------------------------------------------------------------
# RED   -> IRL640.   Logic-level, RDS(on) GUARANTEED at VGS=5V (0.18R max
#          @ 10A, Vishay datasheet S21-1046-Rev.D). Already field-proven on
#          THIS machine at comparable current (D11 fan) since 2026-07-28.
# GREEN -> IRFZ44N.  Standard-level - RDS(on) is ONLY characterized at
#          VGS=10V (17.5mR typ / 22mR max, Infineon PD-94787B). No 5V
#          RDS(on) spec exists at all for this part class - not a worse
#          number, an ABSENT one. Safe anyway at this current - see below.
# BLUE  -> IRFZ44N.  Same part, same caveat, same verdict.
#
# WHY RED GETS THE PROPERLY-RATED PART (HISTORICAL - see correction below):
# red was the ONLY channel with shutdown_value: 1 (see below) - it could
# latch ON, unattended, for however long the machine sat shut down before
# someone noticed, in the ORIGINAL direct-RAMPS-drive design. That was
# exactly the channel you would not want running outside its guaranteed
# envelope. Green/blue only conducted while PRINTING, i.e. while someone
# was plausibly in the room. This assignment was deliberate, not incidental
# - AT THE TIME.
#
# 🔴 CORRECTION 2026-08-07: this asymmetry argument is now MOOT, not just
# outdated. After the level-shifter change above, ALL THREE gates get the
# exact same clean +5V-through-a-10k-pull-up drive, regardless of which
# physical MOSFET sits on which channel - there is no longer a "channel
# that runs outside its guaranteed envelope" at all, because none of them
# are driven by a raw logic pin anymore (see "THE VERDICT, IN FULL" below -
# its RAMPS-pin-VOH argument described the OLD circuit; the NEW one is
# strictly better margin, a real regulated 5V rail instead of an unloaded
# AVR pin's ~4.8-4.9V). The R/G/B <-> IRL640/IRFZ44N/IRFZ44N pairing below
# is kept AS-IS anyway - there is no benefit to reshuffling it, IRL640 is
# still the one physically freed from the D11 fan and the two IRFZ44Ns are
# still the ones already on hand - but the SAFETY REASONING for that
# pairing no longer applies, and shutdown_value is 0 on all three flags now
# (see the [output_pin] sections below) precisely because none of them
# drives anything through a shutdown-latch mechanism anymore either.
#
# THE VERDICT, IN FULL (HISTORICAL CONTEXT - both parts read from their real
# datasheets, not fetched-and-guessed: PDFs pulled via WebFetch, run through
# pdftotext, checked against the actual Electrical Characteristics tables.
# Written for the ORIGINAL direct-RAMPS-drive design; the RDS(on)/VGS(th)
# numbers are still correct and still the reason both parts are fine at
# this current, but the "Gate drive" paragraph below describes a RAMPS pin
# driving the gate directly, which is NO LONGER what happens - see the
# correction above and smoke-siren-daemon.py for the actual current path):
#
#   IRFZ44N (Infineon/IR PD-94787B, "IRFZ44NPbF"):
#     RDS(on): 17.5mR typ / 22mR max @ VGS=10V, ID=25A - ONLY test condition
#       given. VGS(th): 2.0V min / 4.0V max @ ID=250uA.
#     The SAME datasheet's own avalanche-test-circuit footnote reads:
#       "[VGS=10V] *** ... *** VGS = 5.0V for Logic Level and 3V Drive
#       Devices" - i.e. the manufacturer's own test convention puts THIS
#       part in the 10V-driven, non-logic-level bucket. That is the finding:
#       there is no guaranteed number at 5V, not a bad one.
#     Fig. 3 (Typical Transfer Characteristics) plots ID vs VGS from 4V to
#       11V with the lowest characterized curve labelled "BOTTOM 4.5V" - the
#       part is usable there but visibly short of the 10V/15V curves; no
#       ohms figure can be read off a curve honestly, so none is quoted here.
#     theta-JA (free air, no heatsink): 62 C/W max (same datasheet).
#     BOUND, not estimate: even at a deliberately pessimistic 10x the 10V-max
#       figure (~220mR) at 2A - well above the "hundreds of mA to low amps"
#       this strip will draw per channel - P = I^2*R = 0.88W,
#       deltaT = 0.88 * 62 = ~55C above ambient. TJ stays near 80-90C against
#       a 175C max rating. At the more realistic sub-1A range, dissipation is
#       tens of mW. This is nowhere near the stakes of the heater/motor-load
#       circuit that ruled out standard-level FETs elsewhere in this project
#       tonight - the current here is an order of magnitude lower.
#     Gate drive: RAMPS pins source no DC current into a MOSFET gate (only
#       transient charging current), so there is no IR-drop load line to
#       worry about - the pin sits at its unloaded VOH, ~4.8-4.9V on a lightly
#       loaded ATmega2560 pin off a 5V rail. That is above the 4.0V worst-case
#       VGS(th), but only by ~0.9V of guaranteed margin - which is exactly
#       why "logic-level" parts exist as a separate category and why this one
#       doesn't carry a 5V spec.
#     VERDICT: fine as-is for THIS load, no mitigation needed. Revisit only
#       if a channel ever has to carry more than a few amps continuously.
#
#   IRL640 (Vishay S21-1046-Rev.D):
#     RDS(on): 0.18R (180mR) MAX, GUARANTEED, @ VGS=5.0V, ID=10A. Also
#       0.27R max @ VGS=4.0V, ID=8.5A - robust well below nominal 5V.
#     VGS(th) max 2V @ 250uA - fully enhanced far below RAMPS logic level.
#     Continuous ID: 17A @ VGS=5V, TC=25C. Qg max 66nC @ 5V. Ciss 1800pF max.
#     theta-JA: 62 C/W max - same figure as the IRFZ44N above.
#     Already carrying a comparable current (fan, "hundreds of mA") on this
#       exact machine, unheatsinked, since 2026-07-28 - see printer.cfg:110.
#     VERDICT: correctly specified for this application, nothing to check.
#
# ---------------------------------------------------------------------------
# GATE RESISTOR / PULLDOWN (HISTORICAL - describes the OLD direct-drive
# design; see the level-shifter resistor math in smoke-siren-daemon.py for
# the CURRENT circuit's gate-charge numbers, which use the 10k pull-up as
# the charging resistance instead of the RAMPS pin's ~40R source impedance)
# ---------------------------------------------------------------------------
# SERIES GATE RESISTOR: not needed, by the same math smoke-alarm.cfg's
# Option A used for the buzzer's IRLZ44N, redone here with THIS project's
# actual Ciss figures (pulled from the real datasheets above, not assumed):
#   IRFZ44N: Ciss 1470pF (VGS=0V). Charge ~= Ciss*VGS = 1470pF*5V = 7.35nC.
#     tau = Rpin(~40R) * Ciss = ~59ns. Energy = 0.5*C*V^2 = ~18.4nJ.
#   IRL640:  Ciss 1800pF max. Charge ~= 9nC. tau ~= 72ns. Energy ~= 22.5nJ.
# Both are the same order of magnitude as the IRLZ44N calc already vetted in
# smoke-alarm.cfg (Ciss ~1.7nF -> ~21nJ) and for the same reason: this is a
# sub-100ns transient, not the AVR's DC 20/40mA rating, and each pin here
# switches at most a handful of times per print (color changes at lifecycle
# events, never a PWM rate) - not the kHz-repeated case where a resistor
# would start to matter. STILL TRUE under the new circuit (tau =~ 15-18us
# through the 10k pull-up instead - see smoke-siren-daemon.py), just for a
# different reason: microsecond-scale is still nowhere near switching-rate
# territory for an event that fires a few times per print.
#
# GATE PULLDOWN: under the OLD direct-drive design this was "recommended,
# not mandatory, cosmetic stakes only" (a stray flicker during the AVR's
# own reset/bootloader window). 🔴 That verdict does NOT carry over to the
# new circuit - see the BOOT-DEFAULT WARNING at the top of this file and in
# smoke-siren-daemon.py's header. The gate is no longer pulled down by
# anything when undriven; it is pulled UP by the KSP42(TA) stage's own 10k
# resistor, so "the gate floats" is not the failure mode here at all -
# "the gate gets driven HIGH by design whenever the level-shifter's input
# is undriven" is. A naive gate-to-GND pulldown does NOT fix this (see the
# daemon header for the divider-math reason it would just add a second,
# uncertain failure mode) - no gate pulldown is used in this design, on
# purpose, not as an oversight.
#
# ---------------------------------------------------------------------------
# PINS - two SEPARATE pin sets now, logical (AVR) and physical (Orange Pi)
# ---------------------------------------------------------------------------
# 🔴 These are no longer the same three pins driving the same three gates -
# see the ARCHITECTURE CHANGE note at the top of this file. AUX-4 D23/D25/
# D27 below carry only the LOGICAL request flags between Klipper and the
# Orange-Pi daemon (via Moonraker); the ACTUAL MOSFET gates are wired to
# three Orange Pi GPIO pins instead, through the KSP42(TA) level shifter -
# full pin numbers, live gpioinfo verification, and the resistor math are
# in smoke-siren-daemon.py's header, not repeated here.
#
# AVR SIDE (this file, PURE VIRTUAL FLAGS - AUX-4 is a single-row 18-pin
# header, RepRapDiscount LCD connector, never used - the screen lives on
# the Orange Pi). Its PHYSICAL contact order, pulled straight from Marlin's
# pins_RAMPS.h header comment (not inferred):
#   5V GND D32 D47 D45 D43 D41 D39 D37 D35 D33 D31 D29 D27 D25 D23 D17 D16
# D16/PH1 is already claimed (smoke-alarm.cfg's [output_pin siren_armed]).
# D23/D25/D27 are the three contacts immediately before it - genuinely
# adjacent on the physical header, not just adjacent in a sorted pin-number
# list. D17/PH0 (RXD2, the other half of hardware Serial2 whose TXD2 half is
# D16) is deliberately left free rather than also taken, in case Serial2
# ever matters later - it costs nothing to skip since D23/D25/D27 alone are
# enough for three channels and are just as adjacent to D16's cluster. These
# three pins are UNCHANGED from the original 2026-08-06 design - only their
# JOB changed (virtual flag instead of real switch), not which physical AVR
# contacts they sit on:
#   RED REQUEST   -> D23 / PA1  -> output_pin rgb_request_r
#   GREEN REQUEST -> D25 / PA3  -> output_pin rgb_request_g
#   BLUE REQUEST  -> D27 / PA5  -> output_pin rgb_request_b
# Cross-checked against printer.cfg and every other printer-configs/*.cfg:
# no collision with TMC UART (PB0/PL0/PG1), any stepper/heater/fan pin, or
# the smoke-alarm pins (PL5/PL7/PH1).
#
# ORANGE PI SIDE (real switching - smoke-siren-daemon.py, not this file):
# sysfs gpio21/PA21 (R), gpio19/PA19 (G), gpio18/PA18 (B), each through its
# own KSP42(TA) + 10k/10k level shifter into the MOSFET gate already
# assigned to that channel above (IRL640 for R, IRFZ44N for G and B).
# Verified unclaimed live via `gpioinfo` on gpiochip0, 2026-08-07 - see the
# daemon header for the full verification note, including the honest caveat
# about physical header-pin numbers (26/27/28) being corroborated against
# this project's own already-verified pinout table rather than freshly
# re-derived this session.
#
# ---------------------------------------------------------------------------
# EVENT MODEL - one-shot lifecycle events only, no polling
# ---------------------------------------------------------------------------
# This project already found and documented the trap this design must avoid:
# a macro/timer that periodically calls SET_PIN goes through
# toolhead.register_lookahead_callback -> toolhead:sync_print_time, which
# flips idle_timeout to "Printing" - breaking both the 10-minute
# TURN_OFF_HEATERS safety net and scripts/deploy.sh's hard gate. Full
# derivation: power-loss-recovery.cfg's own header, and printer-status.md
# "Ключевая находка". This file's macros only ever get CALLED from real
# one-shot events - never from a delayed_gcode timer.
#
# REJECTED ON PURPOSE: [idle_timeout] gcode: hook. It looks like a free
# one-shot event (fires once per Idle transition) but isn't safe here: if
# its gcode calls SET_PIN, that SET_PIN bounces idle_timeout's state to
# "Printing" for ~1-1.5s before it settles back to "Ready" (never "Idle") -
# so the transition-to-Idle-and-run-gcode condition would arm again from
# scratch and could keep re-firing roughly every idle_timeout period. Small
# blast radius (a ~1.5s state blip every ~600s while sitting idle) but it is
# the SAME mechanism the project already burned time on once - not worth
# reintroducing for a cosmetic feature. RGB_OFF is reached a different way
# (see below), so this hook is simply not needed.
#
# WHAT DRIVES EACH COLOR, ALL ONE-SHOT:
#   PREPARING (yellow) -> call RGB_PREPARING once, as the very first line
#     of the future PRINT_START macro (homing + heat-up phase).
#   PRINTING (white)   -> call RGB_PRINTING once, as the LAST line of the
#     future PRINT_START macro, right before control returns to the sliced
#     gcode (i.e. once heaters are at temperature and any homing/mesh is
#     done) - so "printing" means the nozzle is actually about to extrude,
#     not "heaters requested".
#   IDLE/READY (off)   -> call RGB_OFF once, as the FIRST line of the future
#     future PRINT_END macro.
#   Neither PRINT_START nor PRINT_END exists on this machine yet - no
#     slicer profile is wired up, no print has ever completed (see
#     printer-status.md, basket C1/C3). This file does not invent placeholder
#     versions of them: a stub PRINT_START written just to hang color on
#     would collide with whatever the REAL one ends up doing (homing order,
#     bed mesh, purge). Wire RGB_PREPARING/RGB_PRINTING in at the two points
#     above when that macro actually gets written.
#   CANCEL (off)       -> ALREADY WIRED, no new hook needed. mainsail.cfg's
#     CANCEL_PRINT (already live, printer.cfg includes mainsail.cfg) has a
#     documented, upstream-sanctioned single-line extension point:
#     variable_user_cancel_macro on [gcode_macro _CLIENT_VARIABLE]
#     (mainsail.cfg:47, "executed before CANCEL_PRINT_BASE"). Defined below.
#     This is why CANCEL_PRINT does not need mainsail.cfg touched or a
#     second rename_existing chain on top of its own.
#   PAUSE/RESUME       -> deliberately NOT hooked. Mid-print pause leaves the
#     strip on "printing" white, which keeps illuminating the work area for
#     whoever is fixing the pause - a reasonable default, not an oversight.
#     mainsail.cfg exposes the same single-line hooks
#     (user_pause_macro/user_resume_macro) if this is ever wanted later.
#   ERROR/FIRE (red blink) -> 🔴 REWRITTEN 2026-08-07, mechanism is now
#     COMPLETELY DIFFERENT from what this bullet used to say. It used to
#     read: "shutdown_value: 1 on rgb_red is applied by the MCU firmware
#     itself (digital_out_shutdown()) on any invoke_shutdown, independent
#     of gcode/toolhead/the host." That described the OLD direct-drive
#     circuit and is FALSE for the physical strip now - rgb_request_r's
#     shutdown_value is 0 (see below), and even if it were 1, this AVR pin
#     no longer drives anything physical at all (see ARCHITECTURE CHANGE at
#     the top of this file). The MCU-side latch is gone; there is nothing
#     downstream of it to latch anymore.
#     The REAL mechanism now: smoke-siren-daemon.py's alarm_source() -
#     the SAME independent, already-proven-live (2026-08-06) detection the
#     siren uses, polling Moonraker directly, NOT touching this AVR pin at
#     all. When it fires, the daemon blinks RED at the same cadence as the
#     siren and forces GREEN/BLUE off, overriding whatever color was
#     requested, unconditionally - see the daemon header's "FIRE ALARM
#     OVERRIDE" section for the exact logic. This inherits every property
#     alarm_source() already has: independent of klippy hanging, immune to
#     the post-shutdown gcode whitelist, degrades safely on a Moonraker
#     outage. It does NOT depend on rgb_request_r's value at all - a real
#     SMOKE_ALARM lights the strip red even if the LAST requested color
#     before the alarm was, for whatever reason, never successfully
#     mirrored.
#     UNVERIFIED as of this rewrite: whether printer['output_pin
#     rgb_request_r'].value would even read back anything meaningful during
#     a real invoke_shutdown (klippy's own status cache behavior in that
#     state was not tested this session) - moot for the actual light, since
#     the daemon never looks at this flag during an alarm, but worth
#     knowing so nobody builds a UI indicator on top of this flag expecting
#     it to reflect the fire state. It does not.
#
# ---------------------------------------------------------------------------
# STRIP SUPPLY - spec provided by the user 2026-08-06 (was the one open item)
# ---------------------------------------------------------------------------
# Strip: 12V, 14.4W/m, THREE separate 350mm segments (not one continuous
# roll) = 1.05m combined length. Full numbers and the parallel-wiring plan
# for the three segments: docs/printer-status.md, "Питание самой ленты".
# Quick current check (worst case, full white, all 3 channels at once):
#   14.4W/m * 1.05m = 15.12W total. At 12V: 15.12/12 = 1.26A combined,
#   ~0.42A per channel typical - one to two orders of magnitude under both
#   MOSFETs' continuous rating (tens of amps). Never in real doubt, now
#   backed by an actual number instead of "probably fine".
#
# Low-side switching: strip V+ comes from ITS OWN supply rail, common GND
# with RAMPS - each MOSFET only switches the strip's return path to GND.
# 12V strip means the existing 12V rail (fans, RAMPS logic) covers it - no
# second supply needed. (This comment used to carry a 24V branch for an
# unknown strip; moot now - the strip is 12V.)
#
# THREE PHYSICAL SEGMENTS, WIRED IN PARALLEL: the user has three 350mm
# pieces on hand, not one 1.05m roll. Series wiring would need 3*12V=36V,
# which does not exist on this machine, so parallel is the only workable
# topology at 12V - same-color wires (V+/R/G/B) from all three segments
# join into one bus per channel, and each bus lands on the one MOSFET
# already assigned to that channel (IRL640 for R, IRFZ44N for G and B - see
# "MOSFET CHOICE AND CHANNEL ASSIGNMENT" above; those gates are wired to the
# Orange Pi level-shifter now, NOT to D23/D25/D27 - see PINS above). Per-
# channel current is the SUM across the three segments (~0.42A total, not
# per segment) - matches the combined figure above, nothing to re-derive at
# wiring time.
#
# Purchase/price for the strip is not confirmed - not tracked here, see
# docs/purchases.md.
#
# ---------------------------------------------------------------------------
# [output_pin] sections - PURE VIRTUAL REQUEST FLAGS as of 2026-08-07 (see
# ARCHITECTURE CHANGE at the top of this file). Same AUX-4 pins as the
# original 2026-08-06 design, same siren_armed pattern from smoke-alarm.cfg
# - nothing physically wired to PA1/PA3/PA5, and pwm left at its default
# (False, plain on/off): the three colors this design needs (yellow=R+G,
# white=R+G+B, red-only) are pure on/off combinations - no dimming
# required. If mixed colors read wrong on the actual strip once wired (full
# R+G often skews greenish on cheap analog strips, full R+G+B is rarely a
# clean white), the fix is `pwm: True` here PLUS the daemon's set_on() would
# need a matching PWM-aware rewrite - cheap to add later, not built in now.
# shutdown_value is 0 on ALL THREE now, including red - see the rewritten
# ERROR/FIRE bullet in EVENT MODEL above for why the old "red latches on
# shutdown" reasoning no longer applies to this flag.
# ---------------------------------------------------------------------------
[output_pin rgb_request_r]
pin: PA1                    # AUX-4, contact labelled D23. Virtual flag only
                            # - the real RED MOSFET gate (IRL640) is wired to
                            # Orange Pi gpio21/PA21 via the KSP42(TA) level
                            # shifter, not to this pin. See PINS above.
value: 0                    # dark at every normal startup, matches the rest
                            # of this project's output_pin defaults.
shutdown_value: 0           # No longer 1 - this pin drives nothing physical
                            # to latch. The real fire response is
                            # smoke-siren-daemon.py's independent
                            # alarm_source() override - see EVENT MODEL.

[output_pin rgb_request_g]
pin: PA3                    # AUX-4, contact labelled D25. Virtual flag only
                            # - real GREEN gate (IRFZ44N) is Orange Pi
                            # gpio19/PA19 via the level shifter.
value: 0
shutdown_value: 0

[output_pin rgb_request_b]
pin: PA5                    # AUX-4, contact labelled D27. Virtual flag only
                            # - real BLUE gate (IRFZ44N) is Orange Pi
                            # gpio18/PA18 via the level shifter.
value: 0
shutdown_value: 0

[gcode_macro RGB_OFF]
description: Request all channels off. Call once at print end/cancel, or any time by hand. Mirrored onto the real strip by smoke-siren-daemon.py within ~1s.
gcode:
    SET_PIN PIN=rgb_request_r VALUE=0
    SET_PIN PIN=rgb_request_g VALUE=0
    SET_PIN PIN=rgb_request_b VALUE=0

[gcode_macro RGB_PREPARING]
description: Request yellow (R+G) - homing/heating before a print. Call once, first line of the future PRINT_START.
gcode:
    SET_PIN PIN=rgb_request_r VALUE=1
    SET_PIN PIN=rgb_request_g VALUE=1
    SET_PIN PIN=rgb_request_b VALUE=0

[gcode_macro RGB_PRINTING]
description: Request white (R+G+B), plain illumination for the webcam. Call once, last line of the future PRINT_START.
gcode:
    SET_PIN PIN=rgb_request_r VALUE=1
    SET_PIN PIN=rgb_request_g VALUE=1
    SET_PIN PIN=rgb_request_b VALUE=1

[gcode_macro RGB_STATUS]
description: Report the current REQUESTED value of all three channels (what Klipper is asking for, not necessarily the physical strip - see fire-alarm override in smoke-siren-daemon.py, which can override this without touching these flags at all)
gcode:
    RESPOND MSG="{'requested R=%s G=%s B=%s (see smoke-siren-daemon.py journal for the actual physical state, and note the fire-alarm override does not update these flags)' % (printer['output_pin rgb_request_r'].value, printer['output_pin rgb_request_g'].value, printer['output_pin rgb_request_b'].value)}"

# ---------------------------------------------------------------------------
# CANCEL_PRINT hook - the documented mainsail.cfg extension point, not a
# rename_existing chain on top of mainsail.cfg's own.
# ---------------------------------------------------------------------------
# mainsail.cfg's own header (lines 9-12, 42-47) says to copy this whole
# section into your config and edit only what you need; every client.* field
# it reads is wrapped in |default(...), so copying the full template (rather
# than declaring only user_cancel_macro) matches the documented usage and
# avoids relying on how Jinja treats a partially-declared _CLIENT_VARIABLE -
# not verified against Klipper's actual jinja2 Undefined behaviour in this
# session, so not worth being clever about.
# Only user_cancel_macro is changed from the template default (""); every
# other field is copied verbatim from mainsail.cfg's commented block.
# NOTE ON INCLUDE ORDER: printer['gcode_macro _CLIENT_VARIABLE'] is resolved
# by CANCEL_PRINT at the moment it RUNS, after the whole config has already
# loaded - so this should work regardless of whether this file is included
# before or after mainsail.cfg (reasoned from how Klipper macros look up
# other objects, not re-verified against source in this session - sanity
# check with a live CANCEL_PRINT call once this is actually wired).
# WHAT MATTERS: mainsail.cfg's own [gcode_macro _CLIENT_VARIABLE] template
# stays commented-out (it is, today - confirmed 2026-08-06). Two ACTIVE
# sections with this same name would collide. If that template ever gets
# uncommented for some other reason, merge the two, do not stack them.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 0.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 0.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: "RGB_OFF" ; turn the strip off when a print is cancelled - the only line changed from the template
gcode:
