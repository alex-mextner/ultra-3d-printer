# ---------------------------------------------------------------------------
# HOTEND HEATSINK FAN - D9/PH6. This is the SAME PHYSICAL FAN that used to be
# declared as [fan] (part cooling) in printer.cfg. No wire moved; only what
# Klipper believes about it changed, on 2026-08-17.
# ---------------------------------------------------------------------------
#
# WHY THIS FILE EXISTS. User, verbatim:
#   «а еще похоже радиатор хотэнда все же перегревается без обдува. дует на
#    него кулер обдува детали. на деталь он особо и не попадает. давай сделаем
#    так чтобы он работал когда сопло греется или остывает и отключается
#    только когда сопло холоднее процессора оранжа»
#
# The bug that was live until this file was written, stated plainly: the fan
# on D9 physically blows at the HOTEND HEATSINK, but Klipper had it declared
# as [fan] - the part-cooling fan the slicer drives with M106/M107. So every
# time the slicer decided "no part cooling needed" (the whole first layer, all
# of a PETG/ABS job, every M107 in machine_end_gcode) the heatsink lost its
# airflow while the hot end was still at 200-240C. That is the textbook heat
# creep setup: heat climbs the heatbreak, filament softens ABOVE the melt
# zone, swells, and jams. It is a functional failure, not a surface-finish
# one, which is why it was fixed the same day it was reported rather than
# queued in docs/tasks.md.
#
# This machine has NO separate part-cooling fan at all right now (user, same
# day: «для обдува детали надо запланировать отдельный куллер. но это уже
# позже») - see docs/tasks.md for the planned one and what pin/switch it needs.
# Until that exists, D9 is a heatsink fan and nothing else, and M106/M107 have
# nothing to drive (see the stubs at the bottom of this file).
#
# 🔴 READ THIS FIRST IF YOU ARE HERE TO FIT A REAL PART-COOLING FAN:
#    this file defines [gcode_macro M106] and [gcode_macro M107] as no-op
#    stubs. DELETE BOTH, in the same commit that adds the [fan] section back.
#    Leave them in and every slicer M106 keeps vanishing into a stub while the
#    new fan never spins. Klipper will not let you ship that quietly - it
#    refuses to start with "gcode command M106 already registered" - but you
#    will be reading this before you get there. Full checklist, including the
#    D9 <-> new-pin swap this is supposed to be part of: docs/tasks.md, H10.
#
# HISTORICAL NOTE, so nobody thinks this contradicts an earlier decision:
# printer.cfg's [controller_fan extruder_motor_fan] comment and printer-
# status.md ("Охлаждение хотэнда — принятое решение (2026-07-29)") both say
# this build deliberately ships WITHOUT heatbreak cooling, betting on an
# oversized passive heatsink, and that the bet would be re-examined "IF
# HEAT-CREEP JAMS APPEAR". That re-examination is exactly what happened: the
# user reports the heatsink overheating without airflow. The old plan's own
# escape hatch said to add a SEPARATE fan on a SEPARATE pin as
# [heater_fan heatbreak_fan]; reality turned out cheaper - the fan is already
# physically pointed at the heatsink, so only the config was wrong.
#
# ---------------------------------------------------------------------------
# WHY [temperature_fan] AND NOT THE OBVIOUS [heater_fan]
# ---------------------------------------------------------------------------
# [heater_fan] is the stock mechanism for exactly this job and it was the
# first candidate. Its logic, read on THIS machine 2026-08-17 (~/klipper/
# klippy/extras/heater_fan.py, Klipper v0.13.0-708-g7046bd00 - note the file
# no longer has the idle_timeout/idle_speed options older docs mention):
#
#     if target_temp or current_temp > self.heater_temp:  speed = fan_speed
#
# i.e. "on while the heater has a target, or while it is hotter than a FIXED
# constant". That constant is the whole problem: the user did not ask for a
# constant, he asked for the fan to stop only when the nozzle is colder than
# the Orange Pi's CPU. That is a better rule than any constant, and not a
# gimmick - the H3's die temperature is a decent proxy for the air temperature
# inside this enclosure, so "nozzle below CPU" means "the nozzle is at ambient,
# there is no heat left to creep anywhere". A hardcoded 50C is wrong in both
# directions: it runs the fan pointlessly on a hot summer evening when ambient
# is already 45C, and it stops the fan at 49C on a cold morning when ambient
# is 18C and there are still 30 degrees of heat to move.
#
# [temperature_fan] gives a target that CAN be moved at runtime
# (SET_TEMPERATURE_FAN_TARGET), so the CPU comparison is expressible: point
# the fan's sensor at the nozzle, and drive its target from CPU temperature.
#
# HOW THE NOZZLE TEMPERATURE GETS IN WITHOUT A SECOND THERMISTOR: it is NOT
# legal to repeat [extruder]'s sensor_pin (PK5) here - Klipper refuses a pin
# claimed twice (pins.py: "pin %s used multiple times in config") and this
# project's own linter has that as check #4. The supported path is
# sensor_type: temperature_combined, verified by reading ~/klipper/klippy/
# extras/temperature_combined.py on the printer 2026-08-17: it registers
# itself as a SENSOR FACTORY (pheaters.add_sensor_factory("temperature_
# combined", ...)), so any section that takes a sensor_type can use it, and it
# reads its inputs by OBJECT NAME through get_status()['temperature'] - no ADC,
# no pin, no conflict. sensor_list: extruder therefore means "read whatever
# [extruder] is already reading", one thermistor, two consumers. Same
# mechanism docs/tasks.md H9 plans to use for the bed-cooling fan.
#
# ---------------------------------------------------------------------------
# 🔴 WHAT SURVIVES A BROKEN SUPERVISOR - read this before "simplifying"
# ---------------------------------------------------------------------------
# The design splits cleanly in two, and only the harmless half depends on the
# macro below:
#
#   SAFETY HALF (hot nozzle -> fan ON): pure [temperature_fan] behaviour. It
#   runs inside Klipper's own sensor callback (temperature_fan.py
#   temperature_callback -> ControlBangBang), on the sensor's report clock,
#   with NO gcode and NO macro involved. If _hotend_fan_supervisor below dies,
#   errors every tick, or is deleted outright, this half keeps working against
#   whatever target was last set - and if the supervisor never ran at all, the
#   static target_temp: 40 in this file applies, which is simply the
#   [heater_fan heater_temp: 40] behaviour we would have had anyway. Heat
#   creep protection is therefore NOT macro-dependent.
#
#   REFINEMENT HALF (the CPU comparison, and forcing the fan on during warm-up
#   from cold): that is the supervisor. If it stops, the fan reverts to a
#   fixed-threshold fan. The one behaviour genuinely lost is "blow while
#   heating from BELOW ambient" - a window in which, by definition, there is
#   no heat above ambient to move anywhere.
#
# So: the macro is an improvement layered on a mechanism that is already
# correct, not a load-bearing part of the safety story.
# ---------------------------------------------------------------------------

[temperature_fan hotend_fan]
pin: PH6                    # RAMPS D9 - a real onboard MOSFET output, drives a
                            # fan directly, no external switch. Unchanged from
                            # when this pin was [fan]; the wire was not touched.
shutdown_speed: 1.0         # FAIL-SAFE, and the single most important line in
                            # this file. Klipper going to shutdown with a hot
                            # nozzle (verify_heater trip, M112, lost MCU comms,
                            # a host-side exception) is precisely the moment
                            # heat creep happens unattended: heaters die, the
                            # hotend sits at 240C, and nothing is left running
                            # to command a fan. Written into MCU FIRMWARE via
                            # gpiocmds.c digital_out_shutdown() (fan.py:
                            # mcu_fan.setup_start_value(0., shutdown_power)),
                            # so it does not need a live host, only a live MCU.
                            # Set EXPLICITLY although 1.0 is already
                            # temperature_fan's default (fan.py: Fan(config,
                            # default_shutdown_speed=1.)) - a future edit that
                            # changes this section's TYPE (e.g. to fan_generic,
                            # default 0) must not silently drop the fail-safe.
                            # See the "TWO THINGS THIS FAIL-SAFE DOES NOT
                            # COVER" note at the bottom - one of them is a
                            # deliberate, disclosed regression against
                            # smoke-alarm.cfg.
sensor_type: temperature_combined
sensor_list: extruder       # The nozzle, read through [extruder]'s existing
                            # thermistor. See the long note above for why this
                            # is not a second reader of PK5.
combination_method: max     # Required option, no default. With one sensor in
                            # the list every method (min/max/mean) is the same
                            # value; max is written because it is the correct
                            # choice for the day someone adds a second sensor.
maximum_deviation: 999.9    # Required option, no default, must be > 0. It
                            # guards "two sensors that should agree have
                            # drifted apart" by calling invoke_shutdown().
                            # With ONE sensor max(values)-min(values) is
                            # identically 0, so this can never fire; 999.9 says
                            # "deliberately inert" instead of pretending to be
                            # a real limit. If a second sensor is ever added to
                            # sensor_list, this MUST be re-chosen as a real
                            # number - it becomes a shutdown trigger.
min_temp: 0                 # 🔴 MUST NOT BE RAISED ABOVE 0, and not for the
                            # usual reason. temperature_combined starts with
                            # last_temp = 0.0 and only overwrites it `if temp:`
                            # (i.e. a zero reading is ignored, not stored),
                            # while its update timer unconditionally calls
                            # invoke_shutdown() when last_temp < min_temp. With
                            # min_temp: 5 a single startup tick before the
                            # extruder sensor is live would shut Klipper down
                            # on "COMBINED SENSOR temperature 0.0 below
                            # minimum". 0 makes that comparison false. Verified
                            # in temperature_combined.py on this printer.
max_temp: 350               # MUST stay above [extruder] max_temp (300), for
                            # the mirror-image reason: the same timer shuts
                            # Klipper down when the combined reading exceeds
                            # this. A nozzle legitimately at 290C must not trip
                            # the fan's sensor. 50C of headroom over the
                            # extruder's own ceiling, which fires first and is
                            # the real limit.
min_speed: 0.0              # Not a speed the fan ever runs at under watermark
                            # (whose only outputs are 0 and max_speed) - it is
                            # the FLOOR set_tf_speed() clamps nonzero requests
                            # to, default 0.3. Set to 0 so the supervisor is
                            # free to lower MAX_SPEED below 0.3 if a future
                            # measurement calls for it; with the default,
                            # SET_TEMPERATURE_FAN_TARGET would refuse
                            # ("min speed greater than max speed").
max_speed: 0.25             # 🔴 NOT COSMETIC, AND NOT A NOISE PREFERENCE -
                            # MEASURED. At the default 1.0 this machine CANNOT
                            # REACH PRINTING TEMPERATURE. Live evidence,
                            # 2026-08-17, minutes after this file first
                            # deployed: with the fan at 100% the user asked for
                            # 240C, the nozzle climbed to ~215C with heater
                            # power pinned at 1.0 (i.e. saturated, nothing left
                            # to give), stalled there, and [verify_heater]'s
                            # default check (gain >= 2C per 20s while heating)
                            # correctly shut Klipper down: "Heater extruder not
                            # heating at expected rate". Same fan at 100% DID
                            # reach 200C ten minutes earlier - so ~215C is
                            # simply where this 12V cartridge's output equals
                            # the heat this fan removes.
                            # WHY IT HAPPENS: the fan is a bare part-cooling
                            # fan pointed at the heatsink with NO SHROUD, so a
                            # large share of its air spills over the heater
                            # block itself. A proper hotend fan blows only
                            # through the fins and can sit at 100% forever.
                            # WHY 0.6: heat loss scales with the transfer
                            # coefficient, which goes roughly as airflow^0.5-
                            # 0.8. Losses at 100% put the ceiling at ~215C
                            # (dT~190K over ambient); dropping airflow to 0.6
                            # buys back ~25% of that, i.e. a ceiling near 280C,
                            # which clears 240-260C printing with margin
                            # instead of just barely. THAT ESTIMATE WAS WRONG,
                            # and the measured numbers replace it - see the
                            # table below. This value is now the HEATING-TIME
                            # speed only; the supervisor raises it to 1.0
                            # whenever no heater is competing (cooldown), which
                            # is when heat creep actually matters most anyway.
                            #
                            # MEASURED CEILINGS on this machine, 2026-08-17,
                            # target 240C each time, heater saturated at
                            # power 1.0 and temperature stalled:
                            #     fan 100%  -> stalls ~215C  (verify_heater trip)
                            #     fan  60%  -> stalls ~225C  (verify_heater trip)
                            #     fan   0%  -> held 238.4C at target 240 earlier
                            #                  the same day, i.e. ~1.6C short
                            # 🔴 READ THAT LAST ROW CAREFULLY: with NO fan at
                            # all this hotend only just makes 240. It was
                            # already at its thermal limit BEFORE this file
                            # existed. So there is no fan speed that both
                            # protects the heatsink and restores a comfortable
                            # 240C - only a trade, which is why the speed is
                            # now split by phase instead of being one number.
                            # The heater is the real constraint: from the
                            # observed ramp (28->201C in ~180s over a block of
                            # roughly 15-20 J/K) it delivers on the order of
                            # 25-30W, not the 40W a modern hotend assumes. Its
                            # wattage is NOT recorded anywhere (docs/bom.md
                            # says only "12V, came with the mbot"); measuring
                            # coil resistance settles it (P = 144 / R) and is
                            # a one-multimeter job for the user.
                            # WHAT IS NOT LOST: 40% of full airflow is still
                            # continuous forced convection on a heatsink that
                            # had NONE at all until today, which is the entire
                            # point of this file, and cooldown - the phase with
                            # the most creep risk and no heater to fight - runs
                            # at 100%.
                            # THE REAL FIXES ARE MECHANICAL, both cheap:
                            #  1. the silicone sock for the heater block, which
                            #     docs/bom.md says is already BOUGHT (fitting
                            #     unconfirmed). It is the standard cure for
                            #     exactly this symptom - it stops fan air from
                            #     stealing heat off the block - and would
                            #     likely give back more than any fan setting.
                            #  2. a duct/shroud so this fan's air goes THROUGH
                            #     the fins instead of spilling over the block;
                            #     belongs with the part-fan work, tasks.md H10.
                            # ALSO WORTH KNOWING: [extruder]'s PID constants
                            # were calibrated with NO airflow over the block.
                            # They now run against a constant extra heat loss.
                            # PID_CALIBRATE HEATER=extruder is worth re-running
                            # with this fan live before trusting hold stability
                            # at high temperatures (docs/calibration-plan.md).
                            # kick_start_time is left at fan.py's 0.1s default
                            # and now actually matters: below 1.0 the fan needs
                            # that full-power kick to start turning.
control: watermark          # Bang-bang. Same reasoning as electronics-fan.cfg:
                            # PID's floor (min_speed, default 0.3) would keep
                            # the fan spinning forever, and Klipper has no
                            # PID_CALIBRATE for temperature_fan anyway. Under
                            # watermark the only two outputs are 0 and the
                            # CURRENT max_speed - which is exactly why the
                            # supervisor steers max_speed rather than trying to
                            # command a speed directly (it could not: there is
                            # no speed command that does not go through the
                            # forbidden toolhead path).
target_temp: 40             # FALLBACK ONLY - the supervisor below overwrites
                            # this within ~12s of every restart with the live
                            # CPU temperature. It is what protects the machine
                            # if the supervisor never runs at all (see "WHAT
                            # SURVIVES A BROKEN SUPERVISOR" above), so it is
                            # set to a deliberately conservative value: 40C is
                            # below any plausible enclosure ambient, so a
                            # supervisor-less machine errs towards running the
                            # fan too much, never too little.
max_delta: 2.0              # Hysteresis around the target: ON at target+2,
                            # OFF at target-2 (ControlBangBang.temperature_
                            # callback, read on this printer - note the sense
                            # is inverted vs a heater, a temperature_fan blows
                            # when it is ABOVE target). Deliberately narrow:
                            # unlike the electronics bay, this reading does not
                            # wobble with CPU load, and the whole point is to
                            # follow the nozzle closely. 2C also means the
                            # user's rule reads honestly - the fan stops when
                            # the nozzle is 2C BELOW the CPU, i.e. genuinely
                            # "холоднее процессора".

# ---------------------------------------------------------------------------
# Supervisor: makes the OFF threshold track the Orange Pi's CPU temperature
# instead of being a constant, and forces the fan on while the hotend is
# heating. Same idiom, same restrictions and the same reasoning as
# _elec_fan_supervisor in electronics-fan.cfg - read that file's "Why polling
# this macro on a timer does NOT corrupt idle_timeout" section before touching
# this one. Short version of the project rule it obeys:
#
#   📌 A supervisor macro over a fan may call SET_TEMPERATURE_FAN_TARGET and
#      NOTHING else that touches gcode/toolhead. Never SET_FAN_SPEED, never
#      SET_PIN, never M106 - those go through
#      GCodeRequestQueue.queue_gcode_request() -> toolhead.register_lookahead_
#      callback(), which on an idle machine fires "toolhead:sync_print_time",
#      which idle_timeout reads as PRINTING. Polling that every 5s would (a)
#      stop TURN_OFF_HEATERS from ever firing on this 1000W-bed machine and
#      (b) make scripts/deploy.sh's "not printing" gate fail at random.
# ---------------------------------------------------------------------------
[delayed_gcode _hotend_fan_supervisor]
initial_duration: 12        # 12, not 10, purely to not fire in the same
                            # instant as _elec_fan_supervisor on every restart.
gcode:
    # RESCHEDULE FIRST, AND NOTHING ELSE BEFORE IT - if anything below ever
    # raises (a bad printer.* lookup after a future rename), the next tick is
    # already queued and the loop survives. Same rule as _elec_fan_supervisor;
    # the failure it prevents is a supervisor that dies silently forever.
    UPDATE_DELAYED_GCODE ID=_hotend_fan_supervisor DURATION=5
    {% set cpu = printer['temperature_sensor OrangePi_CPU'].temperature|float %}
    {% set tf = printer['temperature_fan hotend_fan'] %}
    # HEATING -> force the fan on outright, do not wait for the nozzle to
    # climb past ambient. This is the "работает когда сопло греется" half of
    # the request. TARGET=5 and never TARGET=0: temperature_fan.py's
    # set_tf_speed() reads `if self.target_temp <= 0.: value = 0.`, so zero
    # means OFF, the exact opposite of "force on" (verified on this printer,
    # same trap electronics-fan.cfg documents).
    #
    # COOLING / IDLE -> target = CPU temperature, clamped:
    #   lower bound 5   - never let a bogus 0.0 reading (sensor not yet live)
    #                     turn into target 0, i.e. into "fan off". Clamping low
    #                     always errs towards MORE airflow.
    #   upper bound 60  - bounds the opposite failure, a wildly high CPU
    #                     reading switching the fan off with a genuinely warm
    #                     nozzle. Above 60C ambient nothing about this machine
    #                     is normal anyway, and [temperature_sensor
    #                     OrangePi_CPU] max_temp: 90 shuts Klipper down before
    #                     the reading could go higher than that.
    {% set heating = printer.extruder.target > 0 %}
    {% set want = 5.0 if heating else [[cpu, 5.0]|max, 60.0]|min %}
    # ---------------------------------------------------------------------
    # SPEED IS SPLIT BY PHASE, and this is the part that keeps the machine
    # able to print at all. Measured 2026-08-17 (numbers and the whole story
    # in the max_speed comment above): airflow over this un-shrouded hotend
    # steals enough heat from the BLOCK, not just the fins, that at 100% the
    # hotend stalls at ~215C and at 60% at ~225C, tripping verify_heater
    # before it can reach PETG temperature. But that competition only exists
    # while a heater is actually driving. So:
    #   heater target > 0  (warm-up and holding) -> the configured max_speed,
    #       deliberately low, just enough to keep the fins swept while the
    #       cartridge does its work.
    #   heater target == 0 (cooldown, the phase with the MOST heat-creep risk
    #       and nothing to fight) -> 100%, full protection, free.
    # Read the heating-phase number from the CONFIG FILE, never a literal
    # copied here: retuning it must mean editing max_speed above and nothing
    # else. Exactly the reason _elec_fan_supervisor reads its idle target from
    # printer.configfile.settings instead of a hardcoded 60.
    # 🔴 TARGET is sent on the SAME command on purpose: cmd_SET_TEMPERATURE_
    # FAN_TARGET does `temp = gcmd.get_float('TARGET', self.target_temp_conf)`,
    # so a MAX_SPEED-only call would silently SLAM THE TARGET BACK to the
    # config's 40 and undo the CPU tracking. Never split these two.
    {% set heat_speed = printer.configfile.settings['temperature_fan hotend_fan']['max_speed'] %}
    {% set want_speed = heat_speed if heating else 1.0 %}
    # Deadband on the RESEND, not on the fan: CPU temperature jitters by a
    # degree constantly and there is no point re-sending an identical target
    # every 5 seconds. The fan's own hysteresis is max_delta above; this 1.0
    # only decides whether the target is worth updating. The speed half has no
    # deadband - it only ever takes two values, so "differs at all" is the
    # right test, and MAX_SPEED must ride along on any command that is sent
    # anyway (see the 🔴 above about TARGET defaulting).
    # NOTE on the second test: tf.speed is the fan's LIVE speed, not its cap -
    # temperature_fan's get_status() exposes speed/rpm/temperature/target and
    # no max_speed, so the cap cannot be read back. Hence the guard tf.speed >
    # 0.01: while the fan is legitimately stopped, 0.0 must not read as "wrong
    # speed" and retrigger every 5s. Correctness does not rest on this test at
    # all - every phase change also changes `want` (5 vs CPU), so the first
    # test fires and carries the right MAX_SPEED along. This one only
    # self-heals a cap changed behind the macro's back, e.g. by hand.
    {% if (want - tf.target)|abs > 1.0
          or (tf.speed > 0.01 and (want_speed - tf.speed)|abs > 0.01) %}
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=hotend_fan TARGET={want|round(1)} MAX_SPEED={want_speed}
    {% endif %}
    #
    # ⚠️ KNOWN INTERACTION BEFORE YOU TEST BY HAND, identical to the one
    # electronics-fan.cfg warns about: this macro re-asserts the target every
    # 5 seconds, so a SET_TEMPERATURE_FAN_TARGET typed by hand (or a target
    # dragged in Mainsail's UI) IS REVERTED within 5 seconds. That is the
    # macro working, not a dead fan. To test manually, first cancel the timer
    # with `UPDATE_DELAYED_GCODE ID=_hotend_fan_supervisor DURATION=0` (0
    # cancels, it does NOT fire immediately), then set what you like, then
    # re-arm with DURATION=5 or just FIRMWARE_RESTART.
    #
    # The honest test that needs no fiddling: with the nozzle cooling down,
    # watch `temperature_fan hotend_fan`.target in Mainsail - it should sit
    # within a degree of OrangePi_CPU.temperature and MOVE as the CPU drifts.
    # If it is pinned at 40, the supervisor is not running and this is a
    # constant-threshold fan.

# ---------------------------------------------------------------------------
# M106 / M107 - what happened to the slicer's fan commands
# ---------------------------------------------------------------------------
# Removing [fan] removes the only section that registers M106/M107. Klipper's
# behaviour without them was read on this machine before deciding anything
# (~/klipper/klippy/gcode.py, cmd_default):
#
#     elif cmd == 'M107' or (cmd == 'M106' and (
#             not gcmd.get_float('S', 1.) or self.is_fileinput)):
#         # Don't warn about requests to turn off fan when fan not present
#         return
#     gcmd.respond_info('Unknown command:"%s"' % (cmd,))
#
# Two facts follow, and they decided the design:
#   1. NOTHING ABORTS. Unknown commands are respond_info, not an exception -
#      no print is interrupted either way. (is_fileinput is klippy's -i debug
#      batch mode, NOT virtual_sdcard printing - do not misread that branch.)
#   2. M107 and M106 S0 are ALREADY silently swallowed. So every existing
#      shutdown-shaped call in this config keeps working untouched:
#      print-start-end.cfg PRINT_END's `M106 S0`, its _PRINT_CANCEL_CLEANUP
#      `M107`, mainsail.cfg CANCEL_PRINT's `M106 S0`, smoke-alarm.cfg
#      SMOKE_ALARM's `M107`, power-loss-recovery.cfg's `M107`. None of them
#      needed editing and none were edited.
#
# The only thing left is M106 with a POSITIVE speed - the slicer's real fan
# commands and power-loss-recovery.cfg's `M106 S{...}` on resume. Those would
# print 'Unknown command:"M106"' into the console, dozens of times per print.
# Hence these two stubs: silent no-ops, purely to keep the console readable.
# They change no behaviour that was not already a no-op.
#
# 🔴 IF A REAL PART-COOLING FAN IS EVER ADDED (docs/tasks.md has the plan and
# the pin), DELETE BOTH STUBS in the same commit that adds the [fan] /
# [fan_generic] section. This is not a silent trap: gcode.py's
# register_command() raises "gcode command M106 already registered" as a
# CONFIG ERROR at startup, so Klipper refuses to start and deploy.sh's
# wait-for-ready fails loudly. Loud is the point - it was chosen over
# rename_existing games precisely so nobody can half-add a part fan and have
# the slicer's M106 keep vanishing into a stub.
#
# Also gone with [fan]: the `printer.fan` object and Mainsail's part-fan
# slider. power-loss-recovery.cfg was already written defensively for this
# (`printer.fan.speed if 'fan' in printer else 0`, line 261) - it records a 0
# and replays a harmless `M106 S0`, nothing to fix. Mainsail now shows the
# hotend fan as a temperature-fan card instead, with a target you can drag but
# that the supervisor will pull straight back (see the warning above).
# ---------------------------------------------------------------------------

[gcode_macro M106]
description: No-op. This machine has no part-cooling fan - D9 blows on the hotend heatsink and is now [temperature_fan hotend_fan]. Swallows slicer fan commands so they neither error nor spam the console.
gcode:
    # Deliberately renders to nothing at all. The {% set %} exists so this
    # option is never an empty string in the config file, and it also documents
    # what is being thrown away: params.S, the requested part-fan speed.
    {% set _discarded_speed = params.S|default(0) %}

[gcode_macro M107]
description: No-op, pair of the M106 stub above. Klipper already ignores M107 when no fan section exists; this only keeps the two commands symmetric.
gcode:
    {% set _no_part_fan = True %}

# ---------------------------------------------------------------------------
# TWO THINGS THIS FAIL-SAFE DOES NOT COVER - both disclosed, neither an
# oversight.
# ---------------------------------------------------------------------------
# 1. MCU NOT RUNNING FIRMWARE. shutdown_speed lives in MCU firmware, so it
#    covers "host/Klipper died, Mega alive" (the common case) but NOT a Mega
#    reset or a power cut. On D9 that gap CANNOT be closed in hardware the way
#    it could on a homemade switch: printer-status.md, "Почему НЕ отдать D9
#    вентилятору электроники", point 3 - the onboard MOSFET has its own gate
#    pull-DOWN, so an undriven pin means fan OFF, always. Note that opening the
#    serial port toggles DTR and resets the Mega, which happens on EVERY
#    scripts/deploy.sh run: deploying with a hot nozzle gives a few seconds of
#    unfanned heatsink. Bounded and acceptable - this machine ran with NO
#    heatsink fan at all until today - but worth knowing.
#
# 2. 🔴 SMOKE ALARM: this change removes a fire-safety behaviour. It was put to
#    the machine's owner the same day and DECIDED BY HIM - see the ✅ at the
#    end of this item; it is settled, not an open question left for the next
#    session. smoke-alarm.cfg's SMOKE_ALARM does `M107  # part fan OFF - do not
#    blow air onto a fire` and then emergency-stops. As of this file:
#      - that M107 no longer stops this fan (it hits the stub above; it hit
#        gcode.py's silent-ignore branch even without the stub), AND
#      - shutdown_speed: 1.0 means invoke_shutdown drives PH6 to 100%, so on a
#        fire alarm this fan now blows AT FULL SPEED, at the hotend.
#    That line was written when D9 was believed to blow on the printed PART.
#    It now aims at the hotend heatsink, so the trade-off changed shape, and
#    the two goals are in genuine conflict: heat-creep protection wants the
#    fan on during every shutdown, fire response wants it off during one kind
#    of shutdown. shutdown_speed: 1.0 was chosen because the heat-creep case is
#    the dominant, frequent one and the fire case has its own siren, its own
#    estop and a human; but this is a real regression against a rule this
#    project wrote down on purpose.
#    ✅ DECIDED BY THE OWNER, 2026-08-17, verbatim: «ничего физически я пока
#    менять не буду. а новый вентилятор даст то что нужно. сейчас приоритетнее
#    обдувать радиатор». Airflow wins. The M107 in smoke-alarm.cfg stays in
#    place but inert, and now carries a comment saying exactly that - ONE
#    comment is the only thing this work changed in that file, no gcode.
#    Do NOT quietly "fix" this back: there is no clean middle to find.
#    SET_TEMPERATURE_FAN_TARGET cannot beat shutdown_speed, which firmware
#    applies after all gcode has stopped, so reversing it means editing
#    shutdown_speed here - picking the other side outright, which is the
#    owner's call and not a tidy-up. The real resolution is hardware and is
#    already planned: docs/tasks.md H10 adds a separate part-cooling fan and
#    moves this one to its own pin, after which that M107 means something
#    again and this fan can keep its fail-safe.
# ---------------------------------------------------------------------------
