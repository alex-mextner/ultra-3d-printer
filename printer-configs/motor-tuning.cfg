# ===========================================================================
# SEMI-AUTOMATIC MOTOR / DRIVER TUNING - speed, acceleration and run_current
# ladders with an OBJECTIVE, MACHINE-READ step-loss measurement in millimetres.
# Written 2026-08-17; first run on a live axis the same day, which is what
# turned up the rung-handoff bug fixed below (see "HOW ONE RUNG HANDS OFF TO
# THE NEXT"). Every macro below moves real axes.
#
# ---------------------------------------------------------------------------
# WHY THIS EXISTS AND WHAT MAKES IT DIFFERENT FROM "TURN IT UP UNTIL IT SKIPS"
# ---------------------------------------------------------------------------
# Until now every speed/current decision on this machine was made by ear or by
# hand-load (see [printer] max_velocity's own comment: "found EMPIRICALLY
# (FORCE_MOVE at rising VELOCITY under hand load)"), and it went wrong in
# exactly the way ear-tuning goes wrong - 175mm/s passed a no-load bench sweep
# and then lost steps in a real print, so it was cut to 80 on 2026-08-16
# without anybody knowing where the real ceiling is.
#
# The standard community method (Ellis' Print Tuning Guide, TEST_SPEED) is:
# home, run a stress pattern, home again, then compare the MCU stepper counts
# printed by GET_POSITION before and after, and call it a skip if they differ
# by more than one full step. That method is correct in principle but its
# readout is console text a human has to eyeball - it cannot drive a loop, and
# it cannot stop a ladder automatically at the first failing rung.
#
# This machine has something better already installed: axis_travel_report
# (github.com/alex-mextner/klipper-axis-travel-report, cloned on the printer
# and symlinked into klippy/extras/, see printer-configs/axis-travel-measure.cfg
# and [update_manager klipper-axis-travel-report] in moonraker.conf). Its
# MEASURE_HOME command performs one homing pass and records the REAL physical
# travel of that pass, taken from raw MCU step counters, and - this is the part
# that matters here - it exposes that number as a QUERYABLE STATUS OBJECT:
#   printer.axis_travel_report['stepper_y'].travel_mm
# So a gcode macro can read it, do arithmetic on it, and branch on the result.
# That turns "did it skip?" from a human judgement call into a number.
#
# ---------------------------------------------------------------------------
# THE MEASUREMENT, DERIVED (read this before trusting any number below)
# ---------------------------------------------------------------------------
# Source: axis_travel_report.py cmd_MEASURE_HOME + klippy/extras/homing.py
# HomingMove.homing_move(), both read on this printer 2026-08-17, not assumed.
#
# MEASURE_HOME sets the kinematic position of the axis to a far synthetic
# anchor, then calls homing.manual_home() toward position_endstop, and records
#   travel_mm = (trig_pos - start_pos) * step_dist
# where both positions are RAW MCU STEP COUNTERS. Klipper's stepper.py keeps
# get_mcu_position() invariant under set_position() (set_commanded_position()
# compensates _mcu_position_offset by exactly the amount the commanded position
# moved), which is why the module's own comment can claim these numbers survive
# homing's internal recalibration - verified in the source, not taken on faith.
# So travel_mm is the true distance the axis physically moved during that
# homing pass.
#
# Now the arithmetic this file rests on. Let Ps be the physical point at which
# the switch trips when approached at homing_speed, and E = position_endstop.
#   1. MEASURE_HOME (reference). Axis ends physically at Ps, Klipper calls it E.
#   2. Move to coordinate `park`. Physically Ps + (park - E).
#   3. Stress moves, ending commanded back at `park`. If L millimetres of steps
#      were lost (net, signed), the axis is physically at Ps + (park - E) + L.
#   4. MEASURE_HOME (measurement). It travels from there back to Ps, so
#         travel_mm = Ps - (Ps + (park - E) + L) = (E - park) - L
#      and therefore
#         L = (E - park) - travel_mm
#      which is what _TUNE_RECORD computes. `E - park` is called `expected`
#      below.
#
# WHY BOTH ENDS OF A RUNG USE MEASURE_HOME AND NOT G28: the trip point Ps
# depends on approach speed (switch latency plus deceleration), and a plain G28
# approaches on its SECOND pass at second_homing_speed (5mm/s on X/Y, 2.5 on Z)
# while MEASURE_HOME does a single pass at homing_speed (10 / 10 / 5). Mixing
# the two would put a fixed, unknown bias into every L. Using MEASURE_HOME on
# both ends makes that bias identical at both ends of the subtraction, so it
# cancels exactly. Only the switch's own repeatability is left - and that is
# not assumed to be small either, see the baseline rungs below.
#
# SIGN OF L: positive L means the axis finished FARTHER FROM ITS ENDSTOP than
# it was commanded to be. Per axis that reads as:
#   X - carriage ended farther from X-MAX (i.e. toward X=0) than commanded.
#   Y - carriage ended farther from Y-MIN (i.e. toward Y=190) than commanded.
#   Z - the BED ended farther from Z-MIN, and since Z-MIN is the bed AT the
#       nozzle, positive L on Z means THE BED SAGGED AWAY FROM THE NOZZLE.
#       That is the exact direction of the "layer 2 printed in the air" symptom
#       under investigation since 2026-08-16 ([printer] max_z_accel's comment).
#       A negative L on Z is the opposite and more dangerous direction. The
#       report prints the sign for precisely this reason - do not read only the
#       magnitude.
#
# ---------------------------------------------------------------------------
# BASELINE RUNGS - the zero point is MEASURED, never assumed
# ---------------------------------------------------------------------------
# Every ladder begins with TWO baseline rungs run at a deliberately gentle
# 10mm/s / 200mm/s^2 (clamped to the axis's own limits). They serve two
# purposes that a single reference pass cannot:
#   * their L values estimate the systematic residue of the method,
#   * the SPREAD between them estimates the switch's repeatability, i.e. the
#     noise floor of the whole measurement.
# The effective loss threshold is then
#     threshold = max(one full step, min(3 x baseline spread, noise_cap_mm))
# One full step is Ellis' criterion (rotation_distance / full_steps_per_rotation
# = 0.180mm on X/Y here, 0.040mm on Z). On Z that 0.040mm is very likely BELOW
# what a mechanical microswitch repeats to, which is why the 3x-spread term
# exists - without it a Z ladder would report a "skip" on every rung and the
# result would be noise dressed up as data.
# The noise term is CLAMPED to noise_cap_mm (0.5) rather than trusted blindly,
# and a baseline whose own loss or spread exceeds that cap stops the run. Both
# guards exist because the naive version is self-defeating: a wildly
# inconsistent baseline produces a huge spread, hence a huge threshold, and the
# ladder then passes every rung and reports a ceiling far above the truth. A
# measurement that fails loudly is fine; one that fails while still printing a
# confident-looking table is not. An axis that cannot hold position at 10mm/s,
# or a switch that will not repeat, is a mechanical fault to fix - not a
# threshold to widen and not a reason to raise current.
#
# ---------------------------------------------------------------------------
# SAFETY - all of this is real motion on a machine whose Z drives the BED INTO
# THE NOZZLE. Read every line.
# ---------------------------------------------------------------------------
# 1. Z DIRECTION. On this printer decreasing Z moves the BED UP TOWARD THE
#    NOZZLE and the Z endstop is on the MIN side, so every Z homing move drives
#    the bed at the nozzle and stops on a switch 0-0.5mm from contact. Each Z
#    rung does that TWICE. Before any Z ladder: bed clear of clips/tools, and
#    the nozzle COLD (a crash into a hot nozzle welds plastic and can bend the
#    heatbreak; a crash into a cold one is a bent bracket at worst).
# 2. WHY THE Z BAND HAS A HARD FLOOR. Lost steps only ever SHORTEN a move, so
#    the bed can never rise above the lowest Z coordinate that was actually
#    commanded - but over a back-and-forth cycle the error accumulates toward
#    the nozzle (short the down-move, then a full up-move overshoots the
#    intended low point by the shortfall). Detection happens only at the END of
#    a rung, so the band floor must cover a whole rung's worth of worst-case
#    creep. Hence: Z requires LOW/HIGH to be stated EXPLICITLY (no defaults on
#    the dangerous axis), LOW must be at least Z_FLOOR_MM (30) above
#    position_endstop, and CYCLES is capped harder on Z than on X/Y.
# 3. NEVER OUTSIDE THE CONFIGURED RANGE. LOW/HIGH are validated against
#    printer.toolhead.axis_minimum/axis_maximum - the LIVE kinematic range from
#    the rail objects, not numbers typed into this file - with a margin.
# 4. NOT DURING A PRINT. _TUNE_BEGIN refuses if print_stats.state is printing
#    or paused. It deliberately does NOT test idle_timeout.state, because these
#    macros are themselves gcode and that field reads "Printing" while they run.
# 5. CURRENT IS ALWAYS PUT BACK. See the next section.
# 6. NO DANGEROUS DEFAULTS. START/END/STEP are required on every ladder,
#    VELOCITY is required for the accel and current sweeps, and LOW/HIGH are
#    required on Z. A macro that guesses a speed to slam an axis at is not a
#    convenience.
# 7. THIS FILE NEVER CALLS SAVE_CONFIG. Its state lives in [save_variables]
#    (variables.cfg), so a tuning run cannot rewrite printer.cfg's SAVE_CONFIG
#    block. Results are printed for a human to copy into the repo by hand, the
#    same rule pid-calibrate-sweep.cfg follows.
#
# ---------------------------------------------------------------------------
# THE CURRENT CEILINGS: 1.0 A RMS ON X AND Z, 1.4 A RMS ON Y - PER AXIS
# ---------------------------------------------------------------------------
# max_tune_current below is 1.0 and governs X and Z; max_tune_current_y is 1.4
# and governs Y alone. EVERY ladder - speed, accel and current sweep alike -
# refuses to exceed the ceiling belonging to the axis it was pointed at, so the
# distinction is enforced by the machine and not by whoever is typing.
# Neither number is a Klipper limit and neither is a sense-resistor limit -
# both of those are far higher, and that is exactly why these are hardcoded:
#   * Klipper would allow up to 2.0 A RMS on this driver (the resolved default
#     of hold_current reads 2.0 for all three [tmc2209] sections, which is
#     Klipper's MAX_CURRENT for them - confirmed by querying configfile on the
#     live printer, and cmd_SET_TMC_CURRENT enforces maxval=max_cur, i.e. 2.0).
#   * The driver module itself can be SET as high as 1.77 A RMS.
#   * The real limit is THERMAL AND HAS NOTHING TO DO WITH EITHER: Watterott's
#     SilentStepStick FAQ for the TMC2209 states that a small heat sink on the
#     top PCB side is suitable for currents up to 1 A RMS, and above that
#     forced airflow is required. 1.0 is therefore the NO-AIRFLOW figure, and
#     it is the one X and Z are held to. It is tracked in
#     docs/printer-status.md as basket item C8 and stated in
#     docs/ramps-diagnostics.html.
#
# WHY Y IS ALLOWED 1.4 (decision of the machine's owner, 2026-08-17)
# Three things lift the passive figure for Y, and they only work together - no
# single one of them would be enough on its own:
#   1. THERE IS AIRFLOW. The electronics-bay fan (D5/PE3, electronics-fan.cfg)
#      is fitted and running and the owner confirms the driver heatsinks are
#      blown, which removes the precondition the Watterott 1 A figure is stated
#      under. What is still NOT confirmed is whether that flow passes ACROSS
#      the RAMPS board rather than past it - open item B14 in printer-status.md
#      - and that unresolved question is the entire reason this ceiling is 1.4
#      rather than the ~1.7 A RMS a properly cooled SilentStepStick is good
#      for. The uncertainty is paid for with margin, not with optimism.
#   2. THE MOTOR IS NOT THE LIMIT ON Y. Y is a NEMA 23 (57mm frame), a class
#      rated 2.0-3.0 A per phase, i.e. 1.4-2.1 A RMS. Its own label is missing
#      (the owner checked, 2026-08-17), so there is no exact datasheet number -
#      but every value in that range leaves the motor UNDER-driven at 1.4 A,
#      not over-driven. X and Z get no such argument because they are not that
#      motor: X (and E) are MT-1702HS170AW at 1.7 A/phase = 1.20 A RMS, Z is
#      17HD2008-200 at 0.8 A/phase = 0.57 A RMS. On those two the driver line
#      and the motor rating are already the same order of magnitude and there
#      is nothing to be won by lifting one of them.
#   3. THE DRIVER DEFENDS ITSELF AND SAYS SO. The TMC2209 has its own
#      overtemperature ladder - the t120/t143/t150/t157 prewarning bits and a
#      hard ot shutdown - and Klipper polls DRV_STATUS at 1Hz, so the real
#      limiter is INSTRUMENTED rather than assumed. That is what makes walking
#      the current upward legitimate instead of reckless: the run is not blind,
#      and the part that would be damaged is the part doing the reporting.
# The rule that follows, and it is enforced in _TUNE_RECORD below rather than
# left to the operator's attention: above 1.0 A the FLAGS decide, not the
# number. t120 or otpw appearing is a STOP - record the last clean current and
# go no further - and ot/s2ga/s2gb is an immediate stop.
#
# AND A FLAG READ AT IDLE PROVES NOTHING. The driver cools within seconds of
# the motion ending, so DRV_STATUS queried from a console after a run comes
# back clean and comes back meaningless. Every read that counts is taken inside
# _TUNE_RECORD or _TUNE_SOAK_REPORT, both of which run immediately after an
# M400 - i.e. with the driver still hot. TUNE_SOAK exists for the other half of
# the same problem: a ladder rung is a few seconds of motion and cannot reach
# thermal equilibrium at all, so "no flags during a ladder" is a statement
# about a short burst and NOT about sustained printing. Only a soak answers the
# sustained question, and that is why raising current and running a soak are
# two separate steps here.
#
# A SECOND, LOWER LINE AT 0.85 A: the highest run_current ever applied to this
# machine is 0.85 (Y, 2026-08-08). It produced no driver fault bits but did
# produce an audible whine and was reverted the same session, along with Z's
# 0.7 -> 0.6 revert ([tmc2209 stepper_y] and [tmc2209 stepper_z] carry the full
# story). Anything above 0.85 therefore gets a loud warning line, because it is
# re-entering territory this machine has already rejected once for a reason
# that DRV_STATUS cannot see.
# That warning used to fire only in the current sweep, which was a hole: an
# accel ladder run with CURRENT=1.20 is squarely in the rejected territory and
# printed nothing at all about it. It now fires in every mode. Keep the reason
# in view when reading any high-current result below - "no fault bits at 1.2 A"
# and "1.2 A is acceptable on this machine" are different claims, and DRV_STATUS
# can only ever support the first one. The whine is inaudible to it.
#
# RESTORING CURRENT, INCLUDING ON A CRASH. Klipper gcode has no try/finally: an
# error aborts the whole macro chain and nothing later in it runs. So restore
# cannot be a line at the end of the ladder. Two mechanisms instead:
#   * [delayed_gcode _tune_watchdog] is re-armed at the start of every rung with
#     a generous per-rung timeout and cancelled by _TUNE_FINISH. If the chain
#     dies for any reason - a failed homing, an out-of-range move, a user M112
#     that stops short of a full shutdown - the timer still fires (reactor
#     timers are not cancelled by a gcode error) and calls TUNE_RESTORE.
#   * TUNE_RESTORE reads its values from printer.configfile.settings, i.e. the
#     DEPLOYED CONFIG, not from live values captured when the ladder started.
#     That matters: if a previous run died mid-ladder and left 0.45 A on the
#     motor, a restore-to-what-it-was-at-start scheme would faithfully restore
#     the wrong number forever. It is also idempotent and takes no arguments,
#     so a human can simply type TUNE_RESTORE at any time.
#   * A backstop under both: SET_TMC_CURRENT is not persistent. Any Klipper
#     restart re-applies the config value.
# Note also that SET_TMC_CURRENT with no HOLDCURRENT does NOT invent a
# hold_current - cmd_SET_TMC_CURRENT passes the previously REQUESTED hold value
# through unchanged (klippy/extras/tmc.py, read 2026-08-17), so this file
# cannot silently undo the deliberate "hold_current is absent on purpose"
# decision documented at length in [tmc2209 stepper_x].
#
# ---------------------------------------------------------------------------
# TWO WAYS THIS COULD HAVE SILENTLY REPORTED "NO LOSS" ON A TEST THAT NEVER RAN
# ---------------------------------------------------------------------------
# Both are hard errors below, not warnings, because both produce a confident
# wrong answer rather than an obvious failure.
#
# A. Z CANNOT BE SPED UP BY SET_VELOCITY_LIMIT. SET_VELOCITY_LIMIT changes the
#    toolhead's global max_velocity/max_accel only. The Z limits live in the
#    kinematics: cartesian.py check_move() ends with
#        move.limit_speed(self.max_z_velocity * z_ratio,
#                          self.max_z_accel * z_ratio)
#    and there is no gcode command anywhere in Klipper that changes those. For
#    a pure Z move z_ratio is 1, so every Z move is hard-clamped to the
#    configured max_z_velocity (18) and max_z_accel (100). A Z speed ladder
#    running 20,25,30 would therefore execute three IDENTICAL 18mm/s rungs and
#    print "no loss" for all of them. So: any Z rung above the configured
#    max_z_velocity / max_z_accel is REFUSED, with instructions to raise the
#    value in printer.cfg and redeploy first. X/Y are not refused - there
#    SET_VELOCITY_LIMIT genuinely does the job.
#
# B. A STROKE TOO SHORT TO REACH THE TESTED SPEED. With symmetric accel and
#    decel a move only reaches velocity v if the stroke is at least v^2/a. At
#    200mm/s and 500mm/s^2 that is 80mm - longer than a plausible Y stroke. A
#    rung whose stroke is too short simply never reaches its nominal speed and
#    reports no loss, and the ladder invents a ceiling that does not exist.
#    Every rung's requirement is checked against HIGH-LOW and refused if short.
#    Related: MINIMUM_CRUISE_RATIO is forced to 0 during a ladder (restored
#    afterwards) - the configured 0.5 deliberately softens acceleration on
#    short moves, which would blunt an accel ladder specifically.
#
# ---------------------------------------------------------------------------
# WHAT WAS CONSIDERED AND REJECTED
# ---------------------------------------------------------------------------
# * StallGuard (SG_RESULT) as a live load meter. Physically available - these
#   are TMC2209s, tmc2209.py defines SG_RESULT at 0x41 and adds it to
#   ReadRegisters, and this Klipper even carries a TMCStallguardDump bulk-sensor
#   endpoint ("tmc/stallguard_dump") that streams it. It is still NOT usable as
#   the measurement here, for three independent reasons: (1) StallGuard4 on the
#   TMC2209 is a stealthChop feature - its predecessor StallGuard2 was the
#   spreadCycle one, and the 2209 does not have StallGuard2 - so SG_RESULT is
#   meaningless in spreadCycle, which is where every axis on this machine runs
#   at test speeds (X has no stealthchop_threshold at all; Y and Z have it at 5
#   mm/s, i.e. stealthChop only below 5mm/s); (2) DUMP_TMC only prints to the
#   console and exposes nothing to a macro, and the bulk endpoint is a
#   websocket subscription, not something gcode can read; (3) Klipper's gcode
#   runs AHEAD of physical motion by the whole lookahead buffer, so a register
#   read issued "during" a move in a macro does not sample during that move.
#   SG_RESULT remains a useful bench instrument via the websocket endpoint for
#   a human watching a plot - it is not a loop variable.
# * DRV_STATUS as a skip detector. It has no lost-step counter. What it does
#   have is worth recording, and the report does record it: printer[
#   'tmc2209 stepper_y'].drv_status is a live dict populated by Klipper's own
#   1Hz TMCErrorCheck poll, containing only the NONZERO fields - so 'otpw' or
#   'ot' appearing in it means the driver got hot during the rung, and 's2ga'/
#   's2gb' mean a short. Those are the real reasons to stop a current sweep.
# * klipper_tmc_autotune. Already evaluated and rejected by this project: it
#   needs the motor's R, L, holding torque and rated current, and these motors
#   are unbranded with no datasheet ([printer]'s own comment says the limits
#   were found empirically for exactly this reason). It also tends to raise
#   current, into the no-confirmed-airflow situation described above. Not
#   revisited here.
# * Klipper's own TUNING_TOWER. Genuinely useful, but it varies a parameter
#   with Z HEIGHT DURING A PRINT and is read off the printed part - it is a
#   print-quality tool (pressure advance, temperature), not a step-loss tool,
#   and it cannot stop when something goes wrong.
# * SHAPER_CALIBRATE / resonance testing. Requires an accelerometer. This
#   machine has none (no adxl345/lis2dw/mpu9250 and no [resonance_tester]
#   anywhere in printer-configs/). The accelerometer-free substitute is the
#   RINGING TOWER: print a tall test object with sharp direction changes, then
#   measure the spacing of the ghosting ripples with calipers and compute the
#   ringing frequency as (printing speed) / (ripple spacing). That is a
#   separate, print-based procedure and is deliberately NOT automated here -
#   see docs/ramps-diagnostics.html. The ladders below answer "at what speed /
#   accel / current does this axis LOSE STEPS", which is the prerequisite
#   question and the one that can be answered without printing anything.
#
# ---------------------------------------------------------------------------
# HOW ONE RUNG HANDS OFF TO THE NEXT (changed after the first live run)
# ---------------------------------------------------------------------------
# The rungs are NOT a recursive macro chain, and cannot be: Klipper forbids a
# gcode_macro from re-entering itself, so the original
# _TUNE_STEP -> _TUNE_RECORD -> _TUNE_STEP hop died with "Macro _TUNE_STEP
# called recursively" on the very first live rung, 2026-08-17. The hop now
# goes through [delayed_gcode _tune_next], which runs from a reactor timer and
# therefore outside the macro's script context. Full derivation, with the
# relevant lines of gcode_macro.py and delayed_gcode.py quoted, is on that
# section itself. Two consequences worth knowing before reading a run:
#   * the ladder is ASYNCHRONOUS after the first rung - the HTTP request that
#     started it returns (or times out at nginx) long before the run ends, and
#     progress must be followed via the console / gcode_store, not the reply;
#   * a rung that errors stops the chain silently by design. The per-rung
#     [delayed_gcode _tune_watchdog] is what turns that silence back into a
#     restored run_current and a loud message.
#
# ---------------------------------------------------------------------------
# USAGE
# ---------------------------------------------------------------------------
#   TUNE_SPEED_LADDER  AXIS=Y START=60 END=160 STEP=20
#   TUNE_ACCEL_LADDER  AXIS=Y START=500 END=3000 STEP=500 VELOCITY=60
#   TUNE_CURRENT_SWEEP AXIS=Y START=0.45 END=0.85 STEP=0.05 VELOCITY=60
#   TUNE_SOAK          AXIS=Y CURRENT=1.2 VELOCITY=250 ACCEL=6000 MINUTES=10
#   TUNE_SOAK_STOP       - end a soak early, after the burst now in flight
#   TUNE_REPORT          - reprint the last run's table (survives restarts)
#   TUNE_RESTORE         - put current and velocity limits back, any time
# Common optional parameters: LOW= HIGH= CYCLES= THRESHOLD= CURRENT= ACCEL=
# (see each macro's own description). LOW/HIGH are REQUIRED on AXIS=Z.
# Speed and accel ladders stop at the FIRST rung that loses steps; the current
# sweep stops at the first rung that does NOT, since there the goal is the
# minimum current that still holds position.
# ===========================================================================


[gcode_macro TUNE_SPEED_LADDER]
description: TUNE_SPEED_LADDER AXIS=<X|Y|Z> START= END= STEP= [ACCEL=] [CURRENT=] [LOW=] [HIGH=] [CYCLES=] [THRESHOLD=] - step the velocity up rung by rung, measuring real lost steps in mm after each one via MEASURE_HOME, and stop at the first rung that loses more than the measured noise floor. START/END/STEP are mm/s. LOW/HIGH are required on Z. Read motor-tuning.cfg's header before running.
# NOTE ON THE ONE-LINE CALL BELOW: Klipper gcode has NO line continuation -
# every line a template renders is dispatched as its own command - so this call
# must stay on a single line however long it gets. Wrapping it would silently
# turn the continuation lines into "Unknown command: VELOCITY=...". The config
# linter cannot catch that: it compiles the Jinja, it does not dispatch it.
gcode:
    _TUNE_BEGIN MODE=speed AXIS={params.AXIS|default('NONE')|upper} START={params.START|default(-999999)} END={params.END|default(-999999)} STEP={params.STEP|default(-999999)} VELOCITY=-999999 ACCEL={params.ACCEL|default(0)} CURRENT={params.CURRENT|default(0)} LOW={params.LOW|default(-999999)} HIGH={params.HIGH|default(-999999)} CYCLES={params.CYCLES|default(4)} THRESHOLD={params.THRESHOLD|default(0)}


[gcode_macro TUNE_ACCEL_LADDER]
description: TUNE_ACCEL_LADDER AXIS=<X|Y|Z> START= END= STEP= VELOCITY= [CURRENT=] [LOW=] [HIGH=] [CYCLES=] [THRESHOLD=] - same ladder but stepping ACCELERATION at a fixed velocity, which is the number that actually matters for printing. START/END/STEP are mm/s^2, VELOCITY is mm/s. On Z the rungs may not exceed the configured max_z_accel (raise it in printer.cfg and redeploy first) - see this file's header, section A.
gcode:
    _TUNE_BEGIN MODE=accel AXIS={params.AXIS|default('NONE')|upper} START={params.START|default(-999999)} END={params.END|default(-999999)} STEP={params.STEP|default(-999999)} VELOCITY={params.VELOCITY|default(-999999)} ACCEL=0 CURRENT={params.CURRENT|default(0)} LOW={params.LOW|default(-999999)} HIGH={params.HIGH|default(-999999)} CYCLES={params.CYCLES|default(4)} THRESHOLD={params.THRESHOLD|default(0)}


[gcode_macro TUNE_CURRENT_SWEEP]
description: TUNE_CURRENT_SWEEP AXIS=<X|Y|Z> START= END= STEP= VELOCITY= [ACCEL=] [LOW=] [HIGH=] [CYCLES=] [THRESHOLD=] - sweep run_current upward at a fixed velocity and stop at the LOWEST current that loses no steps. START/END/STEP are amps RMS. Hard ceiling 1.0 A RMS (driver passive-cooling limit, see this file's header); anything above 0.85 A warns loudly. The original run_current is restored on completion AND by a watchdog if the run dies.
gcode:
    _TUNE_BEGIN MODE=current AXIS={params.AXIS|default('NONE')|upper} START={params.START|default(-999999)} END={params.END|default(-999999)} STEP={params.STEP|default(-999999)} VELOCITY={params.VELOCITY|default(-999999)} ACCEL={params.ACCEL|default(0)} CURRENT=0 LOW={params.LOW|default(-999999)} HIGH={params.HIGH|default(-999999)} CYCLES={params.CYCLES|default(4)} THRESHOLD={params.THRESHOLD|default(0)}


[gcode_macro _TUNE_BEGIN]
description: Internal to the TUNE_* ladders - do not call directly. Validates every parameter against the live config, builds the rung queue and the run context, then starts the chain.
variable_max_tune_current: 1.0
# Y ONLY. See the header section "WHY Y IS ALLOWED 1.4". Short version: the
# 1.0 above is the passive-cooling rating, Y's driver is in the fan's airflow,
# Y is a NEMA 23 whose class rating (1.4-2.1 A RMS) leaves it under-driven at
# this figure, and the TMC2209's own t120/t143/t150/t157 bits are the real
# limiter and are polled. Do NOT copy this to X or Z - different motors, and
# there the driver line and the motor rating already coincide.
variable_max_tune_current_y: 1.4
variable_warn_tune_current: 0.85
variable_z_floor_mm: 30.0
# 15mm, not a token 1-2mm, and the reason is the failure mode being tested for.
# Lost steps only ever SHORTEN a move, so over one out-and-back cycle the error
# accumulates TOWARD the endstop: the outbound move falls short, the return move
# runs its full commanded length, and the axis ends up past its intended park
# point on the endstop side. An axis that is losing steps - exactly the axis a
# failing rung has - therefore walks into its own endstop if the park end sits
# flush against it. On X/Y that is a grind against the switch and frame; on Z it
# would be the bed into the nozzle, which is why Z additionally has z_floor_mm
# and demands LOW/HIGH explicitly. Raising CYCLES eats into this margin.
variable_band_margin_mm: 15.0
variable_base_velocity: 10.0
variable_base_accel: 200.0
gcode:
    {% set mode = params.MODE %}
    {% set axis = params.AXIS|upper %}

    {% if axis not in ['X', 'Y', 'Z'] %}
        { action_raise_error("TUNE: AXIS must be X, Y or Z (got '%s'). This is required - there is no default axis on purpose." % axis) }
    {% endif %}
    {% if 'axis_travel_report' not in printer %}
        { action_raise_error("TUNE: the axis_travel_report module is not loaded, so lost steps cannot be measured and this would be a blind speed test. Check [axis_travel_report] in axis-travel-measure.cfg and the symlink into klippy/extras/.") }
    {% endif %}
    {% set pstate = printer.print_stats.state|default('standby') %}
    {% if pstate in ['printing', 'paused'] %}
        { action_raise_error("TUNE: refusing to run - print_stats.state is '%s'. These macros home and slam an axis; they are not runnable during a print." % pstate) }
    {% endif %}

    {% set lname = axis|lower %}
    {% set sname = 'stepper_' + lname %}
    {% set tname = 'tmc2209 ' + sname %}
    {% set cfg = printer.configfile.settings %}
    {% set st = cfg[sname] %}
    {% set pr = cfg.printer %}

    {% if params.START|float <= -999998 or params.END|float <= -999998 or params.STEP|float <= -999998 %}
        { action_raise_error("TUNE: START, END and STEP are all required - no defaults, on purpose.") }
    {% endif %}
    {% set start = params.START|float %}
    {% set end = params.END|float %}
    {% set step = params.STEP|float %}
    {% if step <= 0 or end <= start %}
        { action_raise_error("TUNE: need STEP>0 and END>START (got START=%s END=%s STEP=%s)." % (start, end, step)) }
    {% endif %}

    {% set ns = namespace(rungs=[]) %}
    {% for i in range(0, 41) %}
        {% if start + i * step <= end + 0.000001 %}
            {% set _ = ns.rungs.append((start + i * step)|round(4)) %}
        {% endif %}
    {% endfor %}
    {% if ns.rungs|length == 0 or ns.rungs|length > 40 %}
        { action_raise_error("TUNE: that START/END/STEP makes %d rungs - keep it between 1 and 40." % ns.rungs|length) }
    {% endif %}

    {% set amin = printer.toolhead.axis_minimum[('x','y','z').index(lname)] %}
    {% set amax = printer.toolhead.axis_maximum[('x','y','z').index(lname)] %}
    {% set pend = st.position_endstop|float %}

    {% if axis == 'Z' and (params.LOW|float <= -999998 or params.HIGH|float <= -999998) %}
        { action_raise_error("TUNE: on Z, LOW and HIGH are REQUIRED. Z drives the bed into the nozzle on this machine, so the test band is never guessed for you. See motor-tuning.cfg's safety section.") }
    {% endif %}
    {% set low = params.LOW|float if params.LOW|float > -999998 else (amin + band_margin_mm) %}
    {% set high = params.HIGH|float if params.HIGH|float > -999998 else (amax - band_margin_mm) %}

    {% if low < amin + band_margin_mm or high > amax - band_margin_mm or high <= low %}
        { action_raise_error("TUNE: band %.2f..%.2f is outside the live safe range %.2f..%.2f for %s (margin %.1fmm). Limits come from printer.toolhead.axis_minimum/axis_maximum, not from this file." % (low, high, amin + band_margin_mm, amax - band_margin_mm, axis, band_margin_mm)) }
    {% endif %}
    {% if axis == 'Z' and low < pend + z_floor_mm %}
        { action_raise_error("TUNE: Z LOW=%.2f is closer than %.1fmm to the endstop at %.2f. Lost steps accumulate toward the nozzle within a rung and are only detected at the end of it, so the band floor must absorb a whole rung of creep. Raise LOW." % (low, z_floor_mm, pend)) }
    {% endif %}

    {% set cycles = params.CYCLES|int %}
    {% set cycle_cap = 10 if axis == 'Z' else 20 %}
    {% if cycles < 1 or cycles > cycle_cap %}
        { action_raise_error("TUNE: CYCLES must be 1..%d on %s (got %d). More cycles means more un-detected creep inside one rung." % (cycle_cap, axis, cycles)) }
    {% endif %}

    {% set base_cur = cfg[tname].run_current|float %}
    {% set cur = params.CURRENT|float if params.CURRENT|float > 0 else base_cur %}
    {% set vel = params.VELOCITY|float if params.VELOCITY|float > 0 else 0 %}
    {% set dflt_acc = pr.max_z_accel|float if axis == 'Z' else pr.max_accel|float %}
    {% set acc = params.ACCEL|float if params.ACCEL|float > 0 else dflt_acc %}

    {% if mode in ['accel', 'current'] and vel <= 0 %}
        { action_raise_error("TUNE: VELOCITY is required for the %s sweep - the whole point is to hold it fixed while the other variable moves." % mode) }
    {% endif %}

    {% set axis_ceiling = max_tune_current_y|float if axis == 'Y' else max_tune_current|float %}
    {% if mode == 'current' %}
        {% if end > axis_ceiling %}
            { action_raise_error("TUNE: END=%.2fA exceeds the %.2fA RMS ceiling for %s. Ceilings are PER AXIS here: 1.0A on X/Z (the driver module's passive-cooling rating - Watterott SilentStepStick TMC2209, small heat sink good to 1 A RMS) and 1.4A on Y (fan airflow confirmed, NEMA 23 motor, thermal flags polled). Neither is a Klipper limit - Klipper would allow 2.0A. See motor-tuning.cfg's header." % (end, axis_ceiling, axis)) }
        {% endif %}
    {% else %}
        {% if cur > axis_ceiling %}
            { action_raise_error("TUNE: CURRENT=%.2fA exceeds the %.2fA RMS ceiling for %s (1.0A on X/Z, 1.4A on Y) - see motor-tuning.cfg's header." % (cur, axis_ceiling, axis)) }
        {% endif %}
    {% endif %}

    {% set top_v = end if mode == 'speed' else vel %}
    {% set top_a = end if mode == 'accel' else acc %}
    {% if axis == 'Z' %}
        {% if top_v > pr.max_z_velocity|float %}
            { action_raise_error("TUNE: Z rung velocity %.1f exceeds max_z_velocity=%.1f. SET_VELOCITY_LIMIT CANNOT lift that - cartesian.py clamps every Z move to it and there is no gcode for it, so those rungs would silently run at %.1f and report a ceiling that does not exist. Raise max_z_velocity in printer.cfg and redeploy first." % (top_v, pr.max_z_velocity|float, pr.max_z_velocity|float)) }
        {% endif %}
        {% if top_a > pr.max_z_accel|float %}
            { action_raise_error("TUNE: Z rung accel %.0f exceeds max_z_accel=%.0f. Same hard clamp in cartesian.py as above - the rungs would be identical and the result meaningless. Raise max_z_accel in printer.cfg and redeploy first." % (top_a, pr.max_z_accel|float)) }
        {% endif %}
    {% endif %}

    {% set stroke = high - low %}
    {% set need = (top_v * top_v) / top_a %}
    {% if need > stroke %}
        { action_raise_error("TUNE: stroke %.1fmm is too short to ever REACH %.1fmm/s at %.0fmm/s^2 - that needs %.1fmm (v^2/a). The rung would top out below its nominal speed and falsely report no loss. Widen LOW/HIGH, lower END, or raise ACCEL." % (stroke, top_v, top_a, need)) }
    {% endif %}

    {% set endstop_at_min = (pend - amin) <= (amax - pend) %}
    {% set park = low if endstop_at_min else high %}
    {% set far = high if endstop_at_min else low %}
    {% set fullstep = (st.rotation_distance|float) / (st.full_steps_per_rotation|int) %}
    {% set thr = params.THRESHOLD|float if params.THRESHOLD|float > 0 else fullstep %}
    {% set hs = st.homing_speed|float %}
    {% set slowest = base_velocity if base_velocity < top_v else top_v %}
    {% set est = (2 * (amax - amin) / hs) + (cycles * 2 * stroke / slowest) %}
    {% set tmo = ((est * 3) + 120)|round(0)|int %}

    {% set ctx = {'mode': mode, 'axis': axis, 'stepper': sname, 'tmc': tname,
                  'low': low, 'high': high, 'park': park, 'far': far,
                  'cycles': cycles, 'velocity': vel, 'accel': acc, 'current': cur,
                  'expected': (pend - park)|round(4), 'fullstep': fullstep|round(4),
                  'threshold': thr|round(4), 'base_thr': thr|round(4),
                  'timeout': tmo if tmo < 3600 else 3600, 'stopped': 0} %}

    SAVE_VARIABLE VARIABLE=mt_ctx VALUE="{ ctx }"
    SAVE_VARIABLE VARIABLE=mt_queue VALUE="{ [none, none] + ns.rungs }"
    SAVE_VARIABLE VARIABLE=mt_results VALUE="{ [] }"

    RESPOND MSG="===== TUNE {mode|upper} LADDER on {axis} ====="
    RESPOND MSG="rungs: {ns.rungs|join(', ')}   (plus 2 baseline rungs at {base_velocity}mm/s / {base_accel}mm/s^2 first)"
    RESPOND MSG="band {'%.1f'|format(low)}..{'%.1f'|format(high)}mm, park at {'%.1f'|format(park)}, {cycles} cycles per rung, expected home travel {'%.3f'|format(pend - park)}mm"
    RESPOND MSG="one full step on {axis} = {'%.3f'|format(fullstep)}mm - that is the minimum loss threshold; the real one is set after the baselines measure the noise floor"
    {% if mode == 'current' %}
        RESPOND MSG="current sweep: stops at the LOWEST current with no loss. Ceiling {'%.2f'|format(axis_ceiling)}A RMS on {axis}."
        {% if end > warn_tune_current %}
            RESPOND MSG="WARNING: rungs above {warn_tune_current}A re-enter territory this machine already rejected on 2026-08-08 for audible whine (no fault bits, but reverted). Listen to the motor, not only to this table."
        {% endif %}
    {% else %}
        RESPOND MSG="run_current held at {'%.2f'|format(cur)}A for the whole ladder (ceiling {'%.2f'|format(axis_ceiling)}A on {axis}); velocity limits are restored at the end."
        {% if cur > warn_tune_current %}
            RESPOND MSG="WARNING: {'%.2f'|format(cur)}A is above {warn_tune_current}A, which this machine already rejected once (Y, 2026-08-08) for an audible whine that produced NO fault bits. DRV_STATUS cannot see that failure mode - listen to the motor. A clean table below is not a verdict that this current is acceptable."
        {% endif %}
        {% if cur > max_tune_current %}
            RESPOND MSG="NOTE: {'%.2f'|format(cur)}A is above the 1.0A passive-cooling rating and relies on the bay fan actually blowing across the drivers. Thermal flags are the limiter: t120/otpw stops this ladder, ot/s2ga/s2gb stops it immediately. A few seconds of rung motion CANNOT reach thermal equilibrium - use TUNE_SOAK before trusting this current for real printing."
        {% endif %}
    {% endif %}
    {% if axis == 'Z' %}
        RESPOND MSG="Z SAFETY: every rung homes Z twice, and homing Z drives the BED INTO THE NOZZLE until the switch trips. Bed clear, nozzle COLD, hand near the power switch."
    {% endif %}
    RESPOND MSG="If anything goes wrong: M112 to stop, then M84 and G28 {axis} before any other motion, then TUNE_RESTORE."

    _TUNE_STEP


[gcode_macro _TUNE_STEP]
description: Internal to the TUNE_* ladders - do not call directly. Pops one rung, applies it, homes for reference, runs the stress cycles, then hands off to _TUNE_RECORD.
gcode:
    {% set ctx = printer.save_variables.variables.mt_ctx|default({}) %}
    {% set queue = printer.save_variables.variables.mt_queue|default([]) %}
    {% if ctx|length == 0 %}
        { action_raise_error("TUNE: no run context - start a ladder with TUNE_SPEED_LADDER / TUNE_ACCEL_LADDER / TUNE_CURRENT_SWEEP.") }
    {% endif %}
    {% if queue|length == 0 %}
        _TUNE_FINISH REASON=completed
    {% else %}
        {% set rung = queue[0] %}
        {% set axis = ctx.axis %}
        {% set is_base = rung is none %}
        {% set bv = printer['gcode_macro _TUNE_BEGIN'].base_velocity %}
        {% set ba = printer['gcode_macro _TUNE_BEGIN'].base_accel %}
        {% set pr = printer.configfile.settings.printer %}
        {% set zv = pr.max_z_velocity|float %}
        {% set za = pr.max_z_accel|float %}
        {% if is_base %}
            {% set vel = ((bv if bv < zv else zv) if axis == 'Z' else bv) %}
            {% set acc = ((ba if ba < za else za) if axis == 'Z' else ba) %}
            {% set cur = ctx.current %}
        {% else %}
            {% set vel = rung if ctx.mode == 'speed' else ctx.velocity %}
            {% set acc = rung if ctx.mode == 'accel' else ctx.accel %}
            {% set cur = rung if ctx.mode == 'current' else ctx.current %}
        {% endif %}

        SAVE_VARIABLE VARIABLE=mt_queue VALUE="{ queue[1:] }"
        UPDATE_DELAYED_GCODE ID=_tune_watchdog DURATION={ctx.timeout}

        {% if is_base %}
            RESPOND MSG="--- baseline rung: {'%.1f'|format(vel)}mm/s, {'%.0f'|format(acc)}mm/s^2, {'%.2f'|format(cur)}A (measuring the noise floor) ---"
        {% else %}
            RESPOND MSG="--- rung {ctx.mode}={rung}: {'%.1f'|format(vel)}mm/s, {'%.0f'|format(acc)}mm/s^2, {'%.2f'|format(cur)}A ---"
        {% endif %}

        SET_TMC_CURRENT STEPPER={ctx.stepper} CURRENT={'%.3f'|format(cur)}
        SET_VELOCITY_LIMIT VELOCITY={'%.3f'|format(vel)} ACCEL={'%.3f'|format(acc)} MINIMUM_CRUISE_RATIO=0

        M400
        MEASURE_HOME AXIS={axis}
        G90
        G1 {axis}{'%.4f'|format(ctx.park)} F{'%.1f'|format(vel * 60)}
        {% for n in range(ctx.cycles) %}
            G1 {axis}{'%.4f'|format(ctx.far)} F{'%.1f'|format(vel * 60)}
            G1 {axis}{'%.4f'|format(ctx.park)} F{'%.1f'|format(vel * 60)}
        {% endfor %}
        M400
        MEASURE_HOME AXIS={axis}
        _TUNE_RECORD BASE={1 if is_base else 0} RUNG={rung if not is_base else 0} VEL={'%.3f'|format(vel)} ACC={'%.3f'|format(acc)} CUR={'%.3f'|format(cur)}
    {% endif %}


[gcode_macro _TUNE_RECORD]
description: Internal to the TUNE_* ladders - do not call directly. Reads the travel MEASURE_HOME just recorded, turns it into a signed lost-step figure in mm, and decides whether the ladder continues.
# Sanity cap on everything derived from the baseline rungs. A mechanical
# microswitch repeats to well under 0.05mm, and a real step loss worth acting on
# is far larger, so 0.5mm sits comfortably between the two. It does two jobs:
# a baseline whose loss or spread exceeds it stops the run outright, and the
# 3x-spread noise term is clamped to it - otherwise a wildly inconsistent
# baseline would compute a huge threshold and then wave every later rung
# through, which is worse than no measurement at all because it looks like one.
variable_noise_cap_mm: 0.5
gcode:
    {% set ctx = printer.save_variables.variables.mt_ctx %}
    {% set results = printer.save_variables.variables.mt_results|default([]) %}
    {% set is_base = params.BASE|int == 1 %}
    {% set rung = params.RUNG|float %}
    {% set vel = params.VEL|float %}
    {% set acc = params.ACC|float %}
    {% set cur = params.CUR|float %}

    {% set rep = printer.axis_travel_report.get(ctx.stepper) %}
    {% if rep is none or rep.travel_mm is none %}
        { action_raise_error("TUNE: axis_travel_report has no travel for %s after MEASURE_HOME. The homing pass did not record - stopping rather than reporting a made-up zero. Run TUNE_RESTORE." % ctx.stepper) }
    {% endif %}
    {% set travel = rep.travel_mm|float %}
    {% set loss = (ctx.expected|float - travel)|round(4) %}
    {% set absloss = loss if loss >= 0 else -loss %}

    {% set drv = printer[ctx.tmc].drv_status|default({}) %}
    {% set flags = [] %}
    {% for f in ['ot', 'otpw', 't157', 't150', 't143', 't120', 's2ga', 's2gb', 's2vsa', 's2vsb', 'ola', 'olb'] %}
        {% if drv is not none and f in drv %}{% set _ = flags.append(f) %}{% endif %}
    {% endfor %}

    {% set nr = results + [[rung if not is_base else -1, loss, vel, acc, cur, flags|join('/')]] %}
    SAVE_VARIABLE VARIABLE=mt_results VALUE="{ nr }"

    RESPOND MSG="    travel {'%.3f'|format(travel)}mm vs expected {'%.3f'|format(ctx.expected|float)}mm  ->  LOSS {'%+.3f'|format(loss)}mm{' | DRV_STATUS: ' + flags|join(',') if flags|length > 0 else ''}"

    {% if is_base %}
        {% if nr|length >= 2 %}
            {% set b1 = nr[0][1]|float %}
            {% set b2 = nr[1][1]|float %}
            {% set a1 = b1 if b1 >= 0 else -b1 %}
            {% set a2 = b2 if b2 >= 0 else -b2 %}
            {% set aworst = a1 if a1 > a2 else a2 %}
            {% set spread = (b1 - b2) if (b1 - b2) >= 0 else (b2 - b1) %}
            {% set cap = noise_cap_mm|float %}
            {% if aworst > cap or spread > cap %}
                RESPOND MSG="    STOPPING: the two baseline rungs at walking pace lost {'%+.3f'|format(b1)}mm and {'%+.3f'|format(b2)}mm (spread {'%.3f'|format(spread)}mm), past the {'%.2f'|format(cap)}mm sanity cap. Either this axis already loses steps at {'%.1f'|format(vel)}mm/s, or the endstop does not repeat well enough to measure against. Both are mechanical faults - fix the machine, do not raise current to hide it, and do not trust any ladder run on top of this."
                _TUNE_FINISH REASON=baseline_failed
            {% else %}
                {% set raw_noise = spread * 3 %}
                {% set noise_thr = raw_noise if raw_noise < cap else cap %}
                {% set eff = ctx.base_thr|float if ctx.base_thr|float > noise_thr else noise_thr %}
                {% set _ = ctx.update({'threshold': eff|round(4)}) %}
                SAVE_VARIABLE VARIABLE=mt_ctx VALUE="{ ctx }"
                RESPOND MSG="    baseline spread {'%.3f'|format(spread)}mm -> loss threshold {'%.3f'|format(eff)}mm (the larger of one full step {'%.3f'|format(ctx.fullstep|float)}mm and 3x the spread, with the noise term itself capped at {'%.2f'|format(cap)}mm so a noisy baseline can never buy a permissive threshold)"
                UPDATE_DELAYED_GCODE ID=_tune_next DURATION=0.05
            {% endif %}
        {% else %}
            UPDATE_DELAYED_GCODE ID=_tune_next DURATION=0.05
        {% endif %}
    {% else %}
        {% set thr = ctx.threshold|float %}
        {% set stopflags = [] %}
        {% for f in ['ot', 'otpw', 't157', 't150', 't143', 't120', 's2ga', 's2gb', 's2vsa', 's2vsb'] %}
            {% if f in flags %}{% set _ = stopflags.append(f) %}{% endif %}
        {% endfor %}
        {% if stopflags|length > 0 %}
            RESPOND MSG="    STOPPING: driver reported {stopflags|join(',')} - overtemperature (or a short). Read RIGHT AFTER the rung's motion, so this is the driver hot, not idle. A PREWARNING (t120/otpw) counts as the stop signal on purpose, not as advice: it is the last reading taken before the chip starts protecting itself, and the point of walking current up is to find that edge WITHOUT crossing it. The last CLEAN rung is the result; this one is not a tuning number, it is a hardware limit."
            _TUNE_FINISH REASON=driver_fault
        {% elif ctx.mode == 'current' %}
            {% if absloss <= thr %}
                RESPOND MSG="    RESULT: {'%.2f'|format(rung)}A is the LOWEST swept current that holds position at {'%.1f'|format(vel)}mm/s (loss {'%+.3f'|format(loss)}mm within the {'%.3f'|format(thr)}mm threshold)."
                _TUNE_FINISH REASON=found
            {% else %}
                UPDATE_DELAYED_GCODE ID=_tune_next DURATION=0.05
            {% endif %}
        {% else %}
            {% if absloss > thr %}
                RESPOND MSG="    CEILING FOUND: {ctx.mode}={rung} lost {'%+.3f'|format(loss)}mm, over the {'%.3f'|format(thr)}mm threshold."
                _TUNE_FINISH REASON=found
            {% else %}
                UPDATE_DELAYED_GCODE ID=_tune_next DURATION=0.05
            {% endif %}
        {% endif %}
    {% endif %}


[gcode_macro _TUNE_FINISH]
description: Internal to the TUNE_* ladders - do not call directly. Cancels the watchdog, restores current and velocity limits, and prints the table.
gcode:
    UPDATE_DELAYED_GCODE ID=_tune_watchdog DURATION=0
    UPDATE_DELAYED_GCODE ID=_tune_next DURATION=0
    TUNE_RESTORE
    RESPOND MSG="ladder finished ({params.REASON|default('unknown')})"
    TUNE_REPORT


[gcode_macro TUNE_REPORT]
description: Reprint the last TUNE_* ladder's table without re-running anything. Results live in variables.cfg and survive a restart.
gcode:
    {% set ctx = printer.save_variables.variables.mt_ctx|default({}) %}
    {% set results = printer.save_variables.variables.mt_results|default([]) %}
    {% if results|length == 0 %}
        RESPOND MSG="TUNE: no results recorded yet - run one of the TUNE_* ladders first."
    {% else %}
        RESPOND MSG="===== TUNE results: {ctx.mode|default('?')} ladder on {ctx.axis|default('?')} ====="
        RESPOND MSG="  loss threshold {'%.3f'|format(ctx.threshold|default(0)|float)}mm | positive loss = ended FARTHER from the endstop than commanded"
        RESPOND MSG="        rung     mm/s    mm/s2   amps    loss mm  flags"
        {% for r in results %}
            {% set label = 'baseline' if r[0] == -1 else '%.3f'|format(r[0]|float) %}
            RESPOND MSG="  {'%10s'|format(label)} {'%8.1f'|format(r[2]|float)} {'%8.0f'|format(r[3]|float)} {'%6.2f'|format(r[4]|float)} {'%+9.3f'|format(r[1]|float)}  {r[5]}"
        {% endfor %}
        {% if ctx.mode|default('') == 'current' %}
            RESPOND MSG="  To apply: put the chosen value into run_current in [{ctx.tmc|default('tmc2209 stepper_?')}] in printer-configs/printer.cfg, then lint and deploy. Nothing here writes the config."
        {% else %}
            RESPOND MSG="  To apply: take the last rung BEFORE the ceiling, cut it by ~15 percent for margin, and put it into printer-configs/printer.cfg ({'max_z_accel/max_z_velocity' if ctx.axis|default('') == 'Z' else 'max_accel/max_velocity'} in [printer]), then lint and deploy. Nothing here writes the config."
        {% endif %}
    {% endif %}


[gcode_macro TUNE_RESTORE]
description: Put run_current on all three axes and the toolhead velocity limits back to the DEPLOYED CONFIG values. Safe to run at any time, takes no arguments, and is what the watchdog calls if a ladder dies mid-run.
gcode:
    {% set cfg = printer.configfile.settings %}
    {% set pr = cfg.printer %}
    {% for s in ['stepper_x', 'stepper_y', 'stepper_z'] %}
        SET_TMC_CURRENT STEPPER={s} CURRENT={'%.3f'|format(cfg['tmc2209 ' + s].run_current|float)}
    {% endfor %}
    SET_VELOCITY_LIMIT VELOCITY={pr.max_velocity} ACCEL={pr.max_accel} MINIMUM_CRUISE_RATIO={pr.minimum_cruise_ratio} SQUARE_CORNER_VELOCITY={pr.square_corner_velocity}
    RESPOND MSG="TUNE_RESTORE: run_current back to config (X {cfg['tmc2209 stepper_x'].run_current} / Y {cfg['tmc2209 stepper_y'].run_current} / Z {cfg['tmc2209 stepper_z'].run_current} A), velocity limits back to {pr.max_velocity}mm/s / {pr.max_accel}mm/s^2."


[delayed_gcode _tune_next]
# THE RUNG-TO-RUNG TRAMPOLINE, AND THE BUG THAT MADE IT NECESSARY.
# Caught on the first live run, 2026-08-17: the ladder measured its first
# baseline rung correctly (travel -14.985mm vs expected -15.000mm, i.e. a
# 0.015mm loss against a 0.180mm full step) and then died with
#     !! Macro _TUNE_STEP called recursively
# The original chain was _TUNE_STEP -> _TUNE_RECORD -> _TUNE_STEP, and that
# last hop is a SELF-call: _TUNE_STEP is still on the template stack while
# _TUNE_RECORD runs inside it. klippy/extras/gcode_macro.py (read on this
# printer) guards against exactly that:
#     def cmd(self, gcmd):
#         if self.in_script:
#             raise gcmd.error("Macro %s called recursively" % (self.alias,))
# in_script is set True for the whole duration of the macro's own script, so
# no gcode_macro can ever re-enter itself, at any depth. No amount of
# parameter juggling fixes that - the hop has to LEAVE the macro's script
# context entirely.
#
# A delayed_gcode does leave it: klippy/extras/delayed_gcode.py runs its
# template from a REACTOR TIMER (_gcode_timer_event -> gcode.run_script),
# not from inside the calling macro, so in_script is False by then. That is
# why _TUNE_RECORD now ends with UPDATE_DELAYED_GCODE ID=_tune_next instead
# of calling _TUNE_STEP: the current rung's macros all return, the stack
# unwinds, and only then does the timer start the next rung.
#
# WHY RE-ARMING FROM INSIDE THE TIMER IS SAFE (verified in that same file,
# not assumed - this is the part that looks wrong at first glance).
# _tune_next re-arms ITSELF: the timer fires -> _TUNE_STEP -> _TUNE_RECORD ->
# UPDATE_DELAYED_GCODE ID=_tune_next. cmd_UPDATE_DELAYED_GCODE takes a
# different branch when it is called from within its own timer:
#     if self.inside_timer:
#         self.repeat = (self.duration != 0.)
#     else:
#         ... reactor.update_timer(...)
# and _gcode_timer_event then honours that flag AFTER the script has run:
#     nextwake = self.reactor.NEVER
#     if self.repeat:
#         nextwake = eventtime + self.duration
# So the self-re-arm is the documented repeating idiom and schedules exactly
# one more pass. It also means the reverse is true, and that is what keeps
# the ladder honest: a rung that DIES (failed homing, out-of-range move, a
# raised error) never reaches the re-arm, repeat stays False, nextwake stays
# NEVER, and the chain stops instead of blindly marching on to the next rung.
#
# WHAT THIS DOES NOT BREAK:
#   * The results table. It never lived on the call stack - mt_ctx, mt_queue
#     and mt_results are in [save_variables] (variables.cfg, on disk), read
#     back fresh at the top of every _TUNE_STEP / _TUNE_RECORD. Splitting the
#     chain across independent timer callbacks changes nothing about that,
#     which is the whole reason the state was put there in the first place.
#   * The watchdog. _TUNE_STEP re-arms _tune_watchdog at the start of EVERY
#     rung, so the guarantee is per-rung and does not depend on how the rungs
#     are strung together. The silent-stop case above is precisely what it
#     covers: chain stops -> nobody cancels the watchdog -> it fires ->
#     TUNE_RESTORE puts run_current and the velocity limits back.
#   * _TUNE_BEGIN -> _TUNE_STEP stays a direct call. That one is not
#     recursive (different macros, first entry), so it needs no trampoline.
initial_duration: 0
gcode:
    _TUNE_STEP


[delayed_gcode _tune_watchdog]
# Armed at the start of every rung with that ladder's own generous timeout, and
# cancelled by _TUNE_FINISH. It exists because Klipper gcode has no try/finally:
# any error aborts the macro chain and no later line runs, so "restore current
# at the end" is not a guarantee. A reactor timer is not cancelled by a gcode
# error, so this one still fires. It deliberately does NOT move the machine or
# cut motor power - it only puts electrical settings back and shouts, because a
# timer that moves an axis behind the operator's back would be a worse hazard
# than the one it is guarding against.
initial_duration: 0
gcode:
    RESPOND MSG="TUNE WATCHDOG: a tuning ladder did not finish in its expected time (error, abort, or M112). Restoring run_current and velocity limits from the deployed config now."
    TUNE_RESTORE
    RESPOND MSG="TUNE WATCHDOG: if a MEASURE_HOME failed, the axis may be flagged as homed at a position it is NOT physically at - unlike G28, MEASURE_HOME has no motor_off() failure path. Run M84, then G28 before any other movement."


# ===========================================================================
# THERMAL SOAK - the test a ladder structurally cannot be
# ===========================================================================
# A ladder rung is a few SECONDS of motion. A TMC2209 on a heatsink reaches
# thermal equilibrium in MINUTES. So a ladder that ran clean at 1.2 A has shown
# that 1.2 A does not trip the driver in a burst, and has shown NOTHING about
# whether it survives a print - the two questions differ by two orders of
# magnitude in timescale, and only one of them is what "can I print at this
# current" means. That gap is the reason this macro exists rather than a note
# telling the operator to "run it for a while and watch".
#
# WHAT IT MEASURES AND WHAT IT CANNOT. Klipper reports NO die temperature for a
# TMC2209 - printer['tmc2209 stepper_y'].temperature is always null, confirmed
# by query on this printer; that field is populated for drivers with an ADC
# (TMC2240 and friends), which this is not. The entire on-chip readout is the
# threshold ladder t120 -> t143 -> t150 -> t157 plus otpw and the hard ot
# shutdown. So the machine can tell you WHICH BAND it is in, never the number.
# The number has to come from outside: a hand or an IR thermometer on the
# driver heatsink, which is also the only way to learn whether the bay fan's
# air actually reaches this board (open item B14) rather than passing it by.
# The soak is therefore designed as a two-instrument test - flags from the
# chip, degrees from the human - and the RESPOND lines below are paced so a
# person standing at the machine can follow them.
#
# WHY EACH READ IS PRECEDED BY M400. Klipper's gcode runs AHEAD of physical
# motion by the whole lookahead buffer, so a status read issued between queued
# moves samples a driver that has not made those moves yet. M400 drains the
# queue, so the read that follows it is taken with the motion just finished and
# the driver at its hottest. Equally important: the report CANNOT be part of
# one long rendered script, because a Jinja template is rendered ONCE, before
# any of it executes - every drv_status read in such a loop would return the
# same start-of-run value and the log would look reassuringly clean by
# construction. Hence the same delayed_gcode trampoline the ladders use: one
# burst per macro invocation, each rendering its own fresh read.
[gcode_macro TUNE_SOAK]
description: TUNE_SOAK AXIS=<X|Y> CURRENT= VELOCITY= ACCEL= MINUTES= [LOW=] [HIGH=] - drive one axis back and forth continuously for MINUTES at a fixed current/speed/accel, printing DRV_STATUS right after each burst so the driver is read HOT. Thermal test only - it measures no step loss. Stops itself on any overtemperature flag. TUNE_SOAK_STOP ends it early.
gcode:
    {% set axis = params.AXIS|default('NONE')|upper %}
    {% set b = printer['gcode_macro _TUNE_BEGIN'] %}
    {% if axis not in ['X', 'Y'] %}
        { action_raise_error("TUNE_SOAK: AXIS must be X or Y (got '%s'). Z is never soaked - every Z move on this machine drives the bed toward the nozzle, and a soak is by definition unattended-ish repetitive motion." % axis) }
    {% endif %}
    {% set pstate = printer.print_stats.state|default('standby') %}
    {% if pstate in ['printing', 'paused'] %}
        { action_raise_error("TUNE_SOAK: refusing to run - print_stats.state is '%s'." % pstate) }
    {% endif %}
    {% set lname = axis|lower %}
    {% set sname = 'stepper_' + lname %}
    {% set cur = params.CURRENT|default(0)|float %}
    {% set vel = params.VELOCITY|default(0)|float %}
    {% set acc = params.ACCEL|default(0)|float %}
    {% set mins = params.MINUTES|default(0)|float %}
    {% if cur <= 0 or vel <= 0 or acc <= 0 or mins <= 0 %}
        { action_raise_error("TUNE_SOAK: CURRENT, VELOCITY, ACCEL and MINUTES are all required and must be positive. There is no default soak - the whole point is to reproduce one specific operating point.") }
    {% endif %}
    {% if mins > 30 %}
        { action_raise_error("TUNE_SOAK: MINUTES=%.1f is over the 30 minute cap. Equilibrium arrives in single-digit minutes; a longer run is unattended repetitive motion for no extra information." % mins) }
    {% endif %}
    {% set ceiling = b.max_tune_current_y|float if axis == 'Y' else b.max_tune_current|float %}
    {% if cur > ceiling %}
        { action_raise_error("TUNE_SOAK: CURRENT=%.2fA exceeds the %.2fA RMS ceiling for %s (1.0A on X/Z, 1.4A on Y) - see motor-tuning.cfg's header." % (cur, ceiling, axis)) }
    {% endif %}
    {% set amin = printer.toolhead.axis_minimum[('x','y','z').index(lname)] %}
    {% set amax = printer.toolhead.axis_maximum[('x','y','z').index(lname)] %}
    {% set bm = b.band_margin_mm|float %}
    {% set low = params.LOW|float if params.LOW|default(-999999)|float > -999998 else (amin + bm) %}
    {% set high = params.HIGH|float if params.HIGH|default(-999999)|float > -999998 else (amax - bm) %}
    {% if low < amin + bm or high > amax - bm or high <= low %}
        { action_raise_error("TUNE_SOAK: band %.2f..%.2f is outside the live safe range %.2f..%.2f for %s (margin %.1fmm)." % (low, high, amin + bm, amax - bm, axis, bm)) }
    {% endif %}
    {% set stroke = high - low %}
    {% set need = (vel * vel) / acc %}
    {% if need > stroke %}
        { action_raise_error("TUNE_SOAK: stroke %.1fmm never reaches %.1fmm/s at %.0fmm/s^2 (needs %.1fmm). The soak would run slower than the operating point it is supposed to reproduce, and under-report the heating." % (stroke, vel, acc, need)) }
    {% endif %}
    {% set percycle = 2.0 * stroke / vel %}
    {% set rawc = (25.0 / percycle)|round(0)|int %}
    {% set cyc = 1 if rawc < 1 else (100 if rawc > 100 else rawc) %}
    {% set rawb = (mins * 60.0 / (cyc * percycle))|round(0)|int %}
    {% set chunks = 1 if rawb < 1 else rawb %}
    {% set ctx = {'axis': axis, 'stepper': sname, 'tmc': 'tmc2209 ' + sname,
                  'low': low|round(4), 'high': high|round(4), 'cycles': cyc,
                  'left': chunks, 'total': chunks,
                  'velocity': vel, 'accel': acc, 'current': cur} %}
    SAVE_VARIABLE VARIABLE=ms_ctx VALUE="{ ctx }"

    RESPOND MSG="===== TUNE SOAK on {axis}: {'%.2f'|format(cur)}A RMS, {'%.0f'|format(vel)}mm/s, {'%.0f'|format(acc)}mm/s^2, band {'%.0f'|format(low)}..{'%.0f'|format(high)}mm ====="
    RESPOND MSG="{chunks} bursts x {cyc} out-and-back cycles = about {'%.1f'|format(chunks * cyc * percycle / 60.0)} minutes of CONTINUOUS motion. DRV_STATUS is read within a second of each burst ending, i.e. with the driver hot - an idle read would be clean and worthless."
    RESPOND MSG="Klipper reads NO die temperature from a TMC2209 (temperature is always null). The chip's whole readout is t120/t143/t150/t157 + otpw + ot, i.e. WHICH BAND, never how many degrees. Put a hand or an IR thermometer on the {axis} driver heatsink while this runs - that is the other half of the measurement, and the only thing that tells you whether the bay fan's air really reaches this board."
    RESPOND MSG="Rough guide for the heatsink by hand: comfortable to hold = fine; too hot to keep a finger on (about 60C) = watch it; painful instantly (about 70C+) = stop even with no flags, because the flags start at 120C JUNCTION and the heatsink lags the junction badly. Any flag at all stops this run by itself."
    RESPOND MSG="Stop early at any time: TUNE_SOAK_STOP (ends after the burst in flight). Hard stop: M112, then M84, G28 {axis}, TUNE_RESTORE."

    SET_TMC_CURRENT STEPPER={sname} CURRENT={'%.3f'|format(cur)}
    SET_VELOCITY_LIMIT VELOCITY={'%.3f'|format(vel)} ACCEL={'%.3f'|format(acc)} MINIMUM_CRUISE_RATIO=0
    G28 {axis}
    G90
    G1 {axis}{'%.4f'|format(low)} F{'%.1f'|format(vel * 60)}
    M400
    _TUNE_SOAK_STEP


[gcode_macro _TUNE_SOAK_STEP]
description: Internal to TUNE_SOAK - do not call directly. Runs one burst of motion, then hands to _TUNE_SOAK_REPORT.
gcode:
    {% set ctx = printer.save_variables.variables.ms_ctx|default({}) %}
    {% if ctx|length == 0 %}
        { action_raise_error("TUNE_SOAK: no soak context - start one with TUNE_SOAK.") }
    {% endif %}
    {% if ctx.left|int <= 0 %}
        _TUNE_SOAK_FINISH REASON=completed
    {% else %}
        {% set _ = ctx.update({'left': ctx.left|int - 1}) %}
        SAVE_VARIABLE VARIABLE=ms_ctx VALUE="{ ctx }"
        UPDATE_DELAYED_GCODE ID=_tune_watchdog DURATION=180
        G90
        {% for n in range(ctx.cycles|int) %}
            G1 {ctx.axis}{'%.4f'|format(ctx.high|float)} F{'%.1f'|format(ctx.velocity|float * 60)}
            G1 {ctx.axis}{'%.4f'|format(ctx.low|float)} F{'%.1f'|format(ctx.velocity|float * 60)}
        {% endfor %}
        M400
        _TUNE_SOAK_REPORT
    {% endif %}


[gcode_macro _TUNE_SOAK_REPORT]
description: Internal to TUNE_SOAK - do not call directly. Reads DRV_STATUS with the motion just finished and decides whether the soak continues.
gcode:
    {% set ctx = printer.save_variables.variables.ms_ctx %}
    {% set drv = printer[ctx.tmc].drv_status|default({}) %}
    {% set flags = [] %}
    {% for f in ['ot', 'otpw', 't157', 't150', 't143', 't120', 's2ga', 's2gb', 's2vsa', 's2vsb', 'ola', 'olb'] %}
        {% if drv is not none and f in drv %}{% set _ = flags.append(f) %}{% endif %}
    {% endfor %}
    {% set stopflags = [] %}
    {% for f in ['ot', 'otpw', 't157', 't150', 't143', 't120', 's2ga', 's2gb', 's2vsa', 's2vsb'] %}
        {% if f in flags %}{% set _ = stopflags.append(f) %}{% endif %}
    {% endfor %}
    RESPOND MSG="soak {ctx.total|int - ctx.left|int}/{ctx.total} at {'%.2f'|format(ctx.current|float)}A - DRV_STATUS: {flags|join(',') if flags|length > 0 else 'clean'}"
    {% if stopflags|length > 0 %}
        RESPOND MSG="SOAK STOPPING at burst {ctx.total|int - ctx.left|int} of {ctx.total}: {stopflags|join(',')}. This is the answer, not a failure - it says {'%.2f'|format(ctx.current|float)}A is NOT sustainable at this duty on this cooling. Back off one current step and soak again. Note the elapsed time to the flag: tripping in the first minute and tripping at minute nine mean different things about the airflow."
        _TUNE_SOAK_FINISH REASON=driver_flag
    {% else %}
        UPDATE_DELAYED_GCODE ID=_tune_soak_next DURATION=0.05
    {% endif %}


[gcode_macro _TUNE_SOAK_FINISH]
description: Internal to TUNE_SOAK - do not call directly. Cancels timers and restores current and velocity limits.
gcode:
    UPDATE_DELAYED_GCODE ID=_tune_watchdog DURATION=0
    UPDATE_DELAYED_GCODE ID=_tune_soak_next DURATION=0
    TUNE_RESTORE
    RESPOND MSG="soak finished ({params.REASON|default('unknown')}). Reminder: a clean soak means the DRIVER survives this current at this duty. It says nothing about motor temperature, about the whine that DRV_STATUS cannot hear, or about print quality."


[gcode_macro TUNE_SOAK_STOP]
description: End a running TUNE_SOAK early. It stops after the burst currently in flight (a few tens of seconds at most), then restores run_current and the velocity limits.
gcode:
    {% set ctx = printer.save_variables.variables.ms_ctx|default({}) %}
    {% if ctx|length == 0 %}
        RESPOND MSG="TUNE_SOAK_STOP: no soak context found - nothing to stop. If the machine is moving anyway, use M112."
    {% else %}
        {% set _ = ctx.update({'left': 0}) %}
        SAVE_VARIABLE VARIABLE=ms_ctx VALUE="{ ctx }"
        RESPOND MSG="TUNE_SOAK_STOP: the burst in flight finishes, then the soak ends and TUNE_RESTORE runs. It cannot cut the motion short mid-burst - that would need M112, which is worse than waiting a few seconds."
    {% endif %}


[delayed_gcode _tune_soak_next]
# Same trampoline as _tune_next, and necessary for the same two reasons: a
# gcode_macro cannot re-enter itself (gcode_macro.py raises "called
# recursively" unconditionally), and - the reason specific to this macro - a
# fresh macro invocation is the only way to get a FRESH drv_status read, since
# a single template renders all of its reads once, before any motion happens.
# The self-re-arm from inside the timer is the documented repeating idiom
# (cmd_UPDATE_DELAYED_GCODE takes the inside_timer branch and sets repeat), and
# its converse is the safety property: a burst that dies never reaches the
# re-arm, so the soak stops instead of grinding on unattended.
initial_duration: 0
gcode:
    _TUNE_SOAK_STEP
